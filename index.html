방식","system":false,"text":"정의\n\"오픈소스 AI\" 라고 불리는 대부분은 가중치만 공개하는 오픈웨이트다. 완전 오픈소스는 여기에 소스 코드, 전체 학습 데이터셋, 평가 · 학습 레시피(방법론), 학습 과정의 중간 체크포인트를 더해 제3자가 학습 자체를 재현하고 검증할 수 있게 하는 공개 방식이다 [S-2026-09-08-005].\n근거 있는 사실\nK2 Horizon 은 이 방식으로 6종을 Apache 2.0 라이선스로 허깅페이스에 공개했으며, IFM 은 이를 \"AI 역사상 최대 규모의 완전 오픈소스 모델 발표\" 라고 주장한다 [S-2026-09-08-005]\n최종 결과물만 공개하는 기존 방식과 달리 중간 체크포인트를 함께 배포해 학습 과정의 변화를 추적할 수 있다 [S-2026-09-08-005]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nproduct-k2-horizon — 대표 사례\norg-mbzuai\nS-2026-09-08-005-uae-k2-horizon-open-source","title":"완전 오픈소스 모델 (오픈웨이트와의 차이)","topics":["open-local-models"],"type":"concept","updated":"2026-09-08"},{"aliases":["승인 피로","자동화의 아이러니","전략적 마찰","approval fatigue","human-in-the-loop 한계"],"back":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime"],"cites":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트가 수십 단계를 자율 수행할 때, 사람이 승인 버튼을 갖고 있다는 사실만으로는 감독이 성립하지 않는다는 문제. 세 메커니즘이 겹친다: 이해 · 기억 · 예측 · 감시의 인지 부담, 반복 승인에 따른 승인 피로, 그리고 자동화가 잘될수록 사람의 평가 역량이 약해지는 자동화의 아이러니 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e출처 보고서: Margaret Mitchell · Abhijit Ghosh · Sameer Passi, \"AI Agents Push Humans Out of the Loop\" (arXiv 2608.23642). 새 실험이 아니라 인지과학 · 자동화 · HCI · AI 연구를 종합한 정책 제안서다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e승인 피로: \"허용 · 계속 · 승인\" 을 반복 클릭하면 각 요청 검토를 멈추고 사람의 역할은 상징적이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e자동화의 아이러니: 자동화가 더 많은 일을 할수록 평가 기술을 연습할 기회가 줄어 전문성이 약해지고 상황 인식을 잃으며, 감독해야 할 시스템에 더 의존하게 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e처방 \"전략적 마찰\": AI 추천을 보기 전에 스스로 판단, 승인 근거 설명, 일부 작업을 AI 없이 수행, 판단이 중요한 순간에 멈춤. 추가로 정기적 자율 연습, 설계된 승인 시점, 휴식 · 작업 순환, 주의력 저하 인지 훈련 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경(GPT-6 Astra) 이 가능해져도 이미 실행된 행동은 되돌릴 수 없어, 되돌리기 어려운 작업에는 실행 직전 승인이 남는다. 승인 지점을 없앨 수 없다면 승인 피로를 줄이는 설계가 더 중요해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e교육에서는 배경 지식이 없는 학생이 AI 산출물을 검토할 수 없다는 형태로 같은 문제가 나타난다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 다만 코그니션은 하네스 감독과 VM 격리로 에이전트를 \"더 신뢰할 수 있다\" 고 보는데(\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e), 이 보고서는 기술적 통제 장치가 있어도 사람 쪽 역량이 침식된다는 별개의 축을 지적한다. 상충이 아니라 보완 관계로 읽힌다.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 시스템 쪽 통제. 이 페이지는 사람 쪽 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 자율성이 커질수록 감독 부담도 커진다\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","proactive-agent"],"relpath":"wiki/concepts/human-oversight-erosion.md","sources":["S-2026-09-08-003","S-2026-09-09-004"],"status":"draft","stem":"human-oversight-erosion","summary":"사람이 루프 안에 있어도 실질적 감독이 보장되지 않는 메커니즘(인지 부담, 승인 피로, 역량 약화) 과 그 처방(전략적 마찰)","system":false,"text":"정의\n에이전트가 수십 단계를 자율 수행할 때, 사람이 승인 버튼을 갖고 있다는 사실만으로는 감독이 성립하지 않는다는 문제. 세 메커니즘이 겹친다: 이해 · 기억 · 예측 · 감시의 인지 부담, 반복 승인에 따른 승인 피로, 그리고 자동화가 잘될수록 사람의 평가 역량이 약해지는 자동화의 아이러니 [S-2026-09-08-003].\n근거 있는 사실\n출처 보고서: Margaret Mitchell · Abhijit Ghosh · Sameer Passi, \"AI Agents Push Humans Out of the Loop\" (arXiv 2608.23642). 새 실험이 아니라 인지과학 · 자동화 · HCI · AI 연구를 종합한 정책 제안서다 [S-2026-09-08-003]\n승인 피로: \"허용 · 계속 · 승인\" 을 반복 클릭하면 각 요청 검토를 멈추고 사람의 역할은 상징적이 된다 [S-2026-09-08-003]\n자동화의 아이러니: 자동화가 더 많은 일을 할수록 평가 기술을 연습할 기회가 줄어 전문성이 약해지고 상황 인식을 잃으며, 감독해야 할 시스템에 더 의존하게 된다 [S-2026-09-08-003]\n처방 \"전략적 마찰\": AI 추천을 보기 전에 스스로 판단, 승인 근거 설명, 일부 작업을 AI 없이 수행, 판단이 중요한 순간에 멈춤. 추가로 정기적 자율 연습, 설계된 승인 시점, 휴식 · 작업 순환, 주의력 저하 인지 훈련 [S-2026-09-08-003]\n실행 중 지시 변경(GPT-6 Astra) 이 가능해져도 이미 실행된 행동은 되돌릴 수 없어, 되돌리기 어려운 작업에는 실행 직전 승인이 남는다. 승인 지점을 없앨 수 없다면 승인 피로를 줄이는 설계가 더 중요해진다 [S-2026-09-09-004]\n교육에서는 배경 지식이 없는 학생이 AI 산출물을 검토할 수 없다는 형태로 같은 문제가 나타난다 [S-2026-09-08-003]\n모순 · 논쟁\n(없음) — 다만 코그니션은 하네스 감독과 VM 격리로 에이전트를 \"더 신뢰할 수 있다\" 고 보는데(agent-governance-guardrails), 이 보고서는 기술적 통제 장치가 있어도 사람 쪽 역량이 침식된다는 별개의 축을 지적한다. 상충이 아니라 보완 관계로 읽힌다.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nagent-governance-guardrails — 시스템 쪽 통제. 이 페이지는 사람 쪽 문제\nproactive-agent — 자율성이 커질수록 감독 부담도 커진다\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-09-004-gpt-6-astra-task-completion","title":"인간 감독의 침식: 승인 피로 · 자동화의 아이러니 · 전략적 마찰","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["지식 증류","distillation","증류","KD"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","_unsorted","distillation-defense-limits","on-policy-distillation","org-deepseek","post-training-agent-capability"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e큰 teacher 모델의 출력을 작은 student 모델이 따라가도록 학습시켜 지식을 옮기는 기술. 정답 라벨(고양이 1, 나머지 0) 대신 teacher 의 확률 분포(고양이 87%, 개 9%, 여우 3%) 를 배우면 \"고양이는 개와 비슷하고 자동차와는 무관하다\" 는 관계 정보(dark knowledge) 까지 전달된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e출발점으로 흔히 인용되는 논문은 Hinton · Vinyals · Dean 의 「Distilling the Knowledge in a Neural Network」(2015). teacher/student 와 soft target 의 가치를 체계화했고 3만 회 이상 인용됐지만 NeurIPS 본회의에서는 리젝돼 워크숍에 실렸다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원래 목적은 경쟁사 기술 탈취가 아니라 같은 조직 안에서 큰 모델을 압축해 휴대전화 · 서버에서 싸게 돌리는 경량화였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e초기 정의는 좁았다(teacher 확률분포를 student 가 따라감). LLM 으로 오면서 teacher 가 전달하는 것이 완성 답변 · 풀이 과정 · 실패 수정법 · 답안 순위 · 코드 수정안 · 도구 선택 순서 · 비평까지 넓어졌다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e스펙트럼: 한쪽 끝은 teacher logit 을 직접 복사하는 고전적 KD, 다른 끝은 외부 teacher 없이 verifier 와 환경만으로 학습하는 독립 RL. 그 사이에 teacher-generated data, chain-of-thought 학습, synthetic data, LLM judge, RLAIF, preference learning, critique-and-revision, on-policy correction, agent trajectory 학습이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDistillation 이 잘 되려면 강한 base model · 자체 pre-training · 충분한 데이터와 컴퓨팅 · post-training 인프라가 먼저 있어야 한다. 마지막 격차를 빠르게 줄이는 데 효과적이지 약한 baseline 에서 frontier 를 만들지는 못한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기술적 distillation 과 약관 위반 · IP 침해 · 보안 공격은 별개 문제다. 알고리즘 이름으로 합법 · 불법을 판단할 수 없다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — 스펙트럼의 최신 형태\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 방어와 판단 기준\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e — 2026년 2월 논쟁 당사자\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","distillation-defense-limits","on-policy-distillation","org-anthropic","org-deepseek"],"relpath":"wiki/concepts/knowledge-distillation.md","sources":["S-2026-09-08-004"],"status":"draft","stem":"knowledge-distillation","summary":"큰 teacher 모델의 지식(soft target 의 dark knowledge 포함) 을 작은 student 모델로 옮기는 기술. 원래는 경량화 목적이었으나 LLM 시대에 능력 이전 스펙트럼으로 확장","system":false,"text":"정의\n큰 teacher 모델의 출력을 작은 student 모델이 따라가도록 학습시켜 지식을 옮기는 기술. 정답 라벨(고양이 1, 나머지 0) 대신 teacher 의 확률 분포(고양이 87%, 개 9%, 여우 3%) 를 배우면 \"고양이는 개와 비슷하고 자동차와는 무관하다\" 는 관계 정보(dark knowledge) 까지 전달된다 [S-2026-09-08-004].\n근거 있는 사실\n출발점으로 흔히 인용되는 논문은 Hinton · Vinyals · Dean 의 「Distilling the Knowledge in a Neural Network」(2015). teacher/student 와 soft target 의 가치를 체계화했고 3만 회 이상 인용됐지만 NeurIPS 본회의에서는 리젝돼 워크숍에 실렸다 [S-2026-09-08-004]\n원래 목적은 경쟁사 기술 탈취가 아니라 같은 조직 안에서 큰 모델을 압축해 휴대전화 · 서버에서 싸게 돌리는 경량화였다 [S-2026-09-08-004]\n초기 정의는 좁았다(teacher 확률분포를 student 가 따라감). LLM 으로 오면서 teacher 가 전달하는 것이 완성 답변 · 풀이 과정 · 실패 수정법 · 답안 순위 · 코드 수정안 · 도구 선택 순서 · 비평까지 넓어졌다 [S-2026-09-08-004]\n스펙트럼: 한쪽 끝은 teacher logit 을 직접 복사하는 고전적 KD, 다른 끝은 외부 teacher 없이 verifier 와 환경만으로 학습하는 독립 RL. 그 사이에 teacher-generated data, chain-of-thought 학습, synthetic data, LLM judge, RLAIF, preference learning, critique-and-revision, on-policy correction, agent trajectory 학습이 있다 [S-2026-09-08-004]\nDistillation 이 잘 되려면 강한 base model · 자체 pre-training · 충분한 데이터와 컴퓨팅 · post-training 인프라가 먼저 있어야 한다. 마지막 격차를 빠르게 줄이는 데 효과적이지 약한 baseline 에서 frontier 를 만들지는 못한다 [S-2026-09-08-004]\n기술적 distillation 과 약관 위반 · IP 침해 · 보안 공격은 별개 문제다. 알고리즘 이름으로 합법 · 불법을 판단할 수 없다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\non-policy-distillation — 스펙트럼의 최신 형태\ndistillation-defense-limits — 방어와 판단 기준\norg-anthropic · org-deepseek — 2026년 2월 논쟁 당사자\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo","title":"Knowledge Distillation (지식 증류)","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["LLM 위키","llm-wiki","LLM Wiki"],"back":["S-2026-09-08-001-karpathy-llm-wiki","_unsorted","person-andrej-karpathy","product-obsidian","rag-vs-persistent-wiki"],"cites":["S-2026-09-08-001-karpathy-llm-wiki"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eLLM 에이전트가 사람 대신 지식 베이스를 쓰고 유지하는 패턴. 원본 문서를 질문 때마다 검색하는 대신, 새 소스가 들어올 때 LLM 이 읽고 기존 위키 페이지에 통합해 \"한 번 컴파일하고 계속 최신으로 유지\" 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e세 계층으로 구성된다: 불변 원본(raw), LLM 이 전적으로 소유하는 마크다운 위키, 구조와 워크플로를 정의하는 스키마 문서(CLAUDE.md / AGENTS.md) \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e세 가지 운영 작업이 있다: ingest(소스 1건 → 요약 페이지 + 관련 페이지 10~15개 갱신 + index/log), query(인용 달린 답을 위키에 다시 파일링), lint(모순 · 정체 · 고아 · 누락 페이지 · 공백 점검) \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eindex.md 는 내용 카탈로그, log.md 는 시간순 기록으로 역할이 다르다. log 항목은 \u003ccode\u003e## [날짜] 작업 | 제목\u003c/code\u003e 접두어로 유닉스 도구로 파싱 가능하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e소스 약 100건 · 페이지 수백 개 규모까지는 index.md 만으로 탐색이 되고 임베딩 인프라가 필요 없다. 그 이상은 qmd 같은 로컬 검색을 붙인다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e사람의 역할은 소스 큐레이션 · 분석 방향 · 질문이고, 요약 · 상호참조 · 파일링 · 장부 정리는 LLM 의 일이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e적용 범위로 개인 · 연구 · 독서 · 팀 내부 위키 · 경쟁 분석 · 실사 등이 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원전은 의도적으로 추상적이며, 구체 구조는 도메인별로 에이전트와 함께 정하라고 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/rag-vs-persistent-wiki\" class=\"wl\"\u003erag-vs-persistent-wiki\u003c/a\u003e — 이 패턴이 대체하려는 방식과의 차이\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/person-andrej-karpathy\" class=\"wl\"\u003eperson-andrej-karpathy\u003c/a\u003e — 제안자\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-obsidian\" class=\"wl\"\u003eproduct-obsidian\u003c/a\u003e — 권장 열람 도구\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e — 원전\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","person-andrej-karpathy","product-obsidian","rag-vs-persistent-wiki"],"relpath":"wiki/concepts/llm-wiki-pattern.md","sources":["S-2026-09-08-001"],"status":"draft","stem":"llm-wiki-pattern","summary":"LLM 이 원본을 영속 마크다운 위키로 컴파일 · 유지하는 지식 관리 패턴. raw/wiki/schema 3계층과 ingest · query · lint 루프","system":false,"text":"정의\nLLM 에이전트가 사람 대신 지식 베이스를 쓰고 유지하는 패턴. 원본 문서를 질문 때마다 검색하는 대신, 새 소스가 들어올 때 LLM 이 읽고 기존 위키 페이지에 통합해 \"한 번 컴파일하고 계속 최신으로 유지\" 한다 [S-2026-09-08-001].\n근거 있는 사실\n세 계층으로 구성된다: 불변 원본(raw), LLM 이 전적으로 소유하는 마크다운 위키, 구조와 워크플로를 정의하는 스키마 문서(CLAUDE.md / AGENTS.md) [S-2026-09-08-001]\n세 가지 운영 작업이 있다: ingest(소스 1건 → 요약 페이지 + 관련 페이지 10~15개 갱신 + index/log), query(인용 달린 답을 위키에 다시 파일링), lint(모순 · 정체 · 고아 · 누락 페이지 · 공백 점검) [S-2026-09-08-001]\nindex.md 는 내용 카탈로그, log.md 는 시간순 기록으로 역할이 다르다. log 항목은 ## [날짜] 작업 | 제목 접두어로 유닉스 도구로 파싱 가능하다 [S-2026-09-08-001]\n소스 약 100건 · 페이지 수백 개 규모까지는 index.md 만으로 탐색이 되고 임베딩 인프라가 필요 없다. 그 이상은 qmd 같은 로컬 검색을 붙인다 [S-2026-09-08-001]\n사람의 역할은 소스 큐레이션 · 분석 방향 · 질문이고, 요약 · 상호참조 · 파일링 · 장부 정리는 LLM 의 일이다 [S-2026-09-08-001]\n적용 범위로 개인 · 연구 · 독서 · 팀 내부 위키 · 경쟁 분석 · 실사 등이 제시된다 [S-2026-09-08-001]\n원전은 의도적으로 추상적이며, 구체 구조는 도메인별로 에이전트와 함께 정하라고 한다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nrag-vs-persistent-wiki — 이 패턴이 대체하려는 방식과의 차이\nperson-andrej-karpathy — 제안자\nproduct-obsidian — 권장 열람 도구\nS-2026-09-08-001-karpathy-llm-wiki — 원전","title":"LLM Wiki 패턴","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["24GB 경계","로컬 모델","local model","온프레미스 모델"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-005-arena-coding-leaderboard-shift","open-local-models","org-startlux","post-training-agent-capability","product-muse-glimmer","product-qwen","sovereign-ai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-005-arena-coding-leaderboard-shift"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e클라우드에서는 모델이 인프라에 맞춰 커졌지만, 로컬에서는 인프라(소비자 GPU 메모리 24GB) 가 모델 크기의 상한을 정한다. 그 결과 여러 회사의 로컬 모델이 27~30B 에 모였다. \"제약이 표준을 만들고 표준이 생태계를 만든다\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAlibaba Qwen3.8-27B(2026-08-14, Apache 2.0): 27B Dense, 네이티브 멀티모달, 262K 컨텍스트. 4비트 양자화 시 약 17GB. LM Studio · Ollama · Unsloth 원클릭 설치 지원 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eMeta Muse Glimmer(2026-08-10, 같은 라이선스): 30B Dense + 1.8B 지각 인코더, 120K+ 컨텍스트. 4비트 동적 양자화로 17~20GB, 24~32GB 안에 KV 캐시와 추측적 디코딩 여유까지 확보 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eStartLux-V1.0-27B-Preview: Qwen3.6-27B 기반 후훈련 모델 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e뒷받침 기술: 추측적 디코딩(작은 초안 모델이 여러 토큰 생성, 큰 모델이 한 번에 검증), KV 캐시 최적화. Qwen3.8-27B 는 64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시 생성 층을 1/4 로 줄였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArena 코딩 리더보드에서 Qwen3.8-27B 가 약 1600 Elo 로 상위권에 근접했다는 관찰은 24GB 규격이 성능 타협이 아니라는 독립 근거다 (전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 사용자 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e클라우드는 사라지지 않고 재편된다. Microsoft Azure Local, Google 경량 Flash 계열처럼 빅테크도 로컬을 흡수하며, 미래는 \"어떤 작업을 어디서\" 가 정해지는 계층 구조다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e천다녠은 로컬 모델이 3년 안에 시장 80% 를 점유한다고 예측한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 반면 코그니션은 개발자 데이터에서 IDE 보다 클라우드 에이전트 사용이 늘고 있다고 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 같은 글이 \"클라우드 대 로컬\" 이 아니라 계층화라고 정리하므로 정면 충돌은 아니지만, 어느 작업이 어디로 가는지는 열린 문제다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 같은 크기에서 성능을 올리는 층\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/product-muse-glimmer\" class=\"wl\"\u003eproduct-muse-glimmer\u003c/a\u003e · \u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 반대편 흐름\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-005-arena-coding-leaderboard-shift","cloud-agent","open-local-models","org-startlux","post-training-agent-capability","product-muse-glimmer","product-qwen"],"relpath":"wiki/concepts/local-model-24gb-boundary.md","sources":["S-2026-09-08-006","S-2026-09-09-005"],"status":"draft","stem":"local-model-24gb-boundary","summary":"소비자 GPU 한 장(24GB) 이 설계 제약이 되어 27~30B Dense 4비트(17~20GB) 가 로컬 모델 표준으로 수렴하고, 양자화 · 추측적 디코딩 · KV 캐시 최적화가 이를 뒷받침한다는 관찰","system":false,"text":"정의\n클라우드에서는 모델이 인프라에 맞춰 커졌지만, 로컬에서는 인프라(소비자 GPU 메모리 24GB) 가 모델 크기의 상한을 정한다. 그 결과 여러 회사의 로컬 모델이 27~30B 에 모였다. \"제약이 표준을 만들고 표준이 생태계를 만든다\" [S-2026-09-08-006].\n근거 있는 사실\nAlibaba Qwen3.8-27B(2026-08-14, Apache 2.0): 27B Dense, 네이티브 멀티모달, 262K 컨텍스트. 4비트 양자화 시 약 17GB. LM Studio · Ollama · Unsloth 원클릭 설치 지원 [S-2026-09-08-006]\nMeta Muse Glimmer(2026-08-10, 같은 라이선스): 30B Dense + 1.8B 지각 인코더, 120K+ 컨텍스트. 4비트 동적 양자화로 17~20GB, 24~32GB 안에 KV 캐시와 추측적 디코딩 여유까지 확보 [S-2026-09-08-006]\nStartLux-V1.0-27B-Preview: Qwen3.6-27B 기반 후훈련 모델 [S-2026-09-08-006]\n뒷받침 기술: 추측적 디코딩(작은 초안 모델이 여러 토큰 생성, 큰 모델이 한 번에 검증), KV 캐시 최적화. Qwen3.8-27B 는 64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시 생성 층을 1/4 로 줄였다 [S-2026-09-08-006]\nArena 코딩 리더보드에서 Qwen3.8-27B 가 약 1600 Elo 로 상위권에 근접했다는 관찰은 24GB 규격이 성능 타협이 아니라는 독립 근거다 (전언) [S-2026-09-09-005]\n로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 사용자 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 [S-2026-09-08-006]\n클라우드는 사라지지 않고 재편된다. Microsoft Azure Local, Google 경량 Flash 계열처럼 빅테크도 로컬을 흡수하며, 미래는 \"어떤 작업을 어디서\" 가 정해지는 계층 구조다 [S-2026-09-08-006]\n모순 · 논쟁\n천다녠은 로컬 모델이 3년 안에 시장 80% 를 점유한다고 예측한다 [S-2026-09-08-006]. 반면 코그니션은 개발자 데이터에서 IDE 보다 클라우드 에이전트 사용이 늘고 있다고 한다 [S-2026-09-08-002]. 같은 글이 \"클라우드 대 로컬\" 이 아니라 계층화라고 정리하므로 정면 충돌은 아니지만, 어느 작업이 어디로 가는지는 열린 문제다.\n관련 페이지\nopen-local-models — 상위 주제\npost-training-agent-capability — 같은 크기에서 성능을 올리는 층\nproduct-qwen · product-muse-glimmer · org-startlux\ncloud-agent — 반대편 흐름\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-005-arena-coding-leaderboard-shift","title":"로컬 모델과 24GB 경계선","topics":["open-local-models"],"type":"concept","updated":"2026-09-09"},{"aliases":["model routing","토큰 경제","token economics","모델 라우팅"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","org-anthropic","org-cognition","org-openai","org-tencent","product-gpt-6-astra","small-model-self-improvement-loop"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모든 작업에 가장 비싼 모델을 쓰지 않고, 계획 같은 복잡한 작업에는 강한 모델을, 단순 실행에는 저렴한 모델을 배치하는 운영 방식. 어떤 업무에 어떤 모델이 맞는지를 계속 평가해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e많은 고객이 최상위 모델부터 쓰다가 곧바로 예산을 소진한다. \"청구서 충격을 겪지 않은 회사가 없다\" 고 제프 왕은 말했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션은 Claude · ChatGPT · Gemini · 자체 모델 · 오픈소스를 후보에 두고 태스크마다 고른다. 모든 작업에 최상위 모델을 쓰면 비용이 10배가 된다고 했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e최적 모델은 거의 매주 바뀐다. 특정 랩 소속 도구는 그 랩 모델에 묶이므로 독립성이 라우팅의 전제라는 것이 코그니션의 논리다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e오픈웨이트 모델도 라우팅 대상이다. 성능이 같고 비용이 1/10 이며 고객이 수용하면 쓰고, 특정 모델을 원치 않는 고객은 차단할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e라우팅의 극단형: 반복 업무마다 작고 저렴한 전용 소형 모델을 만들어 쓰는 방식. Shopify 는 0.8B 모델로 특정 업무에서 GPT-5.6 Sol 을 이겼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e티어 배분의 실례: GPT-6 Astra 는 입력 10달러 · 출력 50달러(100만 토큰) 로 Sol 의 2.5배다. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol, 다단계 · 외부 시스템 · 요구 변경이 있는 업무만 Astra 에 맡기라는 것이 실무자의 권고다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e가격 대비 성능의 역전 사례: Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 기록해 Grok 4.6 급 성능을 훨씬 낮은 가격에 냈고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접했다 (전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e더밀크 해설: 기업 AI 경쟁이 \"가장 좋은 모델을 누가 쓰나\" 에서 \"어떤 업무에 어떤 모델을 얼마나 경제적으로 배치하나\" 로 이동하고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — 비용의 반대편인 성과 측정\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e · \u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 업무별 전용 소형 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","org-cognition","org-shopify","small-model-self-improvement-loop"],"relpath":"wiki/concepts/model-routing-token-economics.md","sources":["S-2026-09-08-002","S-2026-09-09-003","S-2026-09-09-004","S-2026-09-09-005"],"status":"draft","stem":"model-routing-token-economics","summary":"작업마다 적합한 모델(최상위 · 저렴 · 오픈웨이트) 을 고르는 라우팅. 기업 AI 비용 관리가 클라우드 비용에서 토큰 배분 문제로 이동","system":false,"text":"정의\n모든 작업에 가장 비싼 모델을 쓰지 않고, 계획 같은 복잡한 작업에는 강한 모델을, 단순 실행에는 저렴한 모델을 배치하는 운영 방식. 어떤 업무에 어떤 모델이 맞는지를 계속 평가해야 한다 [S-2026-09-08-002].\n근거 있는 사실\n많은 고객이 최상위 모델부터 쓰다가 곧바로 예산을 소진한다. \"청구서 충격을 겪지 않은 회사가 없다\" 고 제프 왕은 말했다 [S-2026-09-08-002]\n코그니션은 Claude · ChatGPT · Gemini · 자체 모델 · 오픈소스를 후보에 두고 태스크마다 고른다. 모든 작업에 최상위 모델을 쓰면 비용이 10배가 된다고 했다 [S-2026-09-08-002]\n최적 모델은 거의 매주 바뀐다. 특정 랩 소속 도구는 그 랩 모델에 묶이므로 독립성이 라우팅의 전제라는 것이 코그니션의 논리다 [S-2026-09-08-002]\n오픈웨이트 모델도 라우팅 대상이다. 성능이 같고 비용이 1/10 이며 고객이 수용하면 쓰고, 특정 모델을 원치 않는 고객은 차단할 수 있다 [S-2026-09-08-002]\n라우팅의 극단형: 반복 업무마다 작고 저렴한 전용 소형 모델을 만들어 쓰는 방식. Shopify 는 0.8B 모델로 특정 업무에서 GPT-5.6 Sol 을 이겼다 [S-2026-09-09-003]\n티어 배분의 실례: GPT-6 Astra 는 입력 10달러 · 출력 50달러(100만 토큰) 로 Sol 의 2.5배다. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol, 다단계 · 외부 시스템 · 요구 변경이 있는 업무만 Astra 에 맡기라는 것이 실무자의 권고다 [S-2026-09-09-004]\n가격 대비 성능의 역전 사례: Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 기록해 Grok 4.6 급 성능을 훨씬 낮은 가격에 냈고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접했다 (전언) [S-2026-09-09-005]\n더밀크 해설: 기업 AI 경쟁이 \"가장 좋은 모델을 누가 쓰나\" 에서 \"어떤 업무에 어떤 모델을 얼마나 경제적으로 배치하나\" 로 이동하고 있다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-roi-human-equivalent-hours — 비용의 반대편인 성과 측정\norg-cognition · org-shopify\nsmall-model-self-improvement-loop — 업무별 전용 소형 모델\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-005-arena-coding-leaderboard-shift","title":"모델 라우팅과 토큰 경제","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["온폴리시 증류","GKD","Generalized Knowledge Distillation"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","_unsorted","distillation-defense-limits","knowledge-distillation","post-training-agent-capability"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eTeacher 가 미리 만든 모범답안을 student 가 외우는 대신, student 가 현재 실력으로 답안과 reasoning 궤적을 만들고, 실제로 방문한 중간 상태를 teacher 에게 보여 그 지점에서 좋은 token · 행동을 피드백받는 방식 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e동기: 고정된 teacher 답안만 학습하면 student 가 추론 초반에 작은 실수를 한 뒤 한 번도 본 적 없는 상태에 도달해 전체가 무너진다(train-inference distribution mismatch, exposure bias). Student 가 자주 틀리는 지점을 중심으로 교정하면 더 효율적일 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eGoogle DeepMind 의 Generalized Knowledge Distillation 이 student 생성 sequence 위에서 teacher 의 token-level 확률분포를 학습하는 방식으로 정식화했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e엄밀한 on-policy distillation 은 중간 상태마다 teacher 의 token probability 급 세밀 신호가 필요하다. 상용 API 는 logit 을 주지 않으므로 외부에서는 다음 단계 작성, 틀린 부분 지적, 답안 순위, 두 답안 비교 같은 대체 신호를 쓴다. 알고리즘은 달라도 \"student 경로 위에서 teacher 판단을 반복해 받는\" 구조는 같다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eRLVR 의 최종 정답 보상과 on-policy distillation 의 token-level 신호를 결합하는 연구가 활발하며, 2026년 제안된 OPDVR 이 두 신호를 한 학습 구조에 넣었다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델 제공사가 chain of thought 를 요약 · 암호화해도 이 경로는 남는다. 셰프가 레시피를 숨겨도 견습생 요리를 맛보고 조언하는 한 능력은 이전된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e — 상위 개념\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 이 경로가 방어를 어렵게 만드는 이유\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","distillation-defense-limits","knowledge-distillation"],"relpath":"wiki/concepts/on-policy-distillation.md","sources":["S-2026-09-08-004"],"status":"draft","stem":"on-policy-distillation","summary":"student 가 스스로 생성한 추론 궤적의 각 지점에서 teacher 의 확률 · 교정 신호를 받는 distillation. 견습생이 자기 요리를 셰프에게 보여주고 다음 단계를 묻는 구조","system":false,"text":"정의\nTeacher 가 미리 만든 모범답안을 student 가 외우는 대신, student 가 현재 실력으로 답안과 reasoning 궤적을 만들고, 실제로 방문한 중간 상태를 teacher 에게 보여 그 지점에서 좋은 token · 행동을 피드백받는 방식 [S-2026-09-08-004].\n근거 있는 사실\n동기: 고정된 teacher 답안만 학습하면 student 가 추론 초반에 작은 실수를 한 뒤 한 번도 본 적 없는 상태에 도달해 전체가 무너진다(train-inference distribution mismatch, exposure bias). Student 가 자주 틀리는 지점을 중심으로 교정하면 더 효율적일 수 있다 [S-2026-09-08-004]\nGoogle DeepMind 의 Generalized Knowledge Distillation 이 student 생성 sequence 위에서 teacher 의 token-level 확률분포를 학습하는 방식으로 정식화했다 [S-2026-09-08-004]\n엄밀한 on-policy distillation 은 중간 상태마다 teacher 의 token probability 급 세밀 신호가 필요하다. 상용 API 는 logit 을 주지 않으므로 외부에서는 다음 단계 작성, 틀린 부분 지적, 답안 순위, 두 답안 비교 같은 대체 신호를 쓴다. 알고리즘은 달라도 \"student 경로 위에서 teacher 판단을 반복해 받는\" 구조는 같다 [S-2026-09-08-004]\nRLVR 의 최종 정답 보상과 on-policy distillation 의 token-level 신호를 결합하는 연구가 활발하며, 2026년 제안된 OPDVR 이 두 신호를 한 학습 구조에 넣었다 [S-2026-09-08-004]\n모델 제공사가 chain of thought 를 요약 · 암호화해도 이 경로는 남는다. 셰프가 레시피를 숨겨도 견습생 요리를 맛보고 조언하는 한 능력은 이전된다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-distillation — 상위 개념\ndistillation-defense-limits — 이 경로가 방어를 어렵게 만드는 이유\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo","title":"On-policy Distillation","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["로컬 모델","오픈소스 모델","open models","온프레미스 AI"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","fully-open-source-model","local-model-24gb-boundary","org-deepseek","org-mbzuai","org-shopify","org-startlux","org-tencent","person-chen-danian","post-training-agent-capability","product-k2-horizon","product-muse-glimmer","product-qwen","product-tangle","small-model-self-improvement-loop"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift"],"confidence":"medium","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e모델 공개의 수준이 가중치만 내놓는 오픈웨이트에서 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 내놓는 완전 오픈소스로 올라가고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e. UAE MBZUAI 의 K2 Horizon 은 0.9B 부터 375B 까지 6종을 Apache 2.0 으로 공개하며 이를 \"AI 역사상 최대 규모의 완전 오픈소스 발표\" 라고 주장했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e같은 시기 로컬 쪽에서는 소비자 GPU 한 장(24GB) 이 설계 제약이 되어 Qwen3.8-27B, Meta Muse Glimmer(30B), StartLux 27B 가 4비트 17~20GB 규격으로 수렴했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. StartLux 는 Qwen3.6-27B 에 도구 선택 · 다단계 실행 · 검증 중심 후훈련만 얹어 CAICT MCP 테스트에서 1.6T 모델에 1.3%p 차로 근접했고, 이는 에이전트 능력의 상당 부분이 후훈련 층에 있으며 파운데이션 모델 없는 회사도 만들 수 있다는 근거로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e두 흐름이 만나면, 강한 오픈 base 위에 도메인 특화 후훈련을 얹어 24GB 한 장에서 도는 스페셜리스트 에이전트를 만드는 것이 파운데이션 모델을 갖지 않은 회사의 현실적 경로가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 같은 결론이 서구 대기업에서도 나온다. Shopify 는 0.8B Qwen 을 실제 업무 결과 평가와 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼고, 파이프라인 기술 Tangle 을 오픈소스로 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e. 공개 리더보드 관찰도 같은 방향이다. Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 내고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접한 반면 GPT-5.6 Sol 은 9위로 밀렸다는 관찰은 경쟁 축이 성능 · 가격 · 로컬 실행으로 바뀌었음을 시사한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e. 다만 클라우드는 사라지지 않고 \"어떤 작업을 어디서\" 가 정해지는 계층 구조로 재편된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 성능 주장 다수는 발표 주체의 자체 평가라 독립 검증이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/fully-open-source-model\" class=\"wl\"\u003efully-open-source-model\u003c/a\u003e — 오픈웨이트와 완전 오픈소스의 차이\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — 소비자 GPU 한 장이 만든 27~30B 표준\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 에이전트 능력은 후훈련 층에\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 업무별 소형 모델의 자기개선 루프 (Shopify)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-mbzuai\" class=\"wl\"\u003eorg-mbzuai\u003c/a\u003e · \u003ca href=\"#/product-k2-horizon\" class=\"wl\"\u003eproduct-k2-horizon\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e · \u003ca href=\"#/person-chen-danian\" class=\"wl\"\u003eperson-chen-danian\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/product-muse-glimmer\" class=\"wl\"\u003eproduct-muse-glimmer\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e · \u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/org-tencent\" class=\"wl\"\u003eorg-tencent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" class=\"wl\"\u003eS-2026-09-08-005-uae-k2-horizon-open-source\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" class=\"wl\"\u003eS-2026-09-09-001-tangle-visual-ml-pipeline\u003c/a\u003e — Tangle 제품 페이지 (Shopify 와의 관계 미확인)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e — 리더보드에서 본 가격 · 로컬 경쟁\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e Arena 코딩 리더보드: Hy4 1631 Elo, Sol 9위, Qwen3.8-27B 약 1600\u003c/li\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e Shopify, Qwen3.5-0.8B 자기개선 미세조정으로 특정 업무에서 GPT-5.6 Sol 상회 · Tangle 오픈소스\u003c/li\u003e\n\u003cli\u003e2026-08-31 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e CAICT MCP 테스트 공표, StartLux-V1.0-27B-Preview 종합 2위\u003c/li\u003e\n\u003cli\u003e2026-08-14 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e Alibaba Qwen3.8-27B Apache 2.0 공개\u003c/li\u003e\n\u003cli\u003e2026-08-10 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e Meta Muse Glimmer 공개\u003c/li\u003e\n\u003cli\u003e날짜 미상 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e MBZUAI IFM, K2 Horizon 6종 완전 오픈소스 공개 (게시글에 \"3일\" 로만 표기)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003etangleml.com 의 Tangle 이 Shopify 가 공개한 Tangle 과 같은 제품인가? 저장소 확인 필요\u003c/li\u003e\n\u003cli\u003eK2 Horizon 과 Qwen3.8 · Muse Glimmer 의 독립 벤치마크 결과는? (모든 성능 주장이 발표 주체 자료)\u003c/li\u003e\n\u003cli\u003e우리 도메인 데이터로 후훈련할 때 base 는 K2 Horizon 3.7B/32B 인가 Qwen3.8-27B 인가 — 라이선스는 둘 다 Apache 2.0 이지만 학습 데이터 · 레시피 공개는 K2 만 확인됨\u003c/li\u003e\n\u003cli\u003e\"3년 안에 로컬 80%\" 예측(천다녠) 과 클라우드 에이전트 사용 증가(코그니션) 는 어떤 작업 분할로 양립하는가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-09: Shopify 소형 모델 사례 공유 — 로컬 · 후훈련 흐름의 서구 사례로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-08: 완전 오픈소스 공개 뉴스와 로컬 에이전트 모델 분석을 같은 날 공유 — 파운데이션 모델 없이 특화 모델을 만드는 경로에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","fully-open-source-model","local-model-24gb-boundary","org-mbzuai","org-shopify","org-startlux","org-tencent","person-chen-danian","post-training-agent-capability","product-k2-horizon","product-muse-glimmer","product-qwen","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/topics/open-local-models.md","sources":["S-2026-09-08-005","S-2026-09-08-006","S-2026-09-09-003","S-2026-09-09-001","S-2026-09-09-005"],"status":"draft","stem":"open-local-models","summary":"완전 오픈소스(K2 Horizon) 와 24GB 로컬 표준(Qwen3.8 · Muse Glimmer · StartLux) 이 만나 파운데이션 모델 없이 후훈련으로 특화 에이전트를 만드는 길","system":false,"text":"현재 종합\n모델 공개의 수준이 가중치만 내놓는 오픈웨이트에서 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 내놓는 완전 오픈소스로 올라가고 있다 [S-2026-09-08-005]. UAE MBZUAI 의 K2 Horizon 은 0.9B 부터 375B 까지 6종을 Apache 2.0 으로 공개하며 이를 \"AI 역사상 최대 규모의 완전 오픈소스 발표\" 라고 주장했다 [S-2026-09-08-005].\n같은 시기 로컬 쪽에서는 소비자 GPU 한 장(24GB) 이 설계 제약이 되어 Qwen3.8-27B, Meta Muse Glimmer(30B), StartLux 27B 가 4비트 17~20GB 규격으로 수렴했다 [S-2026-09-08-006]. StartLux 는 Qwen3.6-27B 에 도구 선택 · 다단계 실행 · 검증 중심 후훈련만 얹어 CAICT MCP 테스트에서 1.6T 모델에 1.3%p 차로 근접했고, 이는 에이전트 능력의 상당 부분이 후훈련 층에 있으며 파운데이션 모델 없는 회사도 만들 수 있다는 근거로 제시된다 [S-2026-09-08-006].\n두 흐름이 만나면, 강한 오픈 base 위에 도메인 특화 후훈련을 얹어 24GB 한 장에서 도는 스페셜리스트 에이전트를 만드는 것이 파운데이션 모델을 갖지 않은 회사의 현실적 경로가 된다 [S-2026-09-08-005] [S-2026-09-08-006]. 로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 [S-2026-09-08-006]. 같은 결론이 서구 대기업에서도 나온다. Shopify 는 0.8B Qwen 을 실제 업무 결과 평가와 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼고, 파이프라인 기술 Tangle 을 오픈소스로 공개했다 [S-2026-09-09-003]. 공개 리더보드 관찰도 같은 방향이다. Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 내고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접한 반면 GPT-5.6 Sol 은 9위로 밀렸다는 관찰은 경쟁 축이 성능 · 가격 · 로컬 실행으로 바뀌었음을 시사한다 [S-2026-09-09-005]. 다만 클라우드는 사라지지 않고 \"어떤 작업을 어디서\" 가 정해지는 계층 구조로 재편된다 [S-2026-09-08-006]. 성능 주장 다수는 발표 주체의 자체 평가라 독립 검증이 필요하다 [S-2026-09-08-005] [S-2026-09-08-006].\n하위 페이지\n개념\nfully-open-source-model — 오픈웨이트와 완전 오픈소스의 차이\nlocal-model-24gb-boundary — 소비자 GPU 한 장이 만든 27~30B 표준\npost-training-agent-capability — 에이전트 능력은 후훈련 층에\nsmall-model-self-improvement-loop — 업무별 소형 모델의 자기개선 루프 (Shopify)\n엔티티\norg-mbzuai · product-k2-horizon\norg-startlux · person-chen-danian\nproduct-qwen · product-muse-glimmer\norg-shopify · product-tangle · org-tencent\n소스\nS-2026-09-08-005-uae-k2-horizon-open-source\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-001-tangle-visual-ml-pipeline — Tangle 제품 페이지 (Shopify 와의 관계 미확인)\nS-2026-09-09-005-arena-coding-leaderboard-shift — 리더보드에서 본 가격 · 로컬 경쟁\n타임라인\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-005] Arena 코딩 리더보드: Hy4 1631 Elo, Sol 9위, Qwen3.8-27B 약 1600\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-003] Shopify, Qwen3.5-0.8B 자기개선 미세조정으로 특정 업무에서 GPT-5.6 Sol 상회 · Tangle 오픈소스\n2026-08-31 [S-2026-09-08-006] CAICT MCP 테스트 공표, StartLux-V1.0-27B-Preview 종합 2위\n2026-08-14 [S-2026-09-08-006] Alibaba Qwen3.8-27B Apache 2.0 공개\n2026-08-10 [S-2026-09-08-006] Meta Muse Glimmer 공개\n날짜 미상 [S-2026-09-08-005] MBZUAI IFM, K2 Horizon 6종 완전 오픈소스 공개 (게시글에 \"3일\" 로만 표기)\n열린 질문\ntangleml.com 의 Tangle 이 Shopify 가 공개한 Tangle 과 같은 제품인가? 저장소 확인 필요\nK2 Horizon 과 Qwen3.8 · Muse Glimmer 의 독립 벤치마크 결과는? (모든 성능 주장이 발표 주체 자료)\n우리 도메인 데이터로 후훈련할 때 base 는 K2 Horizon 3.7B/32B 인가 Qwen3.8-27B 인가 — 라이선스는 둘 다 Apache 2.0 이지만 학습 데이터 · 레시피 공개는 K2 만 확인됨\n\"3년 안에 로컬 80%\" 예측(천다녠) 과 클라우드 에이전트 사용 증가(코그니션) 는 어떤 작업 분할로 양립하는가\n관심 흐름\n2026-09-09: Shopify 소형 모델 사례 공유 — 로컬 · 후훈련 흐름의 서구 사례로 추정 (추정)\n2026-09-08: 완전 오픈소스 공개 뉴스와 로컬 에이전트 모델 분석을 같은 날 공유 — 파운데이션 모델 없이 특화 모델을 만드는 경로에 대한 관심으로 추정 (추정)","title":"오픈소스 · 로컬 모델의 부상","topics":[],"type":"topic","updated":"2026-09-09"},{"aliases":["앤트로픽","앤스로픽"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-004-distillation-spectrum-lee-dongsoo","ai-agents-enterprise-adoption","distillation-defense-limits","knowledge-distillation","org-deepseek","org-openai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-004-distillation-spectrum-lee-dongsoo"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eClaude 모델을 만드는 미국 AI 랩. Claude Code 등장이 \"개발의 민주화\" 계기로 언급된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제프 왕에 따르면 2026년 8월 시점 상장을 준비 중이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e어느 주에는 Anthropic 모델이 최고라 Claude Code 가 앞서고 다음 주에는 OpenAI 가 앞서는 식으로 최적 모델이 매주 바뀐다 — 라우팅 논리의 근거로 인용됨 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e많은 고객이 최상위 모델(기사 표기 \"페이블\") 부터 쓰다가 예산을 소진한다는 사례에 등장 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026년 2월, DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 reasoning · coding · tool use 능력을 이전하려 했다고 주장하고, 약관 · 지역 제한 우회를 포함한 \"산업적 규모의 distillation 공격\" 으로 규정해 업계 · 정책당국의 공동 대응을 요구했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-004-distillation-spectrum-lee-dongsoo","ai-agents-enterprise-adoption","distillation-defense-limits","model-routing-token-economics","org-deepseek","org-openai"],"relpath":"wiki/entities/org-anthropic.md","sources":["S-2026-09-08-002","S-2026-09-08-004"],"status":"draft","stem":"org-anthropic","summary":"미국 AI 랩. Claude 모델과 Claude Code 개발. 상장 준비, 모델 종속 도구 사례, 중국 모델의 distillation 공격 주장 주체로 등장","system":false,"text":"정의\nClaude 모델을 만드는 미국 AI 랩. Claude Code 등장이 \"개발의 민주화\" 계기로 언급된다 [S-2026-09-08-002].\n근거 있는 사실\n제프 왕에 따르면 2026년 8월 시점 상장을 준비 중이다 [S-2026-09-08-002]\n어느 주에는 Anthropic 모델이 최고라 Claude Code 가 앞서고 다음 주에는 OpenAI 가 앞서는 식으로 최적 모델이 매주 바뀐다 — 라우팅 논리의 근거로 인용됨 [S-2026-09-08-002]\n많은 고객이 최상위 모델(기사 표기 \"페이블\") 부터 쓰다가 예산을 소진한다는 사례에 등장 [S-2026-09-08-002]\n2026년 2월, DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 reasoning · coding · tool use 능력을 이전하려 했다고 주장하고, 약관 · 지역 제한 우회를 포함한 \"산업적 규모의 distillation 공격\" 으로 규정해 업계 · 정책당국의 공동 대응을 요구했다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\norg-openai\nmodel-routing-token-economics\ndistillation-defense-limits · org-deepseek\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo","title":"Anthropic","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-08"},{"aliases":["코그니션","Cognition AI","Cognition Labs"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","forward-deployed-engineer","model-routing-token-economics","org-crewon-ai","person-jeff-wang","product-devin","sovereign-ai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"AI 소프트웨어 엔지니어\" 개념을 내세운 미국 AI 코딩 기업. Devin 을 개발하고 2025년 Windsurf 의 사업 · 제품 · IP · 인력을 인수했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제프 왕에 따르면 OpenAI · Anthropic 은 상장 준비 중이고 Cursor 는 SpaceX 안에 있어, 코그니션이 유일하게 남은 독립 대형 비상장 AI 코딩 기업이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e매출의 상당 부분이 엔터프라이즈 장기 계약에서 나온다. 골드만삭스 · 씨티 등 대형 금융기관, 메르세데스 등 자동차 기업과 일한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e작업별 모델 라우팅과 평가 체계를 갖고 있으며, 내부 코드 작성의 90% 를 Devin 이 담당한다고 밝혔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e창업팀과 다수 엔지니어가 IOI 등 프로그래밍 올림피아드 출신이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e미국 연방정부 · EU 와 일한 경험이 있고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이다. 한국과는 구체 논의 전이지만 관심이 있으며, 고객 기반이 커지면 현지 팀 · 오피스도 검토한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026년에 Windsurf 브랜드를 단계적으로 Devin 으로 통합했다. 클라우드 에이전트 · IDE · CLI · 코드리뷰를 한 플랫폼으로 묶는 방향이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e기업가치: 기사 도입부 \"약 460억 달러로 신규 투자 유치 중\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e / 같은 기사 해설 \"400억~450억 달러 수준으로 논의 중, 5월 시리즈 D 는 260억 달러\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 회사는 코멘트하지 않았다. 확정치 아님.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e · \u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — \"실행 환경을 판다\" 는 같은 논리의 한국 사례 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e · \u003ca href=\"#/person-jeff-wang\" class=\"wl\"\u003eperson-jeff-wang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e · \u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e · \u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","forward-deployed-engineer","model-routing-token-economics","org-crewon-ai","person-jeff-wang","product-devin"],"relpath":"wiki/entities/org-cognition.md","sources":["S-2026-09-08-002","S-2026-09-09-002"],"status":"draft","stem":"org-cognition","summary":"AI 소프트웨어 엔지니어 Devin 개발사. Windsurf 인수 후 독립 대형 비상장 AI 코딩 기업. 엔터프라이즈 중심, 한국 금융 · 제조 진출 검토","system":false,"text":"정의\n\"AI 소프트웨어 엔지니어\" 개념을 내세운 미국 AI 코딩 기업. Devin 을 개발하고 2025년 Windsurf 의 사업 · 제품 · IP · 인력을 인수했다 [S-2026-09-08-002].\n근거 있는 사실\n제프 왕에 따르면 OpenAI · Anthropic 은 상장 준비 중이고 Cursor 는 SpaceX 안에 있어, 코그니션이 유일하게 남은 독립 대형 비상장 AI 코딩 기업이다 [S-2026-09-08-002]\n매출의 상당 부분이 엔터프라이즈 장기 계약에서 나온다. 골드만삭스 · 씨티 등 대형 금융기관, 메르세데스 등 자동차 기업과 일한다 [S-2026-09-08-002]\n작업별 모델 라우팅과 평가 체계를 갖고 있으며, 내부 코드 작성의 90% 를 Devin 이 담당한다고 밝혔다 [S-2026-09-08-002]\n창업팀과 다수 엔지니어가 IOI 등 프로그래밍 올림피아드 출신이다 [S-2026-09-08-002]\n미국 연방정부 · EU 와 일한 경험이 있고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이다. 한국과는 구체 논의 전이지만 관심이 있으며, 고객 기반이 커지면 현지 팀 · 오피스도 검토한다 [S-2026-09-08-002]\n2026년에 Windsurf 브랜드를 단계적으로 Devin 으로 통합했다. 클라우드 에이전트 · IDE · CLI · 코드리뷰를 한 플랫폼으로 묶는 방향이다 [S-2026-09-08-002]\n모순 · 논쟁\n기업가치: 기사 도입부 \"약 460억 달러로 신규 투자 유치 중\" [S-2026-09-08-002] / 같은 기사 해설 \"400억~450억 달러 수준으로 논의 중, 5월 시리즈 D 는 260억 달러\" [S-2026-09-08-002]. 회사는 코멘트하지 않았다. 확정치 아님.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\norg-crewon-ai · ai-workforce-runtime — \"실행 환경을 판다\" 는 같은 논리의 한국 사례 [S-2026-09-09-002]\nproduct-devin · person-jeff-wang\nmodel-routing-token-economics · forward-deployed-engineer · ai-roi-human-equivalent-hours\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"Cognition (코그니션)","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-09"},{"aliases":["크루온AI","Crewon.ai","크루AI 워크","crewai.work","송호철"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","ai-agents-enterprise-adoption","ai-workforce-runtime","org-cognition"],"cites":["S-2026-09-09-002-crewon-ai-agent-runtime"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"AI 에이전트가 정말 직원처럼 일하려면 무엇이 필요할까\" 라는 질문에서 출발한 한국 스타트업. 대표 송호철은 더존비즈온 플랫폼사업부문 대표를 지냈다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제품: '크루AI 워크(crewai.work)' 사람 + AI 업무공간(메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재) 과 '크루온AI(Crewon.ai)' AI 크루를 만들고 운영하는 런타임 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e시연: 비서 · 회계 · 영업 · 법무 AI 가 조직도에 배치됨. 비서 AI 는 메일에서 회신 · 일정 · 할 일을 구분하고 번역 · 답장 초안 · 회의 시간 조율을 수행 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e방법론: 플레이북(업무 순서 · 승인 단계), '시맨틱 퍼스트 벡터 세컨드', 실제 결과 기준 완료 판정 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e사업: 초기 기업 · 공공 구축형, 법무 · 회계 · R\u0026amp;D 사업관리 '전문 AI 크루팩' 공급, 구독형 검토 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기사 게재 2026-09-03 (디지털데일리, 네이버) \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 기사 1건 기준. 고객 사례 · 매출 · 규모 정보 없음.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e — 같은 \"실행 환경을 판다\" 논리의 미국 사례\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-002-crewon-ai-agent-runtime","ai-agents-enterprise-adoption","ai-workforce-runtime","org-cognition"],"relpath":"wiki/entities/org-crewon-ai.md","sources":["S-2026-09-09-002"],"status":"draft","stem":"org-crewon-ai","summary":"전 더존비즈온 플랫폼사업부문 대표 송호철이 창업한 한국 기업. 크루AI 워크(업무공간) + 크루온AI(에이전트 런타임) 로 기업 · 공공 구축형 시장 진입","system":false,"text":"정의\n\"AI 에이전트가 정말 직원처럼 일하려면 무엇이 필요할까\" 라는 질문에서 출발한 한국 스타트업. 대표 송호철은 더존비즈온 플랫폼사업부문 대표를 지냈다 [S-2026-09-09-002].\n근거 있는 사실\n제품: '크루AI 워크(crewai.work)' 사람 + AI 업무공간(메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재) 과 '크루온AI(Crewon.ai)' AI 크루를 만들고 운영하는 런타임 [S-2026-09-09-002]\n시연: 비서 · 회계 · 영업 · 법무 AI 가 조직도에 배치됨. 비서 AI 는 메일에서 회신 · 일정 · 할 일을 구분하고 번역 · 답장 초안 · 회의 시간 조율을 수행 [S-2026-09-09-002]\n방법론: 플레이북(업무 순서 · 승인 단계), '시맨틱 퍼스트 벡터 세컨드', 실제 결과 기준 완료 판정 [S-2026-09-09-002]\n사업: 초기 기업 · 공공 구축형, 법무 · 회계 · R\u0026D 사업관리 '전문 AI 크루팩' 공급, 구독형 검토 [S-2026-09-09-002]\n기사 게재 2026-09-03 (디지털데일리, 네이버) [S-2026-09-09-002]\n모순 · 논쟁\n(없음) — 기사 1건 기준. 고객 사례 · 매출 · 규모 정보 없음.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-workforce-runtime\norg-cognition — 같은 \"실행 환경을 판다\" 논리의 미국 사례\nS-2026-09-09-002-crewon-ai-agent-runtime","title":"크루온AI (Crewon.ai) · 송호철","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-09"},{"aliases":["딥시크"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","_unsorted","distillation-defense-limits","knowledge-distillation","org-anthropic","org-startlux"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e중국의 AI 모델 개발사. 이 위키에서는 distillation 논쟁의 당사자이자 RLVR 사례로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 능력을 이전하려 했다고 주장했다 (Anthropic 측 주장) \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDeepSeek-R1-Zero 는 teacher reasoning trace 없이 RL(RLVR) 만으로 자기검증 · 되돌아가기 · 긴 추론을 만들어낼 수 있음을 보였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCAICT MCP 특별 테스트(2026-08-31 공표) 에서 1.6T DeepSeek-V4-Pro 가 종합 40.55% 로 1위, 284B DeepSeek-V4-Flash-0731 이 38.24% 였다. 27B StartLux 가 그 사이(39.25%) 에 들어왔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이(이동수) 는 중국 모델 발전 전체를 distillation 탓으로 돌리는 것은 위험하며, 자체 연구 · 시스템 최적화 · 데이터 구축 · RL 역량을 묻어서는 안 된다고 경고했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAnthropic 의 distillation 공격 주장 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e 은 한쪽 당사자의 주장이며, 같은 소스의 글쓴이는 distillation 만으로 frontier 모델이 만들어지지 않는다고 본다. DeepSeek 측 반박은 이 위키에 아직 없다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e — 벤치마크 비교 상대\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","distillation-defense-limits","knowledge-distillation","open-local-models","org-anthropic","org-startlux"],"relpath":"wiki/entities/org-deepseek.md","sources":["S-2026-09-08-004","S-2026-09-08-006"],"status":"draft","stem":"org-deepseek","summary":"중국 AI 랩. R1-Zero 의 RLVR 추론 학습, Anthropic 의 distillation 공격 지목, V4 계열이 CAICT MCP 테스트 기준점으로 등장","system":false,"text":"정의\n중국의 AI 모델 개발사. 이 위키에서는 distillation 논쟁의 당사자이자 RLVR 사례로 등장한다 [S-2026-09-08-004].\n근거 있는 사실\nAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 능력을 이전하려 했다고 주장했다 (Anthropic 측 주장) [S-2026-09-08-004]\nDeepSeek-R1-Zero 는 teacher reasoning trace 없이 RL(RLVR) 만으로 자기검증 · 되돌아가기 · 긴 추론을 만들어낼 수 있음을 보였다 [S-2026-09-08-004]\nCAICT MCP 특별 테스트(2026-08-31 공표) 에서 1.6T DeepSeek-V4-Pro 가 종합 40.55% 로 1위, 284B DeepSeek-V4-Flash-0731 이 38.24% 였다. 27B StartLux 가 그 사이(39.25%) 에 들어왔다 [S-2026-09-08-006]\n글쓴이(이동수) 는 중국 모델 발전 전체를 distillation 탓으로 돌리는 것은 위험하며, 자체 연구 · 시스템 최적화 · 데이터 구축 · RL 역량을 묻어서는 안 된다고 경고했다 [S-2026-09-08-004]\n모순 · 논쟁\nAnthropic 의 distillation 공격 주장 [S-2026-09-08-004] 은 한쪽 당사자의 주장이며, 같은 소스의 글쓴이는 distillation 만으로 frontier 모델이 만들어지지 않는다고 본다. DeepSeek 측 반박은 이 위키에 아직 없다.\n관련 페이지\nopen-local-models — 상위 주제\norg-startlux — 벤치마크 비교 상대\norg-anthropic\nknowledge-distillation · distillation-defense-limits\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo\nS-2026-09-08-006-local-agent-models-startlux","title":"DeepSeek (딥시크)","topics":["open-local-models"],"type":"entity","updated":"2026-09-08"},{"aliases":["MBZUAI","IFM","Institute of Foundation Models","기초 모델 연구소"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","fully-open-source-model","open-local-models","product-k2-horizon"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eUAE 아부다비의 모하메드 빈 자예드 인공지능대학교. 산하 기초 모델 연구소(IFM) 가 K2 Horizon 의 발표 주체다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eIFM 은 K2 Horizon 6종을 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 Apache 2.0 으로 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e라인업이 추론 · 코딩 · 수학 · 에이전트 작업 전반에서 규모별 최고 수준이라고 자체 평가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-h 9 Elo 로 9위까지 내려왔고, 랩 순위에서 OpenAI 가 6위까지 내려왔다는 분석이 있다 (리더보드 스냅샷 전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCursor 가 SpaceX 에 인수된 뒤 OpenAI 가 Cursor 이용을 재검토하겠다는 보도가 있었다 — 도구 독립성의 중요성을 보여주는 사례로 인용됨 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-j ,"cites":["S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e커머스 플랫폼 기업. 이 위키에서는 소형 전용 모델의 자기개선 루프 사례로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eQwen3.5-0.8B 를 특정 업무에 맞게 미세조정해 그 작업에서 GPT-5.6 Sol 을 이겼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e방식은 실제 업무 결과 평가 → 실패 데이터 재학습의 반복이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCEO Tobi Lütke 는 이런 학습 구조가 있으면 작은 모델이 특정 업무에서 대형 모델보다 나을 수 있다고 설명했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e학습 파이프라인 기반 기술 Tangle 을 오픈소스로 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 원문 발표 미확보, SNS 요약 1건 기준.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-003-shopify-small-model-beats-sol","open-local-models","product-qwen","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/entities/org-shopify.md","sources":["S-2026-09-09-003"],"status":"draft","stem":"org-shopify","summary":"캐나다 커머스 플랫폼. CEO Tobi Lütke. 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이겼다고 발표, 기반 기술 Tangle 오픈소스 공개","system":false,"text":"정의\n커머스 플랫폼 기업. 이 위키에서는 소형 전용 모델의 자기개선 루프 사례로 등장한다 [S-2026-09-09-003].\n근거 있는 사실\nQwen3.5-0.8B 를 특정 업무에 맞게 미세조정해 그 작업에서 GPT-5.6 Sol 을 이겼다 [S-2026-09-09-003]\n방식은 실제 업무 결과 평가 → 실패 데이터 재학습의 반복이다 [S-2026-09-09-003]\nCEO Tobi Lütke 는 이런 학습 구조가 있으면 작은 모델이 특정 업무에서 대형 모델보다 나을 수 있다고 설명했다 [S-2026-09-09-003]\n학습 파이프라인 기반 기술 Tangle 을 오픈소스로 공개했다 [S-2026-09-09-003]\n모순 · 논쟁\n(없음) — 원문 발표 미확보, SNS 요약 1건 기준.\n관련 페이지\nopen-local-models — 상위 주제\nsmall-model-self-improvement-loop\nproduct-tangle · product-qwen\nS-2026-09-09-003-shopify-small-model-beats-sol","title":"Shopify","topics":["open-local-models"],"type":"entity","updated":"2026-09-09"},{"aliases":["스타트럭스","StartLux-V1.0-27B-Preview"],"back":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","open-local-models","org-deepseek","person-chen-danian","post-training-agent-capability","product-qwen","sovereign-ai"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"로컬 모델\" 을 철학으로 내세운 중국 AI 회사. 첫 모델 StartLux-V1.0-27B-Preview 를 8월 말 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCAICT 인공지능연구소의 신뢰 AI 대모형 MCP 특별 테스트(8월 3일 시작, 3회 완주 평균, 8월 31일 공표) 에서 종합 39.25% 로 2위. 284B DeepSeek-V4-Flash-0731(38.24%), 198B Step-3.7-Flash 를 앞섰고 1.6T DeepSeek-V4-Pro(40.55%) 에 1.3%p 차. 위치 네비게이션 단독 1위, 금융 분석 · 브라우저 자동화 공동 1위 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델은 Alibaba Qwen3.6-27B 기반 후훈련. 같은 27B 원본보다 5.34%p 높다. \"오토 리서치\" 로 후훈련한 중국 최초 로컬 에이전트 모델이라고 회사가 주장 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e창업팀: 창업자 천다녠(제품), CTO 궈취안웨이(로컬 배포 · 에이전트 · 프라이버시 보호 ML 연구), 뤄융샹(전 모건스탠리 아시아 총괄) \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e올해 안에 팔려는 것은 가중치 파일이 아니라 양자화 · 추론 프레임워크를 몰라도 오피스 설치하듯 끝나는 로컬 지능 솔루션이며, 정부 규제 통과 프레임까지 설계했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e회사 시연(회사 측 자료): 금융 분석에서 Claude Sonnet 4.6 은 비거래일 오판으로 47,254달러(89.02%), StartLux 는 47,499.09달러(90.00%); 브라우저 자동화에서 Claude 200초+ · 21단계 · 556달러 vs StartLux 95초 · 12단계 · 299달러 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e홈페
