\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e통제 문제에서도 사람이 할 일은 어떤 작업을 맡기는지와 무엇을 성공으로 볼지를 명확히 정의하는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e개발자의 역할이 요구사항 정의 · 아키텍처 · 우선순위 · 품질 기준 · 리스크 판단으로 올라가며, 코딩 비용이 낮아질수록 \"무엇을 만들지 잘못 정한 비용\" 이 커진다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e긴 업무를 끝까지 수행하는 모델(GPT-6 Astra) 에서도 완료 조건은 실행 조건 목록의 첫 항목이며, 완료 조건이 있어야 \"업무 완료율\" 을 잴 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e크루온AI 의 '플레이북' 은 업무 순서와 승인 단계를 미리 가르치는 장치로, 업무 정의를 제품 기능으로 만든 사례다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e창업자에게는 기술이 아니라 고객의 고통(pain point) 에서 시작하라고 권한다. AI 로 만드는 장벽은 낮아졌기 때문이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e — 이 정의 작업을 고객과 함께 하는 직무\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","cloud-agent","forward-deployed-engineer"],"relpath":"wiki/concepts/task-definition-bottleneck.md","sources":["S-2026-09-08-002","S-2026-09-09-004","S-2026-09-09-002"],"status":"draft","stem":"task-definition-bottleneck","summary":"AI 도입 성패는 모델 성능보다 무엇을 맡길지, 무엇이 완료인지(테스트 통과 · 실행 검증) 를 정의하고 프로젝트를 위임 단위로 나누는 데 달렸다는 주장","system":false,"text":"정의\n에이전트에게 \"이 기능을 만들어라\" 로 끝내지 않고 성공 조건(\"모든 유닛 테스트 통과\", \"앱을 직접 실행해 테스트\") 을 주고, 프로젝트를 에이전트가 받을 수 있는 단위로 쪼개는 일. 이것이 부족하면 강한 모델을 써도 기간이 줄지 않는다 [S-2026-09-08-002].\n근거 있는 사실\n한국 기업의 에이전트 도입 확신 부족에 대해 제프 왕은 \"무엇이 완료된 상태인지 명확히 정의하는 것이 부족했기 때문\" 이라고 답했다 [S-2026-09-08-002]\n통제 문제에서도 사람이 할 일은 어떤 작업을 맡기는지와 무엇을 성공으로 볼지를 명확히 정의하는 것이다 [S-2026-09-08-002]\n개발자의 역할이 요구사항 정의 · 아키텍처 · 우선순위 · 품질 기준 · 리스크 판단으로 올라가며, 코딩 비용이 낮아질수록 \"무엇을 만들지 잘못 정한 비용\" 이 커진다 [S-2026-09-08-002]\n긴 업무를 끝까지 수행하는 모델(GPT-6 Astra) 에서도 완료 조건은 실행 조건 목록의 첫 항목이며, 완료 조건이 있어야 \"업무 완료율\" 을 잴 수 있다 [S-2026-09-09-004]\n크루온AI 의 '플레이북' 은 업무 순서와 승인 단계를 미리 가르치는 장치로, 업무 정의를 제품 기능으로 만든 사례다 [S-2026-09-09-002]\n창업자에게는 기술이 아니라 고객의 고통(pain point) 에서 시작하라고 권한다. AI 로 만드는 장벽은 낮아졌기 때문이다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-roi-human-equivalent-hours\nforward-deployed-engineer — 이 정의 작업을 고객과 함께 하는 직무\ncloud-agent\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-002-crewon-ai-agent-runtime","title":"에이전트 도입의 병목은 업무 정의와 완료 조건","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["완료된 업무 단위 평가","task completion rate","에이전트 KPI","업무 완료율"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","ai-agents-enterprise-adoption","ai-workforce-runtime","product-gpt-6-astra"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델이 긴 업무를 끝까지 수행하게 되면 \"답변이 얼마나 좋은가\" 는 평가 단위로 부족하다. 평가 단위를 완료된 업무 한 건으로 잡고, 그 업무를 끝까지 완료한 비율, 사람이 개입한 횟수, 결과 검증까지 걸린 시간, 재시도와 사람 검수 시간을 합친 총비용을 측정하자는 관점 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGPT-6 Astra 의 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도는 하나의 긴 업무를 처음부터 최종 결과까지 이어서 처리하려는 설계이며, 그래서 평가 단위가 \"완료된 업무 한 건\" 으로 넓어진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e벤치마크 점수만으로는 실제 업무 능력을 설명하기 어려워진다는 것이 글쓴이의 결론이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 방향의 사업 지표: 코그니션은 세션을 작업 유형별로 분류해 사람이 했다면 걸렸을 시간(사람 환산 작업시간) 과 프로덕션 반영 여부로 ROI 를 재고, 판매 기준을 좌석 수에서 \"완료한 일의 양\" 으로 옮긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e크루온AI 는 \"도구를 호출한 것과 실제 업무가 완료된 것은 다르다\" 며 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지까지 확인해 완료를 판정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — 같은 단위의 사업 쪽 지표\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 완료 조건이 정의돼야 완료율을 잴 수 있다\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 실행 조건(체크포인트 · 재시도 상한 · 비용 상한)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","product-gpt-6-astra","task-definition-bottleneck"],"relpath":"wiki/concepts/task-level-agent-evaluation.md","sources":["S-2026-09-09-004","S-2026-09-09-002"],"status":"draft","stem":"task-level-agent-evaluation","summary":"에이전트를 벤치마크 점수가 아니라 업무 완료율 · 사람 개입 횟수 · 검증 소요 시간 · 재시도와 검수를 합친 비용으로 평가해야 한다는 관점. 코그니션의 사람 환산 시간과 같은 방향","system":false,"text":"정의\n모델이 긴 업무를 끝까지 수행하게 되면 \"답변이 얼마나 좋은가\" 는 평가 단위로 부족하다. 평가 단위를 완료된 업무 한 건으로 잡고, 그 업무를 끝까지 완료한 비율, 사람이 개입한 횟수, 결과 검증까지 걸린 시간, 재시도와 사람 검수 시간을 합친 총비용을 측정하자는 관점 [S-2026-09-09-004].\n근거 있는 사실\nGPT-6 Astra 의 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도는 하나의 긴 업무를 처음부터 최종 결과까지 이어서 처리하려는 설계이며, 그래서 평가 단위가 \"완료된 업무 한 건\" 으로 넓어진다 [S-2026-09-09-004]\n벤치마크 점수만으로는 실제 업무 능력을 설명하기 어려워진다는 것이 글쓴이의 결론이다 [S-2026-09-09-004]\n에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요해진다 [S-2026-09-09-004]\n같은 방향의 사업 지표: 코그니션은 세션을 작업 유형별로 분류해 사람이 했다면 걸렸을 시간(사람 환산 작업시간) 과 프로덕션 반영 여부로 ROI 를 재고, 판매 기준을 좌석 수에서 \"완료한 일의 양\" 으로 옮긴다 [S-2026-09-08-002]\n크루온AI 는 \"도구를 호출한 것과 실제 업무가 완료된 것은 다르다\" 며 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지까지 확인해 완료를 판정한다 [S-2026-09-09-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-roi-human-equivalent-hours — 같은 단위의 사업 쪽 지표\ntask-definition-bottleneck — 완료 조건이 정의돼야 완료율을 잴 수 있다\nagent-governance-guardrails — 실행 조건(체크포인트 · 재시도 상한 · 비용 상한)\nproduct-gpt-6-astra · ai-workforce-runtime\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-002-crewon-ai-agent-runtime","title":"에이전트 평가 단위: 답변 한 번에서 완료된 업무 한 건으로","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"}],"title":"CEO Insight Hub"}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("wiki-data").textContent);
var PAGES = DATA.pages, LOG = DATA.log, TITLE = DATA.title, BUILT = DATA.built;
var BY = {}; PAGES.forEach(function(p){ BY[p.stem]=p; });
var TYPE_LABEL = {topic:"주제",concept:"개념",entity:"엔티티",source:"소스",insight:"인사이트",digest:"다이제스트"};
var ORDER = ["topic","concept","entity","source","insight","digest"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function badge(t){ return '<span class="badge b-'+t+'">'+(TYPE_LABEL[t]||t)+'</span>'; }
function el(id){ return document.getElementById(id); }

/* ---------- theme ---------- */
function applyTheme(v){
  var r=document.documentElement;
  if(v==="dark"||v==="light"){ r.setAttribute("data-theme",v); } else { r.removeAttribute("data-theme"); }
  var b=el("theme"); if(b){ b.textContent = (v==="dark") ? "☀" : "☾"; }
}
function curTheme(){
  var v=document.documentElement.getAttribute("data-theme");
  if(v) return v;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark":"light";
}
try{ var st=localStorage.getItem("cih-theme"); if(st) applyTheme(st); else applyTheme(null); }catch(e){ applyTheme(null); }

/* ---------- sidebar ---------- */
function sortedOf(type){
  var l = PAGES.filter(function(p){ return p.type===type; });
  if(type==="source"){ l.sort(function(a,b){ return (b.stem<a.stem)?-1:(b.stem>a.stem?1:0); }); }
  else { l.sort(function(a,b){ return a.title.localeCompare(b.title,"ko"); }); }
  return l;
}
var closedSecs = (function(){
  var d = {};
  ORDER.forEach(function(t){ d[t] = true; });   // 첫 진입에는 전부 닫힘
  try{
    var raw = localStorage.getItem("cih-secs");
    if(raw){ var o = JSON.parse(raw); ORDER.forEach(function(t){ if(t in o) d[t] = !!o[t]; }); }
  }catch(e){}
  return d;
})();
function renderTree(){
  var cur = (location.hash||"").replace(/^#\//,"");
  var h = "";
  ORDER.forEach(function(t){
    var list = sortedOf(t);
    if(!list.length) return;
    var normal = list.filter(function(p){ return !p.system; });
    var sys = list.filter(function(p){ return p.system; });
    var closed = closedSecs[t] ? " closed":"";
    h += '<div class="sec'+closed+'" data-sec="'+t+'">';
    h += '<button class="sec-head" data-toggle="'+t+'"><span class="caret">▾</span>'+
         (TYPE_LABEL[t]||t)+'<span class="cnt">'+list.length+'</span></button>';
    h += '<div class="sec-body">';
    normal.concat([null]).concat(sys).forEach(function(p){
      if(p===null){ if(sys.length) h += '<div class="divider">시스템</div>'; return; }
      h += '<a class="tree-a'+(p.stem===cur?" active":"")+'" href="#/'+esc(p.stem)+'" title="'+esc(p.title)+'">'+esc(p.title)+'</a>';
    });
    h += "</div></div>";
  });
  el("tree").innerHTML = h;
}

/* ---------- search ---------- */
function snippet(text, q){
  text = String(text||"").replace(/\s+/g," ");
  var i = text.toLowerCase().indexOf(q);
  if(i<0) return esc(text.slice(0,80));
  var s = Math.max(0, i-32), e = Math.min(text.length, i+q.length+52);
  return (s>0?"\u2026":"") + esc(text.slice(s,i)) +
         "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" +
         esc(text.slice(i+q.length,e)) + (e<text.length?"\u2026":"");
}
function runSearch(raw){
  var q = raw.trim().toLowerCase();
  if(!q){ el("results").innerHTML=""; el("results").hidden=true; el("tree").hidden=false; renderTree(); return; }
  el("tree").hidden = true; el("results").hidden = false;
  var hits = [];
  PAGES.forEach(function(p){
    var fields = [p.title, p.aliases.join(" "), p.summary, p.text];
    var rank = -1, snip = "";
    for(var i=0;i<fields.length;i++){
      if((fields[i]||"").toLowerCase().indexOf(q) >= 0){ rank=i; snip=fields[i]; break; }
    }
    if(rank<0) return;
    hits.push({p:p, rank:rank, snip:snippet(snip, q)});
  });
  hits.sort(function(a,b){
    if(a.rank!==b.rank) return a.rank-b.rank;
    return a.p.title.localeCompare(b.p.title,"ko");
  });
  if(!hits.length){ el("results").innerHTML='<div class="sb-note">결과 없음</div>'; return; }
  var more = hits.length>30 ? hits.length-30 : 0;
  var h = '<div class="sb-note">'+hits.length+'건</div>';
  hits.slice(0,30).forEach(function(x){
    h += '<a class="hit" href="#/'+esc(x.p.stem)+'"><span class="ht">'+badge(x.p.type)+' '+esc(x.p.title)+
         '</span><span class="hs">'+x.snip+'</span></a>';
  });
  if(more) h += '<div class="sb-note">… 외 '+more+'건</div>';
  el("results").innerHTML = h;
}

/* ---------- views ---------- */
function chipsFor(stems, missingLabel){
  if(!stems || !stems.length) return '<span class="chip">'+esc(missingLabel||"(없음)")+'</span>';
  return stems.map(function(s){
    var p = BY[s];
    if(!p) return '<span class="chip wl-missing">'+esc(s)+'</span>';
    return '<a class="chip" href="#/'+esc(p.stem)+'" title="'+esc(p.title)+'">'+esc(p.title)+'</a>';
  }).join("");
}
function sourceChips(ids){
  if(!ids || !ids.length) return '<span class="chip">(없음)</span>';
  return ids.map(function(sid){
    var hit=null;
    for(var i=0;i<PAGES.length;i++){ if(PAGES[i].src && PAGES[i].src.source_id===sid){ hit=PAGES[i]; break; } }
    if(!hit) return '<span class="chip cite-missing">'+esc(sid)+'</span>';
    return '<a class="chip" href="#/'+esc(hit.stem)+'" title="'+esc(hit.title)+'">'+esc(sid)+'</a>';
  }).join("");
}

function viewHome(){
  var topics = sortedOf("topic").filter(function(p){ return !p.system; });
  var h = '<h1 class="page-title">'+esc(TITLE)+'</h1>';
  h += '<p class="lede">'+esc(BUILT)+'</p>';
  h += '<h2 class="sec-title">주제</h2><div class="cards">';
  topics.forEach(function(p){
    h += '<a class="card" href="#/'+esc(p.stem)+'"><div class="ct">'+esc(p.title)+'</div>'+
         '<div class="cs">'+esc(p.summary)+'</div>'+
         '<div class="cm">근거 소스 '+p.sources.length+'건 · 갱신 '+esc(p.updated)+'</div></a>';
  });
  h += '</div>';

  h += '<h2 class="sec-title">최근 활동</h2><ul class="log-list">';
  var recent = LOG.slice(-10).reverse();
  if(!recent.length) h += '<li><span class="d">기록 없음</span></li>';
  recent.forEach(function(e){
    h += '<li><span class="d">'+esc(e.date)+'</span><span class="badge b-op">'+esc(e.op)+
         '</span><span>'+esc(e.title)+'</span></li>';
  });
  h += '</ul>';

  h += '<h2 class="sec-title">현황</h2><div class="stats">';
  ORDER.forEach(function(t){
    var n = PAGES.filter(function(p){ return p.type===t; }).length;
    if(!n) return;
    h += '<div class="stat"><b>'+n+'</b>'+(TYPE_LABEL[t]||t)+'</div>';
  });
  h += '<div class="stat"><b>'+PAGES.length+'</b>전체</div></div>';
  el("main").innerHTML = '<div class="wrap">'+h+'</div>';
}

function viewPage(stem){
  var p = BY[stem];
  if(!p){
    el("main").innerHTML = '<div class="wrap"><h1 class="page-title">페이지 없음</h1>'+
      '<p class="notfound">'+esc(stem)+' 에 해당하는 페이지가 없습니다. <a href="#/">홈으로</a></p></div>';
    return;
  }
  var h = '<div class="pg-head">'+badge(p.type)+' <h1 class="page-title">'+esc(p.title)+'</h1>'+
          '<p class="lede">'+esc(p.summary)+'</p></div>';

  h += '<dl class="meta">';
  h += '<dt>상태</dt><dd>'+esc(p.status||"-")+'</dd>';
  h += '<dt>확신도</dt><dd>'+esc(p.confidence||"-")+'</dd>';
  h += '<dt>생성 / 갱신</dt><dd>'+esc(p.created)+' / '+esc(p.updated)+'</dd>';
  h += '<dt>주제</dt><dd>'+chipsFor(p.topics)+'</dd>';
  h += '<dt>근거 소스</dt><dd>'+sourceChips(p.sources)+'</dd>';
  if(p.src){
    var s = p.src, origin;
    if(s.url){ origin = '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url)+'</a>'; }
    else if(s.file){ origin = '<code>'+esc(s.file)+'</code>'; }
    else { origin = '<span class="muted">-</span>'; }
    h += '<dt>출처</dt><dd>'+origin+'</dd>';
    h += '<dt>저자</dt><dd>'+esc(s.author||"-")+'</dd>';
    h += '<dt>발행일</dt><dd>'+esc(s.published_at||"미상")+'</dd>';
    h += '<dt>공유일</dt><dd>'+esc(s.shared_at||"-")+(s.shared_by?' ('+esc(s.shared_by)+')':"")+'</dd>';
  }
  h += '</dl>';

  if(p.src){
    h += '<div class="callout"><div class="cl-l">코멘트</div>'+
         (p.src.shared_note
            ? '<div class="cl-b">'+esc(p.src.shared_note)+'</div>'
            : '<div class="cl-b none">코멘트 없음</div>')+'</div>';
  }

  h += '<div class="body">'+p.html+'</div>';

  h += '<h2 class="sec-title">백링크 ('+p.back.length+')</h2>';
  if(!p.back.length){ h += '<p class="notfound" style="padding:0">이 페이지를 참조하는 페이지가 없습니다.</p>'; }
  else {
    h += '<ul class="backlinks">';
    p.back.forEach(function(s){
      var b = BY[s]; if(!b) return;
      h += '<li>'+badge(b.type)+' <a href="#/'+esc(b.stem)+'">'+esc(b.title)+'</a></li>';
    });
    h += '</ul>';
  }
  h += '<div class="srcfoot">원본: '+esc(p.relpath)+'</div>';
  el("main").innerHTML = '<div class="wrap">'+h+'</div>';

  // 테이블 가로 스크롤 래퍼
  var tables = el("main").querySelectorAll(".body table");
  Array.prototype.forEach.call(tables, function(t){
    if(t.parentNode && t.parentNode.className==="tbl-wrap") return;
    var w = document.createElement("div"); w.className="tbl-wrap";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
}

/* ---------- graph ---------- */
var SIM = null;
function stopSim(){ if(SIM){ SIM.stop=true; SIM=null; } }

function viewGraph(){
  var h = '<h1 class="page-title">그래프</h1>'+
    '<p class="lede">위키링크와 소스 인용으로 이어진 '+PAGES.length+'개 페이지. 노드를 끌어 옮기고, 휠로 확대하고, 클릭하면 이동합니다.</p>'+
    '<div id="graph-wrap"><svg id="graph"><g id="gz"><g id="gedges"></g><g id="gnodes"></g></g></svg></div>'+
    '<div class="legend">'+ORDER.map(function(t){
      return '<span><i style="background:var(--t-'+t+')"></i>'+(TYPE_LABEL[t]||t)+'</span>';
    }).join("")+'</div>'+
    '<div class="ghelp">노드 크기 = 들어오는 링크 수. 주제는 항상 이름을 보여주고, 나머지는 마우스를 올리면 보입니다.</div>';
  el("main").innerHTML = '<div class="wrap">'+h+'</div>';
  startGraph();
}

function startGraph(){
  var svg = el("graph"), gz = el("gz");
  var nodes = PAGES.map(function(p,i){ return {id:p.stem, type:p.type, title:p.title, deg:p.back.length}; });
  var idx = {}; nodes.forEach(function(n,i){ idx[n.id]=i; });
  var seen = {}, edges = [];
  PAGES.forEach(function(p){
    p.out.forEach(function(t){
      if(idx[t]==null || t===p.stem) return;
      var a = idx[p.stem], b = idx[t], k = (a<b? a+"-"+b : b+"-"+a);
      if(seen[k]) return; seen[k]=1; edges.push({s:a,t:b});
    });
  });

  var W = svg.clientWidth || 800, H = svg.clientHeight || 500;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  var cx = W/2, cy = H/2, R = Math.min(W,H)*0.36;
  nodes.forEach(function(n,i){
    var a = (i/nodes.length)*Math.PI*2;
    n.x = cx + R*Math.cos(a); n.y = cy + R*Math.sin(a); n.vx=0; n.vy=0; n.fixed=false;
  });

  // SVG 요소 생성
  var eh = edges.map(function(){ return "<line/>"; }).join("");
  el("gedges").innerHTML = eh;
  var nh = nodes.map(function(n){
    var r = 4 + Math.min(9, Math.sqrt(n.deg)*2.6);
    return '<g class="node'+(n.type==="topic"?" lbl":"")+'" data-id="'+esc(n.id)+'">'+
      '<circle r="'+r.toFixed(2)+'" fill="var(--t-'+n.type+')"><title>'+esc(n.title)+'</title></circle>'+
      '<text dy="'+(-r-3).toFixed(1)+'" text-anchor="middle">'+esc(n.title.slice(0,22))+'</text></g>';
  }).join("");
  el("gnodes").innerHTML = nh;
  var lines = el("gedges").children, gnodes = el("gnodes").children;

  var sim = {stop:false, alpha:1, running:false};
  SIM = sim;
  function kick(){ if(!sim.running && !sim.stop){ sim.running=true; requestAnimationFrame(tick); } }
  function tick(){
    sim.running = true;
    var i,j,a,b,dx,dy,d,f;
    for(i=0;i<nodes.length;i++){
      a=nodes[i];
      for(j=i+1;j<nodes.length;j++){
        b=nodes[j]; dx=b.x-a.x; dy=b.y-a.y; d=Math.sqrt(dx*dx+dy*dy)||0.01;
        if(d>320) continue;
        f = 900/(d*d);
        dx=dx/d*f; dy=dy/d*f;
        a.vx-=dx; a.vy-=dy; b.vx+=dx; b.vy+=dy;
      }
    }
    for(i=0;i<edges.length;i++){
      a=nodes[edges[i].s]; b=nodes[edges[i].t];
      dx=b.x-a.x; dy=b.y-a.y; d=Math.sqrt(dx*dx+dy*dy)||0.01;
      f = (d-70)*0.02;
      dx=dx/d*f; dy=dy/d*f;
      a.vx+=dx; a.vy+=dy; b.vx-=dx; b.vy-=dy;
    }
    for(i=0;i<nodes.length;i++){
      a=nodes[i];
      a.vx += (cx-a.x)*0.004; a.vy += (cy-a.y)*0.004;
      if(a.fixed){ a.vx=0; a.vy=0; continue; }
      a.vx*=0.82; a.vy*=0.82;
      a.x += a.vx*sim.alpha; a.y += a.vy*sim.alpha;
    }
    sim.alpha *= 0.995;
    draw();
    if(!sim.stop && sim.alpha>0.02){ requestAnimationFrame(tick); }
    else { sim.running = false; }
  }
  function draw(){
    for(var i=0;i<edges.length;i++){
      var a=nodes[edges[i].s], b=nodes[edges[i].t], L=lines[i];
      L.setAttribute("x1",a.x.toFixed(1)); L.setAttribute("y1",a.y.toFixed(1));
      L.setAttribute("x2",b.x.toFixed(1)); L.setAttribute("y2",b.y.toFixed(1));
    }
    for(var k=0;k<nodes.length;k++){
      gnodes[k].setAttribute("transform","translate("+nodes[k].x.toFixed(1)+","+nodes[k].y.toFixed(1)+")");
    }
  }
  kick();

  // zoom
  var zs=1, zx=0, zy=0;
  function applyZoom(){ gz.setAttribute("transform","translate("+zx.toFixed(2)+","+zy.toFixed(2)+") scale("+zs.toFixed(3)+")"); }
  svg.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var pt = svgPoint(ev), k = ev.deltaY<0 ? 1.12 : 1/1.12, ns = Math.min(4, Math.max(0.25, zs*k));
    zx = pt.x - (pt.x - zx)*(ns/zs); zy = pt.y - (pt.y - zy)*(ns/zs); zs = ns;
    applyZoom();
  }, {passive:false});

  function svgPoint(ev){
    var r = svg.getBoundingClientRect();
    return {x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height)};
  }

  // drag
  var drag=null, moved=false;
  svg.addEventListener("pointerdown", function(ev){
    var g = ev.target.closest ? ev.target.closest(".node") : null;
    if(!g) return;
    var id = g.getAttribute("data-id");
    drag = nodes[idx[id]]; drag.fixed = true; moved=false;
    svg.classList.add("dragging");
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", function(ev){
    if(!drag) return;
    var pt = svgPoint(ev);
    drag.x = (pt.x - zx)/zs; drag.y = (pt.y - zy)/zs;
    moved = true; sim.alpha = Math.max(sim.alpha, 0.35);
    draw();
  });
  svg.addEventListener("pointerup", function(ev){
    if(!drag) return;
    var d = drag; drag=null; d.fixed=false;
    svg.classList.remove("dragging");
    if(!moved){ location.hash = "#/"+d.id; } else { kick(); }
  });
}

/* ---------- router ---------- */
function route(){
  var h = location.hash || "";
  var path = h.replace(/^#\/?/,"");
  stopSim();
  if(path === "graph"){ viewGraph(); }
  else if(!path){ viewHome(); }
  else { viewPage(decodeURIComponent(path)); }
  window.scrollTo(0,0);
  document.body.classList.remove("sb-open");
  if(el("results").hidden) renderTree();
}

/* ---------- wiring ---------- */
el("q").addEventListener("input", function(){ runSearch(this.value); });
el("q").addEventListener("keydown", function(ev){
  if(ev.key==="Escape"){ this.value=""; runSearch(""); this.blur(); }
});
document.addEventListener("keydown", function(ev){
  var t = ev.target, tag = t && t.tagName;
  if(ev.key==="/" && tag!=="INPUT" && tag!=="TEXTAREA"){ ev.preventDefault(); el("q").focus(); }
});
el("tree").addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-toggle]") : null;
  if(!b) return;
  var k = b.getAttribute("data-toggle");
  closedSecs[k] = !closedSecs[k];
  try{ localStorage.setItem("cih-secs", JSON.stringify(closedSecs)); }catch(e){}
  renderTree();
});
el("theme").addEventListener("click", function(){
  var next = curTheme()==="dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem("cih-theme", next); }catch(e){}
});
el("menu").addEventListener("click", function(){ document.body.classList.toggle("sb-open"); });
el("scrim").addEventListener("click", function(){ document.body.classList.remove("sb-open"); });
el("sbtoggle").addEventListener("click", function(){ document.body.classList.toggle("sb-collapsed"); });
el("graphbtn").addEventListener("click", function(){ location.hash = "#/graph"; });
el("brand").addEventListener("click", function(){ location.hash = "#/"; });
window.addEventListener("hashchange", route);
renderTree();
route();
})();
</script>
</body>
