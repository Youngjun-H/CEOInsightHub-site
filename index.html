 보안처럼 '하기 싫지만 반드시 해야 하는 일' 부터 넘기고 있다 {stated}\n8. 5월 기준 연환산 매출은 4억 9,200만 달러까지 올라왔다 {stated}\n9. FDE 는 문제를 해결해주는 사람이지 AI 툴로 대신 일해주는 사람이 아니며, 고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람이지 사내 프로세스에 AI 를 적용하는 사람이 아니다 {stated}\n10. 한국은 아직 \"어떤 모델을 쓸 것인가\", \"사내 챗봇을 어떻게 만들 것인가\" 에 논의가 머물러 있는 반면, 미국 선두 기업은 어떤 업무를 없애고 쪼개고 다시 설계해 에이전트에게 넘길지를 고민한다. 한미 차이는 기술보다 조직에 있다 {stated}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption — 상위 주제\nax-organizational-redesign — AX 는 도입이 아니라 회사 재설계\ntask-definition-bottleneck · forward-deployed-engineer · ai-roi-human-equivalent-hours · proactive-agent\norg-cognition · person-jeff-wang · product-devin\nS-2026-09-08-002-cognition-jeff-wang-interview — 같은 인터뷰의 기사 본문\n우리에게 주는 함의\n고객 제안의 첫 단계를 모델 선택이 아니라 '업의 정의' 로 잡는 근거가 하나 더 늘었다. 이 후기는 그 순서를 지키지 않은 도입이 어떻게 실패하는지를 구체적으로 적는다 [S-2026-09-09-010]\n국내에서 FDE 가 \"AI 로 대신 일해주는 사람\" 으로 오해되고 있다는 지적은 우리가 그 역할을 정의할 때 참고할 만하다 [S-2026-09-09-010]\n매출 수치가 시점별로 다르다. 5월 연환산 4.92억 달러 [S-2026-09-09-010] 와 8월 기준 8억 달러 초과 [S-2026-09-08-002] 는 성장 곡선으로 읽어야 하며 어느 하나를 현재값으로 인용하면 안 된다 [S-2026-09-09-010] [S-2026-09-08-002]\n주요 인용\n그들은 “AI에게 얼마나 많은 일을 통째로 맡길 수 있는가?”란 질문을 끝까지 밀어붙여 63조원의 기업 가치를 만들어냈다.\n회사를 망하게 하는 법이 있다. 하던 일과 조직을 그대로 두고 AI 포모(FOMO)를 일으켜 회사에 AI를 도입하게 하는 것이다.\nFDE는 문제를 해결해주는 사람들이지, AI 툴을 써서 대신 일을 해주는 사람들이 아니다.\nAI를 도입하는 것과 AI가 일하도록 회사를 다시 설계하는 것은 전혀 다른 문제다.","title":"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제","topics":["ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-09"},{"aliases":["에이전틱 비디오","Gemini agentic video"],"back":["_unsorted","cloud-agent","harness-engineering-discipline","model-routing-token-economics","product-gemini"],"cites":[],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eGemini 3.7 Flash 에 추가된 \"에이전틱 비디오 이해\" 는 모든 프레임을 입력에 밀어넣는 대신 모델이 필요한 부분만 골라 세부적으로 살펴보게 해 토큰 소비를 약 1/10 로 줄인다. 에이전트 프레임워크를 끼지 않아도 API 호출 내부에서 하네스 같은 루프가 돈다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 에이전트 루프가 프레임워크가 아니라 모델 API 안으로 들어가는 흐름\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 토큰 1/10 이라는 비용 효과 — 영상 처리가 필요한 업무의 단가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e기존 방식은 모든 비디오 프레임을 다 밀어넣고 모델이 해석하는 것이었다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이번 업데이트는 필요한 부분만 뽑아 그 구간의 프레임만 세부적으로 살펴보게 해 토큰 소비량을 비약적으로 줄였다(거의 1/10 수준) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e모델이 스스로 도구 호출을 하면서 비디오를 이해하기 위한 자율적 행동을 취하는 것으로 이해할 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\"에이전틱\" 이라고 해서 에이전트 프레임워크를 끼고 작동하는 것은 아니지만, interaction API 호출만으로 내부에서 에이전트 · 하네스 같은 것이 루프로 돌아가므로 에이전트로 볼 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e비디오 입력에 어떻게 에이전틱하게 사고할지를 모델이 이해하도록 무언가 업데이트가 있었을 것으로 추정한다(파라미터인지 시스템 프롬프트인지 에이전트 레벨 지령인지는 불명) \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u003c/a\u003e — 대상 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 토큰 소비 1/10 의 비용 효과\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 에이전트 루프가 어디서 도는가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e에이전트 루프가 우리 코드가 아니라 모델 API 안에서 도는 경우가 늘고 있다. 우리가 만드는 하네스의 경계가 어디까지인지 다시 봐야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e영상 · 대용량 입력을 다루는 업무라면 \"필요한 부분만 모델이 골라 보게 하는\" 구조가 비용 차이를 만든다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e이번 업데이트는 필요한 부분만 쏙쏙 뽑아서 그 부분에 대한 프레임만 세부적으로 살펴보게되어 토큰 소비량이 비약적으로 줄인 것이 특징입니다 (거의 1/10 수준). [sic]\u003c/p\u003e\n\u003cp\u003e이미 interaction API를 호출하는 것 만으로 내부적으로는 에이전트/하네스 같은게 Loop 형식으로 돌아가므로 에이전트라고 볼 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["cloud-agent","model-routing-token-economics","product-gemini"],"relpath":"wiki/sources/S-2026-09-09-011-gemini-agentic-video.md","sources":["S-2026-09-09-011"],"src":{"author":"박찬성 (ETRI) — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-011.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-011","url":""},"status":"draft","stem":"S-2026-09-09-011-gemini-agentic-video","summary":"모든 프레임을 밀어넣는 대신 모델이 스스로 도구를 호출해 필요한 구간만 살펴보는 방식. 토큰 소비가 약 1/10 로 줄고 API 호출 안에서 에이전트 루프가 돈다","system":false,"text":"한 줄 요약\nGemini 3.7 Flash 에 추가된 \"에이전틱 비디오 이해\" 는 모든 프레임을 입력에 밀어넣는 대신 모델이 필요한 부분만 골라 세부적으로 살펴보게 해 토큰 소비를 약 1/10 로 줄인다. 에이전트 프레임워크를 끼지 않아도 API 호출 내부에서 하네스 같은 루프가 돈다.\n관심 포인트\n(추정) 에이전트 루프가 프레임워크가 아니라 모델 API 안으로 들어가는 흐름\n(추정) 토큰 1/10 이라는 비용 효과 — 영상 처리가 필요한 업무의 단가\n핵심 주장\n1. 기존 방식은 모든 비디오 프레임을 다 밀어넣고 모델이 해석하는 것이었다 {stated}\n2. 이번 업데이트는 필요한 부분만 뽑아 그 구간의 프레임만 세부적으로 살펴보게 해 토큰 소비량을 비약적으로 줄였다(거의 1/10 수준) {stated}\n3. 모델이 스스로 도구 호출을 하면서 비디오를 이해하기 위한 자율적 행동을 취하는 것으로 이해할 수 있다 {stated}\n4. \"에이전틱\" 이라고 해서 에이전트 프레임워크를 끼고 작동하는 것은 아니지만, interaction API 호출만으로 내부에서 에이전트 · 하네스 같은 것이 루프로 돌아가므로 에이전트로 볼 수 있다 {stated}\n5. 비디오 입력에 어떻게 에이전틱하게 사고할지를 모델이 이해하도록 무언가 업데이트가 있었을 것으로 추정한다(파라미터인지 시스템 프롬프트인지 에이전트 레벨 지령인지는 불명) {low}\n등장 개념 · 엔티티\nproduct-gemini — 대상 모델\nmodel-routing-token-economics — 토큰 소비 1/10 의 비용 효과\ncloud-agent — 에이전트 루프가 어디서 도는가\n우리에게 주는 함의\n에이전트 루프가 우리 코드가 아니라 모델 API 안에서 도는 경우가 늘고 있다. 우리가 만드는 하네스의 경계가 어디까지인지 다시 봐야 한다 [S-2026-09-09-011]\n영상 · 대용량 입력을 다루는 업무라면 \"필요한 부분만 모델이 골라 보게 하는\" 구조가 비용 차이를 만든다 [S-2026-09-09-011]\n주요 인용\n이번 업데이트는 필요한 부분만 쏙쏙 뽑아서 그 부분에 대한 프레임만 세부적으로 살펴보게되어 토큰 소비량이 비약적으로 줄인 것이 특징입니다 (거의 1/10 수준). [sic]\n이미 interaction API를 호출하는 것 만으로 내부적으로는 에이전트/하네스 같은게 Loop 형식으로 돌아가므로 에이전트라고 볼 수 있습니다.","title":"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10","topics":[],"type":"source","updated":"2026-09-09"},{"aliases":["Wisdombase","위즈덤베이스"],"back":["knowledge-base-compilation","org-ai3","product-gemini","product-wisdombase","rag-vs-persistent-wiki"],"cites":["S-2026-09-08-001-karpathy-llm-wiki"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e사내 RAG 를 별도 프로젝트로 구축하는 대신, 비정형 문서를 올리면 구조화된 위키 사이트와 그것을 물릴 MCP 서버 · 임베드 챗봇이 자동으로 나오는 서비스 Wisdombase 출시 공지. Gitbook 대체를 목적으로 자체 개발했고 무료이며 데이터는 국내에서 처리된다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 우리가 이 저장소로 직접 만든 것과 같은 목적의 상용 서비스 — 직접 만들 것인가 쓸 것인가의 비교 대상\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e MCP 서버가 함께 나와 ChatGPT · Claude · Gemini 에 바로 물린다는 점 — 팀별 지식 베이스 운영 방식\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 국내 GPU 처리 · 무료 · 학습 미사용이라는 조건 — 사내 도입 시 보안 요건\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e많은 기업이 사내 RAG 구축에 별도 프로젝트로 수천만~수억을 써 왔는데, 이제 비정형 문서만 넣으면 구조화된 위키 형태의 AI-ready 사이트가 나온다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e개발 동기는 Gitbook 에 매년 700만 원 가까이 내던 비용이었다. 기본적으로 Gitbook 과 유사한 웹사이트가 만들어지며 전부 무료다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e핵심은 사이트와 함께 MCP 서버가 나온다는 점이다. ChatGPT · Claude · Gemini 에 연결해 즉시 사내 공용 지식 베이스로 쓸 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e인사팀 · 재무팀처럼 팀별 지식 베이스를 만들어 해당 팀 AI 계정에만 물릴 수 있고 전사 지식 베이스도 만들 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문서를 올리면 HWP · DOCX · PDF · XLSX · PPTX 등 19종 자동 파싱(표 안의 표 포함), 임베딩(국내 GPU), 문서 종류별 자동 최적화 청킹, 리랭킹까지 처리한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문서 업로드 · 웹사이트 링크 · 직접 편집 모두 지원하며, 지식 베이스를 만들면 챗봇이 자동 생성돼 임베드 코드로 사이트에 붙일 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e전부 무료이고 모든 데이터는 국내에서 처리되며 AI 학습에 활용되지 않는다고 밝힌다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 문서를 위키로 컴파일한다는 같은 발상의 상용 구현\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/rag-vs-persistent-wiki\" class=\"wl\"\u003erag-vs-persistent-wiki\u003c/a\u003e — \"사내 RAG 구축\" 대신 구조화된 위키\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-ai3\" class=\"wl\"\u003eorg-ai3\u003c/a\u003e · \u003ca href=\"#/product-wisdombase\" class=\"wl\"\u003eproduct-wisdombase\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리가 이 저장소로 직접 만든 것(문서 → 구조화된 위키 → 에이전트가 읽는 지식) 과 목적이 같다. 차이는 우리 쪽이 출처 추적 · 모순 기록 · 관심 흐름 같은 편집 규율을 갖는다는 점이고, 저쪽은 파싱 · 임베딩 · MCP 배포가 자동이라는 점이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eMCP 서버로 지식 베이스를 노출하는 방식은 우리 위키에도 적용 가능한 확장 경로다. 현재는 단일 HTML 뷰어와 파일 검색으로 충분하지만 규모가 커지면 검토할 만하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eHWP 포함 19종 파싱은 우리 intake 의 약점(HWP 변환기 부재) 을 정확히 겨냥한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e이제 그럴 필요 없이 그냥 회사에 쌓인 비정형 데이터(=각종 문서들)만 넣으면 알아서 구조화된 위키 형태의 AI-ready 사이트가 튀어나오는 Wisdombase를 출시합니다.\u003c/p\u003e\n\u003cp\u003e중요한 점은 이렇게 사이트가 만들어지면 MCP 서버가 같이 나온다는 점입니다.\u003c/p\u003e\n\u003cp\u003e따라서 사용자는 RAG에 대한 아무런 기술적인 고민 없이 뚝딱 우리 회사 사내 데이터를 바로 AI가 활용할 수 있는 지식 기반으로 만들 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","knowledge-base-compilation","llm-wiki-pattern","org-ai3","product-wisdombase","rag-vs-persistent-wiki"],"relpath":"wiki/sources/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp.md","sources":["S-2026-09-09-012"],"src":{"author":"표철민 (AI3) — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-012.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-012","url":""},"status":"draft","stem":"S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","summary":"AI3 가 출시한 Wisdombase. 문서를 올리면 19종 자동 파싱 · 임베딩 · 청킹 · 리랭킹을 거쳐 Gitbook 형태 위키와 MCP 서버 · 챗봇이 생성되며 전부 무료, 국내 처리","system":false,"text":"한 줄 요약\n사내 RAG 를 별도 프로젝트로 구축하는 대신, 비정형 문서를 올리면 구조화된 위키 사이트와 그것을 물릴 MCP 서버 · 임베드 챗봇이 자동으로 나오는 서비스 Wisdombase 출시 공지. Gitbook 대체를 목적으로 자체 개발했고 무료이며 데이터는 국내에서 처리된다.\n관심 포인트\n(추정) 우리가 이 저장소로 직접 만든 것과 같은 목적의 상용 서비스 — 직접 만들 것인가 쓸 것인가의 비교 대상\n(추정) MCP 서버가 함께 나와 ChatGPT · Claude · Gemini 에 바로 물린다는 점 — 팀별 지식 베이스 운영 방식\n(추정) 국내 GPU 처리 · 무료 · 학습 미사용이라는 조건 — 사내 도입 시 보안 요건\n핵심 주장\n1. 많은 기업이 사내 RAG 구축에 별도 프로젝트로 수천만~수억을 써 왔는데, 이제 비정형 문서만 넣으면 구조화된 위키 형태의 AI-ready 사이트가 나온다 {stated}\n2. 개발 동기는 Gitbook 에 매년 700만 원 가까이 내던 비용이었다. 기본적으로 Gitbook 과 유사한 웹사이트가 만들어지며 전부 무료다 {stated}\n3. 핵심은 사이트와 함께 MCP 서버가 나온다는 점이다. ChatGPT · Claude · Gemini 에 연결해 즉시 사내 공용 지식 베이스로 쓸 수 있다 {stated}\n4. 인사팀 · 재무팀처럼 팀별 지식 베이스를 만들어 해당 팀 AI 계정에만 물릴 수 있고 전사 지식 베이스도 만들 수 있다 {stated}\n5. 문서를 올리면 HWP · DOCX · PDF · XLSX · PPTX 등 19종 자동 파싱(표 안의 표 포함), 임베딩(국내 GPU), 문서 종류별 자동 최적화 청킹, 리랭킹까지 처리한다 {stated}\n6. 문서 업로드 · 웹사이트 링크 · 직접 편집 모두 지원하며, 지식 베이스를 만들면 챗봇이 자동 생성돼 임베드 코드로 사이트에 붙일 수 있다 {stated}\n7. 전부 무료이고 모든 데이터는 국내에서 처리되며 AI 학습에 활용되지 않는다고 밝힌다 {stated}\n등장 개념 · 엔티티\nknowledge-base-compilation — 상위 주제\nllm-wiki-pattern — 문서를 위키로 컴파일한다는 같은 발상의 상용 구현\nrag-vs-persistent-wiki — \"사내 RAG 구축\" 대신 구조화된 위키\norg-ai3 · product-wisdombase\n우리에게 주는 함의\n우리가 이 저장소로 직접 만든 것(문서 → 구조화된 위키 → 에이전트가 읽는 지식) 과 목적이 같다. 차이는 우리 쪽이 출처 추적 · 모순 기록 · 관심 흐름 같은 편집 규율을 갖는다는 점이고, 저쪽은 파싱 · 임베딩 · MCP 배포가 자동이라는 점이다 [S-2026-09-09-012] [S-2026-09-08-001]\nMCP 서버로 지식 베이스를 노출하는 방식은 우리 위키에도 적용 가능한 확장 경로다. 현재는 단일 HTML 뷰어와 파일 검색으로 충분하지만 규모가 커지면 검토할 만하다 [S-2026-09-09-012]\nHWP 포함 19종 파싱은 우리 intake 의 약점(HWP 변환기 부재) 을 정확히 겨냥한다 [S-2026-09-09-012]\n주요 인용\n이제 그럴 필요 없이 그냥 회사에 쌓인 비정형 데이터(=각종 문서들)만 넣으면 알아서 구조화된 위키 형태의 AI-ready 사이트가 튀어나오는 Wisdombase를 출시합니다.\n중요한 점은 이렇게 사이트가 만들어지면 MCP 서버가 같이 나온다는 점입니다.\n따라서 사용자는 RAG에 대한 아무런 기술적인 고민 없이 뚝딱 우리 회사 사내 데이터를 바로 AI가 활용할 수 있는 지식 기반으로 만들 수 있습니다.","title":"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다","topics":["knowledge-base-compilation"],"type":"source","updated":"2026-09-09"},{"aliases":["신정규 3편","그래서 우리는 뭘 해야 하나"],"back":["beyond-parameter-scaling","org-deepseek","org-google-deepmind","org-openai","org-world-labs","person-demis-hassabis","product-gemini","rlvr-domain-expansion","subscription-subsidy-dependency","two-months-later-principle"],"cites":[],"confidence":"","created":"2026-09-15","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e3부작 마지막 편. 구글이 Flash 를 3주 간격으로 찍어내며 에이전트에 올인하는 이유, 상장 여부로 갈리는 목적 함수, 코딩 밖으로 넓어질 RLVR 전망, 그리고 \"개발 문제는 난도가 아니라 시간의 문제\" 라는 운영 원칙과 정액제 적자에 얹힌 산업 구조에 대한 우려.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"전 분야 RLVR 확장\" 전망 — 연말에 모델 성능이 어디서 갑자기 오를지에 대한 예측\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"두 달 후를 믿어라\" 라는 개발 우선순위 원칙 — 우리 로드맵 판단에 바로 적용 가능\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 정액제 요금제의 토큰량이 줄어드는 순간에 대한 경고 — 비용 구조 리스크\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e구글은 Gemini Flash 를 3주 간격으로 내고 있다. 3.6 Flash 7월 21일, 3.7 Flash 8월 13일, 3.8 Flash 9월 2일이다. 3.8 은 새로 만든 것이 아니라 3.7 위에서 재학습한 이터레이션이며, 프로 모델은 여전히 포스트 트레이닝 중이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e연구 인력을 기계처럼 갈아 넣어 스냅샷을 찍어내는 루틴을 돌리는데도 성능이 계속 오른다는 점이 무섭다. 같은 규칙대로면 3.9 도 한 달 안쪽으로 나온다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e구글이 비판을 알면서도 Flash 에 집중하는 것은 에이전트에 올인하기 때문이다. 억 단위 에이전트가 동시에 돌 때 백엔드가 받쳐줄 수 있는 크기를 타깃으로 라인업을 잡고 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e상장을 앞둔 Anthropic · OpenAI 와 이미 상장한 Google 은 목적 함수가 다른 회사다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e데미스 하사비스는 AGI 를 \"2030년 전후\" 로 봐 왔고, 2026년 8월 초 DeepMind CEO 에서 물러나 회장이 됐다. 코라이 카부크추올루가 역할을 승계했다. 같은 시기 제프 딘과 산제이가 창업했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e페이페이 리의 World Labs 는 2025년 11월 첫 모델 Marble 을 냈고 2026년 2월 10억 달러를 조달했다. 오토데스크가 2억 달러를 앵커로 넣었고 기업가치는 약 50억 달러로 알려졌다. 모델 안에서 사고사슬이 도는 구조가 자리 잡으면 거기에 월드모델을 끼워 넣으려는 시도가 나올 것이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 가 뭔가를 하면 중국 랩이 몇 달 후 레시피를 만들어 공개한다. R1 때는 4개월이었고, 이번에는 Huginn · Ouro 같은 공개 연구가 이미 있어 더 빠를 수 있다. 그 전 2~3개월은 OpenAI 가 밀어붙일 것이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e다음 예상은 전 분야 RLVR 이다. 코딩에서 RLVR 이 잘 돌았던 이유는 답이 명확해 맞는 코드 중 가장 짧은 것을 정답으로 랭킹 매길 수 있었기 때문이다. 어떤 모델이 대부분 분야에서 인간 전문가 수준 판별자가 되면 RLVR 루프를 코딩 밖으로 확장할 수 있다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e그러면 \"코딩은 잘하는데 다른 건 그저 그런\" 모델들이 연말쯤 온갖 분야에서 갑자기 개선되는 경향이 나타날 것이다. 그다음은 알파고에서 알파제로로 간 것처럼 구조 개선 자체가 사람 손을 떠날 수 있으며, 이것이 가장 큰 변화일 것이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e개발자로서 이미 겪은 의미 희석이 연구자 정체성으로 이어질 것이 보인다. 코딩은 이상적으로 \"코드를 만들어 주세요\" 하고 20분 뒤 결과물을 쓰는 식이 된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e올해 말쯤 대부분은 지휘자 역할로 가고 개발력은 돈으로 환산될 것이다. 스타트업은 무제한 자본에 대항하는 법(해자) 을 알지만, 무제한 자본에 기반한 무제한 개발력에 대항하는 법을 IT 산업계가 아는지는 글쓴이도 답을 내지 못했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026년 IT 분야의 대규모 혁신이 Anthropic · OpenAI · Google 의 끝을 모르는 적자에 기반한 호혜에 얹혀 있는 것이 아닌가. 정액제 요금제의 토큰량이 줄어드는 순간이 물 빠진 수영장에서 서로를 목격하는 순간이 될 것이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e팀에 하는 말은 \"두 달 후를 믿어라\" 다. 지금 안 되거나 중요도가 낮은 것은 두 달 후에 맡기고, 정말 중요하고 시급하면 사람과 AI 를 갈아 넣는다. 온톨로지 문제도 AR 모델 안에 리커런트 루프가 들어가면 자동으로 해결될 것으로 본다. 개발 분야의 문제 해결은 시간의 문제지 난도의 문제가 아니다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e스케일 산을 계속 오를지 다른 길을 찾을지 확신이 서지 않으며, 그래서 스케일을 더하고 한계에 부딪히면 다른 축을 찾아 더하는 접근이 반복된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/rlvr-domain-expansion\" class=\"wl\"\u003erlvr-domain-expansion\u003c/a\u003e — 코딩 밖으로 넓어지는 검증 가능 보상 학습\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/two-months-later-principle\" class=\"wl\"\u003etwo-months-later-principle\u003c/a\u003e — 개발 문제는 난도가 아니라 시간의 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/subscription-subsidy-dependency\" class=\"wl\"\u003esubscription-subsidy-dependency\u003c/a\u003e — 적자 정액제에 얹힌 산업 구조\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u003c/a\u003e · \u003ca href=\"#/org-google-deepmind\" class=\"wl\"\u003eorg-google-deepmind\u003c/a\u003e · \u003ca href=\"#/person-demis-hassabis\" class=\"wl\"\u003eperson-demis-hassabis\u003c/a\u003e · \u003ca href=\"#/org-world-labs\" class=\"wl\"\u003eorg-world-labs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e · \u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 중국 랩 복제 대상 기술\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\"두 달 후를 믿어라\" 는 로드맵 판단 기준이 된다. 지금 난도 때문에 막힌 항목은 미루고, 시급성과 중요도가 함께 높은 것에만 사람과 AI 를 투입한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e연말에 코딩 외 분야 성능이 갑자기 오를 수 있다면, 지금 그 분야 제품을 설계할 때 모델 한계를 전제로 굳히지 않는 편이 낫다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우리 비용 구조가 정액제 요금제의 넉넉한 토큰량에 기대고 있다면 그것은 가정이지 조건이 아니다. 종량 과금 기준으로도 성립하는지 계산해 둬야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e구글은 거의 기계처럼 모델을 찍어내고 있다.\u003c/p\u003e\n\u003cp\u003e상장을 목전에 둔 Anthropic 이나 OpenAI 와, 상장을 이미 한 Google 은 어떤 의미에선 목적 함수가 다른 회사다.\u003c/p\u003e\n\u003cp\u003e무제한의 자본에 대항하는 법을 스타트업들은 안다. 해자를 만들어라. 그런데 무제한의 자본에 기반한 무제한의 개발력에 대항하는 법을 과연 IT 산업계는 알고 있을까?\u003c/p\u003e\n\u003cp\u003eMax, Pro, Ultra 등등 회사마다 부르는 이름이 다른 그 정액제 요금제의 토큰량이 줄어드는 순간이, 물빠진 수영장에서 다같이 수영복도 입을 생각도 못하고 있던걸 서로 목격하는 순간이 되지 않을까 싶다.\u003c/p\u003e\n\u003cp\u003e이제 개발 분야의 문제 해결은 시간의 문제지 난도의 문제가 아니다.\u003c/p\u003e\n\u003cp\u003e쳇바퀴돌듯 계속 새 모델이 나오고 있지만, 제자리에서 계속 도는것 같아도 어느새 보면 나선형 탑을 오르는 중이다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["beyond-parameter-scaling","loop-transformer-latent-reasoning","org-anthropic","org-deepseek","org-google-deepmind","org-openai","org-world-labs","person-demis-hassabis","product-gemini","rlvr-domain-expansion","subscription-subsidy-dependency","two-months-later-principle"],"relpath":"wiki/sources/S-2026-09-15-001-google-cadence-and-what-to-do.md","sources":["S-2026-09-15-001"],"src":{"author":"신정규 (래블업) — 페이스북 발췌 (3부작 중 3편)","file":"raw/2026/09/S-2026-09-15-001.txt","origin":"text","published_at":"","shared_at":"2026-09-15","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-15-001","url":""},"status":"draft","stem":"S-2026-09-15-001-google-cadence-and-what-to-do","summary":"Gemini Flash 3주 간격 출시와 에이전트 올인, 하사비스의 이동, 전 분야 RLVR 확장 전망, '두 달 후를 믿어라', 정액제 적자에 얹힌 혁신에 대한 우려","system":false,"text":"한 줄 요약\n3부작 마지막 편. 구글이 Flash 를 3주 간격으로 찍어내며 에이전트에 올인하는 이유, 상장 여부로 갈리는 목적 함수, 코딩 밖으로 넓어질 RLVR 전망, 그리고 \"개발 문제는 난도가 아니라 시간의 문제\" 라는 운영 원칙과 정액제 적자에 얹힌 산업 구조에 대한 우려.\n관심 포인트\n(추정) \"전 분야 RLVR 확장\" 전망 — 연말에 모델 성능이 어디서 갑자기 오를지에 대한 예측\n(추정) \"두 달 후를 믿어라\" 라는 개발 우선순위 원칙 — 우리 로드맵 판단에 바로 적용 가능\n(추정) 정액제 요금제의 토큰량이 줄어드는 순간에 대한 경고 — 비용 구조 리스크\n핵심 주장\n1. 구글은 Gemini Flash 를 3주 간격으로 내고 있다. 3.6 Flash 7월 21일, 3.7 Flash 8월 13일, 3.8 Flash 9월 2일이다. 3.8 은 새로 만든 것이 아니라 3.7 위에서 재학습한 이터레이션이며, 프로 모델은 여전히 포스트 트레이닝 중이다 {stated}\n2. 연구 인력을 기계처럼 갈아 넣어 스냅샷을 찍어내는 루틴을 돌리는데도 성능이 계속 오른다는 점이 무섭다. 같은 규칙대로면 3.9 도 한 달 안쪽으로 나온다 {stated}\n3. 구글이 비판을 알면서도 Flash 에 집중하는 것은 에이전트에 올인하기 때문이다. 억 단위 에이전트가 동시에 돌 때 백엔드가 받쳐줄 수 있는 크기를 타깃으로 라인업을 잡고 있다 {stated}\n4. 상장을 앞둔 Anthropic · OpenAI 와 이미 상장한 Google 은 목적 함수가 다른 회사다 {stated}\n5. 데미스 하사비스는 AGI 를 \"2030년 전후\" 로 봐 왔고, 2026년 8월 초 DeepMind CEO 에서 물러나 회장이 됐다. 코라이 카부크추올루가 역할을 승계했다. 같은 시기 제프 딘과 산제이가 창업했다 {stated}\n6. 페이페이 리의 World Labs 는 2025년 11월 첫 모델 Marble 을 냈고 2026년 2월 10억 달러를 조달했다. 오토데스크가 2억 달러를 앵커로 넣었고 기업가치는 약 50억 달러로 알려졌다. 모델 안에서 사고사슬이 도는 구조가 자리 잡으면 거기에 월드모델을 끼워 넣으려는 시도가 나올 것이다 {low}\n7. OpenAI 가 뭔가를 하면 중국 랩이 몇 달 후 레시피를 만들어 공개한다. R1 때는 4개월이었고, 이번에는 Huginn · Ouro 같은 공개 연구가 이미 있어 더 빠를 수 있다. 그 전 2~3개월은 OpenAI 가 밀어붙일 것이다 {low}\n8. 다음 예상은 전 분야 RLVR 이다. 코딩에서 RLVR 이 잘 돌았던 이유는 답이 명확해 맞는 코드 중 가장 짧은 것을 정답으로 랭킹 매길 수 있었기 때문이다. 어떤 모델이 대부분 분야에서 인간 전문가 수준 판별자가 되면 RLVR 루프를 코딩 밖으로 확장할 수 있다 {low}\n9. 그러면 \"코딩은 잘하는데 다른 건 그저 그런\" 모델들이 연말쯤 온갖 분야에서 갑자기 개선되는 경향이 나타날 것이다. 그다음은 알파고에서 알파제로로 간 것처럼 구조 개선 자체가 사람 손을 떠날 수 있으며, 이것이 가장 큰 변화일 것이다 {low}\n10. 개발자로서 이미 겪은 의미 희석이 연구자 정체성으로 이어질 것이 보인다. 코딩은 이상적으로 \"코드를 만들어 주세요\" 하고 20분 뒤 결과물을 쓰는 식이 된다 {stated}\n11. 올해 말쯤 대부분은 지휘자 역할로 가고 개발력은 돈으로 환산될 것이다. 스타트업은 무제한 자본에 대항하는 법(해자) 을 알지만, 무제한 자본에 기반한 무제한 개발력에 대항하는 법을 IT 산업계가 아는지는 글쓴이도 답을 내지 못했다 {stated}\n12. 2026년 IT 분야의 대규모 혁신이 Anthropic · OpenAI · Google 의 끝을 모르는 적자에 기반한 호혜에 얹혀 있는 것이 아닌가. 정액제 요금제의 토큰량이 줄어드는 순간이 물 빠진 수영장에서 서로를 목격하는 순간이 될 것이다 {stated}\n13. 팀에 하는 말은 \"두 달 후를 믿어라\" 다. 지금 안 되거나 중요도가 낮은 것은 두 달 후에 맡기고, 정말 중요하고 시급하면 사람과 AI 를 갈아 넣는다. 온톨로지 문제도 AR 모델 안에 리커런트 루프가 들어가면 자동으로 해결될 것으로 본다. 개발 분야의 문제 해결은 시간의 문제지 난도의 문제가 아니다 {stated}\n14. 스케일 산을 계속 오를지 다른 길을 찾을지 확신이 서지 않으며, 그래서 스케일을 더하고 한계에 부딪히면 다른 축을 찾아 더하는 접근이 반복된다 {stated}\n등장 개념 · 엔티티\nbeyond-parameter-scaling — 상위 주제\nrlvr-domain-expansion — 코딩 밖으로 넓어지는 검증 가능 보상 학습\ntwo-months-later-principle — 개발 문제는 난도가 아니라 시간의 문제\nsubscription-subsidy-dependency — 적자 정액제에 얹힌 산업 구조\nproduct-gemini · org-google-deepmind · person-demis-hassabis · org-world-labs\norg-openai · org-anthropic · org-deepseek\nloop-transformer-latent-reasoning — 중국 랩 복제 대상 기술\n우리에게 주는 함의\n\"두 달 후를 믿어라\" 는 로드맵 판단 기준이 된다. 지금 난도 때문에 막힌 항목은 미루고, 시급성과 중요도가 함께 높은 것에만 사람과 AI 를 투입한다 [S-2026-09-15-001]\n연말에 코딩 외 분야 성능이 갑자기 오를 수 있다면, 지금 그 분야 제품을 설계할 때 모델 한계를 전제로 굳히지 않는 편이 낫다 [S-2026-09-15-001]\n우리 비용 구조가 정액제 요금제의 넉넉한 토큰량에 기대고 있다면 그것은 가정이지 조건이 아니다. 종량 과금 기준으로도 성립하는지 계산해 둬야 한다 [S-2026-09-15-001]\n주요 인용\n구글은 거의 기계처럼 모델을 찍어내고 있다.\n상장을 목전에 둔 Anthropic 이나 OpenAI 와, 상장을 이미 한 Google 은 어떤 의미에선 목적 함수가 다른 회사다.\n무제한의 자본에 대항하는 법을 스타트업들은 안다. 해자를 만들어라. 그런데 무제한의 자본에 기반한 무제한의 개발력에 대항하는 법을 과연 IT 산업계는 알고 있을까?\nMax, Pro, Ultra 등등 회사마다 부르는 이름이 다른 그 정액제 요금제의 토큰량이 줄어드는 순간이, 물빠진 수영장에서 다같이 수영복도 입을 생각도 못하고 있던걸 서로 목격하는 순간이 되지 않을까 싶다.\n이제 개발 분야의 문제 해결은 시간의 문제지 난도의 문제가 아니다.\n쳇바퀴돌듯 계속 새 모델이 나오고 있지만, 제자리에서 계속 도는것 같아도 어느새 보면 나선형 탑을 오르는 중이다.","title":"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나","topics":["beyond-parameter-scaling"],"type":"source","updated":"2026-09-15"},{"aliases":["Astra 시스템 프롬프트 유출","GPT-6_Astra_Prompts.md"],"back":["_unsorted","product-gpt-6-astra"],"cites":[],"confidence":"","created":"2026-09-15","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eGPT-6 Astra 의 시스템 프롬프트라고 주장되는 대규모 문서가 GitHub 에 공개됐다는 소식. 제3자가 올린 자료이며 OpenAI 가 공식 확인한 원본이 아니라는 점이 함께 적혀 있다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 프론티어 에이전트의 시스템 지침이 실제로 어떻게 짜여 있는지 — 우리 하네스 설계의 참고 자료\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 진위가 불확실한 자료를 어디까지 참고할 것인가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eGPT-6 Astra 의 시스템 프롬프트로 주장되는 문서가 GitHub 에 공개됐다고 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e파일은 331KB, 약 5,051줄 규모이며 저장소에 'GPT-6_Astra_Prompts.md' 라는 이름으로 올라와 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문서에는 Astra · Codex 환경에서 쓰는 것으로 주장되는 시스템 지침과 역할, 도구 · 명령어 설명, 작업 수행 방식, 에이전트의 행동 · 의사결정 지침이 포함돼 있다고 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 가 공식 공개한 원본으로 확인된 것은 아니며 제3자 자료이므로 실제 최신 Astra 내부 프롬프트와 동일한지 검증이 필요하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e — 대상 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 시스템 지침이 다루는 영역\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e진위가 확인되지 않은 자료다. 하네스 설계 참고로 읽더라도 \"프론티어 랩이 이렇게 한다\" 는 근거로 인용해서는 안 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-002-astra-system-prompt-leak-claim\" title=\"GPT-6 Astra 시스템 프롬프트가 공개됐다는 주장\"\u003eS-2026-09-15-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원문을 직접 확인하지 않은 상태이므로 이 위키에는 주장의 존재만 기록한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-002-astra-system-prompt-leak-claim\" title=\"GPT-6 Astra 시스템 프롬프트가 공개됐다는 주장\"\u003eS-2026-09-15-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e다만 중요한 점은 이것이 OpenAI가 공식적으로 공개한 원본 시스템 프롬프트라고 확인된 것은 아니라는 것입니다.\u003c/p\u003e\n\u003cp\u003e현재는 제3자가 공개한 자료이므로 실제 최신 Astra 내부 프롬프트와 동일한지 검증이 필요합니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["agent-governance-guardrails","product-gpt-6-astra"],"relpath":"wiki/sources/S-2026-09-15-002-astra-system-prompt-leak-claim.md","sources":["S-2026-09-15-002"],"src":{"author":"미상 (SNS 전언)","file":"raw/2026/09/S-2026-09-15-002.txt","origin":"text","published_at":"","shared_at":"2026-09-15","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-15-002","url":""},"status":"draft","stem":"S-2026-09-15-002-astra-system-prompt-leak-claim","summary":"331KB · 약 5,051줄 규모의 문서가 GitHub 에 Astra 시스템 프롬프트로 올라왔다는 전언. OpenAI 공식 공개가 아니며 진위 검증이 필요하다는 단서가 붙음","system":false,"text":"한 줄 요약\nGPT-6 Astra 의 시스템 프롬프트라고 주장되는 대규모 문서가 GitHub 에 공개됐다는 소식. 제3자가 올린 자료이며 OpenAI 가 공식 확인한 원본이 아니라는 점이 함께 적혀 있다.\n관심 포인트\n(추정) 프론티어 에이전트의 시스템 지침이 실제로 어떻게 짜여 있는지 — 우리 하네스 설계의 참고 자료\n(추정) 진위가 불확실한 자료를 어디까지 참고할 것인가\n핵심 주장\n1. GPT-6 Astra 의 시스템 프롬프트로 주장되는 문서가 GitHub 에 공개됐다고 한다 {stated}\n2. 파일은 331KB, 약 5,051줄 규모이며 저장소에 'GPT-6AstraPrompts.md' 라는 이름으로 올라와 있다 {stated}\n3. 문서에는 Astra · Codex 환경에서 쓰는 것으로 주장되는 시스템 지침과 역할, 도구 · 명령어 설명, 작업 수행 방식, 에이전트의 행동 · 의사결정 지침이 포함돼 있다고 한다 {stated}\n4. OpenAI 가 공식 공개한 원본으로 확인된 것은 아니며 제3자 자료이므로 실제 최신 Astra 내부 프롬프트와 동일한지 검증이 필요하다 {stated}\n등장 개념 · 엔티티\nproduct-gpt-6-astra — 대상 모델\nagent-governance-guardrails — 시스템 지침이 다루는 영역\n우리에게 주는 함의\n진위가 확인되지 않은 자료다. 하네스 설계 참고로 읽더라도 \"프론티어 랩이 이렇게 한다\" 는 근거로 인용해서는 안 된다 [S-2026-09-15-002]\n원문을 직접 확인하지 않은 상태이므로 이 위키에는 주장의 존재만 기록한다 [S-2026-09-15-002]\n주요 인용\n다만 중요한 점은 이것이 OpenAI가 공식적으로 공개한 원본 시스템 프롬프트라고 확인된 것은 아니라는 것입니다.\n현재는 제3자가 공개한 자료이므로 실제 최신 Astra 내부 프롬프트와 동일한지 검증이 필요합니다.","title":"GPT-6 Astra 시스템 프롬프트가 공개됐다는 주장","topics":[],"type":"source","updated":"2026-09-15"},{"aliases":["Harness Engineering 가이드","하네스 엔지니어링 6계층"],"back":["_unsorted","agent-governance-guardrails","ai-workforce-runtime","harness-engineering-discipline"],"cites":["S-2026-09-09-002-crewon-ai-agent-runtime"],"confidence":"","created":"2026-09-15","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e\"Harness Engineering\" 문서의 출처를 바로잡는 짧은 메모. 구글 발표 논문이나 공식 문서가 아니라 여러 자료를 종합한 독립 편찬물이며, 문서 자체가 어떤 벤더와도 제휴 · 승인 관계가 없다고 밝히고 있다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 하네스 엔지니어링은 우리가 다루는 \"실행 환경이 경쟁력\" 논지의 정면 주제 — 6계층 정리가 무엇인지\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 출처 오인이 퍼진 사례 자체 — 자료를 인용할 때의 주의\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e해당 자료는 Google 이 발표한 논문이나 공식 문서가 아니다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e여러 Harness Engineering 자료(OpenAI Codex, Mitchell Hashimoto, Martin Fowler 등) 를 종합한 2026년 8월 독립 편찬 기술 문서다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문서 자체에 Google · OpenAI · Anthropic · HashiCorp 와 제휴 · 승인 관계가 없다고 명시돼 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e원본 PDF 는 Google Drive 링크로, 요약 블로그는 theaxlabs.com/blog/harness-engineering-6-layer-guide 로 제시됐다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/harness-engineering-discipline\" class=\"wl\"\u003eharness-engineering-discipline\u003c/a\u003e — 하네스를 공학 분야로 다루는 흐름\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e · \u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 같은 문제를 다루는 이 위키의 페이지들\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e내용(6계층) 은 이 전언에 없다. 원문 PDF 나 요약 블로그를 확보해야 실제로 참고할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 위키가 이미 다루는 \"모델이 아니라 실행 환경이 경쟁력\" 논지와 정확히 같은 주제다. 확보하면 우리 하네스 설계와 대조할 만하다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e출처가 구글로 잘못 알려진 채 공유된 사례다. 우리 위키의 출처 기록 규율이 필요한 이유를 보여준다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e해당 자료는 Google에서 발표한 논문이나 공식 문서가 아니라, 여러 Harness Engineering 자료(OpenAI Codex, Mitchell Hashimoto, Martin Fowler 등)를 종합한 2026년 8월 독립 편찬 기술 문서입니다.\u003c/p\u003e\n\u003cp\u003e문서 자체에도 Google, OpenAI, Anthropic, HashiCorp와 제휴·승인 관계가 없다고 명시되어 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-09-002-crewon-ai-agent-runtime","agent-governance-guardrails","ai-workforce-runtime","harness-engineering-discipline"],"relpath":"wiki/sources/S-2026-09-15-003-harness-engineering-guide-provenance.md","sources":["S-2026-09-15-003"],"src":{"author":"미상 (SNS 정정 메모)","file":"raw/2026/09/S-2026-09-15-003.txt","origin":"text","published_at":"","shared_at":"2026-09-15","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-15-003","url":""},"status":"draft","stem":"S-2026-09-15-003-harness-engineering-guide-provenance","summary":"널리 공유된 Harness Engineering 문서는 구글 논문이 아니라 2026년 8월 독립 편찬 기술 문서이며, 어떤 벤더와도 제휴 관계가 없다는 정정. 원문 PDF 와 요약 블로그 링크 포함","system":false,"text":"한 줄 요약\n\"Harness Engineering\" 문서의 출처를 바로잡는 짧은 메모. 구글 발표 논문이나 공식 문서가 아니라 여러 자료를 종합한 독립 편찬물이며, 문서 자체가 어떤 벤더와도 제휴 · 승인 관계가 없다고 밝히고 있다.\n관심 포인트\n(추정) 하네스 엔지니어링은 우리가 다루는 \"실행 환경이 경쟁력\" 논지의 정면 주제 — 6계층 정리가 무엇인지\n(추정) 출처 오인이 퍼진 사례 자체 — 자료를 인용할 때의 주의\n핵심 주장\n1. 해당 자료는 Google 이 발표한 논문이나 공식 문서가 아니다 {stated}\n2. 여러 Harness Engineering 자료(OpenAI Codex, Mitchell Hashimoto, Martin Fowler 등) 를 종합한 2026년 8월 독립 편찬 기술 문서다 {stated}\n3. 문서 자체에 Google · OpenAI · Anthropic · HashiCorp 와 제휴 · 승인 관계가 없다고 명시돼 있다 {stated}\n4. 원본 PDF 는 Google Drive 링크로, 요약 블로그는 theaxlabs.com/blog/harness-engineering-6-layer-guide 로 제시됐다 {stated}\n등장 개념 · 엔티티\nharness-engineering-discipline — 하네스를 공학 분야로 다루는 흐름\nai-workforce-runtime · agent-governance-guardrails — 같은 문제를 다루는 이 위키의 페이지들\n우리에게 주는 함의\n내용(6계층) 은 이 전언에 없다. 원문 PDF 나 요약 블로그를 확보해야 실제로 참고할 수 있다 [S-2026-09-15-003]\n이 위키가 이미 다루는 \"모델이 아니라 실행 환경이 경쟁력\" 논지와 정확히 같은 주제다. 확보하면 우리 하네스 설계와 대조할 만하다 [S-2026-09-15-003] [S-2026-09-09-002]\n출처가 구글로 잘못 알려진 채 공유된 사례다. 우리 위키의 출처 기록 규율이 필요한 이유를 보여준다 [S-2026-09-15-003]\n주요 인용\n해당 자료는 Google에서 발표한 논문이나 공식 문서가 아니라, 여러 Harness Engineering 자료(OpenAI Codex, Mitchell Hashimoto, Martin Fowler 등)를 종합한 2026년 8월 독립 편찬 기술 문서입니다.\n문서 자체에도 Google, OpenAI, Anthropic, HashiCorp와 제휴·승인 관계가 없다고 명시되어 있습니다.","title":"Harness Engineering 6계층 가이드의 출처 정정","topics":[],"type":"source","updated":"2026-09-15"},{"aliases":["신정규 2편","아스트라 확인된 것"],"back":["agent-governance-guardrails","beyond-parameter-scaling","cot-monitorability-erosion","harness-engineering-discipline","human-oversight-erosion","inference-hardware-shift-recurrent-depth","loop-transformer-latent-reasoning","org-anthropic","org-google-deepmind","org-nvidia","org-openai","product-arc-agi-3","product-gpt-6-astra"],"cites":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-009-loop-transformer-after-astra"],"confidence":"","created":"2026-09-15","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e앞 글 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e 의 추측을 보도 · 시스템 카드 · OpenAI 발언으로 좁힌 후속편. 아스트라의 recurrent depth 는 공식 확인은 아니지만 정황상 사실로 보이며, 그 대가로 사고사슬 기반 감시가 약해졌고, 루프 구조는 디코드를 memory-bound 에서 compute-bound 로 밀어 하드웨어와 서빙 스케줄링 문제를 새로 만든다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 지난주 열린 질문이었던 \"아스트라는 루프인가 멀티 에이전트인가\" 에 대한 후속 근거\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 사고사슬 감시가 약해진다는 것의 실무적 의미 — 우리 하네스가 무엇에 의존하고 있는가\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 추론 병목이 메모리에서 연산으로 옮겨가면 인프라 투자 판단이 달라진다는 점\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e2026년 9월 2일 The Information 이 아스트라가 recurrent depth(looped transformer) 를 쓴다고 보도했다. OpenAI 는 아키텍처를 공식 확인하지 않았고 시스템 카드는 모니터링 저하를 \"아키텍처 탓으로 귀속하지 않는다\" 고 명시한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e다만 OpenAI 연구자들이 \"루프 사용 범위를 제한했다\" 고 반박한 것 자체를 글쓴이는 간접 확인으로 본다. 후속 보도로는 Anthropic 과 Google DeepMind 도 같은 기술을 검토 중이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e루프 안의 계산은 토큰을 남기지 않으므로 사고사슬을 읽어 감시하던 방법이 약해진다. \"약해진다\" 이지 \"사라진다\" 가 아니며, CoT 를 다 걷어내지 않았거나 루프 게이트웨이를 달았거나 둘 다일 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 수석과학자 야쿱 파초츠키는 \"읽을 수 있는 사고사슬에 대한 약속\" 을 재확인했고, 루프 사용을 제한해 추론을 읽을 수 있게 유지했으며 \"뉴럴리즈로 가는 것\" 이라는 해석을 거부했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e시스템 카드에 따르면 아스트라는 이전 모델보다 사고사슬 모니터링이 어려워졌고, 말로 쓰지 않고도 더 어려운 문제를 풀며, 회피하라고 명시적으로 지시하면 추론 흔적을 더 잘 통제한다. 영국 AISI 도 비슷한 평가를 냈다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e바깥 하네스가 중간 사고사슬을 검색해 걸러내는 방식은 여전히 작동하지만, 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e레드우드 리서치 벅 슐레게리스는 \"이 기술을 더 스케일하면 CoT 모니터링이 완전히 무너질 수 있다\" 고 경고했고, 파초츠키는 스케일 상한을 두겠다고 말하지 않았다. 글쓴이는 무서운 것이 현재 상태가 아니라 방향성이라고 본다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eARC-AGI-3(2026년 3월 공개, 처음 보는 인터랙티브 환경에서 규칙을 스스로 알아내는 벤치마크) 에서 출시 당시 프론티어 모델은 1% 미만, GPT-5.6 Sol 은 7.8% 였는데 아스트라는 OpenAI 발표 기준 98.6%, 어댑터 하네스 기준 99.9% 를 기록했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e단 아스트라는 Responses API 하네스에서 두 설정을 바꿔 평가했고 비교 모델들은 다른 설정으로 평가됐다. ARC-AGI-3 의 100% 는 \"중앙값 인간 기준선과 같거나 그 이상\" 이라는 뜻이며, 운영 주체 ARC Prize 도 \"결정론적 폐쇄 환경은 현실의 복잡성을 대표하지 않는다\" 며 AGI 주장을 거부했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e다른 벤치마크: Terminal-Bench 4.0 과 FrontierCode 1.1 은 50~60% 로 Anthropic Fable 5 수준이고 나머지는 97% 이상, ExploitBench 는 100% 다. Humanity's Last Exam 은 2026년 8월 기준 텍스트 전용 SOTA 가 40%대 중반으로 아직 포화되지 않았다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAnthropic 은 며칠 앞서 Fable 5.1 과 Mythos 5.1 을 냈고 코딩 계열 격차는 아직 작다. 격차가 큰 곳은 ARC-AGI-3 와 사이버다. 아스트라는 OpenAI Preparedness Framework 에서 처음 사이버 Critical 등급에 도달했고 평가 중 미공개 제로데이 두 개를 찾아냈다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 는 성능 향상 요인으로 recurrent depth 뿐 아니라 \"상당히 늘어난 사전학습 컴퓨트\"(GB200 10만 장) 도 언급한다. 루프는 스케일의 대체재가 아니라 보완재로 쓰인다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e하드웨어 영향: 지금까지 사고사슬을 길게 뽑으려면 디코딩을 길게 해야 했고 디코드는 토큰마다 전체 가중치를 읽어 memory-bound 라 HBM 수요가 컸다. Recurrent depth 는 토큰당 prelude → core×r → coda 를 통과해 연산량이 r 배 늘고 arithmetic intensity 가 올라가 디코드가 compute-bound 쪽으로 이동한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e다만 원 논문은 반복 스텝마다 KV 캐시를 따로 두는 것이 기본이라 메모리가 오히려 늘 수도 있다. 서빙 시스템이 KV 캐시를 얼마나 공유하느냐에 달렸다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e파라미터가 작고 연산이 반복되면 가중치를 온칩 SRAM 에 상주시키는 구조(Groq LPU, Cerebras) 가 유리해진다. 엔비디아는 GTC 2026 에서 Groq 3 LPU 와 LPX 랙을 전면에 내세워 SRAM 헤비 옵션을 확보했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e서빙의 진짜 쟁점은 스케줄링이다. 토큰마다 반복 횟수가 다르면 배치 안 토큰들이 제각각 종료돼 배치 정렬이 깨진다. 2026년 8월 Continuous Depth Batching 논문이 이 문제를 다루지만 아직 답이 없다. 글쓴이는 r 값을 몇 가지로 정규화해 체류 시간을 예측 가능하게 만드는 방법을 제안한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e엔비디아 Rubin CPX(2025년 9월 발표된 프리필 전용 가속기) 는 GDDR7 전제가 램값 상승으로 무너져 로드맵에서 사라졌다가, 궈밍치 보도로 HBM4 168GB · Rubin 급 연산 · 2,300W · 별도 MGX ETL 랙으로 부활이 거론된다(공식 발표 아님) \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e그것이 사실이라면 엔비디아가 프리필에 높은 우선순위를 두고 GDDR7 을 버렸다는 뜻이며, 에이전트 워크로드가 끝없이 컨텍스트를 물고 돌아 프리필 부하가 커진 상황에서 메모리 계층이 쉽게 가벼워지지 않는다는 판단으로 읽힌다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e모델 크기가 멈추지는 않는다. 아스트라 자체가 사전학습 컴퓨트를 크게 늘렸고 프론티어가 10T 를 찍는 상황에서 대형 랙 수요 감소를 보기는 어렵다. 중심축이 이동하는 것이지 기존 축이 사라지는 것이 아니며, 복잡도의 축이 하나 더 느는 상황이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cot-monitorability-erosion\" class=\"wl\"\u003ecot-monitorability-erosion\u003c/a\u003e — 루프 연산이 남기지 않는 사고사슬과 감시 약화\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/inference-hardware-shift-recurrent-depth\" class=\"wl\"\u003einference-hardware-shift-recurrent-depth\u003c/a\u003e — 디코드의 compute-bound 이동과 서빙 스케줄링\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 1편에서 정리한 계보\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e · \u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 감시가 약해질 때의 통제 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/product-arc-agi-3\" class=\"wl\"\u003eproduct-arc-agi-3\u003c/a\u003e · \u003ca href=\"#/org-nvidia\" class=\"wl\"\u003eorg-nvidia\u003c/a\u003e · \u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e · \u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리 하네스가 사고사슬 텍스트에 의존해 이상을 감지하고 있다면 그 신뢰도가 모델 세대와 함께 떨어진다. 감시 지점을 실행 결과 · 도구 호출 · 권한 경계로 옮겨야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e벤치마크 수치는 하네스 설정에 따라 달라진다. 아스트라와 비교 모델의 평가 설정이 달랐다는 점은 우리가 벤치마크를 인용하거나 만들 때의 기준이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e추론 병목이 메모리에서 연산으로 옮겨가는 중이지만 프리필 부하는 반대로 커지고 있다. 인프라 판단을 한 방향으로 단정하지 않는 편이 안전하다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e루프 안에서 도는 계산은 토큰을 남기지 않는다. 그래서 사고사슬을 읽어서 모델을 감시하던 방법이 약해진다.\u003c/p\u003e\n\u003cp\u003e다만 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다.\u003c/p\u003e\n\u003cp\u003e그러니까 지금 무서운 건 현재 상태가 아니라 방향성이다.\u003c/p\u003e\n\u003cp\u003e루프는 스케일의 대체재가 아니라 보완재로 쓰이고 있다.\u003c/p\u003e\n\u003cp\u003e중심축이 이동하는 것이지 기존 축이 사라지는 것은 아니다. 복잡도의 축이 하나 더 느는 상황이 될 뿐이다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-009-loop-transformer-after-astra","agent-governance-guardrails","beyond-parameter-scaling","cot-monitorability-erosion","human-oversight-erosion","inference-hardware-shift-recurrent-depth","loop-transformer-latent-reasoning","org-anthropic","org-nvidia","org-openai","product-arc-agi-3","product-gpt-6-astra"],"relpath":"wiki/sources/S-2026-09-15-004-astra-verified-and-hardware-shift.md","sources":["S-2026-09-15-004"],"src":{"author":"신정규 (래블업) — 페이스북 발췌 (3부작 중 2편)","file":"raw/2026/09/S-2026-09-15-004.txt","origin":"text","published_at":"","shared_at":"2026-09-15","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-15-004","url":""},"status":"draft","stem":"S-2026-09-15-004-astra-verified-and-hardware-shift","summary":"The Information 의 recurrent depth 보도와 OpenAI 반응, ARC-AGI-3 99.9% 의 조건, 루프가 디코드를 compute-bound 로 옮기며 생기는 하드웨어 · 서빙 쟁점","system":false,"text":"한 줄 요약\n앞 글 [S-2026-09-09-009] 의 추측을 보도 · 시스템 카드 · OpenAI 발언으로 좁힌 후속편. 아스트라의 recurrent depth 는 공식 확인은 아니지만 정황상 사실로 보이며, 그 대가로 사고사슬 기반 감시가 약해졌고, 루프 구조는 디코드를 memory-bound 에서 compute-bound 로 밀어 하드웨어와 서빙 스케줄링 문제를 새로 만든다.\n관심 포인트\n(추정) 지난주 열린 질문이었던 \"아스트라는 루프인가 멀티 에이전트인가\" 에 대한 후속 근거\n(추정) 사고사슬 감시가 약해진다는 것의 실무적 의미 — 우리 하네스가 무엇에 의존하고 있는가\n(추정) 추론 병목이 메모리에서 연산으로 옮겨가면 인프라 투자 판단이 달라진다는 점\n핵심 주장\n1. 2026년 9월 2일 The Information 이 아스트라가 recurrent depth(looped transformer) 를 쓴다고 보도했다. OpenAI 는 아키텍처를 공식 확인하지 않았고 시스템 카드는 모니터링 저하를 \"아키텍처 탓으로 귀속하지 않는다\" 고 명시한다 {stated}\n2. 다만 OpenAI 연구자들이 \"루프 사용 범위를 제한했다\" 고 반박한 것 자체를 글쓴이는 간접 확인으로 본다. 후속 보도로는 Anthropic 과 Google DeepMind 도 같은 기술을 검토 중이다 {low}\n3. 루프 안의 계산은 토큰을 남기지 않으므로 사고사슬을 읽어 감시하던 방법이 약해진다. \"약해진다\" 이지 \"사라진다\" 가 아니며, CoT 를 다 걷어내지 않았거나 루프 게이트웨이를 달았거나 둘 다일 수 있다 {stated}\n4. OpenAI 수석과학자 야쿱 파초츠키는 \"읽을 수 있는 사고사슬에 대한 약속\" 을 재확인했고, 루프 사용을 제한해 추론을 읽을 수 있게 유지했으며 \"뉴럴리즈로 가는 것\" 이라는 해석을 거부했다 {stated}\n5. 시스템 카드에 따르면 아스트라는 이전 모델보다 사고사슬 모니터링이 어려워졌고, 말로 쓰지 않고도 더 어려운 문제를 풀며, 회피하라고 명시적으로 지시하면 추론 흔적을 더 잘 통제한다. 영국 AISI 도 비슷한 평가를 냈다 {stated}\n6. 바깥 하네스가 중간 사고사슬을 검색해 걸러내는 방식은 여전히 작동하지만, 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다 {stated}\n7. 레드우드 리서치 벅 슐레게리스는 \"이 기술을 더 스케일하면 CoT 모니터링이 완전히 무너질 수 있다\" 고 경고했고, 파초츠키는 스케일 상한을 두겠다고 말하지 않았다. 글쓴이는 무서운 것이 현재 상태가 아니라 방향성이라고 본다 {stated}\n8. ARC-AGI-3(2026년 3월 공개, 처음 보는 인터랙티브 환경에서 규칙을 스스로 알아내는 벤치마크) 에서 출시 당시 프론티어 모델은 1% 미만, GPT-5.6 Sol 은 7.8% 였는데 아스트라는 OpenAI 발표 기준 98.6%, 어댑터 하네스 기준 99.9% 를 기록했다 {stated}\n9. 단 아스트라는 Responses API 하네스에서 두 설정을 바꿔 평가했고 비교 모델들은 다른 설정으로 평가됐다. ARC-AGI-3 의 100% 는 \"중앙값 인간 기준선과 같거나 그 이상\" 이라는 뜻이며, 운영 주체 ARC Prize 도 \"결정론적 폐쇄 환경은 현실의 복잡성을 대표하지 않는다\" 며 AGI 주장을 거부했다 {stated}\n10. 다른 벤치마크: Terminal-Bench 4.0 과 FrontierCode 1.1 은 50~60% 로 Anthropic Fable 5 수준이고 나머지는 97% 이상, ExploitBench 는 100% 다. Humanity's Last Exam 은 2026년 8월 기준 텍스트 전용 SOTA 가 40%대 중반으로 아직 포화되지 않았다 {stated}\n11. Anthropic 은 며칠 앞서 Fable 5.1 과 Mythos 5.1 을 냈고 코딩 계열 격차는 아직 작다. 격차가 큰 곳은 ARC-AGI-3 와 사이버다. 아스트라는 OpenAI Preparedness Framework 에서 처음 사이버 Critical 등급에 도달했고 평가 중 미공개 제로데이 두 개를 찾아냈다 {stated}\n12. OpenAI 는 성능 향상 요인으로 recurrent depth 뿐 아니라 \"상당히 늘어난 사전학습 컴퓨트\"(GB200 10만 장) 도 언급한다. 루프는 스케일의 대체재가 아니라 보완재로 쓰인다 {stated}\n13. 하드웨어 영향: 지금까지 사고사슬을 길게 뽑으려면 디코딩을 길게 해야 했고 디코드는 토큰마다 전체 가중치를 읽어 memory-bound 라 HBM 수요가 컸다. Recurrent depth 는 토큰당 prelude → core×r → coda 를 통과해 연산량이 r 배 늘고 arithmetic intensity 가 올라가 디코드가 compute-bound 쪽으로 이동한다 {stated}\n14. 다만 원 논문은 반복 스텝마다 KV 캐시를 따로 두는 것이 기본이라 메모리가 오히려 늘 수도 있다. 서빙 시스템이 KV 캐시를 얼마나 공유하느냐에 달렸다 {stated}\n15. 파라미터가 작고 연산이 반복되면 가중치를 온칩 SRAM 에 상주시키는 구조(Groq LPU, Cerebras) 가 유리해진다. 엔비디아는 GTC 2026 에서 Groq 3 LPU 와 LPX 랙을 전면에 내세워 SRAM 헤비 옵션을 확보했다 {stated}\n16. 서빙의 진짜 쟁점은 스케줄링이다. 토큰마다 반복 횟수가 다르면 배치 안 토큰들이 제각각 종료돼 배치 정렬이 깨진다. 2026년 8월 Continuous Depth Batching 논문이 이 문제를 다루지만 아직 답이 없다. 글쓴이는 r 값을 몇 가지로 정규화해 체류 시간을 예측 가능하게 만드는 방법을 제안한다 {stated}\n17. 엔비디아 Rubin CPX(2025년 9월 발표된 프리필 전용 가속기) 는 GDDR7 전제가 램값 상승으로 무너져 로드맵에서 사라졌다가, 궈밍치 보도로 HBM4 168GB · Rubin 급 연산 · 2,300W · 별도 MGX ETL 랙으로 부활이 거론된다(공식 발표 아님) {low}\n18. 그것이 사실이라면 엔비디아가 프리필에 높은 우선순위를 두고 GDDR7 을 버렸다는 뜻이며, 에이전트 워크로드가 끝없이 컨텍스트를 물고 돌아 프리필 부하가 커진 상황에서 메모리 계층이 쉽게 가벼워지지 않는다는 판단으로 읽힌다 {low}\n19. 모델 크기가 멈추지는 않는다. 아스트라 자체가 사전학습 컴퓨트를 크게 늘렸고 프론티어가 10T 를 찍는 상황에서 대형 랙 수요 감소를 보기는 어렵다. 중심축이 이동하는 것이지 기존 축이 사라지는 것이 아니며, 복잡도의 축이 하나 더 느는 상황이다 {stated}\n등장 개념 · 엔티티\nbeyond-parameter-scaling — 상위 주제\ncot-monitorability-erosion — 루프 연산이 남기지 않는 사고사슬과 감시 약화\ninference-hardware-shift-recurrent-depth — 디코드의 compute-bound 이동과 서빙 스케줄링\nloop-transformer-latent-reasoning — 1편에서 정리한 계보\nhuman-oversight-erosion · agent-governance-guardrails — 감시가 약해질 때의 통제 문제\nproduct-gpt-6-astra · product-arc-agi-3 · org-nvidia · org-openai · org-anthropic\n우리에게 주는 함의\n우리 하네스가 사고사슬 텍스트에 의존해 이상을 감지하고 있다면 그 신뢰도가 모델 세대와 함께 떨어진다. 감시 지점을 실행 결과 · 도구 호출 · 권한 경계로 옮겨야 한다 [S-2026-09-15-004] [S-2026-09-09-002]\n벤치마크 수치는 하네스 설정에 따라 달라진다. 아스트라와 비교 모델의 평가 설정이 달랐다는 점은 우리가 벤치마크를 인용하거나 만들 때의 기준이 된다 [S-2026-09-15-004]\n추론 병목이 메모리에서 연산으로 옮겨가는 중이지만 프리필 부하는 반대로 커지고 있다. 인프라 판단을 한 방향으로 단정하지 않는 편이 안전하다 [S-2026-09-15-004]\n주요 인용\n루프 안에서 도는 계산은 토큰을 남기지 않는다. 그래서 사고사슬을 읽어서 모델을 감시하던 방법이 약해진다.\n다만 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다.\n그러니까 지금 무서운 건 현재 상태가 아니라 방향성이다.\n루프는 스케일의 대체재가 아니라 보완재로 쓰이고 있다.\n중심축이 이동하는 것이지 기존 축이 사라지는 것은 아니다. 복잡도의 축이 하나 더 느는 상황이 될 뿐이다.","title":"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동","topics":["beyond-parameter-scaling"],"type":"source","updated":"2026-09-15"},{"aliases":["maintenance"],"back":[],"cites":[],"confidence":"high","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e(없음) — 시스템 페이지. \u003ccode\u003e- [ ]\u003c/code\u003e 항목은 미처리, \u003ccode\u003e- [x]\u003c/code\u003e 는 처리됨. 승인은 항목 끝에 \u003ccode\u003e(승인)\u003c/code\u003e 을 붙인다.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e기계 린트 (scripts/lint.py)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eLLM 린트 (skills/lint)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e재정리 제안 (skills/reorganize)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e[ ] [warn] 병합 후보 — wiki/concepts/agent-governance-guardrails.md ↔ task-definition-bottleneck.md (sources Jaccard 0.75, 기계 린트 2026-09-09) → 소스는 겹치지만 개념(시스템 통제 vs 업무 정의) 이 다르므로 병합 비권장. 사람 확인 후 \u003ccode\u003e[x]\u003c/code\u003e
