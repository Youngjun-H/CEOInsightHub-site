e":"Anthropic","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-15"},{"aliases":["코그니션","Cognition AI","Cognition Labs"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","forward-deployed-engineer","model-routing-token-economics","org-crewon-ai","person-jeff-wang","product-devin","sovereign-ai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"AI 소프트웨어 엔지니어\" 개념을 내세운 미국 AI 코딩 기업. Devin 을 개발하고 2025년 Windsurf 의 사업 · 제품 · IP · 인력을 인수했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제프 왕에 따르면 OpenAI · Anthropic 은 상장 준비 중이고 Cursor 는 SpaceX 안에 있어, 코그니션이 유일하게 남은 독립 대형 비상장 AI 코딩 기업이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e매출의 상당 부분이 엔터프라이즈 장기 계약에서 나온다. 골드만삭스 · 씨티 등 대형 금융기관, 메르세데스 등 자동차 기업과 일한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e작업별 모델 라우팅과 평가 체계를 갖고 있으며, 내부 코드 작성의 90% 를 Devin 이 담당한다고 밝혔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e창업팀과 다수 엔지니어가 IOI 등 프로그래밍 올림피아드 출신이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e미국 연방정부 · EU 와 일한 경험이 있고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이다. 한국과는 구체 논의 전이지만 관심이 있으며, 고객 기반이 커지면 현지 팀 · 오피스도 검토한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2023년 창업했다. 자금 조달: 5월 260억 달러 기업가치로 10억 달러 이상 조달, 이후 400억 달러 이상으로 신규 라운드 논의 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e연환산 매출은 5월 기준 4억 9,200만 달러였고 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e, 8월 기준으로는 8억 달러를 넘어섰다는 보도가 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 시점이 다른 수치이므로 성장 곡선으로 읽어야 한다\u003c/li\u003e\n\u003cli\u003e2026년에 Windsurf 브랜드를 단계적으로 Devin 으로 통합했다. 클라우드 에이전트 · IDE · CLI · 코드리뷰를 한 플랫폼으로 묶는 방향이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e기업가치: 기사 도입부 \"약 460억 달러로 신규 투자 유치 중\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e / 같은 기사 해설 \"400억~450억 달러 수준으로 논의 중, 5월 시리즈 D 는 260억 달러\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 회사는 코멘트하지 않았다. 확정치 아님.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e · \u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — \"실행 환경을 판다\" 는 같은 논리의 한국 사례 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e · \u003ca href=\"#/person-jeff-wang\" class=\"wl\"\u003eperson-jeff-wang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e · \u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e · \u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ax-organizational-redesign\" class=\"wl\"\u003eax-organizational-redesign\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","ax-organizational-redesign","forward-deployed-engineer","model-routing-token-economics","org-crewon-ai","person-jeff-wang","product-devin"],"relpath":"wiki/entities/org-cognition.md","sources":["S-2026-09-08-002","S-2026-09-09-002","S-2026-09-09-010"],"status":"draft","stem":"org-cognition","summary":"AI 소프트웨어 엔지니어 Devin 개발사. Windsurf 인수 후 독립 대형 비상장 AI 코딩 기업. 엔터프라이즈 중심, 한국 금융 · 제조 진출 검토","system":false,"text":"정의\n\"AI 소프트웨어 엔지니어\" 개념을 내세운 미국 AI 코딩 기업. Devin 을 개발하고 2025년 Windsurf 의 사업 · 제품 · IP · 인력을 인수했다 [S-2026-09-08-002].\n근거 있는 사실\n제프 왕에 따르면 OpenAI · Anthropic 은 상장 준비 중이고 Cursor 는 SpaceX 안에 있어, 코그니션이 유일하게 남은 독립 대형 비상장 AI 코딩 기업이다 [S-2026-09-08-002]\n매출의 상당 부분이 엔터프라이즈 장기 계약에서 나온다. 골드만삭스 · 씨티 등 대형 금융기관, 메르세데스 등 자동차 기업과 일한다 [S-2026-09-08-002]\n작업별 모델 라우팅과 평가 체계를 갖고 있으며, 내부 코드 작성의 90% 를 Devin 이 담당한다고 밝혔다 [S-2026-09-08-002]\n창업팀과 다수 엔지니어가 IOI 등 프로그래밍 올림피아드 출신이다 [S-2026-09-08-002]\n미국 연방정부 · EU 와 일한 경험이 있고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이다. 한국과는 구체 논의 전이지만 관심이 있으며, 고객 기반이 커지면 현지 팀 · 오피스도 검토한다 [S-2026-09-08-002]\n2023년 창업했다. 자금 조달: 5월 260억 달러 기업가치로 10억 달러 이상 조달, 이후 400억 달러 이상으로 신규 라운드 논의 [S-2026-09-09-010]\n연환산 매출은 5월 기준 4억 9,200만 달러였고 [S-2026-09-09-010], 8월 기준으로는 8억 달러를 넘어섰다는 보도가 있다 [S-2026-09-08-002]. 시점이 다른 수치이므로 성장 곡선으로 읽어야 한다\n2026년에 Windsurf 브랜드를 단계적으로 Devin 으로 통합했다. 클라우드 에이전트 · IDE · CLI · 코드리뷰를 한 플랫폼으로 묶는 방향이다 [S-2026-09-08-002]\n모순 · 논쟁\n기업가치: 기사 도입부 \"약 460억 달러로 신규 투자 유치 중\" [S-2026-09-08-002] / 같은 기사 해설 \"400억~450억 달러 수준으로 논의 중, 5월 시리즈 D 는 260억 달러\" [S-2026-09-08-002]. 회사는 코멘트하지 않았다. 확정치 아님.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\norg-crewon-ai · ai-workforce-runtime — \"실행 환경을 판다\" 는 같은 논리의 한국 사례 [S-2026-09-09-002]\nproduct-devin · person-jeff-wang\nmodel-routing-token-economics · forward-deployed-engineer · ai-roi-human-equivalent-hours\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-010-cognition-interview-ax-view\nax-organizational-redesign","title":"Cognition (코그니션)","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-09"},{"aliases":["크루온AI","Crewon.ai","크루AI 워크","crewai.work","송호철"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","ai-agents-enterprise-adoption","ai-workforce-runtime","org-cognition"],"cites":["S-2026-09-09-002-crewon-ai-agent-runtime"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"AI 에이전트가 정말 직원처럼 일하려면 무엇이 필요할까\" 라는 질문에서 출발한 한국 스타트업. 대표 송호철은 더존비즈온 플랫폼사업부문 대표를 지냈다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제품: '크루AI 워크(crewai.work)' 사람 + AI 업무공간(메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재) 과 '크루온AI(Crewon.ai)' AI 크루를 만들고 운영하는 런타임 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e시연: 비서 · 회계 · 영업 · 법무 AI 가 조직도에 배치됨. 비서 AI 는 메일에서 회신 · 일정 · 할 일을 구분하고 번역 · 답장 초안 · 회의 시간 조율을 수행 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e방법론: 플레이북(업무 순서 · 승인 단계), '시맨틱 퍼스트 벡터 세컨드', 실제 결과 기준 완료 판정 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e사업: 초기 기업 · 공공 구축형, 법무 · 회계 · R\u0026amp;D 사업관리 '전문 AI 크루팩' 공급, 구독형 검토 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기사 게재 2026-09-03 (디지털데일리, 네이버) \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 기사 1건 기준. 고객 사례 · 매출 · 규모 정보 없음.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e — 같은 \"실행 환경을 판다\" 논리의 미국 사례\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-002-crewon-ai-agent-runtime","ai-agents-enterprise-adoption","ai-workforce-runtime","org-cognition"],"relpath":"wiki/entities/org-crewon-ai.md","sources":["S-2026-09-09-002"],"status":"draft","stem":"org-crewon-ai","summary":"전 더존비즈온 플랫폼사업부문 대표 송호철이 창업한 한국 기업. 크루AI 워크(업무공간) + 크루온AI(에이전트 런타임) 로 기업 · 공공 구축형 시장 진입","system":false,"text":"정의\n\"AI 에이전트가 정말 직원처럼 일하려면 무엇이 필요할까\" 라는 질문에서 출발한 한국 스타트업. 대표 송호철은 더존비즈온 플랫폼사업부문 대표를 지냈다 [S-2026-09-09-002].\n근거 있는 사실\n제품: '크루AI 워크(crewai.work)' 사람 + AI 업무공간(메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재) 과 '크루온AI(Crewon.ai)' AI 크루를 만들고 운영하는 런타임 [S-2026-09-09-002]\n시연: 비서 · 회계 · 영업 · 법무 AI 가 조직도에 배치됨. 비서 AI 는 메일에서 회신 · 일정 · 할 일을 구분하고 번역 · 답장 초안 · 회의 시간 조율을 수행 [S-2026-09-09-002]\n방법론: 플레이북(업무 순서 · 승인 단계), '시맨틱 퍼스트 벡터 세컨드', 실제 결과 기준 완료 판정 [S-2026-09-09-002]\n사업: 초기 기업 · 공공 구축형, 법무 · 회계 · R\u0026D 사업관리 '전문 AI 크루팩' 공급, 구독형 검토 [S-2026-09-09-002]\n기사 게재 2026-09-03 (디지털데일리, 네이버) [S-2026-09-09-002]\n모순 · 논쟁\n(없음) — 기사 1건 기준. 고객 사례 · 매출 · 규모 정보 없음.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-workforce-runtime\norg-cognition — 같은 \"실행 환경을 판다\" 논리의 미국 사례\nS-2026-09-09-002-crewon-ai-agent-runtime","title":"크루온AI (Crewon.ai) · 송호철","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-09"},{"aliases":["딥시크"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","_unsorted","distillation-defense-limits","knowledge-distillation","org-anthropic","org-startlux"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e중국의 AI 모델 개발사. 이 위키에서는 distillation 논쟁의 당사자이자 RLVR 사례로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 능력을 이전하려 했다고 주장했다 (Anthropic 측 주장) \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDeepSeek-R1-Zero 는 teacher reasoning trace 없이 RL(RLVR) 만으로 자기검증 · 되돌아가기 · 긴 추론을 만들어낼 수 있음을 보였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCAICT MCP 특별 테스트(2026-08-31 공표) 에서 1.6T DeepSeek-V4-Pro 가 종합 40.55% 로 1위, 284B DeepSeek-V4-Flash-0731 이 38.24% 였다. 27B StartLux 가 그 사이(39.25%) 에 들어왔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2025년 1월 R1 으로 사고사슬 학습 레시피를 공개해, o1-preview(2024-09) 이후 약 4개월 만에 '생각 블록/답변 블록' 분리 방식을 업계 주류로 만들었다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e복제 속도의 기준점으로 인용된다. OpenAI 가 뭔가를 하면 중국 랩이 몇 달 후 레시피를 공개하는데 R1 때는 4개월이었고, 이번 루프 계열은 Huginn · Ouro 같은 공개 연구가 이미 있어 더 빠를 수 있다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e미중 전략 분기 관점에서, 중국은 딥시크 · 큐웬 · 키미 · GLM · Hy 등 오픈소스 모델의 라우팅과 실행 궤적 환류라는 수평적 진화 전략을 택했다는 분석이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이(이동수) 는 중국 모델 발전 전체를 distillation 탓으로 돌리는 것은 위험하며, 자체 연구 · 시스템 최적화 · 데이터 구축 · RL 역량을 묻어서는 안 된다고 경고했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAnthropic 의 distillation 공격 주장 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e 은 한쪽 당사자의 주장이며, 같은 소스의 글쓴이는 distillation 만으로 frontier 모델이 만들어지지 않는다고 본다. DeepSeek 측 반박은 이 위키에 아직 없다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e — 벤치마크 비교 상대\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" class=\"wl\"\u003eS-2026-09-09-009-loop-transformer-after-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","distillation-defense-limits","knowledge-distillation","open-local-models","org-anthropic","org-startlux"],"relpath":"wiki/entities/org-deepseek.md","sources":["S-2026-09-08-004","S-2026-09-08-006","S-2026-09-09-008","S-2026-09-09-009","S-2026-09-15-001"],"status":"draft","stem":"org-deepseek","summary":"중국 AI 랩. R1-Zero 의 RLVR 추론 학습, Anthropic 의 distillation 공격 지목, V4 계열이 CAICT MCP 테스트 기준점으로 등장","system":false,"text":"정의\n중국의 AI 모델 개발사. 이 위키에서는 distillation 논쟁의 당사자이자 RLVR 사례로 등장한다 [S-2026-09-08-004].\n근거 있는 사실\nAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 능력을 이전하려 했다고 주장했다 (Anthropic 측 주장) [S-2026-09-08-004]\nDeepSeek-R1-Zero 는 teacher reasoning trace 없이 RL(RLVR) 만으로 자기검증 · 되돌아가기 · 긴 추론을 만들어낼 수 있음을 보였다 [S-2026-09-08-004]\nCAICT MCP 특별 테스트(2026-08-31 공표) 에서 1.6T DeepSeek-V4-Pro 가 종합 40.55% 로 1위, 284B DeepSeek-V4-Flash-0731 이 38.24% 였다. 27B StartLux 가 그 사이(39.25%) 에 들어왔다 [S-2026-09-08-006]\n2025년 1월 R1 으로 사고사슬 학습 레시피를 공개해, o1-preview(2024-09) 이후 약 4개월 만에 '생각 블록/답변 블록' 분리 방식을 업계 주류로 만들었다 [S-2026-09-09-009]\n복제 속도의 기준점으로 인용된다. OpenAI 가 뭔가를 하면 중국 랩이 몇 달 후 레시피를 공개하는데 R1 때는 4개월이었고, 이번 루프 계열은 Huginn · Ouro 같은 공개 연구가 이미 있어 더 빠를 수 있다 {low} [S-2026-09-15-001]\n미중 전략 분기 관점에서, 중국은 딥시크 · 큐웬 · 키미 · GLM · Hy 등 오픈소스 모델의 라우팅과 실행 궤적 환류라는 수평적 진화 전략을 택했다는 분석이 있다 [S-2026-09-09-008]\n글쓴이(이동수) 는 중국 모델 발전 전체를 distillation 탓으로 돌리는 것은 위험하며, 자체 연구 · 시스템 최적화 · 데이터 구축 · RL 역량을 묻어서는 안 된다고 경고했다 [S-2026-09-08-004]\n모순 · 논쟁\nAnthropic 의 distillation 공격 주장 [S-2026-09-08-004] 은 한쪽 당사자의 주장이며, 같은 소스의 글쓴이는 distillation 만으로 frontier 모델이 만들어지지 않는다고 본다. DeepSeek 측 반박은 이 위키에 아직 없다.\n관련 페이지\nopen-local-models — 상위 주제\norg-startlux — 벤치마크 비교 상대\norg-anthropic\nknowledge-distillation · distillation-defense-limits\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-008-neohorse-agent-native-model\nS-2026-09-09-009-loop-transformer-after-astra\nS-2026-09-15-001-google-cadence-and-what-to-do","title":"DeepSeek (딥시크)","topics":["open-local-models"],"type":"entity","updated":"2026-09-15"},{"aliases":["딥마인드","DeepMind","구글 딥마인드"],"back":["S-2026-09-15-001-google-cadence-and-what-to-do","_unsorted","beyond-parameter-scaling","person-demis-hassabis","product-gemini"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-15","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e구글의 AI 연구 · 모델 조직. 이 위키에서는 Gemini 출시 주기와 에이전트 전략, 리더십 변화로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGemini Flash 출시 간격은 정확히 3주다. 3.6 Flash 2026-07-21, 3.7 Flash 2026-08-13, 3.8 Flash 2026-09-02. 3.8 은 3.7 위에서 재학습한 이터레이션이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e프로 모델은 여름 전 출시 예고에도 아직 포스트 트레이닝 중이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e비판을 알면서도 Flash 에 집중하는 이유는 에이전트 올인이다. 억 단위 에이전트가 동시에 돌 때 백엔드가 감당할 크기를 타깃으로 라인업을 잡는다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026년 8월 초 데미스 하사비스가 CEO 에서 물러나 회장이 되고 코라이 카부크추올루가 승계했다. 같은 시기 제프 딘과 산제이가 창업했다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e상장사인 구글과 상장을 앞둔 Anthropic · OpenAI 는 목적 함수가 다르다는 것이 글쓴이의 관점이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e후속 보도에 따르면 Google DeepMind 도 recurrent depth 기술을 검토 중이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eGoogle DeepMind 의 Generalized Knowledge Distillation 은 on-policy distillation 을 정식화한 연구다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/person-demis-hassabis\" class=\"wl\"\u003eperson-demis-hassabis\u003c/a\u003e · \u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e · \u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","loop-transformer-latent-reasoning","on-policy-distillation","person-demis-hassabis","product-gemini"],"relpath":"wiki/entities/org-google-deepmin  2.0 으로 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e라인업이 추론 · 코딩 · 수학 · 에이전트 작업 전반에서 규모별 최고 수준이라고 자체 평가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-k2-horizon\" class=\"wl\"\u003eproduct-k2-horizon\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/fully-open-source-model\" class=\"wl\"\u003efully-open-source-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" class=\"wl\"\u003eS-2026-09-08-005-uae-k2-horizon-open-source\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-005-uae-k2-horizon-open-source","fully-open-source-model","open-local-models","product-k2-horizon"],"relpath":"wiki/entities/org-mbzuai.md","sources":["S-2026-09-08-005"],"status":"draft","stem":"org-mbzuai","summary":"아부다비의 AI 전문 대학. 산하 기초 모델 연구소(IFM) 가 완전 오픈소스 파운데이션 모델 K2 Horizon 을 공개","system":false,"text":"정의\nUAE 아부다비의 모하메드 빈 자예드 인공지능대학교. 산하 기초 모델 연구소(IFM) 가 K2 Horizon 의 발표 주체다 [S-2026-09-08-005].\n근거 있는 사실\nIFM 은 K2 Horizon 6종을 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 Apache 2.0 으로 공개했다 [S-2026-09-08-005]\n라인업이 추론 · 코딩 · 수학 · 에이전트 작업 전반에서 규모별 최고 수준이라고 자체 평가했다 [S-2026-09-08-005]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nproduct-k2-horizon\nfully-open-source-model\nS-2026-09-08-005-uae-k2-horizon-open-source","title":"MBZUAI (모하메드 빈 자예드 인공지능대학교) · IFM","topics":["open-local-models"],"type":"entity","updated":"2026-09-08"},{"aliases":["엔비디아","Nvidia","Rubin CPX","Groq LPU"],"back":["S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","inference-hardware-shift-recurrent-depth"],"cites":["S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"low","created":"2026-09-15","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAI 가속기 공급자. 이 위키에서는 루프 구조가 만드는 추론 병목 이동에 대한 하드웨어 대응 사례로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGTC 2026 에서 Groq 3 LPU 와 LPX 랙을 전면에 내세워 온칩 SRAM 중심 옵션을 확보했다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eRubin CPX 는 2025년 9월 AI 인프라 서밋에서 발표된 프리필 전용 가속기로, \"프리필은 compute-bound 라 대역폭이 덜 중요하니 HBM 대신 GDDR7 128GB 로 충분하다\" 는 설계 근거였다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e램값 상승으로 GDDR7 의 가격 이점이 사라졌고, 2026년 3월 GTC 로드맵에서 사라졌다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e궈밍치는 Rubin CPX 부활을 보도했다. HBM4 168GB · Rubin 급 연산 · 2,300W · 별도 MGX ETL 랙 구성이며, 애널리스트 리포트이고 엔비디아 공식 발표는 아니다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e그것이 사실이라면 엔비디아가 프리필에 높은 우선순위를 두고 GDDR7 을 버렸다는 뜻으로 읽힌다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e부활안 자체가 미확인 보도다. 공식 발표 전까지 확정 사실로 인용하지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/inference-hardware-shift-recurrent-depth\" class=\"wl\"\u003einference-hardware-shift-recurrent-depth\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","inference-hardware-shift-recurrent-depth"],"relpath":"wiki/entities/org-nvidia.md","sources":["S-2026-09-15-004"],"status":"draft","stem":"org-nvidia","summary":"GPU · AI 가속기 기업. GTC 2026 에서 Groq 3 LPU 와 LPX 랙으로 SRAM 헤비 옵션 확보, 프리필 전용 Rubin CPX 는 HBM4 로 부활 거론","system":false,"text":"정의\nAI 가속기 공급자. 이 위키에서는 루프 구조가 만드는 추론 병목 이동에 대한 하드웨어 대응 사례로 등장한다 [S-2026-09-15-004].\n근거 있는 사실\nGTC 2026 에서 Groq 3 LPU 와 LPX 랙을 전면에 내세워 온칩 SRAM 중심 옵션을 확보했다 [S-2026-09-15-004]\nRubin CPX 는 2025년 9월 AI 인프라 서밋에서 발표된 프리필 전용 가속기로, \"프리필은 compute-bound 라 대역폭이 덜 중요하니 HBM 대신 GDDR7 128GB 로 충분하다\" 는 설계 근거였다 [S-2026-09-15-004]\n램값 상승으로 GDDR7 의 가격 이점이 사라졌고, 2026년 3월 GTC 로드맵에서 사라졌다 [S-2026-09-15-004]\n궈밍치는 Rubin CPX 부활을 보도했다. HBM4 168GB · Rubin 급 연산 · 2,300W · 별도 MGX ETL 랙 구성이며, 애널리스트 리포트이고 엔비디아 공식 발표는 아니다 {low} [S-2026-09-15-004]\n그것이 사실이라면 엔비디아가 프리필에 높은 우선순위를 두고 GDDR7 을 버렸다는 뜻으로 읽힌다 [S-2026-09-15-004]\n모순 · 논쟁\n부활안 자체가 미확인 보도다. 공식 발표 전까지 확정 사실로 인용하지 않는다 [S-2026-09-15-004]\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\ninference-hardware-shift-recurrent-depth\nS-2026-09-15-004-astra-verified-and-hardware-shift","title":"NVIDIA (엔비디아)","topics":["beyond-parameter-scaling"],"type":"entity","updated":"2026-09-15"},{"aliases":["오픈AI","오픈에이아이"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","ai-agents-enterprise-adoption","org-anthropic","org-tencent","product-gpt-6-astra"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eGPT 모델을 만드는 미국 AI 랩. 코딩 도구 시장에서는 자사 모델에 묶인 도구를 가진 \"랩\" 측 사례로 언급된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제프 왕에 따르면 2026년 8월 시점 상장을 준비 중이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2025년 7월 Windsurf 를 약 30억 달러에 인수하려던 논의가 무산됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-03 GPT-6 Astra 를 공개했다(Trusted Access Program 기업 우선, API · 구독 티어에 순차 제공). API 가격은 GPT-5.6 Sol 의 2.5배이며, 모델 티어로 Luna · Terra · Sol · Astra 가 언급된다. Preparedness Framework 에서 처음으로 Critical 사이버보안 등급을 매겼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eGPT-6 Astra 를 공개했다. 웹 서핑 · 문서 작업 · 코드 작성 및 실행 · 소프트웨어 사용 · 프레젠테이션 제작 등 도구를 활용한 복잡한 작업을 수행한다고 소개됐다 (페이스북 글의 전언) \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e아스트라 발표에서 성능 요인으로 recurrent depth 와 크게 늘린 사전학습 컴퓨트(GB200 10만 장) 를 함께 들었다. 수석과학자 야쿱 파초츠키는 읽을 수 있는 사고사슬에 대한 약속을 재확인하며 루프 사용 범위를 제한했다고 밝혔다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e상장을 앞둔 회사로 분류되며, 이미 상장한 구글과는 목적 함수가 다르다는 관점이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArena 코딩 리더보드에서 GPT-5.6 Sol xhigh 가 1609 Elo 로 9위까지 내려왔고, 랩 순위에서 OpenAI 가 6위까지 내려왔다는 분석이 있다 (리더보드 스냅샷 전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCursor 가 SpaceX 에 인수된 뒤 OpenAI 가 Cursor 이용을 재검토하겠다는 보도가 있었다 — 도구 독립성의 중요성을 보여주는 사례로 인용됨 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","ai-agents-enterprise-adoption","model-routing-token-economics","org-anthropic","product-gpt-6-astra"],"relpath":"wiki/entities/org-openai.md","sources":["S-2026-09-08-002","S-2026-09-08-003","S-2026-09-09-004","S-2026-09-09-005","S-2026-09-15-004","S-2026-09-15-001"],"status":"draft","stem":"org-openai","summary":"미국 AI 랩. GPT 계열 모델과 Codex 개발. 이 위키에서는 상장 준비, Windsurf 인수 무산, 모델 종속 도구의 사례로 등장","system":false,"text":"정의\nGPT 모델을 만드는 미국 AI 랩. 코딩 도구 시장에서는 자사 모델에 묶인 도구를 가진 \"랩\" 측 사례로 언급된다 [S-2026-09-08-002].\n근거 있는 사실\n제프 왕에 따르면 2026년 8월 시점 상장을 준비 중이다 [S-2026-09-08-002]\n2025년 7월 Windsurf 를 약 30억 달러에 인수하려던 논의가 무산됐다 [S-2026-09-08-002]\n2026-09-03 GPT-6 Astra 를 공개했다(Trusted Access Program 기업 우선, API · 구독 티어에 순차 제공). API 가격은 GPT-5.6 Sol 의 2.5배이며, 모델 티어로 Luna · Terra · Sol · Astra 가 언급된다. Preparedness Framework 에서 처음으로 Critical 사이버보안 등급을 매겼다 [S-2026-09-09-004]\nGPT-6 Astra 를 공개했다. 웹 서핑 · 문서 작업 · 코드 작성 및 실행 · 소프트웨어 사용 · 프레젠테이션 제작 등 도구를 활용한 복잡한 작업을 수행한다고 소개됐다 (페이스북 글의 전언) [S-2026-09-08-003]\n아스트라 발표에서 성능 요인으로 recurrent depth 와 크게 늘린 사전학습 컴퓨트(GB200 10만 장) 를 함께 들었다. 수석과학자 야쿱 파초츠키는 읽을 수 있는 사고사슬에 대한 약속을 재확인하며 루프 사용 범위를 제한했다고 밝혔다 [S-2026-09-15-004]\n상장을 앞둔 회사로 분류되며, 이미 상장한 구글과는 목적 함수가 다르다는 관점이 있다 [S-2026-09-15-001]\nArena 코딩 리더보드에서 GPT-5.6 Sol xhigh 가 1609 Elo 로 9위까지 내려왔고, 랩 순위에서 OpenAI 가 6위까지 내려왔다는 분석이 있다 (리더보드 스냅샷 전언) [S-2026-09-09-005]\nCursor 가 SpaceX 에 인수된 뒤 OpenAI 가 Cursor 이용을 재검토하겠다는 보도가 있었다 — 도구 독립성의 중요성을 보여주는 사례로 인용됨 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\norg-anthropic\nproduct-gpt-6-astra\nmodel-routing-token-economics\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-005-arena-coding-leaderboard-shift\nS-2026-09-15-004-astra-verified-and-hardware-shift\nS-2026-09-15-001-google-cadence-and-what-to-do","title":"OpenAI","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-15"},{"aliases":["쇼피파이","Tobi Lütke","토비 뤼트케"],"back":["S-2026-09-09-003-shopify-small-model-beats-sol","model-routing-token-economics","open-local-models","product-qwen","product-tangle","small-model-self-improvement-loop"],"cites":["S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e커머스 플랫폼 기업. 이 위키에서는 소형 전용 모델의 자기개선 루프 사례로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eQwen3.5-0.8B 를 특정 업무에 맞게 미세조정해 그 작업에서 GPT-5.6 Sol 을 이겼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e방식은 실제 업무 결과 평가 → 실패 데이터 재학습의 반복이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCEO Tobi Lütke 는 이런 학습 구조가 있으면 작은 모델이 특정 업무에서 대형 모델보다 나을 수 있다고 설명했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e학습 파이프라인 기반 기술 Tangle 을 오픈소스로 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 원문 발표 미확보, SNS 요약 1건 기준.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-003-shopify-small-model-beats-sol","open-local-models","product-qwen","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/entities/org-shopify.md","sources":["S-2026-09-09-003"],"status":"draft","stem":"org-shopify","summary":"캐나다 커머스 플랫폼. CEO Tobi Lütke. 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이겼다고 발표, 기반 기술 Tangle 오픈소스 공개","system":false,"text":"정의\n커머스 플랫폼 기업. 이 위키에서는 소형 전용 모델의 자기개선 루프 사례로 등장한다 [S-2026-09-09-003].\n근거 있는 사실\nQwen3.5-0.8B 를 특정 업무에 맞게 미세조정해 그 작업에서 GPT-5.6 Sol 을 이겼다 [S-2026-09-09-003]\n방식은 실제 업무 결과 평가 → 실패 데이터 재학습의 반복이다 [S-2026-09-09-003]\nCEO Tobi Lütke 는 이런 학습 구조가 있으면 작은 모델이 특정 업무에서 대형 모델보다 나을 수 있다고 설명했다 [S-2026-09-09-003]\n학습 파이프라인 기반 기술 Tangle 을 오픈소스로 공개했다 [S-2026-09-09-003]\n모순 · 논쟁\n(없음) — 원문 발표 미확보, SNS 요약 1건 기준.\n관련 페이지\nopen-local-models — 상위 주제\nsmall-model-self-improvement-loop\nproduct-tangle · product-qwen\nS-2026-09-09-003-shopify-small-model-beats-sol","title":"Shopify","topics":["open-local-models"],"type":"entity","updated":"2026-09-09"},{"aliases":["스타트럭스","StartLux-V1.0-27B-Preview"],"back":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","open-local-models","org-deepseek","person-chen-danian","post-training-agent-capability","product-qwen","sovereign-ai"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"로컬 모델\" 을 철학으로 내세운 중국 AI 회사. 첫 모델 StartLux-V1.0-27B-Preview 를 8월 말 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCAICT 인공지능연구소의 신뢰 AI 대모형 MCP 특별 테스트(8월 3일 시작, 3회 완주 평균, 8월 31일 공표) 에서 종합 39.25% 로 2위. 284B DeepSeek-V4-Flash-0731(38.24%), 198B Step-3.7-Flash 를 앞섰고 1.6T DeepSeek-V4-Pro(40.55%) 에 1.3%p 차. 위치 네비게이션 단독 1위, 금융 분석 · 브라우저 자동화 공동 1위 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델은 Alibaba Qwen3.6-27B 기반 후훈련. 같은 27B 원본보다 5.34%p 높다. \"오토 리서치\" 로 후훈련한 중국 최초 로컬 에이전트 모델이라고 회사가 주장 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e창업팀: 창업자 천다녠(제품), CTO 궈취안웨이(로컬 배포 · 에이전트 · 프라이버시 보호 ML 연구), 뤄융샹(전 모건스탠리 아시아 총괄) \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e올해 안에 팔려는 것은 가중치 파일이 아니라 양자화 · 추론 프레임워크를 몰라도 오피스 설치하듯 끝나는 로컬 지능 솔루션이며, 정부 규제 통과 프레임까지 설계했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e회사 시연(회사 측 자료): 금융 분석에서 Claude Sonnet 4.6 은 비거래일 오판으로 47,254달러(89.02%), StartLux 는 47,499.09달러(90.00%); 브라우저 자동화에서 Claude 200초+ · 21단계 · 556달러 vs StartLux 95초 · 12단계 · 299달러 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e홈페이지 https://startlux.com \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e벤치마크 순위는 CAICT 공표치이나 시연 비교는 회사 자료다. 독립 재현은 이 위키에 없다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/person-chen-danian\" class=\"wl\"\u003eperson-chen-danian\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e · \u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e — base 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e — 비교 대상\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","open-local-models","org-deepseek","person-chen-danian","post-training-agent-capability","product-qwen"],"relpath":"wiki/entities/org-startlux.md","sources":["S-2026- ","org-openai","product-qwen"],"relpath":"wiki/entities/org-tencent.md","sources":["S-2026-09-09-005"],"status":"draft","stem":"org-tencent","summary":"중국 빅테크. 코딩 모델 Hy4 가 Arena 코딩 리더보드 1631 Elo 를 약 2.50달러 가격에 기록해 성능 · 가격 경쟁 변화의 사례로 등장","system":false,"text":"정의\n중국 빅테크. 이 위키에서는 코딩 모델 Hy4 의 리더보드 성적으로 등장한다 [S-2026-09-09-005].\n근거 있는 사실\nHy4 는 Arena 코딩(webdev) 리더보드에서 1631 Elo 를 기록했고 가격은 약 2.50달러 수준이다. Grok 4.6 과 비슷한 성능권이지만 가격은 훨씬 낮다 [S-2026-09-09-005]\n모순 · 논쟁\n리더보드 스냅샷의 전언 1건이며 날짜 · 가격 단위(토큰당인지 작업당인지) 가 명시되지 않았다 {low} [S-2026-09-09-005]\n관련 페이지\nopen-local-models — 상위 주제\nmodel-routing-token-economics — 가격 대비 성능\nproduct-qwen · org-openai\nS-2026-09-09-005-arena-coding-leaderboard-shift","title":"Tencent (텐센트) · Hy4","topics":["open-local-models"],"type":"entity","updated":"2026-09-09"},{"aliases":["TokenRhythm","기원율동","tokenrhythm.studio"],"back":["S-2026-09-09-008-neohorse-agent-native-model","agent-native-model","beyond-parameter-scaling","person-wang-yunhe","product-neohorse","routing-harness"],"cites":["S-2026-09-09-008-neohorse-agent-native-model"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e라우팅 하네스를 핵심 전략으로 삼고 그 실행 궤적으로 모델을 훈련하는 중국 AI 스타트업 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e창업자는 전 화웨이 노아방주 연구소장이자 판구 대형모델 총책임자였던 왕윈허 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e출범 4개월 만에 엔젤 투자 단계에서 1억 달러 기업가치를 인정받았고, 이후 누적 사용자 5만 4천 명 · 일일 토큰 호출량 5,000억을 돌파했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eNeoHorse-1 개발 과정을 '재귀적 자기 개선(RSI) 을 향한 단일 루프의 엔지니어링 검증' 으로 규정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e'All Model, One Mind' 를 지향으로 내세운다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e공개 자료: tokenrhythm.studio, NeoHorse GitHub, Hugging Face 컬렉션 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e빅테크가 자체 라우팅 · 에이전트 기술을 고도화하면 중립적 중개자의 생존 공간이 도전받는다는 것이 글쓴이의 지적이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e · \u003ca href=\"#/agent-native-model\" class=\"wl\"\u003eagent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-neohorse\" class=\"wl\"\u003eproduct-neohorse\u003c/a\u003e · \u003ca href=\"#/person-wang-yunhe\" class=\"wl\"\u003eperson-wang-yunhe\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse- do","title":"World Labs (페이페이 리)","topics":[],"type":"entity","updated":"2026-09-15"},{"aliases":["Karpathy","안드레이 카파시","카파시"],"back":["S-2026-09-08-001-karpathy-llm-wiki","knowledge-base-compilation","llm-wiki-pattern"],"cites":["S-2026-09-08-001-karpathy-llm-wiki"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAI 연구자. 이 위키에서는 LLM Wiki 패턴의 제안자로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eLLM Wiki 패턴을 \"아이디어 파일\" 형태의 gist 로 공개했고, 자신의 LLM 에이전트에 붙여 넣어 구체화하라고 권한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e본인은 LLM 에이전트와 Obsidian 을 나란히 띄워 놓고, 소스를 한 번에 하나씩 관여하며 인제스트하는 방식을 쓴다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","knowledge-base-compilation","llm-wiki-pattern"],"relpath":"wiki/entities/person-andrej-karpathy.md","sources":["S-2026-09-08-001"],"status":"draft","stem":"person-andrej-karpathy","summary":"AI 연구자. LLM Wiki 패턴을 gist 로 제안한 저자","system":false,"text":"정의\nAI 연구자. 이 위키에서는 LLM Wiki 패턴의 제안자로 등장한다 [S-2026-09-08-001].\n근거 있는 사실\nLLM Wiki 패턴을 \"아이디어 파일\" 형태의 gist 로 공개했고, 자신의 LLM 에이전트에 붙여 넣어 구체화하라고 권한다 [S-2026-09-08-001]\n본인은 LLM 에이전트와 Obsidian 을 나란히 띄워 놓고, 소스를 한 번에 하나씩 관여하며 인제스트하는 방식을 쓴다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-base-compilation — 상위 주제\nllm-wiki-pattern\nS-2026-09-08-001-karpathy-llm-wiki","title":"Andrej Karpathy","topics":["knowledge-base-compilation"],"type":"entity","updated":"2026-09-08"},{"aliases":["Danny Chen","陈大年","천대년"],"back":["S-2026-09-08-006-local-agent-models-startlux","open-local-models","org-startlux"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e중국 인터넷 역사에서 \"1세대 프로그래머 대부\" 로 불리는 인물. StartLux 창업자 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e1999년 형 천톈차오와 샨다네트워크를 공동 창업했고 중국에 공유 소프트웨어 개념을 처음 도입했다. 2004년 샨다 나스닥 상장 때 26세. 이후 롄상네트워크를 세워 9억 사용자의 WiFi만능열쇠를 키웠다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e샨다에서는 이사 겸 부총재(후에 COO) 로 기술 · 제품을 맡았고, 미르의전설2 대리권 확보와 액토즈 인수는 형 천톈차오가 주도했다. 2017년 이후 셩취의 국부 유출 논란은 천씨 형제가 2014~2015년 샨다게임즈를 매각하고 떠난 뒤의 일이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성다혁신원 18주년 행사에서 로컬 모델이 클라우드 시장을 무너뜨리고 3년 안에 Claude 와 대등해지며 시장 80% 를 점유할 것이라 예측했다. \"스케일링 법칙은 지나가는 신선(過路神仙) 이다\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이는 샨다가 보여준 것이 \"기술보다 시장 흐름을 남보다 빨리 읽는 능력\" 이었고, 같은 인물이 로컬 모델이라는 다음 시장을 먼저 읽고 있다고 경고한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","open-local-models","org-startlux"],"relpath":"wiki/entities/person-chen-danian.md","sources":["S-2026-09-08-006"],"status":"draft","stem":"person-chen-danian","summary":"중국 1세대 프로그래머. 샨다 공동창업(1999), WiFi만능열쇠(롄상네트워크) 창업. 은퇴 10년 만에 StartLux 창립, '스케일링 법칙은 지나가는 신선' 이라며 로컬 모델 주창","system":false,"text":"정의\n중국 인터넷 역사에서 \"1세대 프로그래머 대부\" 로 불리는 인물. StartLux 창업자 [S-2026-09-08-006].\n근거 있는 사실\n1999년 형 천톈차오와 샨다네트워크를 공동 창업했고 중국에 공유 소프트웨어 개념을 처음 도입했다. 2004년 샨다 나스닥 상장 때 26세. 이후 롄상네트워크를 세워 9억 사용자의 WiFi만능열쇠를 키웠다 [S-2026-09-08-006]\n샨다에서는 이사 겸 부총재(후에 COO) 로 기술 · 제품을 맡았고, 미르의전설2 대리권 확보와 액토즈 인수는 형 천톈차오가 주도했다. 2017년 이후 셩취의 국부 유출 논란은 천씨 형제가 2014~2015년 샨다게임즈를 매각하고 떠난 뒤의 일이다 [S-2026-09-08-006]\n성다혁신원 18주년 행사에서 로컬 모델이 클라우드 시장을 무너뜨리고 3년 안에 Claude 와 대등해지며 시장 80% 를 점유할 것이라 예측했다. \"스케일링 법칙은 지나가는 신선(過路神仙) 이다\" [S-2026-09-08-006]\n글쓴이는 샨다가 보여준 것이 \"기술보다 시장 흐름을 남보다 빨리 읽는 능력\" 이었고, 같은 인물이 로컬 모델이라는 다음 시장을 먼저 읽고 있다고 경고한다 [S-2026-09-08-006]\n모순 · 논쟁\n(없음) 003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-15-001-google-cadence-and-what-to-do","org-google-deepmind"],"relpath":"wiki/entities/person-demis-hassabis.md","sources":["S-2026-09-15-001"],"status":"draft","stem":"person-demis-hassabis","summary":"DeepMind 공동창업자. AGI 를 2030년 전후로 봐 왔고, 2026년 8월 CEO 에서 물러나 회장이 됐다","system":false,"text":"정의\nGoogle DeepMind 를 이끌어 온 인물. 노벨상 수상자이기도 하다 [S-2026-09-15-001].\n근거 있는 사실\nAGI 시점을 \"2030년 전후\" 로 봐 왔다 [S-2026-09-15-001]\n2026년 8월 초 DeepMind CEO 에서 물러나 회장이 됐고 코라이 카부크추올루가 역할을 승계했다 [S-2026-09-15-001]\n글쓴이의 관찰: 벤치마크를 보며 시점을 앞당길 만한 사람이 CEO 자리에서 떠나 다른 방향을 보고 있다는 점이 흥미롭다 [S-2026-09-15-001]\n모순 · 논쟁\n(없음)\n관련 페이지\norg-google-deepmind\nS-2026-09-15-001-google-cadence-and-what-to-do","title":"데미스 하사비스 (Demis Hassabis)","topics":[],"type":"entity","updated":"2026-09-15"},{"aliases":["제프 왕","Jeff Wang"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","org-cognition"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eCognition 의 President of New Enterprise. 전 Windsurf CEO 이며 Codeium 시절부터 사업을 이끌었다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2025년 7월 Windsurf 의 OpenAI 인수 논의가 무산되고 창업자 · 연구진이 Google DeepMind 로 이동한 뒤 CEO 를 맡았고, 며칠 뒤 코그니션이 남은 사업을 인수했다. \"지난 72시간은 내 커리어에서 가장 극적인 롤러코스터\" 라고 직원들에게 말했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e인터뷰는 샌프란시스코에서 진행됐고 기자 후기가 별도로 공개됐다 \u003ca class=\"cite\" href wiki/entities/person-wang-yunhe.md","sources":["S-2026-09-09-008"],"status":"draft","stem":"person-wang-yunhe","summary":"전 화웨이 노아방주 연구소장이자 판구 대형모델 총책임자. 토큰리듬 창업자 겸 CEO","system":false,"text":"정의\n토큰리듬 창업자. 화웨이에서 노아방주 연구소장과 판구 대형모델 총책임자를 지냈다 [S-2026-09-09-008].\n근거 있는 사실\n창업한 토큰리듬은 출범 4개월 만에 엔젤 단계에서 1억 달러 기업가치를 인정받았다 [S-2026-09-09-008]\n모순 · 논쟁\n(없음)\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\norg-tokenrhythm\nS-2026-09-09-008-neohorse-agent-native-model","title":"왕윈허 (王云鹤)","topics":["beyond-parameter-scaling"],"type":"entity","updated":"2026-09-09"},{"aliases":["post-training","사후훈련","후훈련","에이전트 특화 후훈련"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model","agent-native-model","ai-agents-enterprise-adoption","beyond-parameter-scaling","local-model-24gb-boundary","open-local-models","org-startlux","rlvr-domain-expansion","skill-evolution-persistent-wiki","small-model-self-improvement-loop","sovereign-ai"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델이 배워야 할 것이 최종 텍스트가 아니라 \"언제 어떤 도구를 부를지, 오류가 오면 어떻게 조정할지, 어떤 조건에서 완료를 선언할지\" 라면, 그 능력은 사전학습이 아니라 사후훈련 층에서 만들어진다는 관찰 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eStartLux-V1.0-27B-Preview 는 Qwen3.6-27B 에 후훈련만 얹었고 같은 27B 원본보다 CAICT MCP 테스트에서 5.34%p 높았다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e훈련 데이터는 과제 이해 · 도구 선택 · 파라미터 구성 · 다단계 실행 · 상태 점검 · 결과 검증을 집중 강화했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"오토 리서치\": 모델이 실제 도구 환경에서 스스로 과제를 수행하고 환경 피드백으로 전략을 조정하는, AI 가 AI 를 훈련시키는 방법론. 회사는 이 방식으로 후훈련한 중국 최초의 로컬 에이전트 모델이라고 주장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e결론: 파라미터를 늘리지 않고 점수가 5%p 넘게 움직였으므로 에이전트 능력의 상당 부분이 후훈련 층에 있고, 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e한국은 온디바이스 하드웨어(메모리 · NPU) 에 강하지만 증명된 층은 하드웨어가 아니라 후훈련이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e서구 대기업 사례: Shopify 는 0.8B Qwen 을 실제 업무 결과 평가 → 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼다. 크기가 아니라 업무별 학습 루프가 성능을 만든다는 같은 결론이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e세 번째 경로: 토큰리듬 NeoHorse-1-4B 는 라우팅 하네스가 만든 에이전트 실행 궤적을 학습해 11개 에이전트 벤치마크 중 5개에서 두 배 이상 큰 기초 모델을 능가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e또 다른 경로: 구글 WikiSkill 은 학습이 아니라 재사용 가능한 '스킬' 축적으로 같은 결과를 냈다. 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 능가했고, 스킬은 모델 계열을 넘어 전이됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실물 경제가 원하는 것은 만능 제너럴리스트가 아니라 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e후훈련만으로 효과를 내려면 강한 base model 이 전제라는 점은 distillation 논의와 일치한다: 약한 baseline 에서는 외부 신호를 아무리 모아도 frontier 가 되지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e. 보완 관계.\u003c/li\u003e\n\u003cli\u003eStartLux 의 Claude Sonnet 4.6 대비 시연 결과는 회사 측 자료다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e · \u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-native-model\" class=\"wl\"\u003eagent-native-model\u003c/a\u003e — 실행 궤적 학습 경로\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — Shopify 의 운영 루프\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e — 스킬 축적 경로\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — 후훈련 신호의 출처 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 완료 조건 정의는 훈련 데이터에서도 핵심\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" class=\"wl\"\u003eS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model","agent-native-model","beyond-parameter-scaling","knowledge-distillation","local-model-24gb-boundary","on-policy-distillation","open-local-models","org-startlux","product-qwen","skill-evolution-persistent-wiki","small-model-self-improvement-loop","task-definition-bottleneck"],"relpath":"wiki/concepts/post-training-agent-capability.md","sources":["S-2026-09-08-006","S-2026-09-09-003","S-2026-09-09-006","S-2026-09-09-008"],"status":"draft","stem":"post-training-agent-capability","summary":"같은 27B base 에 도구 선택 · 다단계 실행 · 검증 중심 후훈련만 얹어 5%p 이상 오른 사례로, 에이전트 능력의 상당 부분이 사전학습이 아닌 후훈련에 있고 파운데이션 모델 없는 회사도 만들 수 있다는 주장","system":false,"text":"정의\n모델이 배워야 할 것이 최종 텍스트가 아니라 \"언제 어떤 도구를 부를지, 오류가 오면 어떻게 조정할지, 어떤 조건에서 완료를 선언할지\" 라면, 그 능력은 사전학습이 아니라 사후훈련 층에서 만들어진다는 관찰 [S-2026-09-08-006].\n근거 있는 사실\nStartLux-V1.0-27B-Preview 는 Qwen3.6-27B 에 후훈련만 얹었고 같은 27B 원본보다 CAICT MCP 테스트에서 5.34%p 높았다 [S-2026-09-08-006]\n훈련 데이터는 과제 이해 · 도구 선택 · 파라미터 구성 · 다단계 실행 · 상태 점검 · 결과 검증을 집중 강화했다 [S-2026-09-08-006]\n\"오토 리서치\": 모델이 실제 도구 환경에서 스스로 과제를 수행하고 환경 피드백으로 전략을 조정하는, AI 가 AI 를 훈련시키는 방법론. 회사는 이 방식으로 후훈련한 중국 최초의 로컬 에이전트 모델이라고 주장한다 [S-2026-09-08-006]\n결론: 파라미터를 늘리지 않고 점수가 5%p 넘게 움직였으므로 에이전트 능력의 상당 부분이 후훈련 층에 있고, 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다 [S-2026-09-08-006]\n한국은 온디바이스 하드웨어(메모리 · NPU) 에 강하지만 증명된 층은 하드웨어가 아니라 후훈련이다 [S-2026-09-08-006]\n서구 대기업 사례: Shopify 는 0.8B Qwen 을 실제 업무 결과 평가 → 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼다. 크기가 아니라 업무별 학습 루프가 성능을 만든다는 같은 결론이다 [S-2026-09-09-003]\n세 번째 경로: 토큰리듬 NeoHorse-1-4B 는 라우팅 하네스가 만든 에이전트 실행 궤적을 학습해 11개 에이전트 벤치마크 중 5개에서 두 배 이상 큰 기초 모델을 능가했다 [S-2026-09-09-008]\n또 다른 경로: 구글 WikiSkill 은 학습이 아니라 재사용 가능한 '스킬' 축적으로 같은 결과를 냈다. 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 능가했고, 스킬은 모델 계열을 넘어 전이됐다 [S-2026-09-09-006]\n실물 경제가 원하는 것은 만능 제너럴리스트가 아니라 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트다 [S-2026-09-08-006]\n모순 · 논쟁\n후훈련만으로 효과를 내려면 강한 base model 이 전제라는 점은 distillation 논의와 일치한다: 약한 baseline 에서는 외부 신호를 아무리 모아도 frontier 가 되지 않는다 [S-2026-09-08-004]. 보완 관계.\nStartLux 의 Claude Sonnet 4.6 대비 시연 결과는 회사 측 자료다 {low} [S-2026-09-08-006]\n관련 페이지\nopen-local-models · beyond-parameter-scaling — 상위 주제\nagent-native-model — 실행 궤적 학습 경로\nlocal-model-24gb-boundary\nsmall-model-self-improvement-loop — Shopify 의 운영 루프\nskill-evolution-persistent-wiki — 스킬 축적 경로\norg-startlux · product-qwen\nknowledge-distillation · on-policy-distillation — 후훈련 신호의 출처 문제\ntask-definition-bottleneck — 완료 조건 정의는 훈련 데이터에서도 핵심\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\nS-2026-09-09-008-neohorse-agent-native-model","title":"에이전트 능력은 사후훈련 층에 있다","topics":["open-local-models","beyond-parameter-scaling"],"type":"concept","updated":"2026-09-09"},{"aliases":["proactive agent","선제적 에이전트"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","agent-governance-guardrails","ai-agents-enterprise-adoption","cloud-agent","human-oversight-erosion"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"low","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e사람이 시키지 않아도 스스로 문제를 발견해 조사하고 수정안을 내는 에이전트. 제프 왕은 클라우드 에이전트 다음에 올 시대로 예측했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e예시: 슬랙에서 여러 사람이 같은 버그를 반복해 말하면 감지하고, 보안 취약점이 생기면 자동으로 조사 · 패치한다. 코그니션이 개발 중인 자동화도 이 방향이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCIO 대화에서 두 번째로 자주 나오는 주제가 코드베이스 보안이며, 이미 탐지된 수천 · 수백만 건의 취약점 처리가 수요다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e에이전트가 능동적으로 움직일수록 기술보다 조직이 만들어 놓은 업무 흐름과 '일의 정의' 가 중요해진다. 흐름이 뒤죽박죽이면 좋은 AI 도 실제 일에 도움이 되지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e요청하지 않은 AI 가 시스템을 수정하면 무엇까지 허용할지, 어떤 작업은 승인을 받을지, 오류 시 책임은 누구인지가 경영 이슈가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 단일 소스의 예측이라 confidence 는 low.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 이전 단계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 능동형이 되면 커지는 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e · \u003ca href=\"#/ax-organizational-redesign\" class=\"wl\"\u003eax-organizational-redesign\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","agent-governance-guardrails","ai-agents-enterprise-adoption","ax-organizational-redesign","cloud-agent"],"relpath":"wiki/concepts/proactive-agent.md","sources":["S-2026-09-08-002","S-2026-09-09-010"],"status":"draft","stem":"proactive-agent","summary":"사람이 요청하기 전에 문제를 감지하고 먼저 움직이는 에이전트. 클라우드 에이전트 다음 단계로 제시되며 권한 · 책임 문제를 동반","system":false,"text":"정  class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e세션마다 하네스가 감독해 과제 이탈을 감지한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션 내부 코드 작성의 90% 를 담당한다고 회사가 밝혔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e금융권 COBOL · 메인프레임 탈피 프로젝트에서 코드베이스 분석과 이전을 지원하는 용도로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e미국 대기업은 시스템 전환 · 코드 현대화 · 보안처럼 '하기 싫지만 반드시 해야 하는 일' 부터 데빈에게 넘기고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026년 Windsurf 브랜드가 Devin 으로 통합됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cogni s-to-wiki-mcp","S-2026-09-15-001-google-cadence-and-what-to-do"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e구글의 LLM 계열. 이 위키에서는 에이전틱 비디오 이해 기능과 스킬 진화 실험 대상으로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGemini 3.7 Flash 에 \"에이전틱 비디오 이해\" 가 추가됐다. 모든 프레임을 입력하는 대신 필요한 구간만 골라 세부적으로 보게 해 토큰 소비를 약 1/10 로 줄였다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e에이전트 프레임워크 없이 interaction API 호출만으로 내부에서 하네스 같은 루프가 돈다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e공지 링크: blog.google 의 \"introducing agentic video in gemini\" \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eGemini 3.5 Flash 는 구글 리서치 WikiSkill 실험의 대상 모델 중 하나였다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e출시 주기: Flash 계열이 3주 간격으로 나온다. 3.6 Flash 2026-07-21, 3.7 Flash 2026-08-13, 3.8 Flash 2026-09-02. 3.8 은 3.7 위에서 재학습한 이터레이션이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFlash 집중은 에이전트 올인의 결과로, 억 단위 에이전트가 동시에 돌 때 백엔드가 감당할 크기를 타깃으로 한다. 프로 모델은 아직 포스트 트레이닝 중이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eWisdombase 가 생성하는 MCP 서버를 연결할 수 있는 클라이언트로도 언급된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 기능 설명은 소개글의 전언이며 공식 문서는 미확보.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 토큰 1/10 의 비용 효과\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 에이전트 루프의 위치\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-011-gemini-agentic-video\" class=\"wl\"\u003eS-2026-09-09-011-gemini-agentic-video\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" class=\"wl\"\u003eS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e · \u003ca href=\"#/org-google-deepmind\" class=\"wl\"\u003eorg-google-deepmind\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-011-gemini-
