03cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 국내 경쟁사 · 협력사 후보. 더존비즈온 출신이 기업 · 공공 구축형으로 들어오는 포지셔닝\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"에이전트 런타임\" 이라는 제품 범주 — 모델이 아니라 역할 · 권한 · 플레이북 · 승인 · 기억 · 감사 기록을 파는 것\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 오늘 이어진 \"실행 환경이 경쟁력\" 논지의 국내 실체 사례\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e크루온AI 는 전 더존비즈온 플랫폼사업부문 대표 송호철이 창업한 회사로, 기업 · 공공 시장을 겨냥한 \"기업용 AI 에이전트 런타임\" 을 출시했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문제 인식: 실제 업무는 한 프로그램 안에서 끝나지 않고 메일 · 메신저 · 문서 · 전자결재 · ERP · CRM 을 오가며 완성되는데, 현재 업무용 AI 는 특정 앱 안에서 답하거나 문서를 쓰는 데 머문다. \"AI 를 잘 사용하는 것과 AI 와 함께 일하는 것은 다르다\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAI 가 직원처럼 일하려면 역할, 업무지식 · 회사 규정, 업무시스템 사용 권한, 일하는 순서, 판단이 어려울 때 상급자 보고가 필요하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e두 플랫폼: '크루AI 워크(crewai.work)' 는 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, 비서 · 영업 · 회계 · 인사 · 홍보 · 법무 'AI 크루' 를 채용하듯 조직도에 추가한다. '크루온AI(Crewon.ai)' 는 AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 승인 단계를 '플레이북' 으로 가르치는 운영 기반이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e예시: 구매 담당 AI 에게 구매규정 · 계약지침을 학습시키고 ERP · 메일 · 문서 권한을 주며 견적 요청 → 비교 → 검토 → 계약 → 발주 순서를 설정하고, 일정 금액 이상은 사람 승인을 강제할 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\"A 프로젝트 예산 증액안 결재 올려줘\" 같은 지시에 AI 크루는 프로젝트 · 예산 관계, 변경 규정, 결재 절차, 요청자 권한을 차례로 확인하고, 범위를 넘으면 담당자에게 보고 · 승인 요청한다. 반복 작업은 AI, 중요한 판단은 사람이 맡는 휴먼 인 더 루프 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e'시맨틱 퍼스트, 벡터 세컨드': 비슷한 문서를 먼저 검색하지 않고 사용자 의도와 해야 할 업무부터 파악한 뒤, 규정 · 절차 · 접근권한을 확인하고 허용 범위 안에서 정보를 찾는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e완료 여부는 실제 결과로 판단한다. 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지 점검한다. \"도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e시스템이 달라져도 역할 · 권한 · 이전 업무 기억이 유지되고, 일할수록 조직 지식이 쌓인다. \"사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다\" — 축적된 지식 · 절차가 기업의 디지털 자산 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e관리 과제: 각 AI 의 데이터 · 시스템 접근 범위, 자율 판단 범위, 판단 근거와 실행 기록, 중요 업무의 사람 승인, 데이터 소유 · 보안 · 오류 책임 범위는 도입 과정에서 검증해야 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사업 모델: 초기에는 기업 · 공공 구축형에 집중하고 법무 · 회계 · R\u0026amp;D 사업관리 등 '전문 AI 크루팩' 을 공급한다. 구독형도 검토 중 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\"고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — 에이전트를 직원처럼 채용 · 교육 · 권한 · 플레이북으로 운영하는 제품 범주\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 권한 · 승인 단계 · 실행 기록\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 도구 호출 ≠ 업무 완료, 실제 결과로 판정\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 플레이북 = 업무 순서와 완료 조건의 명시\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e국내에서 \"런타임 · 실행 환경\" 을 파는 회사가 실제로 나왔다. 코그니션(사람 환산 시간 · 생산성 보증), GPT-6 Astra 분석(실행 조건), 크루온AI(플레이북 · 권한 · 실제 결과 판정) 가 같은 결론을 가리킨다: 팔리는 것은 모델이 아니라 모델이 일하는 환경이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기업 · 공공 구축형 + 전문 크루팩은 국내 규제 · 온프레미스 요구에 맞춘 진입 방식이며, 우리 시장과 겹칠 수 있다. 경쟁인지 협력인지 판단이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"시맨틱 퍼스트, 벡터 세컨드\"(의도 · 규정 · 권한 확인 후 검색) 와 \"실제 결과 기준 완료 판정\" 은 우리 제품 설계에 그대로 참고할 만한 원칙이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“AI를 잘 사용하는 것과 AI와 함께 일하는 것은 다르다”\u003c/p\u003e\n\u003cp\u003e쉽게 말해 크루AI 워크가 AI 직원이 출근해 사람과 함께 일하는 ‘사무실’이라면, 크루온AI는 AI를 채용하고 가르치며 역할과 권한을 관리하는 ‘운영체계’다.\u003c/p\u003e\n\u003cp\u003e송 대표는 “도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제”라고 설명했다.\u003c/p\u003e\n\u003cp\u003e“사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다”\u003c/p\u003e\n\u003cp\u003e“고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경”\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","org-crewon-ai","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/sources/S-2026-09-09-002-crewon-ai-agent-runtime.md","sources":["S-2026-09-09-002"],"src":{"author":"이안나 (디지털데일리)","file":"raw/2026/09/S-2026-09-09-002.html","origin":"url","published_at":"2026-09-03","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-002","url":"https://n.news.naver.com/article/138/0002240068"},"status":"draft","stem":"S-2026-09-09-002-crewon-ai-agent-runtime","summary":"전 더존비즈온 송호철 대표의 크루온AI. AI 크루를 채용 · 교육해 조직도에 배치하고 메일 · ERP · 전자결재를 오가며 일을 끝내는 '에이전트 런타임'. 플레이북 · 권한 · 실제 결과 판정","system":false,"text":"한 줄 요약\n크루온AI 는 AI 에이전트가 직원처럼 일하려면 역할 · 업무지식 · 규정 · 시스템 권한 · 업무 순서 · 보고 체계가 필요하다고 보고, 사람과 AI 가 함께 일하는 업무공간(크루AI 워크) 과 AI 직원을 채용 · 교육 · 관리하는 런타임(크루온AI) 두 플랫폼을 내놓았다. 기업 · 공공 구축형으로 시작하며, \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라고 말한다.\n관심 포인트\n(추정) 국내 경쟁사 · 협력사 후보. 더존비즈온 출신이 기업 · 공공 구축형으로 들어오는 포지셔닝\n(추정) \"에이전트 런타임\" 이라는 제품 범주 — 모델이 아니라 역할 · 권한 · 플레이북 · 승인 · 기억 · 감사 기록을 파는 것\n(추정) 어제 오늘 이어진 \"실행 환경이 경쟁력\" 논지의 국내 실체 사례\n핵심 주장\n1. 크루온AI 는 전 더존비즈온 플랫폼사업부문 대표 송호철이 창업한 회사로, 기업 · 공공 시장을 겨냥한 \"기업용 AI 에이전트 런타임\" 을 출시했다 {stated}\n2. 문제 인식: 실제 업무는 한 프로그램 안에서 끝나지 않고 메일 · 메신저 · 문서 · 전자결재 · ERP · CRM 을 오가며 완성되는데, 현재 업무용 AI 는 특정 앱 안에서 답하거나 문서를 쓰는 데 머문다. \"AI 를 잘 사용하는 것과 AI 와 함께 일하는 것은 다르다\" {stated}\n3. AI 가 직원처럼 일하려면 역할, 업무지식 · 회사 규정, 업무시스템 사용 권한, 일하는 순서, 판단이 어려울 때 상급자 보고가 필요하다 {stated}\n4. 두 플랫폼: '크루AI 워크(crewai.work)' 는 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, 비서 · 영업 · 회계 · 인사 · 홍보 · 법무 'AI 크루' 를 채용하듯 조직도에 추가한다. '크루온AI(Crewon.ai)' 는 AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 승인 단계를 '플레이북' 으로 가르치는 운영 기반이다 {stated}\n5. 예시: 구매 담당 AI 에게 구매규정 · 계약지침을 학습시키고 ERP · 메일 · 문서 권한을 주며 견적 요청 → 비교 → 검토 → 계약 → 발주 순서를 설정하고, 일정 금액 이상은 사람 승인을 강제할 수 있다 {stated}\n6. \"A 프로젝트 예산 증액안 결재 올려줘\" 같은 지시에 AI 크루는 프로젝트 · 예산 관계, 변경 규정, 결재 절차, 요청자 권한을 차례로 확인하고, 범위를 넘으면 담당자에게 보고 · 승인 요청한다. 반복 작업은 AI, 중요한 판단은 사람이 맡는 휴먼 인 더 루프 {stated}\n7. '시맨틱 퍼스트, 벡터 세컨드': 비슷한 문서를 먼저 검색하지 않고 사용자 의도와 해야 할 업무부터 파악한 뒤, 규정 · 절차 · 접근권한을 확인하고 허용 범위 안에서 정보를 찾는다 {stated}\n8. 완료 여부는 실제 결과로 판단한다. 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지 점검한다. \"도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제\" {stated}\n9. 시스템이 달라져도 역할 · 권한 · 이전 업무 기억이 유지되고, 일할수록 조직 지식이 쌓인다. \"사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다\" — 축적된 지식 · 절차가 기업의 디지털 자산 {stated}\n10. 관리 과제: 각 AI 의 데이터 · 시스템 접근 범위, 자율 판단 범위, 판단 근거와 실행 기록, 중요 업무의 사람 승인, 데이터 소유 · 보안 · 오류 책임 범위는 도입 과정에서 검증해야 한다 {stated}\n11. 사업 모델: 초기에는 기업 · 공공 구축형에 집중하고 법무 · 회계 · R\u0026D 사업관리 등 '전문 AI 크루팩' 을 공급한다. 구독형도 검토 중 {stated}\n12. \"고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경\" {stated}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption — 상위 주제\nai-workforce-runtime — 에이전트를 직원처럼 채용 · 교육 · 권한 · 플레이북으로 운영하는 제품 범주\nagent-governance-guardrails — 권한 · 승인 단계 · 실행 기록\ntask-level-agent-evaluation — 도구 호출 ≠ 업무 완료, 실제 결과로 판정\ntask-definition-bottleneck — 플레이북 = 업무 순서와 완료 조건의 명시\norg-crewon-ai\n우리에게 주는 함의\n국내에서 \"런타임 · 실행 환경\" 을 파는 회사가 실제로 나왔다. 코그니션(사람 환산 시간 · 생산성 보증), GPT-6 Astra 분석(실행 조건), 크루온AI(플레이북 · 권한 · 실제 결과 판정) 가 같은 결론을 가리킨다: 팔리는 것은 모델이 아니라 모델이 일하는 환경이다 [S-2026-09-09-002] [S-2026-09-08-002] [S-2026-09-09-004]\n기업 · 공공 구축형 + 전문 크루팩은 국내 규제 · 온프레미스 요구에 맞춘 진입 방식이며, 우리 시장과 겹칠 수 있다. 경쟁인지 협력인지 판단이 필요하다 [S-2026-09-09-002]\n\"시맨틱 퍼스트, 벡터 세컨드\"(의도 · 규정 · 권한 확인 후 검색) 와 \"실제 결과 기준 완료 판정\" 은 우리 제품 설계에 그대로 참고할 만한 원칙이다 [S-2026-09-09-002]\n주요 인용\n“AI를 잘 사용하는 것과 AI와 함께 일하는 것은 다르다”\n쉽게 말해 크루AI 워크가 AI 직원이 출근해 사람과 함께 일하는 ‘사무실’이라면, 크루온AI는 AI를 채용하고 가르치며 역할과 권한을 관리하는 ‘운영체계’다.\n송 대표는 “도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제”라고 설명했다.\n“사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다”\n“고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경”","title":"디지털데일리 — \"AI도 채용해서 조직도에 넣는다\" 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임","topics":["ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-09"},{"aliases":["Shopify 0.8B","Shopify Qwen 미세조정"],"back":["S-2026-09-09-001-tangle-visual-ml-pipeline","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle","small-model-self-improvement-loop"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e범용 대형 모델을 그대로 쓰는 대신, 0.8B 소형 모델을 실제 업무 결과로 평가하고 실패 데이터를 다시 학습에 넣는 자기개선 루프로 키우면 특정 업무에서는 대형 모델을 이긴다는 Shopify 사례. 기반 기술 Tangle 은 오픈소스.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"반복 업무마다 작고 저렴한 전용 모델\" 이라는 운영 모델 — 우리 제품 · 고객 업무에 그대로 적용 가능한 구조\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 실패 데이터를 다시 학습에 넣는 루프를 만드는 파이프라인 기술이 오픈소스라는 점 — 직접 써볼 수 있는가\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 공유한 로컬 · 후훈련 흐름(StartLux, K2 Horizon) 과 같은 방향의 서구 대기업 사례\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eShopify 가 Qwen3.5-0.8B 를 특정 업무에 맞게 미세조정한 결과, 그 작업에서 GPT-5.6 Sol 을 이겼다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e방법은 범용 AI 를 그대로 쓰지 않고, 실제 업무에서 나온 결과를 평가하고 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 것이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eShopify CEO Tobi Lütke 는 이런 자기개선 학습 구조가 있으면 작은 모델도 특정 업무에서 대형 모델보다 좋은 성능을 낼 수 있다고 설명했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이 학습 파이프라인을 만드는 기반 기술 Tangle 을 오픈소스로 공개했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이의 전망: 모든 업무에 비싼 대형 모델을 호출하는 대신 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 빠르게 늘 것이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 평가 → 실패 재학습 → 전용 소형 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 같은 논지의 중국 사례(StartLux) 와 연결\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — \"업무마다 전용 소형 모델\" 은 라우팅의 극단\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e · \u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e어제의 StartLux(27B 후훈련) 와 오늘의 Shopify(0.8B 미세조정) 는 같은 결론을 가리킨다: 특정 업무의 성능은 모델 크기가 아니라 그 업무의 실제 결과로 만든 학습 루프에서 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우리 고객 업무마다 \"평가 기준 + 실패 수집 + 재학습\" 루프를 제품에 내장하면, 대형 모델 API 비용을 줄이면서 성능을 올리는 구조가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원문 출처(Shopify 발표, Tangle 저장소) 가 게시글에 없다. 수치와 벤치마크 조건은 확인이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e0.8B짜리 소형 모델이 특정 작업에서 GPT-5.6 Sol을 이겼습니다.\u003c/p\u003e\n\u003cp\u003e범용 AI를 그대로 쓰는 대신 실제 업무에서 나온 결과를 평가하고, 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 방식을 사용했습니다.\u003c/p\u003e\n\u003cp\u003e모든 업무에 비싼 대형 모델을 호출하는 대신, 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 꽤 빠르게 늘어날 것 같습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/sources/S-2026-09-09-003-shopify-small-model-beats-sol.md","sources":["S-2026-09-09-003"],"src":{"author":"미상 (SNS 요약 게시글)","file":"raw/2026/09/S-2026-09-09-003.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-003","url":""},"status":"draft","stem":"S-2026-09-09-003-shopify-small-model-beats-sol","summary":"Shopify 가 Qwen3.5-0.8B 를 업무 결과 평가 → 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 앞섰고, 기반 기술 Tangle 을 오픈소스 공개","system":false,"text":"한 줄 요약\n범용 대형 모델을 그대로 쓰는 대신, 0.8B 소형 모델을 실제 업무 결과로 평가하고 실패 데이터를 다시 학습에 넣는 자기개선 루프로 키우면 특정 업무에서는 대형 모델을 이긴다는 Shopify 사례. 기반 기술 Tangle 은 오픈소스.\n관심 포인트\n(추정) \"반복 업무마다 작고 저렴한 전용 모델\" 이라는 운영 모델 — 우리 제품 · 고객 업무에 그대로 적용 가능한 구조\n(추정) 실패 데이터를 다시 학습에 넣는 루프를 만드는 파이프라인 기술이 오픈소스라는 점 — 직접 써볼 수 있는가\n(추정) 어제 공유한 로컬 · 후훈련 흐름(StartLux, K2 Horizon) 과 같은 방향의 서구 대기업 사례\n핵심 주장\n1. Shopify 가 Qwen3.5-0.8B 를 특정 업무에 맞게 미세조정한 결과, 그 작업에서 GPT-5.6 Sol 을 이겼다 {stated}\n2. 방법은 범용 AI 를 그대로 쓰지 않고, 실제 업무에서 나온 결과를 평가하고 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 것이다 {stated}\n3. Shopify CEO Tobi Lütke 는 이런 자기개선 학습 구조가 있으면 작은 모델도 특정 업무에서 대형 모델보다 좋은 성능을 낼 수 있다고 설명했다 {stated}\n4. 이 학습 파이프라인을 만드는 기반 기술 Tangle 을 오픈소스로 공개했다 {stated}\n5. 글쓴이의 전망: 모든 업무에 비싼 대형 모델을 호출하는 대신 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 빠르게 늘 것이다 {low}\n등장 개념 · 엔티티\nopen-local-models — 상위 주제\nsmall-model-self-improvement-loop — 평가 → 실패 재학습 → 전용 소형 모델\npost-training-agent-capability — 같은 논지의 중국 사례(StartLux) 와 연결\nmodel-routing-token-economics — \"업무마다 전용 소형 모델\" 은 라우팅의 극단\norg-shopify · product-tangle · product-qwen\n우리에게 주는 함의\n어제의 StartLux(27B 후훈련) 와 오늘의 Shopify(0.8B 미세조정) 는 같은 결론을 가리킨다: 특정 업무의 성능은 모델 크기가 아니라 그 업무의 실제 결과로 만든 학습 루프에서 나온다 [S-2026-09-09-003] [S-2026-09-08-006]\n우리 고객 업무마다 \"평가 기준 + 실패 수집 + 재학습\" 루프를 제품에 내장하면, 대형 모델 API 비용을 줄이면서 성능을 올리는 구조가 된다 [S-2026-09-09-003]\n원문 출처(Shopify 발표, Tangle 저장소) 가 게시글에 없다. 수치와 벤치마크 조건은 확인이 필요하다 [S-2026-09-09-003]\n주요 인용\n0.8B짜리 소형 모델이 특정 작업에서 GPT-5.6 Sol을 이겼습니다.\n범용 AI를 그대로 쓰는 대신 실제 업무에서 나온 결과를 평가하고, 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 방식을 사용했습니다.\n모든 업무에 비싼 대형 모델을 호출하는 대신, 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 꽤 빠르게 늘어날 것 같습니다.","title":"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김","topics":["open-local-models"],"type":"source","updated":"2026-09-09"},{"aliases":["GPT-6 Astra 분석","황민호 Astra 글"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","human-oversight-erosion","model-routing-token-economics","org-openai","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eOpenAI 가 2026-09-03 공개한 GPT-6 Astra 의 진짜 변화는 성능이 아니라 긴 업무를 수행하는 방식(비동기 도구 호출, 실행 중 지시 변경, 단계별 추론 강도) 에 있으며, 이는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓힌다. 비용은 Sol 의 2.5배라 어디에 쓸지 골라야 하고, 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건 설계가 더 중요해진다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"평가 단위 = 완료된 업무 한 건\" 과 그 측정 지표(완료율, 사람 개입 횟수, 검증 시간, 재시도 + 검수 비용) — 어제 코그니션의 사람 환산 시간과 같은 방향\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 모델 호출 코드보다 \"안전하게 오래 일하게 하는 실행 환경\" 의 품질이 경쟁력이라는 결론 — 우리가 만들 것이 무엇인지\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 공유한 Educators Technology 글의 GPT-6 Astra 를 실무 관점에서 더 자세히 본 것\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eOpenAI 는 2026-09-03 GPT-6 Astra 를 공개했다. Trusted Access Program 참여 기업부터 배포 중이며 API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e비동기 도구 호출: 애플리케이션 함수나 사용자 정의 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행한다(사내 데이터 조회 중 목차 작성, 빌드 · 테스트 중 다른 코드 검토). 실제 업무에서 AI 가 느린 이유는 추론이 아니라 기다려야 하는 외부 시스템이기 때문에 중요하다. 단 작업 ID 관리 · 타임아웃 · 재시도 · 중복 실행 방지는 여전히 개발자 몫이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경(mid-turn steering): 긴 작업 도중 \"일본 시장 제외\", \"이 파일은 수정 금지\", \"변경 전에 계획 먼저\" 같은 지시를 추가할 수 있다. 이미 실행된 행동(파일 삭제, 메일 발송) 을 되돌리거나 시작된 도구 실행을 취소하지는 않으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e단계별 추론 강도 조절: 한 작업 안에서 자료 정리는 낮게, 설계 검토 · 중요 의사결정은 높게, 마무리는 다시 낮게 계산 자원을 배분한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e세 가지를 합치면 Astra 는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓히려는 모델이다. 리서치라면 조회 · 대기 중 읽기 · 범위 수정 · 계산 · 문서 작성 · 검증까지, 코딩이라면 저장소 분석 · 수정 · 빌드 · 테스트 · 오류 수정까지가 한 작업이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e가격: 표준 API 입력 100만 토큰당 10달러, 출력 50달러로 GPT-5.6 Sol(4달러 · 20달러) 의 2.5배. ChatGPT Work · Codex 에서 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise · 구매 크레딧 2.08배 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e따라서 반복 분류 · 요약 · 포맷 변환은 Luna · Terra 가, 범위가 명확한 고난도 작업은 Sol 로 충분하다. Astra 는 여러 단계가 연결되고 외부 시스템을 자주 호출하며 진행 중 요구가 바뀌고 실패 시 사람 재투입 비용이 큰 업무에 맞는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 는 Astra 를 Preparedness Framework 에서 처음으로 Critical 수준의 사이버보안 역량에 도달한 모델로 분류했다. 내부 평가 ExploitBench 100%, 알려지지 않은 취약점도 발견. 일부 결과는 기본 환경보다 강한 도구 접근 권한을 쓴 평가였다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e성능이 높아질수록 \"무엇을 시킬 것인가\" 만으로는 부족하다. 어떤 도구를 연결할지, 어느 단계에서 승인을 받을지, 실패하면 어디서 멈출지, 중복 실행을 어떻게 막을지, 작업 내역을 어떻게 남길지를 설계해야 한다. 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건이 더 중요해진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e모델 비교에서 벤치마크 점수만으로는 부족하다. 한 업무를 끝까지 완료한 비율, 사람 개입 횟수, 결과 검증까지 걸린 시간, 재시도와 검수 시간을 합친 비용을 측정해야 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일할 수 있게 만든 실행 환경의 품질이 점점 더 중요해진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 평가 단위 = 완료된 업무 한 건, 측정 지표\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 실행 조건: 최소 권한 · 체크포인트 · 승인 지점 · 비용 상한\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 완료 조건 정의\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — Luna · Terra · Sol · Astra 티어 배분\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 실행 중 지시 변경도 되돌리기는 못한다, 승인은 여전히 필요\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리 에이전트 제품의 지표를 \"답변 품질\" 에서 \"완료율 · 개입 횟수 · 검증 시간 · 총비용\" 으로 바꾸면, 코그니션의 사람 환산 시간과 함께 고객에게 제시할 ROI 프레임이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e경쟁력은 모델 호출이 아니라 실행 환경(작업 ID · 타임아웃 · 재시도 · 중복 방지 · 체크포인트 · 감사 기록) 에 있다. 이것은 모델이 바뀌어도 남는 자산이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eAstra 급 모델은 비용이 2.5배이므로 라우팅 없이 전면 도입하면 청구서 충격이 온다. 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eGPT-6 Astra가 바꾼 것은 답변의 질보다 ‘일을 끝내는 방식’입니다\u003c/p\u003e\n\u003cp\u003e평가 단위를 ‘한 번의 답변’에서 ‘완료된 업무 한 건’으로 넓히려는 모델입니다.\u003c/p\u003e\n\u003cp\u003e다만 이미 실행된 행동을 되돌리는 기능은 아닙니다. 파일을 삭제했거나 외부로 메일을 보냈다면 나중에 지시를 바꾼다고 자동 복구되지 않습니다.\u003c/p\u003e\n\u003cp\u003e성능이 높아질수록 “모델에게 어떤 일을 시킬 것인가”만으로는 부족해집니다.\u003c/p\u003e\n\u003cp\u003e한 업무를 끝까지 완료한 비율은 얼마인지, 사람은 몇 번 개입했는지, 결과 검증까지 얼마나 걸렸는지, 재시도와 사람의 검수 시간을 합친 비용은 얼마인지를 측정해야 합니다.\u003c/p\u003e\n\u003cp\u003eAI 에이전트를 만드는 쪽에서도 모델을 호출하는 코드보다 그 모델이 안전하게 오래 일할 수 있도록 만든 실행 환경의 품질이 점점 더 중요해질 것 같습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","agent-governance-guardrails","ai-agents-enterprise-adoption","human-oversight-erosion","model-routing-token-economics","org-openai","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/sources/S-2026-09-09-004-gpt-6-astra-task-completion.md","sources":["S-2026-09-09-004"],"src":{"author":"황민호 (카카오) — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-004.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-004","url":""},"status":"draft","stem":"S-2026-09-09-004-gpt-6-astra-task-completion","summary":"GPT-6 Astra 의 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도가 평가 단위를 '답변' 에서 '완료된 업무' 로 옮기며, 실행 조건 설계가 핵심이라는 분석","system":false,"text":"한 줄 요약\nOpenAI 가 2026-09-03 공개한 GPT-6 Astra 의 진짜 변화는 성능이 아니라 긴 업무를 수행하는 방식(비동기 도구 호출, 실행 중 지시 변경, 단계별 추론 강도) 에 있으며, 이는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓힌다. 비용은 Sol 의 2.5배라 어디에 쓸지 골라야 하고, 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건 설계가 더 중요해진다.\n관심 포인트\n(추정) \"평가 단위 = 완료된 업무 한 건\" 과 그 측정 지표(완료율, 사람 개입 횟수, 검증 시간, 재시도 + 검수 비용) — 어제 코그니션의 사람 환산 시간과 같은 방향\n(추정) 모델 호출 코드보다 \"안전하게 오래 일하게 하는 실행 환경\" 의 품질이 경쟁력이라는 결론 — 우리가 만들 것이 무엇인지\n(추정) 어제 공유한 Educators Technology 글의 GPT-6 Astra 를 실무 관점에서 더 자세히 본 것\n핵심 주장\n1. OpenAI 는 2026-09-03 GPT-6 Astra 를 공개했다. Trusted Access Program 참여 기업부터 배포 중이며 API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정이다 {stated}\n2. 비동기 도구 호출: 애플리케이션 함수나 사용자 정의 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행한다(사내 데이터 조회 중 목차 작성, 빌드 · 테스트 중 다른 코드 검토). 실제 업무에서 AI 가 느린 이유는 추론이 아니라 기다려야 하는 외부 시스템이기 때문에 중요하다. 단 작업 ID 관리 · 타임아웃 · 재시도 · 중복 실행 방지는 여전히 개발자 몫이다 {stated}\n3. 실행 중 지시 변경(mid-turn steering): 긴 작업 도중 \"일본 시장 제외\", \"이 파일은 수정 금지\", \"변경 전에 계획 먼저\" 같은 지시를 추가할 수 있다. 이미 실행된 행동(파일 삭제, 메일 발송) 을 되돌리거나 시작된 도구 실행을 취소하지는 않으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 {stated}\n4. 단계별 추론 강도 조절: 한 작업 안에서 자료 정리는 낮게, 설계 검토 · 중요 의사결정은 높게, 마무리는 다시 낮게 계산 자원을 배분한다 {stated}\n5. 세 가지를 합치면 Astra 는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓히려는 모델이다. 리서치라면 조회 · 대기 중 읽기 · 범위 수정 · 계산 · 문서 작성 · 검증까지, 코딩이라면 저장소 분석 · 수정 · 빌드 · 테스트 · 오류 수정까지가 한 작업이다 {stated}\n6. 가격: 표준 API 입력 100만 토큰당 10달러, 출력 50달러로 GPT-5.6 Sol(4달러 · 20달러) 의 2.5배. ChatGPT Work · Codex 에서 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise · 구매 크레딧 2.08배 {stated}\n7. 따라서 반복 분류 · 요약 · 포맷 변환은 Luna · Terra 가, 범위가 명확한 고난도 작업은 Sol 로 충분하다. Astra 는 여러 단계가 연결되고 외부 시스템을 자주 호출하며 진행 중 요구가 바뀌고 실패 시 사람 재투입 비용이 큰 업무에 맞는다 {stated}\n8. OpenAI 는 Astra 를 Preparedness Framework 에서 처음으로 Critical 수준의 사이버보안 역량에 도달한 모델로 분류했다. 내부 평가 ExploitBench 100%, 알려지지 않은 취약점도 발견. 일부 결과는 기본 환경보다 강한 도구 접근 권한을 쓴 평가였다 {stated}\n9. 성능이 높아질수록 \"무엇을 시킬 것인가\" 만으로는 부족하다. 어떤 도구를 연결할지, 어느 단계에서 승인을 받을지, 실패하면 어디서 멈출지, 중복 실행을 어떻게 막을지, 작업 내역을 어떻게 남길지를 설계해야 한다. 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건이 더 중요해진다 {stated}\n10. 모델 비교에서 벤치마크 점수만으로는 부족하다. 한 업무를 끝까지 완료한 비율, 사람 개입 횟수, 결과 검증까지 걸린 시간, 재시도와 검수 시간을 합친 비용을 측정해야 한다 {stated}\n11. 에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일할 수 있게 만든 실행 환경의 품질이 점점 더 중요해진다 {stated}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption — 상위 주제\ntask-level-agent-evaluation — 평가 단위 = 완료된 업무 한 건, 측정 지표\nagent-governance-guardrails — 실행 조건: 최소 권한 · 체크포인트 · 승인 지점 · 비용 상한\ntask-definition-bottleneck — 완료 조건 정의\nmodel-routing-token-economics — Luna · Terra · Sol · Astra 티어 배분\nhuman-oversight-erosion — 실행 중 지시 변경도 되돌리기는 못한다, 승인은 여전히 필요\nproduct-gpt-6-astra · org-openai\n우리에게 주는 함의\n우리 에이전트 제품의 지표를 \"답변 품질\" 에서 \"완료율 · 개입 횟수 · 검증 시간 · 총비용\" 으로 바꾸면, 코그니션의 사람 환산 시간과 함께 고객에게 제시할 ROI 프레임이 된다 [S-2026-09-09-004] [S-2026-09-08-002]\n경쟁력은 모델 호출이 아니라 실행 환경(작업 ID · 타임아웃 · 재시도 · 중복 방지 · 체크포인트 · 감사 기록) 에 있다. 이것은 모델이 바뀌어도 남는 자산이다 [S-2026-09-09-004]\nAstra 급 모델은 비용이 2.5배이므로 라우팅 없이 전면 도입하면 청구서 충격이 온다. 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 [S-2026-09-09-004] [S-2026-09-08-002]\n주요 인용\nGPT-6 Astra가 바꾼 것은 답변의 질보다 ‘일을 끝내는 방식’입니다\n평가 단위를 ‘한 번의 답변’에서 ‘완료된 업무 한 건’으로 넓히려는 모델입니다.\n다만 이미 실행된 행동을 되돌리는 기능은 아닙니다. 파일을 삭제했거나 외부로 메일을 보냈다면 나중에 지시를 바꾼다고 자동 복구되지 않습니다.\n성능이 높아질수록 “모델에게 어떤 일을 시킬 것인가”만으로는 부족해집니다.\n한 업무를 끝까지 완료한 비율은 얼마인지, 사람은 몇 번 개입했는지, 결과 검증까지 얼마나 걸렸는지, 재시도와 사람의 검수 시간을 합친 비용은 얼마인지를 측정해야 합니다.\nAI 에이전트를 만드는 쪽에서도 모델을 호출하는 코드보다 그 모델이 안전하게 오래 일할 수 있도록 만든 실행 환경의 품질이 점점 더 중요해질 것 같습니다.","title":"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 '일을 끝내는 방식'","topics":["ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-09"},{"aliases":["Arena 코딩 리더보드 변화","Hy4 1631 Elo"],"back":["local-model-24gb-boundary","model-routing-token-economics","open-local-models","org-openai","org-tencent","product-qwen"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eArena 코딩(webdev) 리더보드에서 Tencent 의 Hy4 가 Grok 4.6 급 성능을 훨씬 낮은 가격에 내고, OpenAI 의 GPT-5.6 Sol 은 9위로 밀렸으며, 로컬에서 무료로 도는 Qwen3.8-27B 가 상위권에 근접했다는 짧은 관찰. 경쟁 축이 성능에서 성능 · 가격 · 로컬 실행으로 바뀌었다는 결론.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 로컬 모델 글의 Qwen3.8-27B 가 공개 리더보드에서도 상위권이라는 독립 근거\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 최상위 모델의 가격 프리미엄이 정당화되기 어려워지는 흐름 — 우리 모델 선택 · 비용 구조\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eTencent Hy4 는 Arena 코딩 리더보드에서 1631 Elo 를 기록했고 가격은 약 2.50달러 수준이다. Grok 4.6 과 비슷한 성능권이지만 가격은 훨씬 낮다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eGPT-5.6 Sol xhigh 는 1609 Elo 로 9위까지 내려왔고 Top 10 밖으로 밀릴 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.8-27B 는 거의 1600 Elo 에 가까운 점수를 기록하면서 이미 로컬에서 무료로 실행할 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eGLM 모델도 10위까지 하락했고, OpenAI 는 랩 순위에서 6위까지 내려왔다는 분석도 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이제 성능뿐 아니라 가격과 로컬 실행까지 경쟁 축이 완전히 달라졌다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — Qwen3.8-27B 의 로컬 상위권 근거\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 가격 대비 성능\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-tencent\" class=\"wl\"\u003eorg-tencent\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eQwen3.8-27B 가 공개 리더보드 상위권에 근접했다면, 24GB 한 장 로컬 배포 규격이 \"성능 타협\" 이 아니라 현실적 선택이라는 근거가 하나 더 생긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eElo 수치는 리더보드 스냅샷의 전언이며 날짜 · 조건이 없다. 인용할 때는 arena.ai 를 직접 확인한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\ 거버넌스","가드레일","agent governance","권한과 책임"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","ai-agents-enterprise-adoption","ai-workforce-runtime","human-oversight-erosion","proactive-agent","product-gpt-6-astra","sovereign-ai","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트가 기업 내부 데이터 · 도구 · 시스템에 연결되어야 실제 업무를 하지만, 연결이 많을수록 보안과 통제 문제가 커진다. 그래서 거버넌스와 가드레일을 먼저 마련하고 그다음 지능을 풀어놓아야 한다는 원칙 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e금융에서 에이전트가 확산되려면 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 해결해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e요청하지 않은 AI 가 시스템을 수정하기 시작하면 무엇까지 허용할지, 어떤 작업은 사람 승인이 필요한지, 오류 시 누가 책임지는지가 새로운 경영 이슈가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션의 통제 방식: 세션마다 하네스가 감독해 과제 이탈 · 이상 행동을 감지하고, 각 작업을 독립 VM 에서 실행해 실제 결과를 검증한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"AGI 가 실재하는데 비밀번호를 바꿀 권한까지 갖고 있다면 문제다\" — 지능보다 접근권한이 위험의 원천이라는 비유 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e소버린 AI 의 요소로도 데이터 위치 · 접근 범위 · 실행 기록 통제가 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 조건의 구체 목록: 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한, 그리고 어떤 도구를 연결할지 · 어느 단계에서 승인을 받을지 · 실패 시 어디서 멈출지 · 중복 실행을 어떻게 막을지 · 작업 내역을 어떻게 남길지. 모델 성능이 오를수록 이 설계의 비중이 커진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경이 가능해져도 이미 실행된 행동(삭제 · 외부 발송) 은 되돌릴 수 없으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e제품 구현 사례: 크루온AI 는 AI 크루마다 권한을 설정하고 플레이북으로 승인 단계를 정하며(예: 일정 금액 이상 구매는 사람 승인 강제), 범위를 넘으면 담당자에게 보고 · 승인 요청하게 한다. 접근 범위 · 자율 판단 범위 · 실행 기록 · 책임 범위는 도입 시 검증 과제로 남긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e승인 지점을 두는 것만으로는 부족하다. 반복 승인은 승인 피로를 낳아 사람의 역할이 상징적이 되므로, 승인 시점을 신중히 설계하고 승인 근거를 설명하게 해야 한다는 처방이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u0 ystem":false,"text":"정의\n에이전트가 기업 내부 데이터 · 도구 · 시스템에 연결되어야 실제 업무를 하지만, 연결이 많을수록 보안과 통제 문제가 커진다. 그래서 거버넌스와 가드레일을 먼저 마련하고 그다음 지능을 풀어놓아야 한다는 원칙 [S-2026-09-08-002].\n근거 있는 사실\n금융에서 에이전트가 확산되려면 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 해결해야 한다 [S-2026-09-08-002]\n요청하지 않은 AI 가 시스템을 수정하기 시작하면 무엇까지 허용할지, 어떤 작업은 사람 승인이 필요한지, 오류 시 누가 책임지는지가 새로운 경영 이슈가 된다 [S-2026-09-08-002]\n코그니션의 통제 방식: 세션마다 하네스가 감독해 과제 이탈 · 이상 행동을 감지하고, 각 작업을 독립 VM 에서 실행해 실제 결과를 검증한다 [S-2026-09-08-002]\n\"AGI 가 실재하는데 비밀번호를 바꿀 권한까지 갖고 있다면 문제다\" — 지능보다 접근권한이 위험의 원천이라는 비유 [S-2026-09-08-002]\n소버린 AI 의 요소로도 데이터 위치 · 접근 범위 · 실행 기록 통제가 제시된다 [S-2026-09-08-002]\n실행 조건의 구체 목록: 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한, 그리고 어떤 도구를 연결할지 · 어느 단계에서 승인을 받을지 · 실패 시 어디서 멈출지 · 중복 실행을 어떻게 막을지 · 작업 내역을 어떻게 남길지. 모델 성능이 오를수록 이 설계의 비중이 커진다 [S-2026-09-09-004]\n실행 중 지시 변경이 가능해져도 이미 실행된 행동(삭제 · 외부 발송) 은 되돌릴 수 없으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 [S-2026-09-09-004]\n제품 구현 사례: 크루온AI 는 AI 크루마다 권한을 설정하고 플레이북으로 승인 단계를 정하며(예: 일정 금액 이상 구매는 사람 승인 강제), 범위를 넘으면 담당자에게 보고 · 승인 요청하게 한다. 접근 범위 · 자율 판단 범위 · 실행 기록 · 책임 범위는 도입 시 검증 과제로 남긴다 [S-2026-09-09-002]\n승인 지점을 두는 것만으로는 부족하다. 반복 승인은 승인 피로를 낳아 사람의 역할이 상징적이 되므로, 승인 시점을 신중히 설계하고 승인 근거를 설명하게 해야 한다는 처방이 있다 [S-2026-09-08-003]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption · sovereign-ai — 상위 주제\nproactive-agent — 자율성이 커질수록 이 문제가 커진다\ncloud-agent — VM 격리는 가드레일의 한 형태\nhuman-oversight-erosion — 시스템 통제의 반대편, 사람 쪽 역량 문제\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-002-crewon-ai-agent-runtime\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"에이전트 거버넌스와 가드레일: 권한 · 책임 · 감사로그","topics":["ai-agents-enterprise-adoption","sovereign-ai"],"type":"concept","updated":"2026-09-09"},{"aliases":["AI 에이전트 도입","enterprise AI agents","에이전트 시대"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-roi-human-equivalent-hours","ai-workforce-runtime","cloud-agent","forward-deployed-engineer","human-oversight-erosion","model-routing-token-economics","org-anthropic","org-cognition","org-crewon-ai","org-openai","person-jeff-wang","proactive-agent","product-devin","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"medium","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003eAI 의 경쟁 축은 답을 잘 하는 것에서 사람 대신 일을 끝까지 수행하는 것으로 옮겨가고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e. 코딩 영역에서는 자동완성 → 대화 → 에이전트 → 클라우드 에이전트로 사용 방식이 약 6개월 주기로 바뀌었고, 다음은 시키기 전에 움직이는 능동형 에이전트라는 전망이 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 범용 영역에서도 웹 · 문서 · 코드 실행 · 소프트웨어 사용을 묶어 복잡한 작업을 수행하는 모델이 나왔다고 소개된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e. 2026-09-03 공개된 GPT-6 Astra 는 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도로 긴 업무를 끝까지 처리하도록 설계돼, 평가 단위를 \"답변 한 번\" 에서 \"완료된 업무 한 건\" 으로 옮긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e도입의 병목은 모델 성능이 아니다. 무엇을 맡길지, 무엇이 완료인지(테스트 통과 · 실행 검증) 를 정의하고 프로젝트를 위임 단위로 쪼개는 일이 안 되면 강한 모델을 써도 기간이 줄지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 성과는 사람 환산 작업시간 같은 지표로 측정해야 하며, 측정하지 못하면 AI 는 IT 비용이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 같은 방향에서 벤치마크 대신 업무 완료율 · 사람 개입 횟수 · 검증 시간 · 재시도와 검수를 합친 비용을 재야 한다는 실무 관점이 더해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e. 최상위 모델은 Sol 의 2.5배 가격이라 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e. 비용 쪽에서는 모든 작업에 최상위 모델을 쓰면 비용이 10배가 되므로 작업별 모델 라우팅(오픈웨이트 포함) 이 기업 AI 의 핵심 경쟁력으로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e통제는 두 축이다. 시스템 쪽에서는 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 정하고, 격리 실행과 하네스 감독으로 가드레일을 둔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 사람 쪽에서는 승인 버튼이 있다고 감독이 성립하지 않는다. 승인 피로와 자동화의 아이러니로 감독자의 역량이 침식되므로 전략적 마찰을 설계에 넣어야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e. 에이전트의 경쟁력과 위험은 같은 곳(연결과 접근권한) 에서 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 모델 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건과, 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 경쟁력이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e. 한국에서는 크루온AI 가 이 실행 환경 자체를 제품으로 내놓았다: AI 크루를 채용하듯 조직도에 넣고 역할 · 권한 · 플레이북 · 기억을 설정하며, 도구 호출과 업무 완료를 구분해 실제 결과로 판정한다. \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라는 말이 이 주제의 현재 결론에 가깝다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e모델 쪽에서는 실물 경제가 만능 제너럴리스트보다 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트를 원하며, 그 능력은 도구 선택 · 다단계 실행 · 검증을 가르치는 후훈련 층에서 만들어진다는 관찰이 더해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 민감 데이터 산업에서는 그런 에이전트가 로컬에서 도는 것이 전제가 되어간다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 독립 실행 환경을 가진 에이전트\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 다음 단계로 예측되는 능동형 에이전트\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 도입 병목은 업무 정의와 완료 조건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — ROI 측정과 생산성 보증\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 작업별 모델 선택과 토큰 비용\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e — 고객 문제를 AI 가 풀 수 있는 형태로 바꾸는 직무\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 시스템 쪽 통제: 권한 · 책임 · 감사로그\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 사람 쪽 통제: 승인 피로 · 자동화의 아이러니\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 평가 단위 = 완료된 업무 한 건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — 실행 환경을 제품으로: 채용 · 권한 · 플레이북 · 기억\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 스페셜리스트 에이전트 능력의 출처 (open-local-models 와 공유)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e · \u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e · \u003ca href=\"#/person-jeff-wang\" class=\"wl\"\u003eperson-jeff-wang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e · \u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e — 한국 에이전트 런타임\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e — 스페셜리스트 로컬 에이전트 관점\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e — GPT-6 Astra 와 실행 조건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e — 크루온AI 에이전트 런타임\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-03 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e 디지털데일리, 크루온AI 기업용 AI 에이전트 런타임 출시 보도\u003c/li\u003e\n\u003cli\u003e2026-09-03 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e OpenAI GPT-6 Astra 공개 — 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도, Sol 대비 2.5배 가격\u003c/li\u003e\n\u003cli\u003e2026-09-08 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e 에이전트 특화 로컬 모델(StartLux) 분석 — 스페셜리스트 에이전트 · 후훈련\u003c/li\u003e\n\u003cli\u003e2026-09-08 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e GPT-6 Astra 출시를 계기로 인간 감독 침식 보고서(arXiv 2608.23642) 소개\u003c/li\u003e\n\u003cli\u003e2026-08-31 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e 더밀크, 코그니션 제프 왕 인터뷰 게재 — 클라우드 에이전트 · ROI · 모델 라우팅 · 한국 진출\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e사람 환산 작업시간 지표를 우리 고객 제안에 쓸 수 있는가? 산정 방식의 세부(작업 분류, 검증 기준) 가 필요하다\u003c/li\u003e\n\u003cli\u003e승인 피로를 줄이는 승인 지점 설계의 구체 사례가 있는가? (보고서 원문 arXiv 2608.23642 미확보)\u003c/li\u003e\n\u003cli\u003e코그니션의 한국 금융 · 제조 진출이 우리에게 파트너 기회인가 경쟁인가\u003c/li\u003e\n\u003cli\u003e크루온AI(기업 · 공공 구축형, 전문 크루팩) 와 우리 시장은 얼마나 겹치는가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-09: 크루온AI 기사 공유 — 국내 에이전트 런타임 경쟁 · 협력 후보에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-09: GPT-6 Astra 실무 분석 공유 — 어제의 감독 문제에 이어 실행 조건 · 평가 지표 쪽 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-08: 에이전트의 사업 모델(완료한 일 기준 과금, 생산성 보증) 과 통제(가드레일, 인간 감독) 를 같은 날 공유 — 도입 조건과 리스크를 함께 보는 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-roi-human-equivalent-hours","ai-workforce-runtime","cloud-agent","forward-deployed-engineer","human-oversight-erosion","model-routing-token-economics","org-anthropic","org-cognition","org-crewon-ai","org-openai","person-jeff-wang","post-training-agent-capability","proactive-agent","product-devin","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/topics/ai-agents-enterprise-adoption.md","sources":["S-2026-09-08-002","S-2026-09-08-003","S-2026-09-08-006","S-2026-09-09-004","S-2026-09-09-002"],"status":"draft","stem":"ai-agents-enterprise-adoption","summary":"에이전트가 '답하는 AI' 에서 '일을 끝까지 수행하는 AI' 로 바뀌면서 생기는 도입 조건(업무 정의 · ROI · 모델 라우팅) 과 통제 문제(가드레일 · 인간 감독)","system":false,"text":"현재 종합\nAI 의 경쟁 축은 답을 잘 하는 것에서 사람 대신 일을 끝까지 수행하는 것으로 옮겨가고 있다 [S-2026-09-08-002] [S-2026-09-08-003]. 코딩 영역에서는 자동완성 → 대화 → 에이전트 → 클라우드 에이전트로 사용 방식이 약 6개월 주기로 바뀌었고, 다음은 시키기 전에 움직이는 능동형 에이전트라는 전망이 나온다 [S-2026-09-08-002]. 범용 영역에서도 웹 · 문서 · 코드 실행 · 소프트웨어 사용을 묶어 복잡한 작업을 수행하는 모델이 나왔다고 소개된다 [S-2026-09-08-003]. 2026-09-03 공개된 GPT-6 Astra 는 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도로 긴 업무를 끝까지 처리하도록 설계돼, 평가 단위를 \"답변 한 번\" 에서 \"완료된 업무 한 건\" 으로 옮긴다 [S-2026-09-09-004].\n도입의 병목은 모델 성능이 아니다. 무엇을 맡길지, 무엇이 완료인지(테스트 통과 · 실행 검증) 를 정의하고 프로젝트를 위임 단위로 쪼개는 일이 안 되면 강한 모델을 써도 기간이 줄지 않는다 [S-2026-09-08-002]. 성과는 사람 환산 작업시간 같은 지표로 측정해야 하며, 측정하지 못하면 AI 는 IT 비용이 된다 [S-2026-09-08-002]. 같은 방향에서 벤치마크 대신 업무 완료율 · 사람 개입 횟수 · 검증 시간 · 재시도와 검수를 합친 비용을 재야 한다는 실무 관점이 더해진다 [S-2026-09-09-004]. 최상위 모델은 Sol 의 2.5배 가격이라 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 [S-2026-09-09-004]. 비용 쪽에서는 모든 작업에 최상위 모델을 쓰면 비용이 10배가 되므로 작업별 모델 라우팅(오픈웨이트 포함) 이 기업 AI 의 핵심 경쟁력으로 제시된다 [S-2026-09-08-002].\n통제는 두 축이다. 시스템 쪽에서는 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 정하고, 격리 실행과 하네스 감독으로 가드레일을 둔다 [S-2026-09-08-002]. 사람 쪽에서는 승인 버튼이 있다고 감독이 성립하지 않는다. 승인 피로와 자동화의 아이러니로 감독자의 역량이 침식되므로 전략적 마찰을 설계에 넣어야 한다 [S-2026-09-08-003]. 에이전트의 경쟁력과 위험은 같은 곳(연결과 접근권한) 에서 나온다 [S-2026-09-08-002]. 모델 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건과, 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 경쟁력이 된다 [S-2026-09-09-004]. 한국에서는 크루온AI 가 이 실행 환경 자체를 제품으로 내놓았다: AI 크루를 채용하듯 조직도에 넣고 역할 · 권한 · 플레이북 · 기억을 설정하며, 도구 호출과 업무 완료를 구분해 실제 결과로 판정한다. \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라는 말이 이 주제의 현재 결론에 가깝다 [S-2026-09-09-002].\n모델 쪽에서는 실물 경제가 만능 제너럴리스트보다 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트를 원하며, 그 능력은 도구 선택 · 다단계 실행 · 검증을 가르치는 후훈련 층에서 만들어진다는 관찰이 더해진다 [S-2026-09-08-006]. 민감 데이터 산업에서는 그런 에이전트가 로컬에서 도는 것이 전제가 되어간다 [S-2026-09-08-006].\n하위 페이지\n개념\ncloud-agent — 독립 실행 환경을 가진 에이전트\nproactive-agent — 다음 단계로 예측되는 능동형 에이전트\ntask-definition-bottleneck — 도입 병목은 업무 정의와 완료 조건\nai-roi-human-equivalent-hours — ROI 측정과 생산성 보증\nmodel-routing-token-economics — 작업별 모델 선택과 토큰 비용\nforward-deployed-engineer — 고객 문제를 AI 가 풀 수 있는 형태로 바꾸는 직무\nagent-governance-guardrails — 시스템 쪽 통제: 권한 · 책임 · 감사로그\nhuman-oversight-erosion — 사람 쪽 통제: 승인 피로 · 자동화의 아이러니\ntask-level-agent-evaluation — 평가 단위 = 완료된 업무 한 건\nai-workforce-runtime — 실행 환경을 제품으로: 채용 · 권한 · 플레이북 · 기억\npost-training-agent-capability — 스페셜리스트 에이전트 능력의 출처 (open-local-models 와 공유)\n엔티티\norg-cognition · product-devin · person-jeff-wang\norg-openai · product-gpt-6-astra · org-anthropic\norg-crewon-ai — 한국 에이전트 런타임\n소스\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-08-006-local-agent-models-startlux — 스페셜리스트 로컬 에이전트 관점\nS-2026-09-09-004-gpt-6-astra-task-completion — GPT-6 Astra 와 실행 조건\nS-2026-09-09-002-crewon-ai-agent-runtime — 크루온AI 에이전트 런타임\n타임라인\n2026-09-03 [S-2026-09-09-002] 디지털데일리, 크루온AI 기업용 AI 에이전트 런타임 출시 보도\n2026-09-03 [S-2026-09-09-004] OpenAI GPT-6 Astra 공개 — 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도, Sol 대비 2.5배 가격\n2026-09-08 [S-2026-09-08-006] 에이전트 특화 로컬 모델(StartLux) 분석 — 스페셜리스트 에이전트 · 후훈련\n2026-09-08 [S-2026-09-08-003] GPT-6 Astra 출시를 계기로 인간 감독 침식 보고서(arXiv 2608.23642) 소개\n2026-08-31 [S-2026-09-08-002] 더밀크, 코그니션 제프 왕 인터뷰 게재 — 클라우드 에이전트 · ROI · 모델 라우팅 · 한국 진출\n열린 질문\n사람 환산 작업시간 지표를 우리 고객 제안에 쓸 수 있는가? 산정 방식의 세부(작업 분류, 검증 기준) 가 필요하다\n승인 피로를 줄이는 승인 지점 설계의 구체 사례가 있는가? (보고서 원문 arXiv 2608.23642 미확보)\n코그니션의 한국 금융 · 제조 진출이 우리에게 파트너 기회인가 경쟁인가\n크루온AI(기업 · 공공 구축형, 전문 크루팩) 와 우리 시장은 얼마나 겹치는가\n관심 흐름\n2026-09-09: 크루온AI 기사 공유 — 국내 에이전트 런타임 경쟁 · 협력 후보에 대한 관심으로 추정 (추정)\n2026-09-09: GPT-6 Astra 실무 분석 공유 — 어제의 감독 문제에 이어 실행 조건 · 평가 지표 쪽 관심으로 추정 (추정)\n2026-09-08: 에이전트의 사업 모델(완료한 일 기준 과금, 생산성 보증) 과 통제(가드레일, 인간 감독) 를 같은 날 공유 — 도입 조건과 리스크를 함께 보는 관심으로 추정 (추정)","title":"AI 에이전트의 기업 도입: 실행 · 통제 · ROI","topics":[],"type":"topic","updated":"2026-09-09"},{"aliases":["Human-equivalent hours","사람 환산 작업시간","생산성 보증","AI ROI"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","model-routing-token-economics","org-cognition","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAI 가 수행한 업무를 사람이 했다면 필요했을 엔지니어링 시간으로 추정하고 경제적 가치로 환산하는 지표. 프로덕션 반영 여부까지 함께 본다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e미국 기업 CEO 가 가장 많이 묻는 것이 ROI 다. \"AI가 좋다는 건 다 안다. 얼마나 회수되는지를 모를 뿐이다\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션은 Devin 세션마다 작업 종류를 분류하고 사람 소요 시간을 계산해 \"사람 환산 작업시간\" 으로 표현한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e일부 엔터프라이즈 계약에 최대 1000만 달러 한도의 생산성 보증을 넣었다. 약속한 가치에 못 미치면 회사가 차액을 부담한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e판매 기준이 좌석 · 라이선스 수에서 \"완료한 일의 양\" 으로 이동한다는 것이 코그니션의 주장이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"12개월 프로젝트를 1개월에\" 는 가능하지만 전제가 있다. 고객에게 먼저 사람이 하면 얼마나 걸리는지 묻고, 무엇을 맡길지 함께 정한다. 업무가 정리되지 않고 코드 · 데이터 접근과 검증 기준이 없으면 효과는 제한된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"ROI 를 측정하지 못하면 AI 도 IT 비용이 된다\" 는 것이 기사 소제목의 요지다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — ROI 의 전제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 비용 쪽\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","model-routing-token-economics","org-cognition","task-definition-bottleneck"],"relpath":"wiki/concepts/ai-roi-human-equivalent-hours.md","sources":["S-2026-09-08-002"],"status":"draft","stem":"ai-roi-human-equivalent-hours","summary":"에이전트 세션을 작업 유형별로 분류해 사람이 했다면 걸렸을 시 실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e구성 요소: AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 사람 승인 단계를 플레이북으로 가르친다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 환경(크루AI 워크) 은 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, AI 크루는 여러 시스템을 오가며 하나의 일을 처리하되 역할 · 권한 · 기억을 유지한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e정보 탐색 순서는 '시맨틱 퍼스트, 벡터 세컨드': 의도와 업무 파악 → 규정 · 절차 · 접근권한 확인 → 허용 범위 안에서 검색 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e완료 판정은 실제 결과 기준: 도구 호출 성공과 업무 완료를 구분하고 결재 문서 생성 여부까지 확인한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e일할수록 조직 지식 · 절차가 쌓여 기업의 디지털 자산이 된다는 것이 판매 논리다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 결론의 다른 관점: 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e; 코그니션은 하네스 감독 · VM 격리 · FDE 로 실행 환경을 판다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e기사가 지적하듯 각 AI 의 접근 범위 · 자율 판단 범위 · 실행 기록 · 데이터 소유 · 오류 책임은 도입 과정에서 검증해야 할 과제로 남아 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e. 감독자 역량 침식 문제 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e 는 이 범주의 제품이 아직 다루지 않는 축이다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e · \u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e · \u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 런타임이 다루지 않는 사람 쪽 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e · \u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","human-oversight-erosion","org-cognition","org-crewon-ai","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/concepts/ai-workforce-runtime.md","sources":["S-2026-09-09-002"],"status":"draft","stem":"ai-workforce-runtime","summary":"모델이 아니라 역할 · 업무지식 · 권한 · 플레이북(순서와 승인) · 기억 · 실행 기록을 갖춘 실행 환경을 파는 제품 범주. '고객이 사는 것은 모델이 일하는 환경'","system":false,"text":"정의\nAI 에이전트가 직원처럼 일하려면 역할, 업무지식과 회사 규정, 업무시스템 권한, 일하는 순서, 판단이 어려울 때의 보고 체계가 필요하다는 전제에서, 이 요소들을 설정 · 운영하는 기반을 제품으로 만든 범주. 크루온AI 는 이를 \"기업용 AI 에이전트 런타임\" 또는 \"AI 워크포스 런타임\" 이라고 부른다 [S-2026-09-09-002].\n근거 있는 사실\n구성 요소: AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 사람 승인 단계를 플레이북으로 가르친다 [S-2026-09-09-002]\n실행 환경(크루AI 워크) 은 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, AI 크루는 여러 시스템을 오가며 하나의 일을 처리하되 역할 · 권한 · 기억을 유지한다 [S-2026-09-09-002]\n정보 탐색 순서는 '시맨틱 퍼스트, 벡터 세컨드': 의도와 업무 파악 → 규정 · 절차 · 접근권한 확인 → 허용 범위 안에서 검색 [S-2026-09-09-002]\n완료 판정은 실제 결과 기준: 도구 호출 성공과 업무 완료를 구분하고 결재 문서 생성 여부까지 확인한다 [S-2026-09-09-002]\n일할수록 조직 지식 · 절차가 쌓여 기업의 디지털 자산이 된다는 것이 판매 논리다 [S-2026-09-09-002]\n같은 결론의 다른 관점: 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요하다 [S-2026-09-09-004]; 코그니션은 하네스 감독 · VM 격리 · FDE 로 실행 환경을 판다 [S-2026-09-08-002]\n모순 · 논쟁\n기사가 지적하듯 각 AI 의 접근 범위 · 자율 판단 범위 · 실행 기록 · 데이터 소유 · 오류 책임은 도입 과정에서 검증해야 할 과제로 남아 있다 [S-2026-09-09-002]. 감독자 역량 침식 문제 [S-2026-09-08-003] 는 이 범주의 제품이 아직 다루지 않는 축이다.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nagent-governance-guardrails · task-definition-bottleneck · task-level-agent-evaluation\nhuman-oversight-erosion — 런타임이 다루지 않는 사람 쪽 문제\norg-crewon-ai · org-cognition\nS-2026-09-09-002-crewon-ai-agent-runtime","title":"AI 워크포스 런타임: 에이전트를 직원처럼 채용 · 교육 · 관리하는 제품 범주","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["cloud agent","클라우드 코딩 에이전트"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","agent-governance-guardrails","ai-agents-enterprise-adoption","local-model-24gb-boundary","proactive-agent","product-devin","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e사람이 과제를 정의하면 별도의 클라우드 컴퓨터 환경에서 일정 시간 독립적으로 실행하는 에이전트. 코드를 쓰는 데 그치지 않고 애플리케이션을 실행 · 재현 · 테스트해 작동을 확인한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAI 코딩 사용 방식은 자동완성 → 대화 → 코드베이스 컨텍스트 → 에이전트 → 클라우드 에이전트 순으로 약 6개월마다 바뀌어 왔다고 제프 왕은 말했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션 데이터에서 IDE 사용보다 클라우드 에이전트 사용이 늘고 있다. 개발자가 화면 앞에 있을 필요가 없기 때문이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e독립 실행 환경이 있으면 \"그럴듯한 코드\" 와 \"실제로 작동하는 코드\" 의 차이를 오류 발견 · 수정 · 재실행 반복으로 메울 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e한 사람이 20개의 클라우드 에이전트를 띄워 큰 프로젝트를 나눠 맡길 수 있어, 생산성 척도가 \"한 명이 얼마나 빨라지나\" 에서 \"몇 개 작업을 동시에 위임 · 관리하나\" 로 바뀐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e각 작업을 독립 VM 에서 실행하고 하네스가 세션을 감독해 과제 이탈을 감지한다는 것이 코그니션의 통제 방식이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 클라우드 에이전트 다음 단계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 위임이 작동하기 위한 전제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e — 대표 구현\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","proactive-agent","product-devin","task-definition-bottleneck"],"relpath":"wiki/concepts/cloud-agent.md","sources":["S-2026-09-08-002"],"status":"draft","stem":"cloud-agent","summary":"개발자 노트북이 아닌 별도 클라우드 실행 환경(OS · 브라우저 · 저장소 · DB) 에서 과제를 끝까지 수행하는 AI 에이전트 형태","system":false,"text":"정의\n사람이 과제를 정의하면 별도의 클라우드 컴퓨터 환경에서 일정 시간 독립적으로 실행하는 에이전트. 코드를 쓰는 데 그치지 않고 애플리케이션을 실행 · 재현 · 테스트해 작동을 확인한다 [S-2026-09-08-002].\n근거 있는 사실\nAI 코딩 사용 방식은 자동완성 → 대화 → 코드베이스 컨텍스트 → 에이전트 → 클라우드 에이전트 순으로 약 6개월마다 바뀌어 왔다고 제프 왕은 말했다 [S-2026-09-08-002]\n코그니션 데이터에서 IDE 사용보다 클라우드 에이전트 사용이 늘고 있다. 개발자가 화면 앞에 있을 필요가 없기 때문이다 [S-2026-09-08-002]\n독립 실행 환경이 있으면 \"그럴듯한 코드\" 와 \"실제로 작동하는 코드\" 의 차이를 오류 발견 · 수정 · 재실행 반복으로 메울 수 있다 [S-2026-09-08-002]\n한 사람이 20개의 클라우드 에이전트를 띄워 큰 프로젝트를 나눠 맡길 수 있어, 생산성 척도가 \"한 명이 얼마나 빨라지나\" 에서 \"몇 개 작업을 동시에 위임 · 관리하나\" 로 바뀐다 [S-2026-09-08-002]\n각 작업을 독립 VM 에서 실행하고 하네스가 세션을 감독해 과제 이탈을 감지한다는 것이 코그니션의 통제 방식이다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nproactive-agent — 클라우드 에이전트 다음 단계\ntask-definition-bottleneck — 위임이 작동하기 위한 전제\nproduct-devin — 대표 구현\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"클라우드 에이전트","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-08"},{"aliases":["distillation 방어","모델 추출 방어","model extraction defense"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","_unsorted","knowledge-distillation","on-policy-distillation","org-anthropic","org-deepseek","small-model-self-improvement-loop"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델 출력이 유용할수록 그것은 좋은 학습 데이터가 되므로, 다른 모델의 학습 가능성을 완전히 없애려면 사람에게도 유용한 답을 주지 못하게 된다는 구조적 한계. 그래서 방어의 목표는 차단이 아니라 대규모 능력 추출을 느리고 비싸게 만드는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eReasoning trace 를 숨기면 정보량이 가장 많은 경로 하나는 막히지만, 최종 답변 · 반복 질문의 응답 변화 · 비평 · 후보 순위 · 코드 수정안 · 도구 사용 순서와 테스트 결과가 모두 학습 신호로 남는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코딩 에이전트의 대량 코드 작성, 교육 서비스의 대량 첨삭은 정상 업무이면서 동시에 post-training 데이터 수집일 수 있다. 요청 형태만으로는 구별되지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e현실적 방어 수단: 계정 · 결제수단 분산 패턴 탐지, 동일 능력을 체계적으로 훑는 프롬프트 탐지, 비정상 계정 생성 · 지역 우회 차단, rate limit, 강화된 신원확인, 계정 간 행동 분석, 출력 식별 신호, benchmark 유사 대량 질의 탐지, 기업 간 계약 · API 약관 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 수단들은 추출 비용(계정 · API 호출 · 시간 · 우회 인력) 을 높여 경제성을 떨어뜨릴 뿐, 수학적으로 불가능하게 만들지는 못한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e판단 기준: \"성능 향상을 만든 학습 신호가 어디서 왔는가\". 공개 문제와 독립 verifier 만으로 스스로 발견했다면 결과가 비슷해도 distillation 이 아니고, 특정 teacher 의 답변 · 판단 · 교정 · 순위 · 행동 경로가 지속적 · 인과적 신호였다면 trace 를 복사하지 않았어도 넓은 의미의 distillation 이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 의 행위를 \"산업적 규모의 distillation 공격\" 으로 규정하고 개별 기업 대응으로는 부족하다며 공동 대응을 요구했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","knowledge-distillation","on-policy-distillation","org-anthropic","org-deepseek"],"relpath":"wiki/concepts/distillation-defense-limits.md","sources":["S-2026-09-08-004"],"status":"draft","stem":"distillation-defense-limits","summary":"정상 사용과 distillation 목적 사용이 구별되지 않아 완벽 방어는 불가능하며, 현실적 방어는 비용을 높이는 것. 판단 기준은 알고리즘이 아니라 학습 신호의 출처","system":false,"text":"정의\n모델 출력이 유용할수록 그것은 좋은 학습 데이터가 되므로, 다른 모델의 학습 가능성을 완전히 없애려면 사람에게도 유용한 답을 주지 못하게 된다는 구조적 한계. 그래서 방어의 목표는 차단이 아니라 대규모 능력 추출을 느리고 비싸게 만드는 것이다 [S-2026-09-08-004].\n근거 있는 사실\nReasoning trace 를 숨기면 정보량이 가장 많은 경로 하나는 막히지만, 최종 답변 · 반복 질문의 응답 변화 · 비평 · 후보 순위 · 코드 수정안 · 도구 사용 순서와 테스트 결과가 모두 학습 신호로 남는다 [S-2026-09-08-004]\n코딩 에이전트의 대량 코드 작성, 교육 서비스의 대량 첨삭은 정상 업무이면서 동시에 post-training 데이터 수집일 수 있다. 요청 형태만으로는 구별되지 않는다 [S-2026-09-08-004]\n현실적 방어 수단: 계정 · 결제수단 분산 패턴 탐지, 동일 능력을 체계적으로 훑는 프롬프트 탐지, 비정상 계정 생성 · 지역 우회 차단, rate limit, 강화된 신원확인, 계정 간 행동 분석, 출력 식별 신호, benchmark 유사 대량 질의 탐지, 기업 간 계약 · API 약관 [S-2026-09-08-004]\n이 수단들은 추출 비용(계정 · API 호출 · 시간 · 우회 인력) 을 높여 경제성을 떨어뜨릴 뿐, 수학적으로 불가능하게 만들지는 못한다 [S-2026-09-08-004]\n판단 기준: \"성능 향상을 만든 학습 신호가 어디서 왔는가\". 공개 문제와 독립 verifier 만으로 스스로 발견했다면 결과가 비슷해도 distillation 이 아니고, 특정 teacher 의 답변 · 판단 · 교정 · 순위 · 행동 경로가 지속적 · 인과적 신호였다면 trace 를 복사하지 않았어도 넓은 의미의 distillation 이다 [S-2026-09-08-004]\nAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 의 행위를 \"산업적 규모의 distillation 공격\" 으로 규정하고 개별 기업 대응으로는 부족하다며 공동 대응을 요구했다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-distillation · on-policy-distillation\norg-anthropic · org-deepseek\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo","title":"Distillation 방어의 한계와 판단 기준","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["FDE","포워드 디플로이드 엔지니어","전진 배치 엔지니어"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","org-cognition","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e제품 설명이나 설치 지원이 아니라, 고객의 코드베이스와 업무 맥락을 깊이 이해해야 하는 어려운 프로젝트(대규모 마이그레이션, 레거시 현대화) 를 직접 맡는 엔지니어. AI 시대의 FDE 는 \"고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람\" 이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e코그니션은 창업해도 될 수준의 프로그래머를 FDE 로 뽑는다. 창업팀과 다수 엔지니어가 IOI 등 올림피아드 메달리스트다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFDE 의 목표는 프로젝트를 대신 끝내는 것이 아니라 고객이 스스로 같은 방식으로 일하게 만드는 것이다. 계약 후 전환 관리자와 Applied AI 인력을 함께 투입해 프로세스를 정착시킨다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e단순 코딩에서는 도구 간 차이가 작지만, 레거시 분석 · 얽힌 코드와 데이터 이해 · 운영환경 적용에서 차이가 커진다는 것이 이 직무의 존재 이유다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e전통 SI · 솔루션 엔지니어가 \"시스템을 구축해주는 사람\" 이었다면 FDE 는 문제 재구성 역할이며, 제품 지식보다 구조적 사고와 디버깅 능력이 중요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","org-cognition","task-definition-bottleneck"],"relpath":"wiki/concepts/forward-deployed-engineer.md","sources":["S-2026-09-08-002"],"status":"draft","stem":"forward-deployed-engineer","summary":"고객 조직 안에 들어가 고객의 문제를 AI 가 풀 수 있는 형태로 재설계하는 엔지니어 직무. 대신 끝내주기가 아니라 고객의 자립이 목표","system":false,"text":"정의\n제품 설명이나 설치 지원이 아니라, 고객의 코드베이스와 업무 맥락을 깊이 이해해야 하는 어려운 프로젝트(대규모 마이그레이션, 레거시 현대화) 를 직접 맡는 엔지니어. AI 시대의 FDE 는 \"고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람\" 이다 [S-2026-09-08-002].\n근거 있는 사실\n코그니션은 창업해도 될 수준의 프로그래머를 FDE 로 뽑는다. 창업팀과 다수 엔지니어가 IOI 등 올림피아드 메달리스트다 [S-2026-09-08-002]\nFDE 의 목표는 프로젝트를 대신 끝내는 것이 아니라 고객이 스스로 같은 방식으로 일하게 만드는 것이다. 계약 후 전환 관리자와 Applied AI 인력을 함께 투입해 프로세스를 정착시킨다 [S-2026-09-08-002]\n단순 코딩에서는 도구 간 차이가 작지만, 레거시 분석 · 얽힌 코드와 데이터 이해 · 운영환경 적용에서 차이가 커진다는 것이 이 직무의 존재 이유다 [S-2026-09-08-002]\n전통 SI · 솔루션 엔지니어가 \"시스템을 구축해주는 사람\" 이었다면 FDE 는 문제 재구성 역할이며, 제품 지식보다 구조적 사고와 디버깅 능력이 중요하다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\ntask-definition-bottleneck\norg-cognition\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"FDE (Forward Deployed Engineer)","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-08"},{"aliases":["fully open source model","완전 오픈소스","오픈웨이트 vs 오픈소스"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","open-local-models","org-mbzuai","product-k2-horizon"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"오픈소스 AI\" 라고 불리는 대부분은 가중치만 공개하는 오픈웨이트다. 완전 오픈소스는 여기에 소스 코드, 전체 학습 데이터셋, 평가 · 학습 레시피(방법론), 학습 과정의 중간 체크포인트를 더해 제3자가 학습 자체를 재현하고 검증할 수 있게 하는 공개 방식이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eK2 Horizon 은 이 방식으로 6종을 Apache 2.0 라이선스로 허깅페이스에 공개했으며, IFM 은 이를 \"AI 역사상 최대 규모의 완전 오픈소스 모델 발표\" 라고 주장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e최종 결과물만 공개하는 기존 방식과 달리 중간 체크포인트를 함께 배포해 학습 과정의 변화를 추적할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-k2-horizon\" class=\"wl\"\u003eproduct-k2-horizon\u003c/a\u003e — 대표 사례\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-mbzuai\" class=\"wl\"\u003eorg-mbzuai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" class=\"wl\"\u003eS-2026-09-08-005-uae-k2-horizon-open-source\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-005-uae-k2-horizon-open-source","open-local-models","org-mbzuai","product-k2-horizon"],"relpath":"wiki/concepts/fully-open-source-model.md","sources":["S-2026-09-08-005"],"status":"draft","stem":"fully-open-source-model","summary":"가중치만 공개하는 오픈웨이트와 달리 소스 코드 · 학습 데이터 · 학습 레시피 · 중간 체크포인트까지 공개해 재현 가능한 모델 공개
