":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-002-astra-system-prompt-leak-claim","S-2026-09-15-003-harness-engineering-guide-provenance","S-2026-09-15-004-astra-verified-and-hardware-shift","ai-agents-enterprise-adoption","ai-workforce-runtime","cot-monitorability-erosion","harness-engineering-discipline","human-oversight-erosion","proactive-agent","product-gpt-6-astra","sovereign-ai","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트가 기업 내부 데이터 · 도구 · 시스템에 연결되어야 실제 업무를 하지만, 연결이 많을수록 보안과 통제 문제가 커진다. 그래서 거버넌스와 가드레일을 먼저 마련하고 그다음 지능을 풀어놓아야 한다는 원칙 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e금융에서 에이전트가 확산되려면 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 해결해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e요청하지 않은 AI 가 시스템을 수정하기 시작하면 무엇까지 허용할지, 어떤 작업은 사람 승인이 필요한지, 오류 시 누가 책임지는지가 새로운 경영 이슈가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션의 통제 방식: 세션마다 하네스가 감독해 과제 이탈 · 이상 행동을 감지하고, 각 작업을 독립 VM 에서 실행해 실제 결과를 검증한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"AGI 가 실재하는데 비밀번호를 바꿀 권한까지 갖고 있다면 문제다\" — 지능보다 접근권한이 위험의 원천이라는 비유 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e소버린 AI 의 요소로도 데이터 위치 · 접근 범위 · 실행 기록 통제가 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 조건의 구체 목록: 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한, 그리고 어떤 도구를 연결할지 · 어느 단계에서 승인을 받을지 · 실패 시 어디서 멈출지 · 중복 실행을 어떻게 막을지 · 작업 내역을 어떻게 남길지. 모델 성능이 오를수록 이 설계의 비중이 커진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경이 가능해져도 이미 실행된 행동(삭제 · 외부 발송) 은 되돌릴 수 없으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e감시 수단의 신뢰도가 모델 세대와 함께 변한다. 바깥 하네스가 중간 사고사슬을 검색해 걸러내는 방식은 여전히 작동하지만, 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e제품 구현 사례: 크루온AI 는 AI 크루마다 권한을 설정하고 플레이북으로 승인 단계를 정하며(예: 일정 금액 이상 구매는 사람 승인 강제), 범위를 넘으면 담당자에게 보고 · 승인 요청하게 한다. 접근 범위 · 자율 판단 범위 · 실행 기록 · 책임 범위는 도입 시 검증 과제로 남긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e승인 지점을 두는 것만으로는 부족하다. 반복 승인은 승인 피로를 낳아 사람의 역할이 상징적이 되므로, 승인 시점을 신중히 설계하고 승인 근거를 설명하게 해야 한다는 처방이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e · \u003ca href=\"#/sovereign-ai\" class=\"wl\"\u003esovereign-ai\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 자율성이 커질수록 이 문제가 커진다\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — VM 격리는 가드레일의 한 형태\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 시스템 통제의 반대편, 사람 쪽 역량 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e · \u003ca href=\"#/cot-monitorability-erosion\" class=\"wl\"\u003ecot-monitorability-erosion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/harness-engineering-discipline\" class=\"wl\"\u003eharness-engineering-discipline\u003c/a\u003e — 실행 환경을 공학으로 다루는 흐름\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" class=\"wl\"\u003eS-2026-09-15-003-harness-engineering-guide-provenance\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-003-harness-engineering-guide-provenance","S-2026-09-15-004-astra-verified-and-hardware-shift","ai-agents-enterprise-adoption","cloud-agent","cot-monitorability-erosion","harness-engineering-discipline","human-oversight-erosion","proactive-agent","sovereign-ai"],"relpath":"wiki/concepts/agent-governance-guardrails.md","sources":["S-2026-09-08-002","S-2026-09-08-003","S-2026-09-09-004","S-2026-09-09-002","S-2026-09-15-004","S-2026-09-15-003"],"status":"draft","stem":"agent-governance-guardrails","summary":"에이전트가 기업 시스템에 접근 · 수정할 때의 허용 범위, 승인 지점, 책임소재, 실행 기록 통제. 경쟁력과 위험이 같은 곳(연결) 에서 나온다","system":false,"text":"정의\n에이전트가 기업 내부 데이터 · 도구 · 시스템에 연결되어야 실제 업무를 하지만, 연결이 많을수록 보안과 통제 문제가 커진다. 그래서 거버넌스와 가드레일을 먼저 마련하고 그다음 지능을 풀어놓아야 한다는 원칙 [S-2026-09-08-002].\n근거 있는 사실\n금융에서 에이전트가 확산되려면 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 해결해야 한다 [S-2026-09-08-002]\n요청하지 않은 AI 가 시스템을 수정하기 시작하면 무엇까지 허용할지, 어떤 작업은 사람 승인이 필요한지, 오류 시 누가 책임지는지가 새로운 경영 이슈가 된다 [S-2026-09-08-002]\n코그니션의 통제 방식: 세션마다 하네스가 감독해 과제 이탈 · 이상 행동을 감지하고, 각 작업을 독립 VM 에서 실행해 실제 결과를 검증한다 [S-2026-09-08-002]\n\"AGI 가 실재하는데 비밀번호를 바꿀 권한까지 갖고 있다면 문제다\" — 지능보다 접근권한이 위험의 원천이라는 비유 [S-2026-09-08-002]\n소버린 AI 의 요소로도 데이터 위치 · 접근 범위 · 실행 기록 통제가 제시된다 [S-2026-09-08-002]\n실행 조건의 구체 목록: 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한, 그리고 어떤 도구를 연결할지 · 어느 단계에서 승인을 받을지 · 실패 시 어디서 멈출지 · 중복 실행을 어떻게 막을지 · 작업 내역을 어떻게 남길지. 모델 성능이 오를수록 이 설계의 비중이 커진다 [S-2026-09-09-004]\n실행 중 지시 변경이 가능해져도 이미 실행된 행동(삭제 · 외부 발송) 은 되돌릴 수 없으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 [S-2026-09-09-004]\n감시 수단의 신뢰도가 모델 세대와 함께 변한다. 바깥 하네스가 중간 사고사슬을 검색해 걸러내는 방식은 여전히 작동하지만, 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다 [S-2026-09-15-004]\n제품 구현 사례: 크루온AI 는 AI 크루마다 권한을 설정하고 플레이북으로 승인 단계를 정하며(예: 일정 금액 이상 구매는 사람 승인 강제), 범위를 넘으면 담당자에게 보고 · 승인 요청하게 한다. 접근 범위 · 자율 판단 범위 · 실행 기록 · 책임 범위는 도입 시 검증 과제로 남긴다 [S-2026-09-09-002]\n승인 지점을 두는 것만으로는 부족하다. 반복 승인은 승인 피로를 낳아 사람의 역할이 상징적이 되므로, 승인 시점을 신중히 설계하고 승인 근거를 설명하게 해야 한다는 처방이 있다 [S-2026-09-08-003]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption · sovereign-ai — 상위 주제\nproactive-agent — 자율성이 커질수록 이 문제가 커진다\ncloud-agent — VM 격리는 가드레일의 한 형태\nhuman-oversight-erosion — 시스템 통제의 반대편, 사람 쪽 역량 문제\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-002-crewon-ai-agent-runtime\nS-2026-09-15-004-astra-verified-and-hardware-shift · cot-monitorability-erosion\nharness-engineering-discipline — 실행 환경을 공학으로 다루는 흐름\nS-2026-09-15-003-harness-engineering-guide-provenance\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"에이전트 거버넌스와 가드레일: 권한 · 책임 · 감사로그","topics":["ai-agents-enterprise-adoption","sovereign-ai"],"type":"concept","updated":"2026-09-15"},{"aliases":["Agent-Native","에이전트 네이티브","실행 궤적 학습"],"back":["S-2026-09-09-008-neohorse-agent-native-model","beyond-parameter-scaling","org-tokenrhythm","post-training-agent-capability","product-neohorse","routing-harness"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e기존 LLM 이 질문과 답변 · 논문 · 위키 · 뉴스로 '무엇을 말해야 하는가' 를 배웠다면, 에이전트 네이티브 모델은 에이전트가 작업을 완수하기까지의 전 과정을 담은 실행 궤적으로 '어떻게 일을 끝내는가' 를 배운다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e궤적에 담기는 것: 라우터가 작업을 어떻게 판단했는지, 어떤 모델을 선택했는지, 그 모델이 어떤 도구를 호출했는지, 환경에서 어떤 피드백을 받았는지, 오류 시 어떻게 경로를 수정했는지 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e차이의 예: 기초 모델은 최신 제약이 담긴 이메일을 읽지 않아 만료된 정보로 일정을 짰지만, 네오호스는 이메일을 읽고 제약을 반영해 재계산 · 검증 후 올바른 위치에 저장했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e훈련 파이프라인: 궤적 생성 → 구조적 검증과 6개 차원(목표 달성 · 증거 일관성 · 오류 복구 등) 품질 평가 → 라우팅 유도 커리큘럼 학습과 온폴리시 증류로 주입 → 갱신 모델이 다시 하네스의 선택지가 되는 선순환 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성과: NeoHorse-1-4B 가 Qwen3.5-4B 기반 후훈련으로 10개 벤치마크 매크로 평균 58.94 → 64.87, 11개 에이전트 벤치마크 중 5개에서 Qwen3.5-9B 기초 모델을 능가 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 구조는 재귀적 자기 개선(RSI) 의 단일 루프를 엔지니어링으로 검증한 것으로 규정된다. 반복 시 지속적 향상 여부는 미검증이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e같은 결론에 이르는 다른 경로들이 있다: 도구 사용 중심 후훈련(StartLux) \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e, 업무 결과 평가 · 실패 재학습(Shopify) \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e, 스킬을 위키로 축적(WikiSkill) \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e. 어느 경로가 우세한지는 이 위키의 자료로 판정할 수 없다.\u003c/li\u003e\n\u003cli\u003e온폴리시 증류가 학습 신호로 쓰이므로, 교사 모델이 외부 상용 모델이라면 distillation 경계 문제와 맞물린다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e — 궤적을 만들어내는 인프라\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e · \u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e · \u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-neohorse\" class=\"wl\"\u003eproduct-neohorse\u003c/a\u003e · \u003ca href=\"#/org-tokenrhythm\" class=\"wl\"\u003eorg-tokenrhythm\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model","beyond-parameter-scaling","on-policy-distillation","org-tokenrhythm","post-training-agent-capability","product-neohorse","routing-harness","skill-evolution-persistent-wiki","small-model-self-improvement-loop"],"relpath":"wiki/concepts/agent-native-model.md","sources":["S-2026-09-09-008"],"status":"draft","stem":"agent-native-model","summary":"인터넷 텍스트가 아니라 에이전트의 실행 궤적(판단 · 도구 호출 · 환경 피드백 · 오류 복구) 을 학습 말뭉치로 삼아 '정답' 이 아닌 '문제 해결의 절차' 를 배우는 모델","system":false,"text":"정의\n기존 LLM 이 질문과 답변 · 논문 · 위키 · 뉴스로 '무엇을 말해야 하는가' 를 배웠다면, 에이전트 네이티브 모델은 에이전트가 작업을 완수하기까지의 전 과정을 담은 실행 궤적으로 '어떻게 일을 끝내는가' 를 배운다 [S-2026-09-09-008].\n근거 있는 사실\n궤적에 담기는 것: 라우터가 작업을 어떻게 판단했는지, 어떤 모델을 선택했는지, 그 모델이 어떤 도구를 호출했는지, 환경에서 어떤 피드백을 받았는지, 오류 시 어떻게 경로를 수정했는지 [S-2026-09-09-008]\n차이의 예: 기초 모델은 최신 제약이 담긴 이메일을 읽지 않아 만료된 정보로 일정을 짰지만, 네오호스는 이메일을 읽고 제약을 반영해 재계산 · 검증 후 올바른 위치에 저장했다 [S-2026-09-09-008]\n훈련 파이프라인: 궤적 생성 → 구조적 검증과 6개 차원(목표 달성 · 증거 일관성 · 오류 복구 등) 품질 평가 → 라우팅 유도 커리큘럼 학습과 온폴리시 증류로 주입 → 갱신 모델이 다시 하네스의 선택지가 되는 선순환 [S-2026-09-09-008]\n성과: NeoHorse-1-4B 가 Qwen3.5-4B 기반 후훈련으로 10개 벤치마크 매크로 평균 58.94 → 64.87, 11개 에이전트 벤치마크 중 5개에서 Qwen3.5-9B 기초 모델을 능가 [S-2026-09-09-008]\n이 구조는 재귀적 자기 개선(RSI) 의 단일 루프를 엔지니어링으로 검증한 것으로 규정된다. 반복 시 지속적 향상 여부는 미검증이다 [S-2026-09-09-008]\n모순 · 논쟁\n같은 결론에 이르는 다른 경로들이 있다: 도구 사용 중심 후훈련(StartLux) [S-2026-09-08-006], 업무 결과 평가 · 실패 재학습(Shopify) [S-2026-09-09-003], 스킬을 위키로 축적(WikiSkill) [S-2026-09-09-006]. 어느 경로가 우세한지는 이 위키의 자료로 판정할 수 없다.\n온폴리시 증류가 학습 신호로 쓰이므로, 교사 모델이 외부 상용 모델이라면 distillation 경계 문제와 맞물린다 [S-2026-09-08-004]\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\nrouting-harness — 궤적을 만들어내는 인프라\npost-training-agent-capability · small-model-self-improvement-loop · skill-evolution-persistent-wiki\non-policy-distillation\nproduct-neohorse · org-tokenrhythm\nS-2026-09-09-008-neohorse-agent-native-model","title":"에이전트 네이티브 모델","topics":["beyond-parameter-scaling"],"type":"concept","updated":"2026-09-09"},{"aliases":["AI 에이전트 도입","enterprise AI agents","에이전트 시대"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-010-cognition-interview-ax-view","agent-governance-guardrails","ai-roi-human-equivalent-hours","ai-workforce-runtime","ax-organizational-redesign","cloud-agent","forward-deployed-engineer","human-oversight-erosion","model-routing-token-economics","org-anthropic","org-cognition","org-crewon-ai","org-openai","person-jeff-wang","proactive-agent","product-devin","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003eAI 의 경쟁 축은 답을 잘 하는 것에서 사람 대신 일을 끝까지 수행하는 것으로 옮겨가고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e. 코딩 영역에서는 자동완성 → 대화 → 에이전트 → 클라우드 에이전트로 사용 방식이 약 6개월 주기로 바뀌었고, 다음은 시키기 전에 움직이는 능동형 에이전트라는 전망이 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 범용 영역에서도 웹 · 문서 · 코드 실행 · 소프트웨어 사용을 묶어 복잡한 작업을 수행하는 모델이 나왔다고 소개된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e. 2026-09-03 공개된 GPT-6 Astra 는 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도로 긴 업무를 끝까지 처리하도록 설계돼, 평가 단위를 \"답변 한 번\" 에서 \"완료된 업무 한 건\" 으로 옮긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e도입의 병목은 모델 성능이 아니다. 무엇을 맡길지, 무엇이 완료인지(테스트 통과 · 실행 검증) 를 정의하고 프로젝트를 위임 단위로 쪼개는 일이 안 되면 강한 모델을 써도 기간이 줄지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 성과는 사람 환산 작업시간 같은 지표로 측정해야 하며, 측정하지 못하면 AI 는 IT 비용이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 같은 방향에서 벤치마크 대신 업무 완료율 · 사람 개입 횟수 · 검증 시간 · 재시도와 검수를 합친 비용을 재야 한다는 실무 관점이 더해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e. 최상위 모델은 Sol 의 2.5배 가격이라 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e. 비용 쪽에서는 모든 작업에 최상위 모델을 쓰면 비용이 10배가 되므로 작업별 모델 라우팅(오픈웨이트 포함) 이 기업 AI 의 핵심 경쟁력으로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e통제는 두 축이다. 시스템 쪽에서는 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 정하고, 격리 실행과 하네스 감독으로 가드레일을 둔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 사람 쪽에서는 승인 버튼이 있다고 감독이 성립하지 않는다. 승인 피로와 자동화의 아이러니로 감독자의 역량이 침식되므로 전략적 마찰을 설계에 넣어야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e. 에이전트의 경쟁력과 위험은 같은 곳(연결과 접근권한) 에서 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 모델 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건과, 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 경쟁력이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e. 한국에서는 크루온AI 가 이 실행 환경 자체를 제품으로 내놓았다: AI 크루를 채용하듯 조직도에 넣고 역할 · 권한 · 플레이북 · 기억을 설정하며, 도구 호출과 업무 완료를 구분해 실제 결과로 판정한다. \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라는 말이 이 주제의 현재 결론에 가깝다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e. 그 환경을 만드는 일은 결국 조직의 몫이다. AI 를 도입하는 것과 AI 가 일하도록 회사를 다시 설계하는 것은 다른 문제이며, 한국과 미국 선두 기업의 격차는 기술보다 조직에 있다는 진단이 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e모델 쪽에서는 실물 경제가 만능 제너럴리스트보다 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트를 원하며, 그 능력은 도구 선택 · 다단계 실행 · 검증을 가르치는 후훈련 층에서 만들어진다는 관찰이 더해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 민감 데이터 산업에서는 그런 에이전트가 로컬에서 도는 것이 전제가 되어간다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 독립 실행 환경을 가진 에이전트\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 다음 단계로 예측되는 능동형 에이전트\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 도입 병목은 업무 정의와 완료 조건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — ROI 측정과 생산성 보증\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 작업별 모델 선택과 토큰 비용\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e — 고객 문제를 AI 가 풀 수 있는 형태로 바꾸는 직무\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 시스템 쪽 통제: 권한 · 책임 · 감사로그\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 사람 쪽 통제: 승인 피로 · 자동화의 아이러니\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 평가 단위 = 완료된 업무 한 건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — 실행 환경을 제품으로: 채용 · 권한 · 플레이북 · 기억\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ax-organizational-redesign\" class=\"wl\"\u003eax-organizational-redesign\u003c/a\u003e — AX 는 도입이 아니라 조직 재설계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 스페셜리스트 에이전트 능력의 출처 (open-local-models 와 공유)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e · \u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e · \u003ca href=\"#/person-jeff-wang\" class=\"wl\"\u003eperson-jeff-wang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e · \u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e — 한국 에이전트 런타임\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e — 스페셜리스트 로컬 에이전트 관점\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e — GPT-6 Astra 와 실행 조건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e — 크루온AI 에이전트 런타임\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e — 같은 인터뷰의 기자 후기, 한국 AX 진단\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-03 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e 디지털데일리, 크루온AI 기업용 AI 에이전트 런타임 출시 보도\u003c/li\u003e\n\u003cli\u003e2026-09-03 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e OpenAI GPT-6 Astra 공개 — 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도, Sol 대비 2.5배 가격\u003c/li\u003e\n\u003cli\u003e2026-09-08 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e 에이전트 특화 로컬 모델(StartLux) 분석 — 스페셜리스트 에이전트 · 후훈련\u003c/li\u003e\n\u003cli\u003e2026-09-08 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e GPT-6 Astra 출시를 계기로 인간 감독 침식 보고서(arXiv 2608.23642) 소개\u003c/li\u003e\n\u003cli\u003e2026-08-31 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e 더밀크, 코그니션 제프 왕 인터뷰 게재 — 클라우드 에이전트 · ROI · 모델 라우팅 · 한국 진출\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e사람 환산 작업시간 지표를 우리 고객 제안에 쓸 수 있는가? 산정 방식의 세부(작업 분류, 검증 기준) 가 필요하다\u003c/li\u003e\n\u003cli\u003e승인 피로를 줄이는 승인 지점 설계의 구체 사례가 있는가? (보고서 원문 arXiv 2608.23642 미확보)\u003c/li\u003e\n\u003cli\u003e코그니션의 한국 금융 · 제조 진출이 우리에게 파트너 기회인가 경쟁인가\u003c/li\u003e\n\u003cli\u003e크루온AI(기업 · 공공 구축형, 전문 크루팩) 와 우리 시장은 얼마나 겹치는가\u003c/li\u003e\n\u003cli\u003e고객사의 '업의 정의' 단계를 우리가 유료 작업으로 만들 수 있는가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-09: 크루온AI 기사 공유 — 국내 에이전트 런타임 경쟁 · 협력 후보에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-09: GPT-6 Astra 실무 분석 공유 — 어제의 감독 문제에 이어 실행 조건 · 평가 지표 쪽 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-08: 에이전트의 사업 모델(완료한 일 기준 과금, 생산성 보증) 과 통제(가드레일, 인간 감독) 를 같은 날 공유 — 도입 조건과 리스크를 함께 보는 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-010-cognition-interview-ax-view","agent-governance-guardrails","ai-roi-human-equivalent-hours","ai-workforce-runtime","ax-organizational-redesign","cloud-agent","forward-deployed-engineer","human-oversight-erosion","model-routing-token-economics","org-anthropic","org-cognition","org-crewon-ai","org-openai","person-jeff-wang","post-training-agent-capability","proactive-agent","product-devin","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/topics/ai-agents-enterprise-adoption.md","sources":["S-2026-09-08-002","S-2026-09-08-003","S-2026-09-08-006","S-2026-09-09-004","S-2026-09-09-002","S-2026-09-09-010"],"status":"draft","stem":"ai-agents-enterprise-adoption","summary":"에이전트가 '답하는 AI' 에서 '일을 끝까지 수행하는 AI' 로 바뀌면서 생기는 도입 조건(업무 정의 · ROI · 모델 라우팅) 과 통제 문제(가드레일 · 인간 감독)","system":false,"text":"현재 종합\nAI 의 경쟁 축은 답을 잘 하는 것에서 사람 대신 일을 끝까지 수행하는 것으로 옮겨가고 있다 [S-2026-09-08-002] [S-2026-09-08-003]. 코딩 영역에서는 자동완성 → 대화 → 에이전트 → 클라우드 에이전트로 사용 방식이 약 6개월 주기로 바뀌었고, 다음은 시키기 전에 움직이는 능동형 에이전트라는 전망이 나온다 [S-2026-09-08-002]. 범용 영역에서도 웹 · 문서 · 코드 실행 · 소프트웨어 사용을 묶어 복잡한 작업을 수행하는 모델이 나왔다고 소개된다 [S-2026-09-08-003]. 2026-09-03 공개된 GPT-6 Astra 는 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도로 긴 업무를 끝까지 처리하도록 설계돼, 평가 단위를 \"답변 한 번\" 에서 \"완료된 업무 한 건\" 으로 옮긴다 [S-2026-09-09-004].\n도입의 병목은 모델 성능이 아니다. 무엇을 맡길지, 무엇이 완료인지(테스트 통과 · 실행 검증) 를 정의하고 프로젝트를 위임 단위로 쪼개는 일이 안 되면 강한 모델을 써도 기간이 줄지 않는다 [S-2026-09-08-002]. 성과는 사람 환산 작업시간 같은 지표로 측정해야 하며, 측정하지 못하면 AI 는 IT 비용이 된다 [S-2026-09-08-002]. 같은 방향에서 벤치마크 대신 업무 완료율 · 사람 개입 횟수 · 검증 시간 · 재시도와 검수를 합친 비용을 재야 한다는 실무 관점이 더해진다 [S-2026-09-09-004]. 최상위 모델은 Sol 의 2.5배 가격이라 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 [S-2026-09-09-004]. 비용 쪽에서는 모든 작업에 최상위 모델을 쓰면 비용이 10배가 되므로 작업별 모델 라우팅(오픈웨이트 포함) 이 기업 AI 의 핵심 경쟁력으로 제시된다 [S-2026-09-08-002].\n통제는 두 축이다. 시스템 쪽에서는 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 정하고, 격리 실행과 하네스 감독으로 가드레일을 둔다 [S-2026-09-08-002]. 사람 쪽에서는 승인 버튼이 있다고 감독이 성립하지 않는다. 승인 피로와 자동화의 아이러니로 감독자의 역량이 침식되므로 전략적 마찰을 설계에 넣어야 한다 [S-2026-09-08-003]. 에이전트의 경쟁력과 위험은 같은 곳(연결과 접근권한) 에서 나온다 [S-2026-09-08-002]. 모델 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건과, 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 경쟁력이 된다 [S-2026-09-09-004]. 한국에서는 크루온AI 가 이 실행 환경 자체를 제품으로 내놓았다: AI 크루를 채용하듯 조직도에 넣고 역할 · 권한 · 플레이북 · 기억을 설정하며, 도구 호출과 업무 완료를 구분해 실제 결과로 판정한다. \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라는 말이 이 주제의 현재 결론에 가깝다 [S-2026-09-09-002]. 그 환경을 만드는 일은 결국 조직의 몫이다. AI 를 도입하는 것과 AI 가 일하도록 회사를 다시 설계하는 것은 다른 문제이며, 한국과 미국 선두 기업의 격차는 기술보다 조직에 있다는 진단이 나온다 [S-2026-09-09-010].\n모델 쪽에서는 실물 경제가 만능 제너럴리스트보다 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트를 원하며, 그 능력은 도구 선택 · 다단계 실행 · 검증을 가르치는 후훈련 층에서 만들어진다는 관찰이 더해진다 [S-2026-09-08-006]. 민감 데이터 산업에서는 그런 에이전트가 로컬에서 도는 것이 전제가 되어간다 [S-2026-09-08-006].\n하위 페이지\n개념\ncloud-agent — 독립 실행 환경을 가진 에이전트\nproactive-agent — 다음 단계로 예측되는 능동형 에이전트\ntask-definition-bottleneck — 도입 병목은 업무 정의와 완료 조건\nai-roi-human-equivalent-hours — ROI 측정과 생산성 보증\nmodel-routing-token-economics — 작업별 모델 선택과 토큰 비용\nforward-deployed-engineer — 고객 문제를 AI 가 풀 수 있는 형태로 바꾸는 직무\nagent-governance-guardrails — 시스템 쪽 통제: 권한 · 책임 · 감사로그\nhuman-oversight-erosion — 사람 쪽 통제: 승인 피로 · 자동화의 아이러니\ntask-level-agent-evaluation — 평가 단위 = 완료된 업무 한 건\nai-workforce-runtime — 실행 환경을 제품으로: 채용 · 권한 · 플레이북 · 기억\nax-organizational-redesign — AX 는 도입이 아니라 조직 재설계\npost-training-agent-capability — 스페셜리스트 에이전트 능력의 출처 (open-local-models 와 공유)\n엔티티\norg-cognition · product-devin · person-jeff-wang\norg-openai · product-gpt-6-astra · org-anthropic\norg-crewon-ai — 한국 에이전트 런타임\n소스\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-08-006-local-agent-models-startlux — 스페셜리스트 로컬 에이전트 관점\nS-2026-09-09-004-gpt-6-astra-task-completion — GPT-6 Astra 와 실행 조건\nS-2026-09-09-002-crewon-ai-agent-runtime — 크루온AI 에이전트 런타임\nS-2026-09-09-010-cognition-interview-ax-view — 같은 인터뷰의 기자 후기, 한국 AX 진단\n타임라인\n2026-09-03 [S-2026-09-09-002] 디지털데일리, 크루온AI 기업용 AI 에이전트 런타임 출시 보도\n2026-09-03 [S-2026-09-09-004] OpenAI GPT-6 Astra 공개 — 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도, Sol 대비 2.5배 가격\n2026-09-08 [S-2026-09-08-006] 에이전트 특화 로컬 모델(StartLux) 분석 — 스페셜리스트 에이전트 · 후훈련\n2026-09-08 [S-2026-09-08-003] GPT-6 Astra 출시를 계기로 인간 감독 침식 보고서(arXiv 2608.23642) 소개\n2026-08-31 [S-2026-09-08-002] 더밀크, 코그니션 제프 왕 인터뷰 게재 — 클라우드 에이전트 · ROI · 모델 라우팅 · 한국 진출\n열린 질문\n사람 환산 작업시간 지표를 우리 고객 제안에 쓸 수 있는가? 산정 방식의 세부(작업 분류, 검증 기준) 가 필요하다\n승인 피로를 줄이는 승인 지점 설계의 구체 사례가 있는가? (보고서 원문 arXiv 2608.23642 미확보)\n코그니션의 한국 금융 · 제조 진출이 우리에게 파트너 기회인가 경쟁인가\n크루온AI(기업 · 공공 구축형, 전문 크루팩) 와 우리 시장은 얼마나 겹치는가\n고객사의 '업의 정의' 단계를 우리가 유료 작업으로 만들 수 있는가\n관심 흐름\n2026-09-09: 크루온AI 기사 공유 — 국내 에이전트 런타임 경쟁 · 협력 후보에 대한 관심으로 추정 (추정)\n2026-09-09: GPT-6 Astra 실무 분석 공유 — 어제의 감독 문제에 이어 실행 조건 · 평가 지표 쪽 관심으로 추정 (추정)\n2026-09-08: 에이전트의 사업 모델(완료한 일 기준 과금, 생산성 보증) 과 통제(가드레일, 인간 감독) 를 같은 날 공유 — 도입 조건과 리스크를 함께 보는 관심으로 추정 (추정)","title":"AI 에이전트의 기업 도입: 실행 · 통제 · ROI","topics":[],"type":"topic","updated":"2026-09-09"},{"aliases":["AI PPT 워크플로","시안 대량 생성","문서 제작 절차"],"back":["S-2026-09-09-007-ai-ppt-design-workflow","_unsorted","task-definition-bottleneck"],"cites":["S-2026-09-09-007-ai-ppt-design-workflow"],"confidence":"low","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e생성 모델의 강점(시각적 완성도) 과 약점(텍스트 깨짐) 을 분리해 다루는 제작 절차. 구조와 메시지는 사람이 고정하고, AI 는 같은 조건에서 변형을 대량으로 만들며, 텍스트는 마지막에 별도 단계로 채운다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e밑그림은 사람이 잡아야 하며, AI 가 잡으면 AI 가 시키는 대로 말하는 앵무새가 된다는 것이 글쓴이의 원칙이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e요청 시 스타일 · 말투 · 정보량을 모두 지정하고, 거의 같은 프롬프트로 최소 10개에서 많게는 100개의 시안을 받는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e확정 후 텍스트를 제거한 이미지를 만들고, 그 이미지에 원래 정보를 텍스트로 다시 넣게 하면 폰트 · 장평을 맞춰 준다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 개인 실무 경험 1건이며 재현 조건(사용 모델 · 도구) 은 명시되지 않았다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 사람이 정의하고 AI 가 실행한다는 같은 분업\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" class=\"wl\"\u003eS-2026-09-09-007-ai-ppt-design-workflow\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-007-ai-ppt-design-workflow","task-definition-bottleneck"],"relpath":"wiki/concepts/ai-document-production-workflow.md","sources":["S-2026-09-09-007"],"status":"draft","stem":"ai-document-production-workflow","summary":"사람이 메시지와 밑그림을 잡고, AI 로 거의 같은 프롬프트의 시안을 수십~수백 개 생성한 뒤, 고른 시안에서 텍스트를 지우고 다시 채워 품질을 맞추는 절차","system":false,"text":"정의\n생성 모델의 강점(시각적 완성도) 과 약점(텍스트 깨짐) 을 분리해 다루는 제작 절차. 구조와 메시지는 사람이 고정하고, AI 는 같은 조건에서 변형을 대량으로 만들며, 텍스트는 마지막에 별도 단계로 채운다 [S-2026-09-09-007].\n근거 있는 사실\n밑그림은 사람이 잡아야 하며, AI 가 잡으면 AI 가 시키는 대로 말하는 앵무새가 된다는 것이 글쓴이의 원칙이다 [S-2026-09-09-007]\n요청 시 스타일 · 말투 · 정보량을 모두 지정하고, 거의 같은 프롬프트로 최소 10개에서 많게는 100개의 시안을 받는다 [S-2026-09-09-007]\n확정 후 텍스트를 제거한 이미지를 만들고, 그 이미지에 원래 정보를 텍스트로 다시 넣게 하면 폰트 · 장평을 맞춰 준다 [S-2026-09-09-007]\n모순 · 논쟁\n(없음) — 개인 실무 경험 1건이며 재현 조건(사용 모델 · 도구) 은 명시되지 않았다 {low}.\n관련 페이지\ntask-definition-bottleneck — 사람이 정의하고 AI 가 실행한다는 같은 분업\nS-2026-09-09-007-ai-ppt-design-workflow","title":"AI 문서 제작 워크플로: 사람이 구조, AI 가 대량 변형","topics":[],"type":"concept","updated":"2026-09-09"},{"aliases":["Human-equivalent hours","사람 환산 작업시간","생산성 보증","AI ROI"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","model-routing-token-economics","org-cognition","subscription-subsidy-dependency","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAI 가 수행한 업무를 사람이 했다면 필요했을 엔지니어링 시간으로 추정하고 경제적 가치로 환산하는 지표. 프로덕션 반영 여부까지 함께 본다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e미국 기업 CEO 가 가장 많이 묻는 것이 ROI 다. \"AI가 좋다는 건 다 안다. 얼마나 회수되는지를 모를 뿐이다\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션은 Devin 세션마다 작업 종류를 분류하고 사람 소요 시간을 계산해 \"사람 환산 작업시간\" 으로 표현한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e일부 엔터프라이즈 계약에 최대 1000만 달러 한도의 생산성 보증을 넣었다. 약속한 가치에 못 미치면 회사가 차액을 부담한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e판매 기준이 좌석 · 라이선스 수에서 \"완료한 일의 양\" 으로 이동한다는 것이 코그니션의 주장이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"12개월 프로젝트를 1개월에\" 는 가능하지만 전제가 있다. 고객에게 먼저 사람이 하면 얼마나 걸리는지 묻고, 무엇을 맡길지 함께 정한다. 업무가 정리되지 않고 코드 · 데이터 접근과 검증 기준이 없으면 효과는 제한된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기자 후기의 요약: AI 도입의 핵심은 가장 좋은 모델을 사는 것이 아니라 무슨 일을 맡길지, 성공을 어떻게 정의할지, 그 결과가 실제 돈과 시간으로 얼마나 돌아왔는지를 측정하는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"ROI 를 측정하지 못하면 AI 도 IT 비용이 된다\" 는 것이 기사 소제목의 요지다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — ROI 의 전제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 비용 쪽\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","model-routing-token-economics","org-cognition","task-definition-bottleneck"],"relpath":"wiki/concepts/ai-roi-human-equivalent-hours.md","sources":["S-2026-09-08-002","S-2026-09-09-010"],"status":"draft","stem":"ai-roi-human-equivalent-hours","summary":"에이전트 세션을 작업 유형별로 분류해 사람이 했다면 걸렸을 시간으로 환산하는 ROI 지표와, 이를 계약에 거는 생산성 보증","system":false,"text":"정의\nAI 가 수행한 업무를 사람이 했다면 필요했을 엔지니어링 시간으로 추정하고 경제적 가치로 환산하는 지표. 프로덕션 반영 여부까지 함께 본다 [S-2026-09-08-002].\n근거 있는 사실\n미국 기업 CEO 가 가장 많이 묻는 것이 ROI 다. \"AI가 좋다는 건 다 안다. 얼마나 회수되는지를 모를 뿐이다\" [S-2026-09-08-002]\n코그니션은 Devin 세션마다 작업 종류를 분류하고 사람 소요 시간을 계산해 \"사람 환산 작업시간\" 으로 표현한다 [S-2026-09-08-002]\n일부 엔터프라이즈 계약에 최대 1000만 달러 한도의 생산성 보증을 넣었다. 약속한 가치에 못 미치면 회사가 차액을 부담한다 [S-2026-09-08-002]\n판매 기준이 좌석 · 라이선스 수에서 \"완료한 일의 양\" 으로 이동한다는 것이 코그니션의 주장이다 [S-2026-09-08-002]\n\"12개월 프로젝트를 1개월에\" 는 가능하지만 전제가 있다. 고객에게 먼저 사람이 하면 얼마나 걸리는지 묻고, 무엇을 맡길지 함께 정한다. 업무가 정리되지 않고 코드 · 데이터 접근과 검증 기준이 없으면 효과는 제한된다 [S-2026-09-08-002]\n기자 후기의 요약: AI 도입의 핵심은 가장 좋은 모델을 사는 것이 아니라 무슨 일을 맡길지, 성공을 어떻게 정의할지, 그 결과가 실제 돈과 시간으로 얼마나 돌아왔는지를 측정하는 것이다 [S-2026-09-09-010]\n\"ROI 를 측정하지 못하면 AI 도 IT 비용이 된다\" 는 것이 기사 소제목의 요지다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\ntask-definition-bottleneck — ROI 의 전제\nmodel-routing-token-economics — 비용 쪽\norg-cognition\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-010-cognition-interview-ax-view","title":"AI ROI 측정: 사람 환산 작업시간과 생산성 보증","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["에이전트 런타임","AI workforce runtime","AI 직원","AI 크루"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-15-003-harness-engineering-guide-provenance","ai-agents-enterprise-adoption","ax-organizational-redesign","harness-engineering-discipline","org-cognition","org-crewon-ai","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-003-harness-engineering-guide-provenance"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAI 에이전트가 직원처럼 일하려면 역할, 업무지식과 회사 규정, 업무시스템 권한, 일하는 순서, 판단이 어려울 때의 보고 체계가 필요하다는 전제에서, 이 요소들을 설정 · 운영하는 기반을 제품으로 만든 범주. 크루온AI 는 이를 \"기업용 AI 에이전트 런타임\" 또는 \"AI 워크포스 런타임\" 이라고 부른다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e구성 요소: AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 사람 승인 단계를 플레이북으로 가르친다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 환경(크루AI 워크) 은 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, AI 크루는 여러 시스템을 오가며 하나의 일을 처리하되 역할 · 권한 · 기억을 유지한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e정보 탐색 순서는 '시맨틱 퍼스트, 벡터 세컨드': 의도와 업무 파악 → 규정 · 절차 · 접근권한 확인 → 허용 범위 안에서 검색 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e완료 판정은 실제 결과 기준: 도구 호출 성공과 업무 완료를 구분하고 결재 문서 생성 여부까지 확인한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e일할수록 조직 지식 · 절차가 쌓여 기업의 디지털 자산이 된다는 것이 판매 논리다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 범주를 공학 분야로 정리하려는 시도도 나온다. 2026년 8월 독립 편찬된 Harness Engineering 6계층 문서가 그 예이며 구글 공식 문서가 아니다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 결론의 다른 관점: 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e; 코그니션은 하네스 감독 · VM 격리 · FDE 로 실행 환경을 판다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e기사가 지적하듯 각 AI 의 접근 범위 · 자율 판단 범위 · 실행 기록 · 데이터 소유 · 오류 책임은 도입 과정에서 검증해야 할 과제로 남아 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e. 감독자 역량 침식 문제 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e 는 이 범주의 제품이 아직 다루지 않는 축이다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e · \u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e · \u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 런타임이 다루지 않는 사람 쪽 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e · \u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/harness-engineering-discipline\" class=\"wl\"\u003eharness-engineering-discipline\u003c/a\u003e · \u003ca href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" class=\"wl\"\u003eS-2026-09-15-003-harness-engineering-guide-provenance\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-003-harness-engineering-guide-provenance","agent-governance-guardrails","ai-agents-enterprise-adoption","harness-engineering-discipline","human-oversight-erosion","org-cognition","org-crewon-ai","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/concepts/ai-workforce-runtime.md","sources":["S-2026-09-09-002","S-2026-09-15-003"],"status":"draft","stem":"ai-workforce-runtime","summary":"모델이 아니라 역할 · 업무지식 · 권한 · 플레이북(순서와 승인) · 기억 · 실행 기록을 갖춘 실행 환경을 파는 제품 범주. '고객이 사는 것은 모델이 일하는 환경'","system":false,"text":"정의\nAI 에이전트가 직원처럼 일하려면 역할, 업무지식과 회사 규정, 업무시스템 권한, 일하는 순서, 판단이 어려울 때의 보고 체계가 필요하다는 전제에서, 이 요소들을 설정 · 운영하는 기반을 제품으로 만든 범주. 크루온AI 는 이를 \"기업용 AI 에이전트 런타임\" 또는 \"AI 워크포스 런타임\" 이라고 부른다 [S-2026-09-09-002].\n근거 있는 사실\n구성 요소: AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 사람 승인 단계를 플레이북으로 가르친다 [S-2026-09-09-002]\n실행 환경(크루AI 워크) 은 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, AI 크루는 여러 시스템을 오가며 하나의 일을 처리하되 역할 · 권한 · 기억을 유지한다 [S-2026-09-09-002]\n정보 탐색 순서는 '시맨틱 퍼스트, 벡터 세컨드': 의도와 업무 파악 → 규정 · 절차 · 접근권한 확인 → 허용 범위 안에서 검색 [S-2026-09-09-002]\n완료 판정은 실제 결과 기준: 도구 호출 성공과 업무 완료를 구분하고 결재 문서 생성 여부까지 확인한다 [S-2026-09-09-002]\n일할수록 조직 지식 · 절차가 쌓여 기업의 디지털 자산이 된다는 것이 판매 논리다 [S-2026-09-09-002]\n이 범주를 공학 분야로 정리하려는 시도도 나온다. 2026년 8월 독립 편찬된 Harness Engineering 6계층 문서가 그 예이며 구글 공식 문서가 아니다 [S-2026-09-15-003]\n같은 결론의 다른 관점: 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요하다 [S-2026-09-09-004]; 코그니션은 하네스 감독 · VM 격리 · FDE 로 실행 환경을 판다 [S-2026-09-08-002]\n모순 · 논쟁\n기사가 지적하듯 각 AI 의 접근 범위 · 자율 판단 범위 · 실행 기록 · 데이터 소유 · 오류 책임은 도입 과정에서 검증해야 할 과제로 남아 있다 [S-2026-09-09-002]. 감독자 역량 침식 문제 [S-2026-09-08-003] 는 이 범주의 제품이 아직 다루지 않는 축이다.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nagent-governance-guardrails · task-definition-bottleneck · task-level-agent-evaluation\nhuman-oversight-erosion — 런타임이 다루지 않는 사람 쪽 문제\norg-crewon-ai · org-cognition\nS-2026-09-09-002-crewon-ai-agent-runtime\nharness-engineering-discipline · S-2026-09-15-003-harness-engineering-guide-provenance","title":"AI 워크포스 런타임: 에이전트를 직원처럼 채용 · 교육 · 관리하는 제품 범주","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-15"},{"aliases":["AX","AI Transformation","업의 정의","조직 재설계"],"back":["S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","org-cognition","proactive-agent","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트 도입의 성패가 모델이나 도구가 아니라, 어떤 업무를 없애고 쪼개고 다시 설계해 에이전트에게 넘길지를 정하는 조직의 작업에 달려 있다는 관점 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e에이전트가 능동적으로 움직일수록 조직이 만들어 놓은 업무 흐름과 '일의 정의' 가 더 중요해진다. 흐름이 뒤죽박죽이면 좋은 AI 도 도움이 되지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실패 경로: 하던 일과 조직을 그대로 둔 채 FOMO 로 AI 를 도입하면 토큰 비용이 급증하고 판단 주체가 사라지며 지연과 불신이 생긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e한국은 \"어떤 모델을 쓸 것인가\", \"사내 챗봇을 어떻게 만들 것인가\" 에 머물러 있고, 미국 선두 기업은 업무를 없애고 쪼개어 넘기는 단계에 있다는 진단 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e미국 대기업이 먼저 넘기는 것은 시스템 전환 · 코드 현대화 · 보안처럼 '하기 싫지만 반드시 해야 하는 일' 이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 인터뷰의 기사 본문도 도입 병목을 업무 정의와 완료 조건으로 지목한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 개별 업무 수준의 같은 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — 재설계된 조직에 AI 를 배치하는 제품 계층\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e — 이 재설계를 고객과 함께 하는 직무\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","ai-workforce-runtime","forward-deployed-engineer","task-definition-bottleneck"],"relpath":"wiki/concepts/ax-organizational-redesign.md","sources":["S-2026-09-09-010"],"status":"draft","stem":"ax-organizational-redesign","summary":"AI 를 도입하는 것과 AI 가 일하도록 회사를 다시 설계하는 것은 다른 문제이며, 출발점은 '업의 정의' 라는 관점. 한미 격차는 기술보다 조직에 있다는 진단","system":false,"text":"정의\n에이전트 도입의 성패가 모델이나 도구가 아니라, 어떤 업무를 없애고 쪼개고 다시 설계해 에이전트에게 넘길지를 정하는 조직의 작업에 달려 있다는 관점 [S-2026-09-09-010].\n근거 있는 사실\n에이전트가 능동적으로 움직일수록 조직이 만들어 놓은 업무 흐름과 '일의 정의' 가 더 중요해진다. 흐름이 뒤죽박죽이면 좋은 AI 도 도움이 되지 않는다 [S-2026-09-09-010]\n실패 경로: 하던 일과 조직을 그대로 둔 채 FOMO 로 AI 를 도입하면 토큰 비용이 급증하고 판단 주체가 사라지며 지연과 불신이 생긴다 [S-2026-09-09-010]\n한국은 \"어떤 모델을 쓸 것인가\", \"사내 챗봇을 어떻게 만들 것인가\" 에 머물러 있고, 미국 선두 기업은 업무를 없애고 쪼개어 넘기는 단계에 있다는 진단 [S-2026-09-09-010]\n미국 대기업이 먼저 넘기는 것은 시스템 전환 · 코드 현대화 · 보안처럼 '하기 싫지만 반드시 해야 하는 일' 이다 [S-2026-09-09-010]\n같은 인터뷰의 기사 본문도 도입 병목을 업무 정의와 완료 조건으로 지목한다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\ntask-definition-bottleneck — 개별 업무 수준의 같은 문제\nai-workforce-runtime — 재설계된 조직에 AI 를 배치하는 제품 계층\nforward-deployed-engineer — 이 재설계를 고객과 함께 하는 직무\nS-2026-09-09-010-cognition-interview-ax-view\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"AX 는 도입이 아니라 조직 재설계","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["포스트 스케일링","beyond scaling","스케일링 이후"],"back":["S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-native-model","cot-monitorability-erosion","inference-hardware-shift-recurrent-depth","loop-transformer-latent-reasoning","org-nvidia","org-stripe","org-tokenrhythm","person-wang-yunhe","post-training-agent-capability","product-arc-agi-3","product-neohorse","product-openrouter","rlvr-domain-expansion","routing-harness","skill-evolution-persistent-wiki","small-model-self-improvement-loop"],"cites":["S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-09","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e파라미터를 늘리지 않고 성능을 올리는 경로가 여러 갈래로 동시에 나타났다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e. 첫째는 경험 학습이다. 토큰리듬의 NeoHorse-1 은 인터넷 텍스트가 아니라 라우팅 하네스가 생성한 에이전트 실행 궤적을 학습해, 4B 모델이 11개 에이전트 벤치마크 중 5개에서 두 배 이상 큰 기초 모델을 능가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e. 둘째는 스킬 축적이다. 구글 WikiSkill 은 경험을 영구 위키로 컴파일하고 그 위에서 스킬을 갱신해, 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 이겼고 스킬은 모델 계열을 넘어 전이됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e두 경로의 공통점은 성능을 파라미터가 아니라 축적된 경험에서 끌어낸다는 것이고, 둘 다 스케일링을 대체하지 않고 보완한다고 말한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e. 시장 신호도 같은 방향이다. 스트라이프가 모델 라우팅 플랫폼 오픈라우터를 약 75억 달러에 인수하면서, 경쟁 축이 단일 모델의 우수성에서 다수 모델을 조직하고 그 실행 기록을 자산화하는 쪽으로 옮겨갔다는 해석이 나왔다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e세 번째는 반복 연산이다. 같은 레이어를 여러 번 통과시켜 파라미터를 고정한 채 추론 시간만으로 성능을 올리는 접근으로, Huginn 은 3.5B 를 32번 돌려 약 50B 급 성능을 보고했고 RYS 는 가중치를 바꾸지 않고 7개 층만 한 번 더 통과시켜 리더보드 1위를 기록했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e. 오래 \"잘 안 된다\" 고 여겨지던 이 방식이 프론티어 모델에 들어간 것이 GPT-6 Astra 발표의 의미라는 해석이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e. 다만 이 계열의 근거는 재현 문제를 안고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e. 일주일 뒤 근거가 보강됐다. The Information 이 아스트라의 recurrent depth 사용을 보도했고 OpenAI 연구자들은 \"루프 사용 범위를 제한했다\" 고 반박했으며, OpenAI 는 성능 요인으로 루프와 함께 크게 늘린 사전학습 컴퓨트를 함께 들었다 — 루프는 스케일의 대체재가 아니라 보완재다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e. 대가도 드러났다. 루프 안의 계산은 토큰을 남기지 않아 사고사슬 기반 감시가 약해지고 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e, 토큰당 연산량이 늘어 디코드가 compute-bound 로 이동하면서 서빙 스케줄링이라는 새 문제가 생긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e다음 국면에 대한 전망도 나온다. 중국 랩이 레시피를 복제하기까지 R1 때는 4개월이 걸렸으나 Huginn · Ouro 같은 공개 연구가 이미 있어 더 빠를 수 있고, 그 전 2~3개월이 OpenAI 의 선점 구간이라는 관측이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e. 더 큰 변화로는 RLVR 이 코딩 밖으로 넓어지는 경로가 지목된다. 모델이 대부분 분야에서 전문가급 판별자가 되면 코딩이 누린 발전을 나머지 분야가 똑같이 누리게 된다는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e지역별 전략이 갈린다는 관찰도 있다. 미국은 하나의 거대 모델이 하위 에이전트를 동적 생성하는 수직적 접근을 택하고, 중국은 오픈소스 모델들의 라우팅과 실행 궤적 환류라는 수평적 진화를 택했다는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/agent-native-model\" class=\"wl\"\u003eagent-native-model\u003c/a\u003e — 실행 궤적을 학습 말뭉치로\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e — 궤적을 만들어내는 인프라 계층\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e — 경험을 위키로 컴파일해 스킬 진화\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 후훈련 층에서 만들어지는 에이전트 능력\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 업무 결과 평가와 실패 재학습\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 같은 층 반복과 잠재 공간 추론\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cot-monitorability-erosion\" class=\"wl\"\u003ecot-monitorability-erosion\u003c/a\u003e — 반복 연산이 치르는 감시 비용\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/inference-hardware-shift-recurrent-depth\" class=\"wl\"\u003einference-hardware-shift-recurrent-depth\u003c/a\u003e — 디코드 병목 이동과 서빙 스케줄링\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/rlvr-domain-expansion\" class=\"wl\"\u003erlvr-domain-expansion\u003c/a\u003e — 검증 가능 보상 학습의 분야 확장 전망\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-tokenrhythm\" class=\"wl\"\u003eorg-tokenrhythm\u003c/a\u003e · \u003ca href=\"#/product-neohorse\" class=\"wl\"\u003eproduct-neohorse\u003c/a\u003e · \u003ca href=\"#/person-wang-yunhe\" class=\"wl\"\u003eperson-wang-yunhe\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-stripe\" class=\"wl\"\u003eorg-stripe\u003c/a\u003e · \u003ca href=\"#/product-openrouter\" class=\"wl\"\u003eproduct-openrouter\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/product-arc-agi-3\" class=\"wl\"\u003eproduct-arc-agi-3\u003c/a\u003e · \u003ca href=\"#/org-nvidia\" class=\"wl\"\u003eorg-nvidia\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-google-deepmind\" class=\"wl\"\u003eorg-google-deepmind\u003c/a\u003e · \u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" class=\"wl\"\u003eS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" class=\"wl\"\u003eS-2026-09-09-009-loop-transformer-after-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e — 2편: 확인된 것과 하드웨어 영향\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e — 3편: 구글 · 전망 · 대응\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-02 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e Gemini 3.8 Flash 출시 (3.6 07-21, 3.7 08-13 에 이어 3주 간격)\u003c/li\u003e\n\u003cli\u003e2026-08 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e 데미스 하사비스, DeepMind CEO 에서 회장으로. 코라이 카부크추올루 승계\u003c/li\u003e\n\u003cli\u003e2026-09-02 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e The Information, 아스트라의 recurrent depth 사용 보도\u003c/li\u003e\n\u003cli\u003e2026-09-04 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e GPT-6 Astra 발표 — 반복 연산(루프) 계열이 프론티어 모델에 들어갔다는 해석\u003c/li\u003e\n\u003cli\u003e2026-08 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e 스트라이프, 오픈라우터 약 75억 달러 인수 (석 달 전 13억 달러 평가)\u003c/li\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e 토큰리듬 NeoHorse-1 공개\u003c/li\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e 구글 리서치 WikiSkill 논문\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e경험 학습 · 스킬 축적 · 후훈련 중 어느 경로가 우리 도메인에 맞는가 (자료만으로는 판정 불가)\u003c/li\u003e\n\u003cli\u003e실행 궤적을 학습 자산으로 남기려면 지금 로그에 무엇을 더 기록해야 하는가\u003c/li\u003e\n\u003cli\u003e라우팅이 독립 인프라 계층으로 남는가, 각 에이전트 제품에 내장되는가\u003c/li\u003e\n\u003cli\u003eAstra 의 실제 구조는 반복 연산인가 멀티 에이전트인가 — 반복 연산 쪽 근거가 보강됐으나 공식 확인은 없다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우리 하네스가 사고사슬 텍스트에 의존하는 지점은 어디이고, 무엇으로 대체할 것인가\u003c/li\u003e\n\u003cli\u003eRLVR 이 코딩 밖으로 넓어진다면 우리 도메인에서 '검증 가능한 보상' 은 무엇으로 정의되는가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-09: WikiSkill 과 NeoHorse 를 같은 날 공유 — 파라미터 경쟁 밖의 성능 경로에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-native-model","cot-monitorability-erosion","inference-hardware-shift-recurrent-depth","loop-transformer-latent-reasoning","org-google-deepmind","org-nvidia","org-stripe","org-tokenrhythm","person-wang-yunhe","post-training-agent-capability","product-arc-agi-3","product-gemini","product-gpt-6-astra","product-neohorse","product-openrouter","rlvr-domain-expansion","routing-harness","skill-evolution-persistent-wiki","small-model-self-improvement-loop"],"relpath":"wiki/topics/beyond-parameter-scaling.md","sources":["S-2026-09-09-006","S-2026-09-09-008","S-2026-09-09-009","S-2026-09-15-004","S-2026-09-15-001"],"status":"draft","stem":"beyond-parameter-scaling","summary":"모델을 더 크게 만드는 것 말고 성능을 올리는 경로들. 실행 경험 학습, 스킬 축적, 같은 층을 여러 번 도는 잠재 추론이 2026년 하반기에 동시에 부상","system":false,"text":"현재 종합\n파라미터를 늘리지 않고 성능을 올리는 경로가 여러 갈래로 동시에 나타났다 [S-2026-09-09-006] [S-2026-09-09-008] [S-2026-09-09-009]. 첫째는 경험 학습이다. 토큰리듬의 NeoHorse-1 은 인터넷 텍스트가 아니라 라우팅 하네스가 생성한 에이전트 실행 궤적을 학습해, 4B 모델이 11개 에이전트 벤치마크 중 5개에서 두 배 이상 큰 기초 모델을 능가했다 [S-2026-09-09-008]. 둘째는 스킬 축적이다. 구글 WikiSkill 은 경험을 영구 위키로 컴파일하고 그 위에서 스킬을 갱신해, 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 이겼고 스킬은 모델 계열을 넘어 전이됐다 [S-2026-09-09-006].\n두 경로의 공통점은 성능을 파라미터가 아니라 축적된 경험에서 끌어낸다는 것이고, 둘 다 스케일링을 대체하지 않고 보완한다고 말한다 [S-2026-09-09-006] [S-2026-09-09-008]. 시장 신호도 같은 방향이다. 스트라이프가 모델 라우팅 플랫폼 오픈라우터를 약 75억 달러에 인수하면서, 경쟁 축이 단일 모델의 우수성에서 다수 모델을 조직하고 그 실행 기록을 자산화하는 쪽으로 옮겨갔다는 해석이 나왔다 [S-2026-09-09-008].\n세 번째는 반복 연산이다. 같은 레이어를 여러 번 통과시켜 파라미터를 고정한 채 추론 시간만으로 성능을 올리는 접근으로, Huginn 은 3.5B 를 32번 돌려 약 50B 급 성능을 보고했고 RYS 는 가중치를 바꾸지 않고 7개 층만 한 번 더 통과시켜 리더보드 1위를 기록했다 [S-2026-09-09-009]. 오래 \"잘 안 된다\" 고 여겨지던 이 방식이 프론티어 모델에 들어간 것이 GPT-6 Astra 발표의 의미라는 해석이다 [S-2026-09-09-009]. 다만 이 계열의 근거는 재현 문제를 안고 있다 [S-2026-09-09-009]. 일주일 뒤 근거가 보강됐다. The Information 이 아스트라의 recurrent depth 사용을 보도했고 OpenAI 연구자들은 \"루프 사용 범위를 제한했다\" 고 반박했으며, OpenAI 는 성능 요인으로 루프와 함께 크게 늘린 사전학습 컴퓨트를 함께 들었다 — 루프는 스케일의 대체재가 아니라 보완재다 [S-2026-09-15-004]. 대가도 드러났다. 루프 안의 계산은 토큰을 남기지 않아 사고사슬 기반 감시가 약해지고 [S-2026-09-15-004], 토큰당 연산량이 늘어 디코드가 compute-bound 로 이동하면서 서빙 스케줄링이라는 새 문제가 생긴다 [S-2026-09-15-004].\n다음 국면에 대한 전망도 나온다. 중국 랩이 레시피를 복제하기까지 R1 때는 4개월이 걸렸으나 Huginn · Ouro 같은 공개 연구가 이미 있어 더 빠를 수 있고, 그 전 2~3개월이 OpenAI 의 선점 구간이라는 관측이다 [S-2026-09-15-001]. 더 큰 변화로는 RLVR 이 코딩 밖으로 넓어지는 경로가 지목된다. 모델이 대부분 분야에서 전문가급 판별자가 되면 코딩이 누린 발전을 나머지 분야가 똑같이 누리게 된다는 것이다 [S-2026-09-15-001].\n지역별 전략이 갈린다는 관찰도 있다. 미국은 하나의 거대 모델이 하위 에이전트를 동적 생성하는 수직적 접근을 택하고, 중국은 오픈소스 모델들의 라우팅과 실행 궤적 환류라는 수평적 진화를 택했다는 것이다 [S-2026-09-09-008].\n하위 페이지\n개념\nagent-native-model — 실행 궤적을 학습 말뭉치로\nrouting-harness — 궤적을 만들어내는 인프라 계층\nskill-evolution-persistent-wiki — 경험을 위키로 컴파일해 스킬 진화\npost-training-agent-capability — 후훈련 층에서 만들어지는 에이전트 능력\nsmall-model-self-improvement-loop — 업무 결과 평가와 실패 재학습\nloop-transformer-latent-reasoning — 같은 층 반복과 잠재 공간 추론\ncot-monitorability-erosion — 반복 연산이 치르는 감시 비용\ninference-hardware-shift-recurrent-depth — 디코드 병목 이동과 서빙 스케줄링\nrlvr-domain-expansion — 검증 가능 보상 학습의 분야 확장 전망\n엔티티\norg-tokenrhythm · product-neohorse · person-wang-yunhe\norg-stripe · product-openrouter\nproduct-gpt-6-astra · product-arc-agi-3 · org-nvidia\norg-google-deepmind · product-gemini\n소스\nS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\nS-2026-09-09-008-neohorse-agent-native-model\nS-2026-09-09-009-loop-transformer-after-astra\nS-2026-09-15-004-astra-verified-and-hardware-shift — 2편: 확인된 것과 하드웨어 영향\nS-2026-09-15-001-google-cadence-and-what-to-do — 3편: 구글 · 전망 · 대응\n타임라인\n2026-09-02 [S-2026-09-15-001] Gemini 3.8 Flash 출시 (3.6 07-21, 3.7 08-13 에 이어 3주 간격)\n2026-08 [S-2026-09-15-001] 데미스 하사비스, DeepMind CEO 에서 회장으로. 코라이 카부크추올루 승계\n2026-09-02 [S-2026-09-15-004] The Information, 아스트라의 recurrent depth 사용 보도\n2026-09-04 [S-2026-09-09-009] GPT-6 Astra 발표 — 반복 연산(루프) 계열이 프론티어 모델에 들어갔다는 해석\n2026-08 [S-2026-09-09-008] 스트라이프, 오픈라우터 약 75억 달러 인수 (석 달 전 13억 달러 평가)\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-008] 토큰리듬 NeoHorse-1 공개\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-006] 구글 리서치 WikiSkill 논문\n열린 질문\n경험 학습 · 스킬 축적 · 후훈련 중 어느 경로가 우리 도메인에 맞는가 (자료만으로는 판정 불가)\n실행 궤적을 학습 자산으로 남기려면 지금 로그에 무엇을 더 기록해야 하는가\n라우팅이 독립 인프라 계층으로 남는가, 각 에이전트 제품에 내장되는가\nAstra 의 실제 구조는 반복 연산인가 멀티 에이전트인가 — 반복 연산 쪽 근거가 보강됐으나 공식 확인은 없다 [S-2026-09-15-004]\n우리 하네스가 사고사슬 텍스트에 의존하는 지점은 어디이고, 무엇으로 대체할 것인가\nRLVR 이 코딩 밖으로 넓어진다면 우리 도메인에서 '검증 가능한 보상' 은 무엇으로 정의되는가\n관심 흐름\n2026-09-09: WikiSkill 과 NeoHorse 를 같은 날 공유 — 파라미터 경쟁 밖의 성능 경로에 대한 관심으로 추정 (추정)","title":"파라미터 스케일링 이후: 경험 · 스킬 · 반복 연산","topics":[],"type":"topic","updated":"2026-09-15"},{"aliases":["cloud agent","클라우드 코딩 에이전트"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-011-gemini-agentic-video","agent-governance-guardrails","ai-agents-enterprise-adoption","local-model-24gb-boundary","proactive-agent","product-devin","product-gemini","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-011-gemini-agentic-video"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e사람이 과제를 정의하면 별도의 클라우드 컴퓨터 환경에서 일정 시간 독립적으로 실행하는 에이전트. 코드를 쓰는 데 그치지 않고 애플리케이션을 실행 · 재현 · 테스트해 작동을 확인한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAI 코딩 사용 방식은 자동완성 → 대화 → 코드베이스 컨텍스트 → 에이전트 → 클라우드 에이전트 순으로 약 6개월마다 바뀌어 왔다고 제프 왕은 말했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션 데이터에서 IDE 사용보다 클라우드 에이전트 사용이 늘고 있다. 개발자가 화면 앞에 있을 필요가 없기 때문이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e독립 실행 환경이 있으면 \"그럴듯한 코드\" 와 \"실제로 작동하는 코드\" 의 차이를 오류 발견 · 수정 · 재실행 반복으로 메울 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e한 사람이 20개의 클라우드 에이전트를 띄워 큰 프로젝트를 나눠 맡길 수 있어, 생산성 척도가 \"한 명이 얼마나 빨라지나\" 에서 \"몇 개 작업을 동시에 위임 · 관리하나\" 로 바뀐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e루프의 위치가 옮겨가기도 한다. Gemini 3.7 Flash 는 에이전트 프레임워크 없이 interaction API 호출만으로 내부에서 하네스 같은 루프를 돌린다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e각 작업을 독립 VM 에서 실행하고 하네스가 세션을 감독해 과제 이탈을 감지한다는 것이 코그니션의 통제 방식이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 클라우드 에이전트 다음 단계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 위임이 작동하기 위한 전제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e — 대표 구현\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-011-gemini-agentic-video\" class=\"wl\"\u003eS-2026-09-09-011-gemini-agentic-video\u003c/a\u003e · \u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u00
