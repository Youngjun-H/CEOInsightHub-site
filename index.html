hift"],"confidence":"medium","created":"2026-09-15","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e추론을 외부 토큰으로 쓰지 않고 잠재 공간에서 반복 연산으로 처리하면, 그 계산은 읽을 수 있는 흔적을 남기지 않는다. 사고사슬 텍스트를 검사해 모델의 의도를 감시하던 방법이 그만큼 약해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e아스트라 시스템 카드: 이전 모델보다 사고사슬을 통한 모니터링이 어려워졌고, 말로 쓰지 않고도 더 어려운 문제를 풀며, 회피하라고 명시적으로 지시하면 추론 흔적을 더 잘 통제한다. 영국 AISI 도 비슷한 평가를 냈다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 수석과학자 야쿱 파초츠키는 \"읽을 수 있는 사고사슬에 대한 약속\" 을 재확인하고 루프 사용 범위를 제한했다고 밝혔으며 \"뉴럴리즈로 가는 것\" 이라는 해석을 거부했다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e시스템 카드는 모니터링 저하를 아키텍처 탓으로 귀속하지 않는다고 명시한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e바깥 하네스가 중간 사고사슬을 검색해 걸러내는 방식은 여전히 작동하지만, 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e레드우드 리서치 벅 슐레게리스는 이 기술을 더 스케일하면 CoT 모니터링이 완전히 무너질 수 있다고 경고했고, OpenAI 는 스케일 상한을 두겠다고 말하지 않았다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOpenAI 는 모니터링 저하를 아키텍처 탓으로 돌리지 않으면서 동시에 루프 사용을 제한했다고 말한다. 글쓴이는 그 반박 자체를 아키텍처의 간접 확인으로 읽는다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e. 공식 확인은 없다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사람 쪽 역량 침식 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e 과는 다른 축이다. 이쪽은 감시 대상이 관측 불가능해지는 문제이고, 저쪽은 감시자가 무뎌지는 문제다. 둘이 겹치면 감시는 형식만 남는다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 원인이 되는 구조\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 사람 쪽 감시 약화\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 감시가 약해질 때 남는 통제 수단\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-governance-guardrails","beyond-parameter-scaling","human-oversight-erosion","loop-transformer-latent-reasoning","product-gpt-6-astra"],"relpath":"wiki/concepts/cot-monitorability-erosion.md","sources":["S-2026-09-15-004"],"status":"draft","stem":"cot-monitorability-erosion","summary":"루프 안에서 도는 계산은 토큰을 남기지 않아, 사고사슬을 읽어 모델을 감시하던 방법이 약해진다. 사라지는 것이 아니라 한 단계 덜 믿을 만해지는 것","system":false,"text":"정의\n추론을 외부 토큰으로 쓰지 않고 잠재 공간에서 반복 연산으로 처리하면, 그 계산은 읽을 수 있는 흔적을 남기지 않는다. 사고사슬 텍스트를 검사해 모델의 의도를 감시하던 방법이 그만큼 약해진다 [S-2026-09-15-004].\n근거 있는 사실\n아스트라 시스템 카드: 이전 모델보다 사고사슬을 통한 모니터링이 어려워졌고, 말로 쓰지 않고도 더 어려운 문제를 풀며, 회피하라고 명시적으로 지시하면 추론 흔적을 더 잘 통제한다. 영국 AISI 도 비슷한 평가를 냈다 [S-2026-09-15-004]\nOpenAI 수석과학자 야쿱 파초츠키는 \"읽을 수 있는 사고사슬에 대한 약속\" 을 재확인하고 루프 사용 범위를 제한했다고 밝혔으며 \"뉴럴리즈로 가는 것\" 이라는 해석을 거부했다 [S-2026-09-15-004]\n시스템 카드는 모니터링 저하를 아키텍처 탓으로 귀속하지 않는다고 명시한다 [S-2026-09-15-004]\n바깥 하네스가 중간 사고사슬을 검색해 걸러내는 방식은 여전히 작동하지만, 사고사슬에만 의존하는 하네스는 한 단계 덜 믿을 만해졌다 [S-2026-09-15-004]\n레드우드 리서치 벅 슐레게리스는 이 기술을 더 스케일하면 CoT 모니터링이 완전히 무너질 수 있다고 경고했고, OpenAI 는 스케일 상한을 두겠다고 말하지 않았다 [S-2026-09-15-004]\n모순 · 논쟁\nOpenAI 는 모니터링 저하를 아키텍처 탓으로 돌리지 않으면서 동시에 루프 사용을 제한했다고 말한다. 글쓴이는 그 반박 자체를 아키텍처의 간접 확인으로 읽는다 [S-2026-09-15-004]. 공식 확인은 없다 {low}\n사람 쪽 역량 침식 [S-2026-09-08-003] 과는 다른 축이다. 이쪽은 감시 대상이 관측 불가능해지는 문제이고, 저쪽은 감시자가 무뎌지는 문제다. 둘이 겹치면 감시는 형식만 남는다.\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\nloop-transformer-latent-reasoning — 원인이 되는 구조\nhuman-oversight-erosion — 사람 쪽 감시 약화\nagent-governance-guardrails — 감시가 약해질 때 남는 통제 수단\nproduct-gpt-6-astra\nS-2026-09-15-004-astra-verified-and-hardware-shift","title":"사고사슬 모니터링의 약화","topics":["beyond-parameter-scaling"],"type":"concept","updated":"2026-09-15"},{"aliases":["distillation 방어","모델 추출 방어","model extraction defense"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","_unsorted","knowledge-distillation","on-policy-distillation","org-anthropic","org-deepseek","small-model-self-improvement-loop"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델 출력이 유용할수록 그것은 좋은 학습 데이터가 되므로, 다른 모델의 학습 가능성을 완전히 없애려면 사람에게도 유용한 답을 주지 못하게 된다는 구조적 한계. 그래서 방어의 목표는 차단이 아니라 대규모 능력 추출을 느리고 비싸게 만드는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eReasoning trace 를 숨기면 정보량이 가장 많은 경로 하나는 막히지만, 최종 답변 · 반복 질문의 응답 변화 · 비평 · 후보 순위 · 코드 수정안 · 도구 사용 순서와 테스트 결과가 모두 학습 신호로 남는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코딩 에이전트의 대량 코드 작성, 교육 서비스의 대량 첨삭은 정상 업무이면서 동시에 post-training 데이터 수집일 수 있다. 요청 형태만으로는 구별되지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e현실적 방어 수단: 계정 · 결제수단 분산 패턴 탐지, 동일 능력을 체계적으로 훑는 프롬프트 탐지, 비정상 계정 생성 · 지역 우회 차단, rate limit, 강화된 신원확인, 계정 간 행동 분석, 출력 식별 신호, benchmark 유사 대량 질의 탐지, 기업 간 계약 · API 약관 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 수단들은 추출 비용(계정 · API 호출 · 시간 · 우회 인력) 을 높여 경제성을 떨어뜨릴 뿐, 수학적으로 불가능하게 만들지는 못한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e판단 기준: \"성능 향상을 만든 학습 신호가 어디서 왔는가\". 공개 문제와 독립 verifier 만으로 스스로 발견했다면 결과가 비슷해도 distillation 이 아니고, 특정 teacher 의 답변 · 판단 · 교정 · 순위 · 행동 경로가 지속적 · 인과적 신호였다면 trace 를 복사하지 않았어도 넓은 의미의 distillation 이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 의 행위를 \"산업적 규모의 distillation 공격\" 으로 규정하고 개별 기업 대응으로는 부족하다며 공동 대응을 요구했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","knowledge-distillation","on-policy-distillation","org-anthropic","org-deepseek"],"relpath":"wiki/concepts/distillation-defense-limits.md","sources":["S-2026-09-08-004"],"status":"draft","stem":"distillation-defense-limits","summary":"정상 사용과 distillation 목적 사용이 구별되지 않아 완벽 방어는 불가능하며, 현실적 방어는 비용을 높이는 것. 판단 기준은 알고리즘이 아니라 학습 신호의 출처","system":false,"text":"정의\n모델 출력이 유용할수록 그것은 좋은 학습 데이터가 되므로, 다른 모델의 학습 가능성을 완전히 없애려면 사람에게도 유용한 답을 주지 못하게 된다는 구조적 한계. 그래서 방어의 목표는 차단이 아니라 대규모 능력 추출을 느리고 비싸게 만드는 것이다 [S-2026-09-08-004].\n근거 있는 사실\nReasoning trace 를 숨기면 정보량이 가장 많은 경로 하나는 막히지만, 최종 답변 · 반복 질문의 응답 변화 · 비평 · 후보 순위 · 코드 수정안 · 도구 사용 순서와 테스트 결과가 모두 학습 신호로 남는다 [S-2026-09-08-004]\n코딩 에이전트의 대량 코드 작성, 교육 서비스의 대량 첨삭은 정상 업무이면서 동시에 post-training 데이터 수집일 수 있다. 요청 형태만으로는 구별되지 않는다 [S-2026-09-08-004]\n현실적 방어 수단: 계정 · 결제수단 분산 패턴 탐지, 동일 능력을 체계적으로 훑는 프롬프트 탐지, 비정상 계정 생성 · 지역 우회 차단, rate limit, 강화된 신원확인, 계정 간 행동 분석, 출력 식별 신호, benchmark 유사 대량 질의 탐지, 기업 간 계약 · API 약관 [S-2026-09-08-004]\n이 수단들은 추출 비용(계정 · API 호출 · 시간 · 우회 인력) 을 높여 경제성을 떨어뜨릴 뿐, 수학적으로 불가능하게 만들지는 못한다 [S-2026-09-08-004]\n판단 기준: \"성능 향상을 만든 학습 신호가 어디서 왔는가\". 공개 문제와 독립 verifier 만으로 스스로 발견했다면 결과가 비슷해도 distillation 이 아니고, 특정 teacher 의 답변 · 판단 · 교정 · 순위 · 행동 경로가 지속적 · 인과적 신호였다면 trace 를 복사하지 않았어도 넓은 의미의 distillation 이다 [S-2026-09-08-004]\nAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 의 행위를 \"산업적 규모의 distillation 공격\" 으로 규정하고 개별 기업 대응으로는 부족하다며 공동 대응을 요구했다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-distillation · on-policy-distillation\norg-anthropic · org-deepseek\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo","title":"Distillation 방어의 한계와 판단 기준","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["FDE","포워드 디플로이드 엔지니어","전진 배치 엔지니어"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","ax-organizational-redesign","org-cognition","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e제품 설명이나 설치 지원이 아니라, 고객의 코드베이스와 업무 맥락을 깊이 이해해야 하는 어려운 프로젝트(대규모 마이그레이션, 레거시 현대화) 를 직접 맡는 엔지니어. AI 시대의 FDE 는 \"고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람\" 이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e코그니션은 창업해도 될 수준의 프로그래머를 FDE 로 뽑는다. 창업팀과 다수 엔지니어가 IOI 등 올림피아드 메달리스트다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eFDE 의 목표는 프로젝트를 대신 끝내는 것이 아니라 고객이 스스로 같은 방식으로 일하게 만드는 것이다. 계약 후 전환 관리자와 Applied AI 인력을 함께 투입해 프로세스를 정착시킨다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e단순 코딩에서는 도구 간 차이가 작지만, 레거시 분석 · 얽힌 코드와 데이터 이해 · 운영환경 적용에서 차이가 커진다는 것이 이 직무의 존재 이유다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e국내에서 오해되고 있다는 지적: FDE 는 문제를 해결해주는 사람이지 AI 툴로 대신 일해주는 사람이 아니며, 고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람이지 사내 프로세스에 AI 를 적용하는 사람이 아니다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e전통 SI · 솔루션 엔지니어가 \"시스템을 구축해주는 사람\" 이었다면 FDE 는 문제 재구성 역할이며, 제품 지식보다 구조적 사고와 디버깅 능력이 중요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","org-cognition","task-definition-bottleneck"],"relpath":"wiki/concepts/forward-deployed-engineer.md","sources":["S-2026-09-08-002","S-2026-09-09-010"],"status":"draft","stem":"forward-deployed-engineer","summary":"고객 조직 안에 들어가 고객의 문제를 AI 가 풀 수 있는 형태로 재설계하는 엔지니어 직무. 대신 끝내주기가 아니라 고객의 자립이 목표","system":false,"text":"정의\n제품 설명이나 설치 지원이 아니라, 고객의 코드베이스와 업무 맥락을 깊이 이해해야 하는 어려운 프로젝트(대규모 마이그레이션, 레거시 현대화) 를 직접 맡는 엔지니어. AI 시대의 FDE 는 \"고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람\" 이다 [S-2026-09-08-002].\n근거 있는 사실\n코그니션은 창업해도 될 수준의 프로그래머를 FDE 로 뽑는다. 창업팀과 다수 엔지니어가 IOI 등 올림피아드 메달리스트다 [S-2026-09-08-002]\nFDE 의 목표는 프로젝트를 대신 끝내는 것이 아니라 고객이 스스로 같은 방식으로 일하게 만드는 것이다. 계약 후 전환 관리자와 Applied AI 인력을 함께 투입해 프로세스를 정착시킨다 [S-2026-09-08-002]\n단순 코딩에서는 도구 간 차이가 작지만, 레거시 분석 · 얽힌 코드와 데이터 이해 · 운영환경 적용에서 차이가 커진다는 것이 이 직무의 존재 이유다 [S-2026-09-08-002]\n국내에서 오해되고 있다는 지적: FDE 는 문제를 해결해주는 사람이지 AI 툴로 대신 일해주는 사람이 아니며, 고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람이지 사내 프로세스에 AI 를 적용하는 사람이 아니다 [S-2026-09-09-010]\n전통 SI · 솔루션 엔지니어가 \"시스템을 구축해주는 사람\" 이었다면 FDE 는 문제 재구성 역할이며, 제품 지식보다 구조적 사고와 디버깅 능력이 중요하다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\ntask-definition-bottleneck\norg-cognition\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-010-cognition-interview-ax-view","title":"FDE (Forward Deployed Engineer)","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["fully open source model","완전 오픈소스","오픈웨이트 vs 오픈소스"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","open-local-models","org-mbzuai","product-k2-horizon"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e\"오픈소스 AI\" 라고 불리는 대부분은 가중치만 공개하는 오픈웨이트다. 완전 오픈소스는 여기에 소스 코드, 전체 학습 데이터셋, 평가 · 학습 레시피(방법론), 학습 과정의 중간 체크포인트를 더해 제3자가 학습 자체를 재현하고 검증할 수 있게 하는 공개 방식이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eK2 Horizon 은 이 방식으로 6종을 Apache 2.0 라이선스로 허깅페이스에 공개했으며, IFM 은 이를 \"AI 역사상 최대 규모의 완전 오픈소스 모델 발표\" 라고 주장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e최종 결과물만 공개하는 기존 방식과 달리 중간 체크포인트를 함께 배포해 학습 과정의 변화를 추적할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-k2-horizon\" class=\"wl\"\u003eproduct-k2-horizon\u003c/a\u003e — 대표 사례\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-mbzuai\" class=\"wl\"\u003eorg-mbzuai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" class=\"wl\"\u003eS-2026-09-08-005-uae-k2-horizon-open-source\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-005-uae-k2-horizon-open-source","open-local-models","org-mbzuai","product-k2-horizon"],"relpath":"wiki/concepts/fully-open-source-model.md","sources":["S-2026-09-08-005"],"status":"draft","stem":"fully-open-source-model","summary":"가중치만 공개하는 오픈웨이트와 달리 소스 코드 · 학습 데이터 · 학습 레시피 · 중간 체크포인트까지 공개해 재현 가능한 모델 공개 방식","system":false,"text":"정의\n\"오픈소스 AI\" 라고 불리는 대부분은 가중치만 공개하는 오픈웨이트다. 완전 오픈소스는 여기에 소스 코드, 전체 학습 데이터셋, 평가 · 학습 레시피(방법론), 학습 과정의 중간 체크포인트를 더해 제3자가 학습 자체를 재현하고 검증할 수 있게 하는 공개 방식이다 [S-2026-09-08-005].\n근거 있는 사실\nK2 Horizon 은 이 방식으로 6종을 Apache 2.0 라이선스로 허깅페이스에 공개했으며, IFM 은 이를 \"AI 역사상 최대 규모의 완전 오픈소스 모델 발표\" 라고 주장한다 [S-2026-09-08-005]\n최종 결과물만 공개하는 기존 방식과 달리 중간 체크포인트를 함께 배포해 학습 과정의 변화를 추적할 수 있다 [S-2026-09-08-005]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nproduct-k2-horizon — 대표 사례\norg-mbzuai\nS-2026-09-08-005-uae-k2-horizon-open-source","title":"완전 오픈소스 모델 (오픈웨이트와의 차이)","topics":["open-local-models"],"type":"concept","updated":"2026-09-08"},{"aliases":["harness engineering","하네스","실행 환경 공학"],"back":["S-2026-09-15-003-harness-engineering-guide-provenance","_unsorted","agent-governance-guardrails","ai-workforce-runtime"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-011-gemini-agentic-video","S-2026-09-15-003-harness-engineering-guide-provenance","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"low","created":"2026-09-15","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델 호출 코드가 아니라 모델이 안전하게 오래 일하도록 만드는 실행 환경(도구 연결 · 승인 지점 · 실패 처리 · 중복 방지 · 기록) 을 설계 대상으로 삼는 분야 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026년 8월 독립 편찬된 기술 문서가 OpenAI Codex, Mitchell Hashimoto, Martin Fowler 등의 자료를 종합해 6계층으로 정리했다. 구글 공식 문서가 아니며 어떤 벤더와도 제휴 관계가 없다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e6계층의 구체 내용은 확보되지 않았다. 원문 PDF 와 요약 블로그 링크만 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 위키의 다른 소스들이 같은 방향을 가리킨다: 모델 호출 코드보다 실행 환경의 품질이 중요해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e, 고객이 사는 것은 모델이 아니라 모델이 일하는 환경이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e, 코그니션은 세션을 감독하는 하네스와 VM 격리로 신뢰를 만든다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델 쪽에서도 하네스가 내부로 들어온다. Gemini 3.7 Flash 는 API 호출만으로 내부 루프를 돌리고 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e, 벤치마크 점수도 하네스 설정에 따라 달라진다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e이 페이지의 근거 소스는 출처 정정 메모 1건이며 실제 6계층 내용은 미확보다. 개념의 윤곽만 잡아 둔 상태다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" title=\"Harness Engineering 6계층 가이드의 출처 정정\"\u003eS-2026-09-15-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — 실행 환경을 제품으로 파는 범주\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 실행 조건과 승인 지점\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 하네스 품질을 재는 지표\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e — 모델 선택 계층의 하네스\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-003-harness-engineering-guide-provenance\" class=\"wl\"\u003eS-2026-09-15-003-harness-engineering-guide-provenance\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-011-gemini-agentic-video","S-2026-09-15-003-harness-engineering-guide-provenance","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-governance-guardrails","ai-workforce-runtime","routing-harness","task-level-agent-evaluation"],"relpath":"wiki/concepts/harness-engineering-discipline.md","sources":["S-2026-09-15-003"],"status":"draft","stem":"harness-engineering-discipline","summary":"모델을 감싸 실제 일을 수행하게 만드는 실행 환경을 하나의 공학 분야로 다루는 흐름. 이 위키에 모인 여러 소스가 같은 결론에 이른 지점","system":false,"text":"정의\n모델 호출 코드가 아니라 모델이 안전하게 오래 일하도록 만드는 실행 환경(도구 연결 · 승인 지점 · 실패 처리 · 중복 방지 · 기록) 을 설계 대상으로 삼는 분야 [S-2026-09-15-003].\n근거 있는 사실\n2026년 8월 독립 편찬된 기술 문서가 OpenAI Codex, Mitchell Hashimoto, Martin Fowler 등의 자료를 종합해 6계층으로 정리했다. 구글 공식 문서가 아니며 어떤 벤더와도 제휴 관계가 없다 [S-2026-09-15-003]\n6계층의 구체 내용은 확보되지 않았다. 원문 PDF 와 요약 블로그 링크만 있다 [S-2026-09-15-003]\n이 위키의 다른 소스들이 같은 방향을 가리킨다: 모델 호출 코드보다 실행 환경의 품질이 중요해진다 [S-2026-09-09-004], 고객이 사는 것은 모델이 아니라 모델이 일하는 환경이다 [S-2026-09-09-002], 코그니션은 세션을 감독하는 하네스와 VM 격리로 신뢰를 만든다 [S-2026-09-08-002]\n모델 쪽에서도 하네스가 내부로 들어온다. Gemini 3.7 Flash 는 API 호출만으로 내부 루프를 돌리고 [S-2026-09-09-011], 벤치마크 점수도 하네스 설정에 따라 달라진다 [S-2026-09-15-004]\n모순 · 논쟁\n이 페이지의 근거 소스는 출처 정정 메모 1건이며 실제 6계층 내용은 미확보다. 개념의 윤곽만 잡아 둔 상태다 {low} [S-2026-09-15-003]\n관련 페이지\nai-workforce-runtime — 실행 환경을 제품으로 파는 범주\nagent-governance-guardrails — 실행 조건과 승인 지점\ntask-level-agent-evaluation — 하네스 품질을 재는 지표\nrouting-harness — 모델 선택 계층의 하네스\nS-2026-09-15-003-harness-engineering-guide-provenance","title":"하네스 엔지니어링","topics":[],"type":"concept","updated":"2026-09-15"},{"aliases":["승인 피로","자동화의 아이러니","전략적 마찰","approval fatigue","human-in-the-loop 한계"],"back":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","cot-monitorability-erosion"],"cites":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트가 수십 단계를 자율 수행할 때, 사람이 승인 버튼을 갖고 있다는 사실만으로는 감독이 성립하지 않는다는 문제. 세 메커니즘이 겹친다: 이해 · 기억 · 예측 · 감시의 인지 부담, 반복 승인에 따른 승인 피로, 그리고 자동화가 잘될수록 사람의 평가 역량이 약해지는 자동화의 아이러니 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e출처 보고서: Margaret Mitchell · Abhijit Ghosh · Sameer Passi, \"AI Agents Push Humans Out of the Loop\" (arXiv 2608.23642). 새 실험이 아니라 인지과학 · 자동화 · HCI · AI 연구를 종합한 정책 제안서다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e승인 피로: \"허용 · 계속 · 승인\" 을 반복 클릭하면 각 요청 검토를 멈추고 사람의 역할은 상징적이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e자동화의 아이러니: 자동화가 더 많은 일을 할수록 평가 기술을 연습할 기회가 줄어 전문성이 약해지고 상황 인식을 잃으며, 감독해야 할 시스템에 더 의존하게 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e처방 \"전략적 마찰\": AI 추천을 보기 전에 스스로 판단, 승인 근거 설명, 일부 작업을 AI 없이 수행, 판단이 중요한 순간에 멈춤. 추가로 정기적 자율 연습, 설계된 승인 시점, 휴식 · 작업 순환, 주의력 저하 인지 훈련 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경(GPT-6 Astra) 이 가능해져도 이미 실행된 행동은 되돌릴 수 없어, 되돌리기 어려운 작업에는 실행 직전 승인이 남는다. 승인 지점을 없앨 수 없다면 승인 피로를 줄이는 설계가 더 중요해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e두 번째 축이 겹친다. 감시자가 무뎌지는 것과 별개로 감시 대상 자체가 관측 불가능해진다. 루프 안 계산은 토큰을 남기지 않아 사고사슬 기반 감시가 약해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e교육에서는 배경 지식이 없는 학생이 AI 산출물을 검토할 수 없다는 형태로 같은 문제가 나타난다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 다만 코그니션은 하네스 감독과 VM 격리로 에이전트를 \"더 신뢰할 수 있다\" 고 보는데(\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e), 이 보고서는 기술적 통제 장치가 있어도 사람 쪽 역량이 침식된다는 별개의 축을 지적한다. 상충이 아니라 보완 관계로 읽힌다.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 시스템 쪽 통제. 이 페이지는 사람 쪽 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 자율성이 커질수록 감독 부담도 커진다\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cot-monitorability-erosion\" class=\"wl\"\u003ecot-monitorability-erosion\u003c/a\u003e — 감시 대상 쪽의 약화\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-governance-guardrails","ai-agents-enterprise-adoption","cot-monitorability-erosion","proactive-agent"],"relpath":"wiki/concepts/human-oversight-erosion.md","sources":["S-2026-09-08-003","S-2026-09-09-004","S-2026-09-15-004"],"status":"draft","stem":"human-oversight-erosion","summary":"사람이 루프 안에 있어도 실질적 감독이 보장되지 않는 메커니즘(인지 부담, 승인 피로, 역량 약화) 과 그 처방(전략적 마찰)","system":false,"text":"정의\n에이전트가 수십 단계를 자율 수행할 때, 사람이 승인 버튼을 갖고 있다는 사실만으로는 감독이 성립하지 않는다는 문제. 세 메커니즘이 겹친다: 이해 · 기억 · 예측 · 감시의 인지 부담, 반복 승인에 따른 승인 피로, 그리고 자동화가 잘될수록 사람의 평가 역량이 약해지는 자동화의 아이러니 [S-2026-09-08-003].\n근거 있는 사실\n출처 보고서: Margaret Mitchell · Abhijit Ghosh · Sameer Passi, \"AI Agents Push Humans Out of the Loop\" (arXiv 2608.23642). 새 실험이 아니라 인지과학 · 자동화 · HCI · AI 연구를 종합한 정책 제안서다 [S-2026-09-08-003]\n승인 피로: \"허용 · 계속 · 승인\" 을 반복 클릭하면 각 요청 검토를 멈추고 사람의 역할은 상징적이 된다 [S-2026-09-08-003]\n자동화의 아이러니: 자동화가 더 많은 일을 할수록 평가 기술을 연습할 기회가 줄어 전문성이 약해지고 상황 인식을 잃으며, 감독해야 할 시스템에 더 의존하게 된다 [S-2026-09-08-003]\n처방 \"전략적 마찰\": AI 추천을 보기 전에 스스로 판단, 승인 근거 설명, 일부 작업을 AI 없이 수행, 판단이 중요한 순간에 멈춤. 추가로 정기적 자율 연습, 설계된 승인 시점, 휴식 · 작업 순환, 주의력 저하 인지 훈련 [S-2026-09-08-003]\n실행 중 지시 변경(GPT-6 Astra) 이 가능해져도 이미 실행된 행동은 되돌릴 수 없어, 되돌리기 어려운 작업에는 실행 직전 승인이 남는다. 승인 지점을 없앨 수 없다면 승인 피로를 줄이는 설계가 더 중요해진다 [S-2026-09-09-004]\n두 번째 축이 겹친다. 감시자가 무뎌지는 것과 별개로 감시 대상 자체가 관측 불가능해진다. 루프 안 계산은 토큰을 남기지 않아 사고사슬 기반 감시가 약해진다 [S-2026-09-15-004]\n교육에서는 배경 지식이 없는 학생이 AI 산출물을 검토할 수 없다는 형태로 같은 문제가 나타난다 [S-2026-09-08-003]\n모순 · 논쟁\n(없음) — 다만 코그니션은 하네스 감독과 VM 격리로 에이전트를 \"더 신뢰할 수 있다\" 고 보는데(agent-governance-guardrails), 이 보고서는 기술적 통제 장치가 있어도 사람 쪽 역량이 침식된다는 별개의 축을 지적한다. 상충이 아니라 보완 관계로 읽힌다.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nagent-governance-guardrails — 시스템 쪽 통제. 이 페이지는 사람 쪽 문제\nproactive-agent — 자율성이 커질수록 감독 부담도 커진다\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-09-004-gpt-6-astra-task-completion\ncot-monitorability-erosion — 감시 대상 쪽의 약화\nS-2026-09-15-004-astra-verified-and-hardware-shift","title":"인간 감독의 침식: 승인 피로 · 자동화의 아이러니 · 전략적 마찰","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-15"},{"aliases":["디코드 병목","compute-bound decode","추론 하드웨어","Continuous Depth Batching"],"back":["S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","loop-transformer-latent-reasoning","org-nvidia"],"cites":["S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-15","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e토큰마다 전체 가중치를 읽어야 해 memory-bound 였던 디코드가, 반복 연산으로 토큰당 FLOPs 가 r 배 늘면서 arithmetic intensity 가 올라가 연산 유닛이 병목이 되는 쪽으로 이동하는 현상 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e지난 1년 반 동안 사고사슬을 길게 뽑으려면 디코딩을 길게 해야 했고, 디코드가 memory-bound 라 HBM 수요가 컸다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eHuginn 구조에서는 생성 토큰마다 prelude → core × r → coda 를 통과해 토큰당 연산량이 r 배가 된다. 가중치는 고정인데 FLOPs 가 늘어난다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e반대 방향의 힘: 원 논문은 반복 스텝마다 KV 캐시를 따로 두는 것이 기본이라 메모리가 오히려 늘 수 있다. 서빙 시스템의 KV 캐시 공유 정도에 달렸다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e파라미터가 작고 연산이 반복되면 가중치를 온칩 SRAM 에 상주시키는 구조(Groq LPU, Cerebras) 가 유리해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e서빙 쟁점은 스케줄링이다. 토큰마다 반복 횟수가 다르면 배치 안 토큰들이 제각각 종료돼 배치 정렬이 깨진다. 2026년 8월 Continuous Depth Batching 논문이 이 문제를 다루지만 답은 아직 없다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이 제안: r 값을 몇 가지로 정규화해 디코드 파이프라인 체류 시간을 예측 가능하게 고정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e에이전트 워크로드는 끝없이 컨텍스트를 물고 돌아 프리필 부하를 키운다. 메모리 계층이 쉽게 가벼워지지 않는 이유다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e루프가 연산 비중을 올린다는 방향과, 에이전트 워크로드가 프리필 · 메모리 부하를 올린다는 방향이 동시에 작용한다. 글쓴이도 한쪽으로 단정하지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델 크기 상한 전망도 양쪽이다. 파라미터 고정으로 성능을 올리면 대형 랙의 위치가 미묘해지지만, 아스트라 자체가 사전학습 컴퓨트를 크게 늘렸고 프론티어는 10T 를 찍는다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 이 이동을 만드는 구조\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-nvidia\" class=\"wl\"\u003eorg-nvidia\u003c/a\u003e — Rubin CPX · Groq 3 LPU\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","loop-transformer-latent-reasoning","org-nvidia"],"relpath":"wiki/concepts/inferenc
