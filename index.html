nt-wiki","skill-evolution-persistent-wiki"],"cites":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-012-wisdombase-docs-to-wiki-mcp"],"confidence":"medium","created":"2026-09-09","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e같은 구조가 서로 다른 세 층위에서 반복해서 나타난다. 원전은 사람의 지식 베이스다. 질문할 때마다 원문 조각을 다시 찾는 RAG 와 달리, LLM 이 원본을 한 번 읽어 영속적인 마크다운 위키에 통합하고 계속 최신으로 유지하며, 구조는 불변 원본 · LLM 이 소유하는 위키 · 규칙 문서의 3계층이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e같은 3계층이 에이전트의 스킬 학습에도 적용됐다. 구글 리서치 WikiSkill 은 원시 실행 경험 · 축적된 영구 위키 · 실행 가능한 스킬을 분리하고, 스킬 갱신을 파편화된 최적화 이력이 아니라 위키 위에서 수행해 기존 최고 성능 방법들을 능가했다. 절제 연구가 성공의 핵심을 '위키를 통한 지속적 축적' 으로 지목했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e. 여기서 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 이겼고 스킬은 모델 계열을 넘어 전이됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e세 번째 층위는 사내 문서다. Wisdombase 는 비정형 문서를 올리면 구조화된 위키 사이트와 MCP 서버 · 챗봇을 자동 생성해, 사내 RAG 를 별도 프로젝트로 구축하지 않아도 되게 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e. 세 사례의 공통점은 검색 대신 컴파일이며, 차이는 편집 규율(출처 · 모순 · 갱신) 을 사람이 정하느냐 자동화하느냐에 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 원전이 정의하는 3계층과 ingest · query · lint\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/rag-vs-persistent-wiki\" class=\"wl\"\u003erag-vs-persistent-wiki\u003c/a\u003e — 축적이 없는 방식과의 대비\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e — 에이전트 경험을 위키로 컴파일해 스킬 진화\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/person-andrej-karpathy\" class=\"wl\"\u003eperson-andrej-karpathy\u003c/a\u003e — 원전 저자\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-obsidian\" class=\"wl\"\u003eproduct-obsidian\u003c/a\u003e — 위키 열람 도구\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-ai3\" class=\"wl\"\u003eorg-ai3\u003c/a\u003e · \u003ca href=\"#/product-wisdombase\" class=\"wl\"\u003eproduct-wisdombase\u003c/a\u003e — 사내 문서 자동 컴파일 서비스\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" class=\"wl\"\u003eS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" class=\"wl\"\u003eS-2026-09-09-012-wisdombase-docs-to-wiki-mcp\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e AI3, Wisdombase 출시 — 문서 → 위키 + MCP 서버\u003c/li\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e 구글 리서치 WikiSkill 논문 소개\u003c/li\u003e\n\u003cli\u003e2026-08-19 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e Karpathy, LLM Wiki 패턴 gist 공개\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리 위키를 MCP 서버로 노출할 필요가 생기는 시점은 언제인가 (현재는 단일 HTML 뷰어와 파일 검색으로 충분)\u003c/li\u003e\n\u003cli\u003eWisdombase 의 자동 파싱(HWP 포함 19종) 을 우리 intake 대신 쓰는 것이 나은 경우가 있는가\u003c/li\u003e\n\u003cli\u003e에이전트의 실행 경험을 우리 위키에도 컴파일해야 하는가 (현재는 사람이 공유한 자료만 들어온다)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-09: 같은 날 WikiSkill 논문과 Wisdombase 출시를 함께 공유 — 지식 베이스 컴파일이라는 한 흐름에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","llm-wiki-pattern","org-ai3","person-andrej-karpathy","product-obsidian","product-wisdombase","rag-vs-persistent-wiki","skill-evolution-persistent-wiki"],"relpath":"wiki/topics/knowledge-base-compilation.md","sources":["S-2026-09-08-001","S-2026-09-09-006","S-2026-09-09-012"],"status":"draft","stem":"knowledge-base-compilation","summary":"질의 때마다 원문을 다시 뒤지는 대신 원본을 한 번 위키로 컴파일해 유지하는 접근. 사람의 지식 베이스, 에이전트의 스킬 학습, 사내 문서 서비스에서 같은 구조가 반복된다","system":false,"text":"현재 종합\n같은 구조가 서로 다른 세 층위에서 반복해서 나타난다. 원전은 사람의 지식 베이스다. 질문할 때마다 원문 조각을 다시 찾는 RAG 와 달리, LLM 이 원본을 한 번 읽어 영속적인 마크다운 위키에 통합하고 계속 최신으로 유지하며, 구조는 불변 원본 · LLM 이 소유하는 위키 · 규칙 문서의 3계층이다 [S-2026-09-08-001].\n같은 3계층이 에이전트의 스킬 학습에도 적용됐다. 구글 리서치 WikiSkill 은 원시 실행 경험 · 축적된 영구 위키 · 실행 가능한 스킬을 분리하고, 스킬 갱신을 파편화된 최적화 이력이 아니라 위키 위에서 수행해 기존 최고 성능 방법들을 능가했다. 절제 연구가 성공의 핵심을 '위키를 통한 지속적 축적' 으로 지목했다 [S-2026-09-09-006]. 여기서 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 이겼고 스킬은 모델 계열을 넘어 전이됐다 [S-2026-09-09-006].\n세 번째 층위는 사내 문서다. Wisdombase 는 비정형 문서를 올리면 구조화된 위키 사이트와 MCP 서버 · 챗봇을 자동 생성해, 사내 RAG 를 별도 프로젝트로 구축하지 않아도 되게 한다 [S-2026-09-09-012]. 세 사례의 공통점은 검색 대신 컴파일이며, 차이는 편집 규율(출처 · 모순 · 갱신) 을 사람이 정하느냐 자동화하느냐에 있다 [S-2026-09-08-001] [S-2026-09-09-012].\n하위 페이지\n개념\nllm-wiki-pattern — 원전이 정의하는 3계층과 ingest · query · lint\nrag-vs-persistent-wiki — 축적이 없는 방식과의 대비\nskill-evolution-persistent-wiki — 에이전트 경험을 위키로 컴파일해 스킬 진화\n엔티티\nperson-andrej-karpathy — 원전 저자\nproduct-obsidian — 위키 열람 도구\norg-ai3 · product-wisdombase — 사내 문서 자동 컴파일 서비스\n소스\nS-2026-09-08-001-karpathy-llm-wiki\nS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\nS-2026-09-09-012-wisdombase-docs-to-wiki-mcp\n타임라인\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-012] AI3, Wisdombase 출시 — 문서 → 위키 + MCP 서버\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-006] 구글 리서치 WikiSkill 논문 소개\n2026-08-19 [S-2026-09-08-001] Karpathy, LLM Wiki 패턴 gist 공개\n열린 질문\n우리 위키를 MCP 서버로 노출할 필요가 생기는 시점은 언제인가 (현재는 단일 HTML 뷰어와 파일 검색으로 충분)\nWisdombase 의 자동 파싱(HWP 포함 19종) 을 우리 intake 대신 쓰는 것이 나은 경우가 있는가\n에이전트의 실행 경험을 우리 위키에도 컴파일해야 하는가 (현재는 사람이 공유한 자료만 들어온다)\n관심 흐름\n2026-09-09: 같은 날 WikiSkill 논문과 Wisdombase 출시를 함께 공유 — 지식 베이스 컴파일이라는 한 흐름에 대한 관심으로 추정 (추정)","title":"지식 베이스 컴파일: 원본을 위키로 만들어 쌓는다","topics":[],"type":"topic","updated":"2026-09-09"},{"aliases":["지식 증류","distillation","증류","KD"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","_unsorted","distillation-defense-limits","on-policy-distillation","org-deepseek","post-training-agent-capability","rlvr-domain-expansion"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e큰 teacher 모델의 출력을 작은 student 모델이 따라가도록 학습시켜 지식을 옮기는 기술. 정답 라벨(고양이 1, 나머지 0) 대신 teacher 의 확률 분포(고양이 87%, 개 9%, 여우 3%) 를 배우면 \"고양이는 개와 비슷하고 자동차와는 무관하다\" 는 관계 정보(dark knowledge) 까지 전달된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e출발점으로 흔히 인용되는 논문은 Hinton · Vinyals · Dean 의 「Distilling the Knowledge in a Neural Network」(2015). teacher/student 와 soft target 의 가치를 체계화했고 3만 회 이상 인용됐지만 NeurIPS 본회의에서는 리젝돼 워크숍에 실렸다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원래 목적은 경쟁사 기술 탈취가 아니라 같은 조직 안에서 큰 모델을 압축해 휴대전화 · 서버에서 싸게 돌리는 경량화였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e초기 정의는 좁았다(teacher 확률분포를 student 가 따라감). LLM 으로 오면서 teacher 가 전달하는 것이 완성 답변 · 풀이 과정 · 실패 수정법 · 답안 순위 · 코드 수정안 · 도구 선택 순서 · 비평까지 넓어졌다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e스펙트럼: 한쪽 끝은 teacher logit 을 직접 복사하는 고전적 KD, 다른 끝은 외부 teacher 없이 verifier 와 환경만으로 학습하는 독립 RL. 그 사이에 teacher-generated data, chain-of-thought 학습, synthetic data, LLM judge, RLAIF, preference learning, critique-and-revision, on-policy correction, agent trajectory 학습이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDistillation 이 잘 되려면 강한 base model · 자체 pre-training · 충분한 데이터와 컴퓨팅 · post-training 인프라가 먼저 있어야 한다. 마지막 격차를 빠르게 줄이는 데 효과적이지 약한 baseline 에서 frontier 를 만들지는 못한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기술적 distillation 과 약관 위반 · IP 침해 · 보안 공격은 별개 문제다. 알고리즘 이름으로 합법 · 불법을 판단할 수 없다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — 스펙트럼의 최신 형태\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 방어와 판단 기준\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e — 2026년 2월 논쟁 당사자\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","distillation-defense-limits","on-policy-distillation","org-anthropic","org-deepseek"],"relpath":"wiki/concepts/knowledge-distillation.md","sources":["S-2026-09-08-004"],"status":"draft","stem":"knowledge-distillation","summary":"큰 teacher 모델의 지식(soft target 의 dark knowledge 포함) 을 작은 student 모델로 옮기는 기술. 원래는 경량화 목적이었으나 LLM 시대에 능력 이전 스펙트럼으로 확장","system":false,"text":"정의\n큰 teacher 모델의 출력을 작은 student 모델이 따라가도록 학습시켜 지식을 옮기는 기술. 정답 라벨(고양이 1, 나머지 0) 대신 teacher 의 확률 분포(고양이 87%, 개 9%, 여우 3%) 를 배우면 \"고양이는 개와 비슷하고 자동차와는 무관하다\" 는 관계 정보(dark knowledge) 까지 전달된다 [S-2026-09-08-004].\n근거 있는 사실\n출발점으로 흔히 인용되는 논문은 Hinton · Vinyals · Dean 의 「Distilling the Knowledge in a Neural Network」(2015). teacher/student 와 soft target 의 가치를 체계화했고 3만 회 이상 인용됐지만 NeurIPS 본회의에서는 리젝돼 워크숍에 실렸다 [S-2026-09-08-004]\n원래 목적은 경쟁사 기술 탈취가 아니라 같은 조직 안에서 큰 모델을 압축해 휴대전화 · 서버에서 싸게 돌리는 경량화였다 [S-2026-09-08-004]\n초기 정의는 좁았다(teacher 확률분포를 student 가 따라감). LLM 으로 오면서 teacher 가 전달하는 것이 완성 답변 · 풀이 과정 · 실패 수정법 · 답안 순위 · 코드 수정안 · 도구 선택 순서 · 비평까지 넓어졌다 [S-2026-09-08-004]\n스펙트럼: 한쪽 끝은 teacher logit 을 직접 복사하는 고전적 KD, 다른 끝은 외부 teacher 없이 verifier 와 환경만으로 학습하는 독립 RL. 그 사이에 teacher-generated data, chain-of-thought 학습, synthetic data, LLM judge, RLAIF, preference learning, critique-and-revision, on-policy correction, agent trajectory 학습이 있다 [S-2026-09-08-004]\nDistillation 이 잘 되려면 강한 base model · 자체 pre-training · 충분한 데이터와 컴퓨팅 · post-training 인프라가 먼저 있어야 한다. 마지막 격차를 빠르게 줄이는 데 효과적이지 약한 baseline 에서 frontier 를 만들지는 못한다 [S-2026-09-08-004]\n기술적 distillation 과 약관 위반 · IP 침해 · 보안 공격은 별개 문제다. 알고리즘 이름으로 합법 · 불법을 판단할 수 없다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\non-policy-distillation — 스펙트럼의 최신 형태\ndistillation-defense-limits — 방어와 판단 기준\norg-anthropic · org-deepseek — 2026년 2월 논쟁 당사자\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo","title":"Knowledge Distillation (지식 증류)","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["LLM 위키","llm-wiki","LLM Wiki"],"back":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","knowledge-base-compilation","person-andrej-karpathy","product-obsidian","product-wisdombase","rag-vs-persistent-wiki","skill-evolution-persistent-wiki"],"cites":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eLLM 에이전트가 사람 대신 지식 베이스를 쓰고 유지하는 패턴. 원본 문서를 질문 때마다 검색하는 대신, 새 소스가 들어올 때 LLM 이 읽고 기존 위키 페이지에 통합해 \"한 번 컴파일하고 계속 최신으로 유지\" 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e세 계층으로 구성된다: 불변 원본(raw), LLM 이 전적으로 소유하는 마크다운 위키, 구조와 워크플로를 정의하는 스키마 문서(CLAUDE.md / AGENTS.md) \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e세 가지 운영 작업이 있다: ingest(소스 1건 → 요약 페이지 + 관련 페이지 10~15개 갱신 + index/log), query(인용 달린 답을 위키에 다시 파일링), lint(모순 · 정체 · 고아 · 누락 페이지 · 공백 점검) \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eindex.md 는 내용 카탈로그, log.md 는 시간순 기록으로 역할이 다르다. log 항목은 \u003ccode\u003e## [날짜] 작업 | 제목\u003c/code\u003e 접두어로 유닉스 도구로 파싱 가능하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e소스 약 100건 · 페이지 수백 개 규모까지는 index.md 만으로 탐색이 되고 임베딩 인프라가 필요 없다. 그 이상은 qmd 같은 로컬 검색을 붙인다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e사람의 역할은 소스 큐레이션 · 분석 방향 · 질문이고, 요약 · 상호참조 · 파일링 · 장부 정리는 LLM 의 일이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e적용 범위로 개인 · 연구 · 독서 · 팀 내부 위키 · 경쟁 분석 · 실사 등이 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 3계층 분리가 에이전트 스킬 학습에도 적용됐다. 구글 리서치 WikiSkill 은 원시 실행 경험 · 영구 위키 · 실행 가능한 스킬을 분리하고 위키 위에서 스킬을 갱신해, 절제 연구로 '위키를 통한 지속적 축적' 이 성공의 핵심임을 확인했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원전은 의도적으로 추상적이며, 구체 구조는 도메인별로 에이전트와 함께 정하라고 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/rag-vs-persistent-wiki\" class=\"wl\"\u003erag-vs-persistent-wiki\u003c/a\u003e — 이 패턴이 대체하려는 방식과의 차이\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e — 에이전트 스킬 학습에 적용된 같은 구조\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/person-andrej-karpathy\" class=\"wl\"\u003eperson-andrej-karpathy\u003c/a\u003e — 제안자\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-obsidian\" class=\"wl\"\u003eproduct-obsidian\u003c/a\u003e — 권장 열람 도구\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e — 원전\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" class=\"wl\"\u003eS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","knowledge-base-compilation","person-andrej-karpathy","product-obsidian","rag-vs-persistent-wiki","skill-evolution-persistent-wiki"],"relpath":"wiki/concepts/llm-wiki-pattern.md","sources":["S-2026-09-08-001","S-2026-09-09-006"],"status":"draft","stem":"llm-wiki-pattern","summary":"LLM 이 원본을 영속 마크다운 위키로 컴파일 · 유지하는 지식 관리 패턴. raw/wiki/schema 3계층과 ingest · query · lint 루프","system":false,"text":"정의\nLLM 에이전트가 사람 대신 지식 베이스를 쓰고 유지하는 패턴. 원본 문서를 질문 때마다 검색하는 대신, 새 소스가 들어올 때 LLM 이 읽고 기존 위키 페이지에 통합해 \"한 번 컴파일하고 계속 최신으로 유지\" 한다 [S-2026-09-08-001].\n근거 있는 사실\n세 계층으로 구성된다: 불변 원본(raw), LLM 이 전적으로 소유하는 마크다운 위키, 구조와 워크플로를 정의하는 스키마 문서(CLAUDE.md / AGENTS.md) [S-2026-09-08-001]\n세 가지 운영 작업이 있다: ingest(소스 1건 → 요약 페이지 + 관련 페이지 10~15개 갱신 + index/log), query(인용 달린 답을 위키에 다시 파일링), lint(모순 · 정체 · 고아 · 누락 페이지 · 공백 점검) [S-2026-09-08-001]\nindex.md 는 내용 카탈로그, log.md 는 시간순 기록으로 역할이 다르다. log 항목은 ## [날짜] 작업 | 제목 접두어로 유닉스 도구로 파싱 가능하다 [S-2026-09-08-001]\n소스 약 100건 · 페이지 수백 개 규모까지는 index.md 만으로 탐색이 되고 임베딩 인프라가 필요 없다. 그 이상은 qmd 같은 로컬 검색을 붙인다 [S-2026-09-08-001]\n사람의 역할은 소스 큐레이션 · 분석 방향 · 질문이고, 요약 · 상호참조 · 파일링 · 장부 정리는 LLM 의 일이다 [S-2026-09-08-001]\n적용 범위로 개인 · 연구 · 독서 · 팀 내부 위키 · 경쟁 분석 · 실사 등이 제시된다 [S-2026-09-08-001]\n같은 3계층 분리가 에이전트 스킬 학습에도 적용됐다. 구글 리서치 WikiSkill 은 원시 실행 경험 · 영구 위키 · 실행 가능한 스킬을 분리하고 위키 위에서 스킬을 갱신해, 절제 연구로 '위키를 통한 지속적 축적' 이 성공의 핵심임을 확인했다 [S-2026-09-09-006]\n원전은 의도적으로 추상적이며, 구체 구조는 도메인별로 에이전트와 함께 정하라고 한다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-base-compilation — 상위 주제\nrag-vs-persistent-wiki — 이 패턴이 대체하려는 방식과의 차이\nskill-evolution-persistent-wiki — 에이전트 스킬 학습에 적용된 같은 구조\nperson-andrej-karpathy — 제안자\nproduct-obsidian — 권장 열람 도구\nS-2026-09-08-001-karpathy-llm-wiki — 원전\nS-2026-09-09-006-wikiskill-agent-experience-to-knowledge","title":"LLM Wiki 패턴","topics":["knowledge-base-compilation"],"type":"concept","updated":"2026-09-09"},{"aliases":["24GB 경계","로컬 모델","local model","온프레미스 모델"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-005-arena-coding-leaderboard-shift","loop-transformer-latent-reasoning","open-local-models","org-startlux","post-training-agent-capability","product-muse-glimmer","product-qwen","sovereign-ai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-009-loop-transformer-after-astra"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e클라우드에서는 모델이 인프라에 맞춰 커졌지만, 로컬에서는 인프라(소비자 GPU 메모리 24GB) 가 모델 크기의 상한을 정한다. 그 결과 여러 회사의 로컬 모델이 27~30B 에 모였다. \"제약이 표준을 만들고 표준이 생태계를 만든다\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAlibaba Qwen3.8-27B(2026-08-14, Apache 2.0): 27B Dense, 네이티브 멀티모달, 262K 컨텍스트. 4비트 양자화 시 약 17GB. LM Studio · Ollama · Unsloth 원클릭 설치 지원 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eMeta Muse Glimmer(2026-08-10, 같은 라이선스): 30B Dense + 1.8B 지각 인코더, 120K+ 컨텍스트. 4비트 동적 양자화로 17~20GB, 24~32GB 안에 KV 캐시와 추측적 디코딩 여유까지 확보 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eStartLux-V1.0-27B-Preview: Qwen3.6-27B 기반 후훈련 모델 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e뒷받침 기술: 추측적 디코딩(작은 초안 모델이 여러 토큰 생성, 큰 모델이 한 번에 검증), KV 캐시 최적화. Qwen3.8-27B 는 64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시 생성 층을 1/4 로 줄였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArena 코딩 리더보드에서 Qwen3.8-27B 가 약 1600 Elo 로 상위권에 근접했다는 관찰은 24GB 규격이 성능 타협이 아니라는 독립 근거다 (전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e상한을 바꿀 수 있는 변수: 같은 층을 반복 통과시켜 작은 모델의 추론 성능을 올리는 계열이 보고되고 있다(Huginn 3.5B×32 ≈ 50B 급 주장). 재현은 미확인이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 사용자 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e클라우드는 사라지지 않고 재편된다. Microsoft Azure Local, Google 경량 Flash 계열처럼 빅테크도 로컬을 흡수하며, 미래는 \"어떤 작업을 어디서\" 가 정해지는 계층 구조다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e천다녠은 로컬 모델이 3년 안에 시장 80% 를 점유한다고 예측한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 반면 코그니션은 개발자 데이터에서 IDE 보다 클라우드 에이전트 사용이 늘고 있다고 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 같은 글이 \"클라우드 대 로컬\" 이 아니라 계층화라고 정리하므로 정면 충돌은 아니지만, 어느 작업이 어디로 가는지는 열린 문제다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 같은 크기에서 성능을 올리는 층\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/product-muse-glimmer\" class=\"wl\"\u003eproduct-muse-glimmer\u003c/a\u003e · \u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 반대편 흐름\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" class=\"wl\"\u003eS-2026-09-09-009-loop-transformer-after-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-009-loop-transformer-after-astra","cloud-agent","loop-transformer-latent-reasoning","open-local-models","org-startlux","post-training-agent-capability","product-muse-glimmer","product-qwen"],"relpath":"wiki/concepts/local-model-24gb-boundary.md","sources":["S-2026-09-08-006","S-2026-09-09-005","S-2026-09-09-009"],"status":"draft","stem":"local-model-24gb-boundary","summary":"소비자 GPU 한 장(24GB) 이 설계 제약이 되어 27~30B Dense 4비트(17~20GB) 가 로컬 모델 표준으로 수렴하고, 양자화 · 추측적 디코딩 · KV 캐시 최적화가 이를 뒷받침한다는 관찰","system":false,"text":"정의\n클라우드에서는 모델이 인프라에 맞춰 커졌지만, 로컬에서는 인프라(소비자 GPU 메모리 24GB) 가 모델 크기의 상한을 정한다. 그 결과 여러 회사의 로컬 모델이 27~30B 에 모였다. \"제약이 표준을 만들고 표준이 생태계를 만든다\" [S-2026-09-08-006].\n근거 있는 사실\nAlibaba Qwen3.8-27B(2026-08-14, Apache 2.0): 27B Dense, 네이티브 멀티모달, 262K 컨텍스트. 4비트 양자화 시 약 17GB. LM Studio · Ollama · Unsloth 원클릭 설치 지원 [S-2026-09-08-006]\nMeta Muse Glimmer(2026-08-10, 같은 라이선스): 30B Dense + 1.8B 지각 인코더, 120K+ 컨텍스트. 4비트 동적 양자화로 17~20GB, 24~32GB 안에 KV 캐시와 추측적 디코딩 여유까지 확보 [S-2026-09-08-006]\nStartLux-V1.0-27B-Preview: Qwen3.6-27B 기반 후훈련 모델 [S-2026-09-08-006]\n뒷받침 기술: 추측적 디코딩(작은 초안 모델이 여러 토큰 생성, 큰 모델이 한 번에 검증), KV 캐시 최적화. Qwen3.8-27B 는 64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시 생성 층을 1/4 로 줄였다 [S-2026-09-08-006]\nArena 코딩 리더보드에서 Qwen3.8-27B 가 약 1600 Elo 로 상위권에 근접했다는 관찰은 24GB 규격이 성능 타협이 아니라는 독립 근거다 (전언) [S-2026-09-09-005]\n상한을 바꿀 수 있는 변수: 같은 층을 반복 통과시켜 작은 모델의 추론 성능을 올리는 계열이 보고되고 있다(Huginn 3.5B×32 ≈ 50B 급 주장). 재현은 미확인이다 [S-2026-09-09-009]\n로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 사용자 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 [S-2026-09-08-006]\n클라우드는 사라지지 않고 재편된다. Microsoft Azure Local, Google 경량 Flash 계열처럼 빅테크도 로컬을 흡수하며, 미래는 \"어떤 작업을 어디서\" 가 정해지는 계층 구조다 [S-2026-09-08-006]\n모순 · 논쟁\n천다녠은 로컬 모델이 3년 안에 시장 80% 를 점유한다고 예측한다 [S-2026-09-08-006]. 반면 코그니션은 개발자 데이터에서 IDE 보다 클라우드 에이전트 사용이 늘고 있다고 한다 [S-2026-09-08-002]. 같은 글이 \"클라우드 대 로컬\" 이 아니라 계층화라고 정리하므로 정면 충돌은 아니지만, 어느 작업이 어디로 가는지는 열린 문제다.\n관련 페이지\nopen-local-models — 상위 주제\npost-training-agent-capability — 같은 크기에서 성능을 올리는 층\nproduct-qwen · product-muse-glimmer · org-startlux\ncloud-agent — 반대편 흐름\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-005-arena-coding-leaderboard-shift\nS-2026-09-09-009-loop-transformer-after-astra\nloop-transformer-latent-reasoning","title":"로컬 모델과 24GB 경계선","topics":["open-local-models"],"type":"concept","updated":"2026-09-09"},{"aliases":["loop transformer","루프 트랜스포머","잠재 추론","recurrent depth","test-time scaling"],"back":["S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","cot-monitorability-erosion","inference-hardware-shift-recurrent-depth","local-model-24gb-boundary","org-google-deepmind","org-world-labs","product-gpt-6-astra"],"cites":["S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e네트워크를 더 넓히거나 깊게 하는 대신 중간 레이어를 반복 통과시켜 추론 시 연산량을 늘리는 방식. 파라미터는 고정이고 시간이 성능을 만든다. 사고사슬이 외부 토큰으로 생각한다면 이 방식은 잠재 상태를 내부에서 반복 정제한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e계보: 2018년 Universal Transformer, ALBERT, RYS, 2025년 Recurrent Depth 와 Mixture of Recursions, 바이트댄스 LoopLM(1.4B 반복으로 12B 급 성능 주장) \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e오래 \"잘 안 된다\" 고 여겨진 이유는 역할 중복이다. 같은 블록을 반복하면 한 레이어가 첫 바퀴의 피처 추출과 나중 바퀴의 컨텍스트 판단을 겹쳐 맡는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우회로 1: 업스테이지 DUS 는 32층 Mistral 7B 를 복제해 24+24=48층으로 이어 붙였고 KT 믿음 2.0 등이 채택했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우회로 2: David Ng 의 RYS 는 Qwen2-72B 의 45~51층 7개 층만 한 번 더 통과시켜 가중치 변경 없이 HuggingFace Open LLM 리더보드 1위를 기록했고, 2026년 3월 재현 연구가 다른 모델에서도 추론 벤치 상승을 보고했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e구조적 해법: 2025년 2월 Huginn(Geiping et al.) 은 prelude · recurrent core · coda 로 나눠 core 만 r 번 돌리고, 학습 시 r 을 확률적으로 샘플링하며 추론 시 잠재 상태의 KL 수렴으로 조기 종료한다. 3.5B 를 32번 돌려 약 50B 급 성능을 보고했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e병렬 계열: 사람 말이 아닌 토큰 영역에서 계산하는 Pause tokens(2023), Quiet-STaR(2024), Meta Coconut(2024-12, 히든 스테이트를 토큰으로 바꾸지 않고 되먹임) \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이는 이 설계가 1년 반 만에 프론티어 모델에 들어간 것이 GPT-6 Astra 발표의 의미라고 본다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e후속 근거: 2026-09-02 The Information 이 아스트라의 recurrent depth 사용을 보도했고, OpenAI 연구자들은 \"루프 사용 범위를 제한했다\" 고 반박했다. 후속 보도로는 Anthropic 과 Google DeepMind 도 같은 기술을 검토 중이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e대가가 따른다. 루프 안의 계산은 토큰을 남기지 않아 사고사슬 기반 감시가 약해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e추론 경제도 바뀐다. 토큰당 연산량이 r 배가 되어 디코드가 memory-bound 에서 compute-bound 쪽으로 이동한다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e재현 문제가 반복해서 지적된다. Huginn 재현은 \"또 다른 이야기\" 이고, RYS 가 되는 이유에 대해서는 \"RLHF 로 망가진 부분을 우회하는 효과일 뿐\" 이라는 반론이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eAstra 가 실제로 이 방식을 썼다는 것은 여전히 보도와 정황 기반이다. OpenAI 공식 확인은 없다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e다른 소스는 Astra 를 \"하나의 거대한 두뇌가 하위 에이전트를 동적 생성하는 멀티 에이전트 아키텍처\" 로 설명한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e. 두 설명이 같은 모델의 다른 층위를 말하는지, 한쪽이 틀렸는지는 미확인.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — 작은 모델을 오래 돌리는 경로가 로컬 상한을 바꾼다\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" class=\"wl\"\u003eS-2026-09-09-009-loop-transformer-after-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cot-monitorability-erosion\" class=\"wl\"\u003ecot-monitorability-erosion\u003c/a\u003e · \u003ca href=\"#/inference-hardware-shift-recurrent-depth\" class=\"wl\"\u003einference-hardware-shift-recurrent-depth\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","cot-monitorability-erosion","inference-hardware-shift-recurrent-depth","local-model-24gb-boundary","product-gpt-6-astra"],"relpath":"wiki/concepts/loop-transformer-latent-reasoning.md","sources":["S-2026-09-09-009","S-2026-09-15-004"],"status":"draft","stem":"loop-transformer-latent-reasoning","summary":"같은 레이어를 여러 번 통과시켜 파라미터를 고정한 채 연산 시간만으로 성능을 올리는 접근. 사고사슬이 밖으로 토큰을 쓴다면 이쪽은 안에서 잠재 상태를 돌린다","system":false,"text":"정의\n네트워크를 더 넓히거나 깊게 하는 대신 중간 레이어를 반복 통과시켜 추론 시 연산량을 늘리는 방식. 파라미터는 고정이고 시간이 성능을 만든다. 사고사슬이 외부 토큰으로 생각한다면 이 방식은 잠재 상태를 내부에서 반복 정제한다 [S-2026-09-09-009].\n근거 있는 사실\n계보: 2018년 Universal Transformer, ALBERT, RYS, 2025년 Recurrent Depth 와 Mixture of Recursions, 바이트댄스 LoopLM(1.4B 반복으로 12B 급 성능 주장) [S-2026-09-09-009]\n오래 \"잘 안 된다\" 고 여겨진 이유는 역할 중복이다. 같은 블록을 반복하면 한 레이어가 첫 바퀴의 피처 추출과 나중 바퀴의 컨텍스트 판단을 겹쳐 맡는다 [S-2026-09-09-009]\n우회로 1: 업스테이지 DUS 는 32층 Mistral 7B 를 복제해 24+24=48층으로 이어 붙였고 KT 믿음 2.0 등이 채택했다 [S-2026-09-09-009]\n우회로 2: David Ng 의 RYS 는 Qwen2-72B 의 45~51층 7개 층만 한 번 더 통과시켜 가중치 변경 없이 HuggingFace Open LLM 리더보드 1위를 기록했고, 2026년 3월 재현 연구가 다른 모델에서도 추론 벤치 상승을 보고했다 [S-2026-09-09-009]\n구조적 해법: 2025년 2월 Huginn(Geiping et al.) 은 prelude · recurrent core · coda 로 나눠 core 만 r 번 돌리고, 학습 시 r 을 확률적으로 샘플링하며 추론 시 잠재 상태의 KL 수렴으로 조기 종료한다. 3.5B 를 32번 돌려 약 50B 급 성능을 보고했다 [S-2026-09-09-009]\n병렬 계열: 사람 말이 아닌 토큰 영역에서 계산하는 Pause tokens(2023), Quiet-STaR(2024), Meta Coconut(2024-12, 히든 스테이트를 토큰으로 바꾸지 않고 되먹임) [S-2026-09-09-009]\n글쓴이는 이 설계가 1년 반 만에 프론티어 모델에 들어간 것이 GPT-6 Astra 발표의 의미라고 본다 [S-2026-09-09-009]\n후속 근거: 2026-09-02 The Information 이 아스트라의 recurrent depth 사용을 보도했고, OpenAI 연구자들은 \"루프 사용 범위를 제한했다\" 고 반박했다. 후속 보도로는 Anthropic 과 Google DeepMind 도 같은 기술을 검토 중이다 [S-2026-09-15-004]\n대가가 따른다. 루프 안의 계산은 토큰을 남기지 않아 사고사슬 기반 감시가 약해진다 [S-2026-09-15-004]\n추론 경제도 바뀐다. 토큰당 연산량이 r 배가 되어 디코드가 memory-bound 에서 compute-bound 쪽으로 이동한다 [S-2026-09-15-004]\n모순 · 논쟁\n재현 문제가 반복해서 지적된다. Huginn 재현은 \"또 다른 이야기\" 이고, RYS 가 되는 이유에 대해서는 \"RLHF 로 망가진 부분을 우회하는 효과일 뿐\" 이라는 반론이 있다 [S-2026-09-09-009]\nAstra 가 실제로 이 방식을 썼다는 것은 여전히 보도와 정황 기반이다. OpenAI 공식 확인은 없다 {low} [S-2026-09-09-009] [S-2026-09-15-004]\n다른 소스는 Astra 를 \"하나의 거대한 두뇌가 하위 에이전트를 동적 생성하는 멀티 에이전트 아키텍처\" 로 설명한다 [S-2026-09-09-008]. 두 설명이 같은 모델의 다른 층위를 말하는지, 한쪽이 틀렸는지는 미확인.\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\nproduct-gpt-6-astra\nlocal-model-24gb-boundary — 작은 모델을 오래 돌리는 경로가 로컬 상한을 바꾼다\nS-2026-09-09-009-loop-transformer-after-astra\nS-2026-09-15-004-astra-verified-and-hardware-shift\ncot-monitorability-erosion · inference-hardware-shift-recurrent-depth","title":"루프 트랜스포머와 잠재 공간 추론","topics":["beyond-parameter-scaling"],"type":"concept","updated":"2026-09-15"},{"aliases":["model routing","토큰 경제","token economics","모델 라우팅"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-011-gemini-agentic-video","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","org-anthropic","org-cognition","org-openai","org-tencent","product-gemini","product-gpt-6-astra","product-openrouter","routing-harness","small-model-self-improvement-loop","subscription-subsidy-dependency"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-011-gemini-agentic-video"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모든 작업에 가장 비싼 모델을 쓰지 않고, 계획 같은 복잡한 작업에는 강한 모델을, 단순 실행에는 저렴한 모델을 배치하는 운영 방식. 어떤 업무에 어떤 모델이 맞는지를 계속 평가해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e많은 고객이 최상위 모델부터 쓰다가 곧바로 예산을 소진한다. \"청구서 충격을 겪지 않은 회사가 없다\" 고 제프 왕은 말했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션은 Claude · ChatGPT · Gemini · 자체 모델 · 오픈소스를 후보에 두고 태스크마다 고른다. 모든 작업에 최상위 모델을 쓰면 비용이 10배가 된다고 했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e최적 모델은 거의 매주 바뀐다. 특정 랩 소속 도구는 그 랩 모델에 묶이므로 독립성이 라우팅의 전제라는 것이 코그니션의 논리다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e오픈웨이트 모델도 라우팅 대상이다. 성능이 같고 비용이 1/10 이며 고객이 수용하면 쓰고, 특정 모델을 원치 않는 고객은 차단할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e라우팅의 극단형: 반복 업무마다 작고 저렴한 전용 소형 모델을 만들어 쓰는 방식. Shopify 는 0.8B 모델로 특정 업무에서 GPT-5.6 Sol 을 이겼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e티어 배분의 실례: GPT-6 Astra 는 입력 10달러 · 출력 50달러(100만 토큰) 로 Sol 의 2.5배다. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol, 다단계 · 외부 시스템 · 요구 변경이 있는 업무만 Astra 에 맡기라는 것이 실무자의 권고다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e가격 대비 성능의 역전 사례: Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 기록해 Grok 4.6 급 성능을 훨씬 낮은 가격에 냈고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접했다 (전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e라우팅이 독립 인프라 계층으로 값이 매겨진 신호: 스트라이프가 오픈라우터를 약 75억 달러에 인수했고, 토큰리듬은 실행 중 모델을 전환하는 '라우팅 하네스' 를 핵심 전략으로 삼는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델 쪽에서 비용을 줄이는 사례: Gemini 3.7 Flash 의 에이전틱 비디오 이해는 모든 프레임 대신 필요한 구간만 골라 보게 해 토큰 소비를 약 1/10 로 줄였다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-011-gemini-agentic-video\" title=\"박찬성 — Gemini 3.7 Flash 의 에이전틱 비디오 이해: 필요한 프레임만 골라 토큰 1/10\"\u003eS-2026-09-09-011\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e더밀크 해설: 기업 AI 경쟁이 \"가장 좋은 모델을 누가 쓰나\" 에서 \"어떤 업무에 어떤 모델을 얼마나 경제적으로 배치하나\" 로 이동하고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — 비용의 반대편인 성과 측정\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e · \u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 업무별 전용 소형 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e · \u003ca href=\"#/product-openrouter\" class=\"wl\"\u003eproduct-openrouter\u003c/a\u003e · \u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-011-gemini-agentic-video","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","org-cognition","org-shopify","product-gemini","product-openrouter","routing-harness","small-model-self-improvement-loop"],"relpath":"wiki/concepts/model-routing-token-economics.md","sources":["S-2026-09-08-002","S-2026-09-09-003","S-2026-09-09-004","S-2026-09-09-005","S-2026-09-09-008","S-2026-09-09-011"],"status":"draft","stem":"model-routing-token-economics","summary":"작업마다 적합한 모델(최상위 · 저렴 · 오픈웨이트) 을 고르는 라우팅. 기업 AI 비용 관리가 클라우드 비용에서 토큰 배분 문제로 이동","system":false,"text":"정의\n모든 작업에 가장 비싼 모델을 쓰지 않고, 계획 같은 복잡한 작업에는 강한 모델을, 단순 실행에는 저렴한 모델을 배치하는 운영 방식. 어떤 업무에 어떤 모델이 맞는지를 계속 평가해야 한다 [S-2026-09-08-002].\n근거 있는 사실\n많은 고객이 최상위 모델부터 쓰다가 곧바로 예산을 소진한다. \"청구서 충격을 겪지 않은 회사가 없다\" 고 제프 왕은 말했다 [S-2026-09-08-002]\n코그니션은 Claude · ChatGPT · Gemini · 자체 모델 · 오픈소스를 후보에 두고 태스크마다 고른다. 모든 작업에 최상위 모델을 쓰면 비용이 10배가 된다고 했다 [S-2026-09-08-002]\n최적 모델은 거의 매주 바뀐다. 특정 랩 소속 도구는 그 랩 모델에 묶이므로 독립성이 라우팅의 전제라는 것이 코그니션의 논리다 [S-2026-09-08-002]\n오픈웨이트 모델도 라우팅 대상이다. 성능이 같고 비용이 1/10 이며 고객이 수용하면 쓰고, 특정 모델을 원치 않는 고객은 차단할 수 있다 [S-2026-09-08-002]\n라우팅의 극단형: 반복 업무마다 작고 저렴한 전용 소형 모델을 만들어 쓰는 방식. Shopify 는 0.8B 모델로 특정 업무에서 GPT-5.6 Sol 을 이겼다 [S-2026-09-09-003]\n티어 배분의 실례: GPT-6 Astra 는 입력 10달러 · 출력 50달러(100만 토큰) 로 Sol 의 2.5배다. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol, 다단계 · 외부 시스템 · 요구 변경이 있는 업무만 Astra 에 맡기라는 것이 실무자의 권고다 [S-2026-09-09-004]\n가격 대비 성능의 역전 사례: Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 기록해 Grok 4.6 급 성능을 훨씬 낮은 가격에 냈고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접했다 (전언) [S-2026-09-09-005]\n라우팅이 독립 인프라 계층으로 값이 매겨진 신호: 스트라이프가 오픈라우터를 약 75억 달러에 인수했고, 토큰리듬은 실행 중 모델을 전환하는 '라우팅 하네스' 를 핵심 전략으로 삼는다 [S-2026-09-09-008]\n모델 쪽에서 비용을 줄이는 사례: Gemini 3.7 Flash 의 에이전틱 비디오 이해는 모든 프레임 대신 필요한 구간만 골라 보게 해 토큰 소비를 약 1/10 로 줄였다 [S-2026-09-09-011]\n더밀크 해설: 기업 AI 경쟁이 \"가장 좋은 모델을 누가 쓰나\" 에서 \"어떤 업무에 어떤 모델을 얼마나 경제적으로 배치하나\" 로 이동하고 있다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-roi-human-equivalent-hours — 비용의 반대편인 성과 측정\norg-cognition · org-shopify\nsmall-model-self-improvement-loop — 업무별 전용 소형 모델\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-005-arena-coding-leaderboard-shift\nS-2026-09-09-008-neohorse-agent-native-model\nrouting-harness · product-openrouter · product-gemini","title":"모델 라우팅과 토큰 경제","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["온폴리시 증류","GKD","Generalized Knowledge Distillation"],"back":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-09-008-neohorse-agent-native-model","_unsorted","agent-native-model","distillation-defense-limits","knowledge-distillation","org-google-deepmind","post-training-agent-capability","rlvr-domain-expansion"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-09-008-neohorse-agent-native-model"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eTeacher 가 미리 만든 모범답안을 student 가 외우는 대신, student 가 현재 실력으로 답안과 reasoning 궤적을 만들고, 실제로 방문한 중간 상태를 teacher 에게 보여 그 지점에서 좋은 token · 행동을 피드백받는 방식 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e동기: 고정된 teacher 답안만 학습하면 student 가 추론 초반에 작은 실수를 한 뒤 한 번도 본 적 없는 상태에 도달해 전체가 무너진다(train-inference distribution mismatch, exposure bias). Student 가 자주 틀리는 지점을 중심으로 교정하면 더 효율적일 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eGoogle DeepMind 의 Generalized Knowledge Distillation 이 student 생성 sequence 위에서 teacher 의 token-level 확률분포를 학습하는 방식으로 정식화했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e엄밀한 on-policy distillation 은 중간 상태마다 teacher 의 token probability 급 세밀 신호가 필요하다. 상용 API 는 logit 을 주지 않으므로 외부에서는 다음 단계 작성, 틀린 부분 지적, 답안 순위, 두 답안 비교 같은 대체 신호를 쓴다. 알고리즘은 달라도 \"student 경로 위에서 teacher 판단을 반복해 받는\" 구조는 같다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eRLVR 의 최종 정답 보상과 on-policy distillation 의 token-level 신호를 결합하는 연구가 활발하며, 2026년 제안된 OPDVR 이 두 신호를 한 학습 구조에 넣었다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실제 적용 사례: 토큰리듬은 '라우팅 유도 커리큘럼 학습' 과 함께 온폴리시 증류를 NeoHorse 후훈련에 썼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e모델 제공사가 chain of thought 를 요약 · 암호화해도 이 경로는 남는다. 셰프가 레시피를 숨겨도 견습생 요리를 맛보고 조언하는 한 능력은 이전된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e — 상위 개념\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 이 경로가 방어를 어렵게 만드는 이유\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" class=\"wl\"\u003eS-2026-09-08-004-distillation-spectrum-lee-dongsoo\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-09-008-neohorse-agent-native-model","distillation-defense-limits","knowledge-distillation"],"relpath":"wiki/concepts/on-policy-distillation.md","sources":["S-2026-09-08-004","S-2026-09-09-008"],"status":"draft","stem":"on-policy-distillation","summary":"student 가 스스로 생성한 추론 궤적의 각 지점에서 teacher 의 확률 · 교정 신호를 받는 distillation. 견습생이 자기 요리를 셰프에게 보여주고 다음 단계를 묻는 구조","system":false,"text":"정의\nTeacher 가 미리 만든 모범답안을 student 가 외우는 대신, student 가 현재 실력으로 답안과 reasoning 궤적을 만들고, 실제로 방문한 중간 상태를 teacher 에게 보여 그 지점에서 좋은 token · 행동을 피드백받는 방식 [S-2026-09-08-004].\n근거 있는 사실\n동기: 고정된 teacher 답안만 학습하면 student 가 추론 초반에 작은 실수를 한 뒤 한 번도 본 적 없는 상태에 도달해 전체가 무너진다(train-inference distribution mismatch, exposure bias). Student 가 자주 틀리는 지점을 중심으로 교정하면 더 효율적일 수 있다 [S-2026-09-08-004]\nGoogle DeepMind 의 Generalized Knowledge Distillation 이 student 생성 sequence 위에서 teacher 의 token-level 확률분포를 학습하는 방식으로 정식화했다 [S-2026-09-08-004]\n엄밀한 on-policy distillation 은 중간 상태마다 teacher 의 token probability 급 세밀 신호가 필요하다. 상용 API 는 logit 을 주지 않으므로 외부에서는 다음 단계 작성, 틀린 부분 지적, 답안 순위, 두 답안 비교 같은 대체 신호를 쓴다. 알고리즘은 달라도 \"student 경로 위에서 teacher 판단을 반복해 받는\" 구조는 같다 [S-2026-09-08-004]\nRLVR 의 최종 정답 보상과 on-policy distillation 의 token-level 신호를 결합하는 연구가 활발하며, 2026년 제안된 OPDVR 이 두 신호를 한 학습 구조에 넣었다 [S-2026-09-08-004]\n실제 적용 사례: 토큰리듬은 '라우팅 유도 커리큘럼 학습' 과 함께 온폴리시 증류를 NeoHorse 후훈련에 썼다 [S-2026-09-09-008]\n모델 제공사가 chain of thought 를 요약 · 암호화해도 이 경로는 남는다. 셰프가 레시피를 숨겨도 견습생 요리를 맛보고 조언하는 한 능력은 이전된다 [S-2026-09-08-004]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-distillation — 상위 개념\ndistillation-defense-limits — 이 경로가 방어를 어렵게 만드는 이유\nS-2026-09-08-004-distillation-spectrum-lee-dongsoo\nS-2026-09-09-008-neohorse-agent-native-model","title":"On-policy Distillation","topics":[],"type":"concept","updated":"2026-09-09"},{"aliases":["로컬 모델","오픈소스 모델","open models","온프레미스 AI"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","fully-open-source-model","local-model-24gb-boundary","org-deepseek","org-mbzuai","org-shopify","org-startlux","org-tencent","person-chen-danian","post-training-agent-capability","product-k2-horizon","product-muse-glimmer","product-qwen","product-tangle","small-model-self-improvement-loop","subscription-subsidy-dependency"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift"],"confidence":"medium","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e모델 공개의 수준이 가중치만 내놓는 오픈웨이트에서 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 내놓는 완전 오픈소스로 올라가고 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e. UAE MBZUAI 의 K2 Horizon 은 0.9B 부터 375B 까지 6종을 Apache 2.0 으로 공개하며 이를 \"AI 역사상 최대 규모의 완전 오픈소스 발표\" 라고 주장했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e같은 시기 로컬 쪽에서는 소비자 GPU 한 장(24GB) 이 설계 제약이 되어 Qwen3.8-27B, Meta Muse Glimmer(30B), StartLux 27B 가 4비트 17~20GB 규격으로 수렴했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. StartLux 는 Qwen3.6-27B 에 도구 선택 · 다단계 실행 · 검증 중심 후훈련만 얹어 CAICT MCP 테스트에서 1.6T 모델에 1.3%p 차로 근접했고, 이는 에이전트 능력의 상당 부분이 후훈련 층에 있으며 파운데이션 모델 없는 회사도 만들 수 있다는 근거로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e두 흐름이 만나면, 강한 오픈 base 위에 도메인 특화 후훈련을 얹어 24GB 한 장에서 도는 스페셜리스트 에이전트를 만드는 것이 파운데이션 모델을 갖지 않은 회사의 현실적 경로가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 같은 결론이 서구 대기업에서도 나온다. Shopify 는 0.8B Qwen 을 실제 업무 결과 평가와 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼고, 파이프라인 기술 Tangle 을 오픈소스로 공개했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e. 공개 리더보드 관찰도 같은 방향이다. Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 내고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접한 반면 GPT-5.6 Sol 은 9위로 밀렸다는 관찰은 경쟁 축이 성능 · 가격 · 로컬 실행으로 바뀌었음을 시사한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e. 다만 클라우드는 사라지지 않고 \"어떤 작업을 어디서\" 가 정해지는 계층 구조로 재편된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 성능 주장 다수는 발표 주체의 자체 평가라 독립 검증이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/fully-open-source-model\" class=\"wl\"\u003efully-open-source-model\u003c/a\u003e — 오픈웨이트와 완전 오픈소스의 차이\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — 소비자 GPU 한 장이 만든 27~30B 표준\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 에이전트 능력은 후훈련 층에\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 업무별 소형 모델의 자기개선 루프 (Shopify)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-mbzuai\" class=\"wl\"\u003eorg-mbzuai\u003c/a\u003e · \u003ca href=\"#/product-k2-horizon\" class=\"wl\"\u003eproduct-k2-horizon\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e · \u003ca href=\"#/person-chen-danian\" class=\"wl\"\u003eperson-chen-danian\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/product-muse-glimmer\" class=\"wl\"\u003eproduct-muse-glimmer\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e · \u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/org-tencent\" class=\"wl\"\u003eorg-tencent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" class=\"wl\"\u003eS-2026-09-08-005-uae-k2-horizon-open-source\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" class=\"wl\"\u003eS-2026-09-09-001-tangle-visual-ml-pipeline\u003c/a\u003e — Tangle 제품 페이지 (Shopify 와의 관계 미확인)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e — 리더보드에서 본 가격 · 로컬 경쟁\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e Arena 코딩 리더보드: Hy4 1631 Elo, Sol 9위, Qwen3.8-27B 약 1600\u003c/li\u003e\n\u003cli\u003e날짜 미상 (2026-09-09 공유) \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e Shopify, Qwen3.5-0.8B 자기개선 미세조정으로 특정 업무에서 GPT-5.6 Sol 상회 · Tangle 오픈소스\u003c/li\u003e\n\u003cli\u003e2026-08-31 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e CAICT MCP 테스트 공표, StartLux-V1.0-27B-Preview 종합 2위\u003c/li\u003e\n\u003cli\u003e2026-08-14 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e Alibaba Qwen3.8-27B Apache 2.0 공개\u003c/li\u003e\n\u003cli\u003e2026-08-10 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e Meta Muse Glimmer 공개\u003c/li\u003e\n\u003cli\u003e날짜 미상 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e MBZUAI IFM, K2 Horizon 6종 완전 오픈소스 공개 (게시글에 \"3일\" 로만 표기)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003etangleml.com 의 Tangle 이 Shopify 가 공개한 Tangle 과 같은 제품인가? 저장소 확인 필요\u003c/li\u003e\n\u003cli\u003eK2 Horizon 과 Qwen3.8 · Muse Glimmer 의 독립 벤치마크 결과는? (모든 성능 주장이 발표 주체 자료)\u003c/li\u003e\n\u003cli\u003e우리 도메인 데이터로 후훈련할 때 base 는 K2 Horizon 3.7B/32B 인가 Qwen3.8-27B 인가 — 라이선스는 둘 다 Apache 2.0 이지만 학습 데이터 · 레시피 공개는 K2 만 확인됨\u003c/li\u003e\n\u003cli\u003e\"3년 안에 로컬 80%\" 예측(천다녠) 과 클라우드 에이전트 사용 증가(코그니션) 는 어떤 작업 분할로 양립하는가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-09: Shopify 소형 모델 사례 공유 — 로컬 · 후훈련 흐름의 서구 사례로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-08: 완전 오픈소스 공개 뉴스와 로컬 에이전트 모델 분석을 같은 날 공유 — 파운데이션 모델 없이 특화 모델을 만드는 경로에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-005-uae-k2-horizon-open-source","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","fully-open-source-model","local-model-24gb-boundary","org-mbzuai","org-shopify","org-startlux","org-tencent","person-chen-danian","post-training-agent-capability","product-k2-horizon","product-muse-glimmer","product-qwen","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/topics/open-local-models.md","sources":["S-2026-09-08-005","S-2026-09-08-006","S-2026-09-09-003","S-2026-09-09-001","S-2026-09-09-005"],"status":"draft","stem":"open-local-models","summary":"완전 오픈소스(K2 Horizon) 와 24GB 로컬 표준(Qwen3.8 · Muse Glimmer · StartLux) 이 만나 파운데이션 모델 없이 후훈련으로 특화 에이전트를 만드는 길","system":false,"text":"현재 종합\n모델 공개의 수준이 가중치만 내놓는 오픈웨이트에서 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 내놓는 완전 오픈소스로 올라가고 있다 [S-2026-09-08-005]. UAE MBZUAI 의 K2 Horizon 은 0.9B 부터 375B 까지 6종을 Apache 2.0 으로 공개하며 이를 \"AI 역사상 최대 규모의 완전 오픈소스 발표\" 라고 주장했다 [S-2026-09-08-005].\n같은 시기 로컬 쪽에서는 소비자 GPU 한 장(24GB) 이 설계 제약이 되어 Qwen3.8-27B, Meta Muse Glimmer(30B), StartLux 27B 가 4비트 17~20GB 규격으로 수렴했다 [S-2026-09-08-006]. StartLux 는 Qwen3.6-27B 에 도구 선택 · 다단계 실행 · 검증 중심 후훈련만 얹어 CAICT MCP 테스트에서 1.6T 모델에 1.3%p 차로 근접했고, 이는 에이전트 능력의 상당 부분이 후훈련 층에 있으며 파운데이션 모델 없는 회사도 만들 수 있다는 근거로 제시된다 [S-2026-09-08-006].\n두 흐름이 만나면, 강한 오픈 base 위에 도메인 특화 후훈련을 얹어 24GB 한 장에서 도는 스페셜리스트 에이전트를 만드는 것이 파운데이션 모델을 갖지 않은 회사의 현실적 경로가 된다 [S-2026-09-08-005] [S-2026-09-08-006]. 로컬이 선택되는 이유는 정확도만이 아니라 검증 가능성 · 통제권 · 데이터가 손안을 떠나지 않는 것이며, 의료 · 금융 · 법률 · 국방에서는 전제가 되어간다 [S-2026-09-08-006]. 같은 결론이 서구 대기업에서도 나온다. Shopify 는 0.8B Qwen 을 실제 업무 결과 평가와 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼고, 파이프라인 기술 Tangle 을 오픈소스로 공개했다 [S-2026-09-09-003]. 공개 리더보드 관찰도 같은 방향이다. Arena 코딩 리더보드에서 Tencent Hy4 가 1631 Elo 를 약 2.50달러에 내고, 로컬 무료 Qwen3.8-27B 가 약 1600 Elo 에 근접한 반면 GPT-5.6 Sol 은 9위로 밀렸다는 관찰은 경쟁 축이 성능 · 가격 · 로컬 실행으로 바뀌었음을 시사한다 [S-2026-09-09-005]. 다만 클라우드는 사라지지 않고 \"어떤 작업을 어디서\" 가 정해지는 계층 구조로 재편된다 [S-2026-09-08-006]. 성능 주장 다수는 발표 주체의 자체 평가라 독립 검증이 필요하다 [S-2026-09-08-005] [S-2026-09-08-006].\n하위 페이지\n개념\nfully-open-source-model — 오픈웨이트와 완전 오픈소스의 차이\nlocal-model-24gb-boundary — 소비자 GPU 한 장이 만든 27~30B 표준\npost-training-agent-capability — 에이전트 능력은 후훈련 층에\nsmall-model-self-improvement-loop — 업무별 소형 모델의 자기개선 루프 (Shopify)\n엔티티\norg-mbzuai · product-k2-horizon\norg-startlux · person-chen-danian\nproduct-qwen · product-muse-glimmer\norg-shopify · product-tangle · org-tencent\n소스\nS-2026-09-08-005-uae-k2-horizon-open-source\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-001-tangle-visual-ml-pipeline — Tangle 제품 페이지 (Shopify 와의 관계 미확인)\nS-2026-09-09-005-arena-coding-leaderboard-shift — 리더보드에서 본 가격 · 로컬 경쟁\n타임라인\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-005] Arena 코딩 리더보드: Hy4 1631 Elo, Sol 9위, Qwen3.8-27B 약 1600\n날짜 미상 (2026-09-09 공유) [S-2026-09-09-003] Shopify, Qwen3.5-0.8B 자기개선 미세조정으로 특정 업무에서 GPT-5.6 Sol 상회 · Tangle 오픈소스\n2026-08-31 [S-2026-09-08-006] CAICT MCP 테스트 공표, StartLux-V1.0-27B-Preview 종합 2위\n2026-08-14 [S-2026-09-08-006] Alibaba Qwen3.8-27B Apache 2.0 공개\n2026-08-10 [S-2026-09-08-006] Meta Muse Glimmer 공개\n날짜 미상 [S-2026-09-08-005] MBZUAI IFM, K2 Horizon 6종 완전 오픈소스 공개 (게시글에 \"3일\" 로만 표기)\n열린 질문\ntangleml.com 의 Tangle 이 Shopify 가 공개한 Tangle 과 같은 제품인가? 저장소 확인 필요\nK2 Horizon 과 Qwen3.8 · Muse Glimmer 의 독립 벤치마크 결과는? (모든 성능 주장이 발표 주체 자료)\n우리 도메인 데이터로 후훈련할 때 base 는 K2 Horizon 3.7B/32B 인가 Qwen3.8-27B 인가 — 라이선스는 둘 다 Apache 2.0 이지만 학습 데이터 · 레시피 공개는 K2 만 확인됨\n\"3년 안에 로컬 80%\" 예측(천다녠) 과 클라우드 에이전트 사용 증가(코그니션) 는 어떤 작업 분할로 양립하는가\n관심 흐름\n2026-09-09: Shopify 소형 모델 사례 공유 — 로컬 · 후훈련 흐름의 서구 사례로 추정 (추정)\n2026-09-08: 완전 오픈소스 공개 뉴스와 로컬 에이전트 모델 분석을 같은 날 공유 — 파운데이션 모델 없이 특화 모델을 만드는 경로에 대한 관심으로 추정 (추정)","title":"오픈소스 · 로컬 모델의 부상","topics":[],"type":"topic","updated":"2026-09-09"},{"aliases":["에이아이쓰리","표철민"],"back":["S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","knowledge-base-compilation","product-wisdombase"],"cites":["S-2026-09-09-012-wisdombase-docs-to-wiki-mcp"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eWisdombase 를 만든 한국 회사. 대표 표철민이 출시를 알렸다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e개발 동기는 Gitbook 에 매년 700만 원 가까이 지출하던 비용이었다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eWisdombase 를 전부 무료로 제공하며 데이터는 국내에서 처리하고 AI 학습에 쓰지 않는다고 밝혔다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 출시 공지 1건 기준. 무료 정책의 지속 조건은 밝혀지지 않았다.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-wisdombase\" class=\"wl\"\u003eproduct-wisdombase\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" class=\"wl\"\u003eS-2026-09-09-012-wisdombase-docs-to-wiki-mcp\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","knowledge-base-compilation","product-wisdombase"],"relpath":"wiki/entities/org-ai3.md","sources":["S-2026-09-09-012"],"status":"draft","stem":"org-ai3","summary":"한국 AI 기업. Gitbook 비용을 대체하려 자체 개발한 지식 베이스 서비스 Wisdombase 를 무료로 출시","system":false,"text":"정의\nWisdombase 를 만든 한국 회사. 대표 표철민이 출시를 알렸다 [S-2026-09-09-012].\n근거 있는 사실\n개발 동기는 Gitbook 에 매년 700만 원 가까이 지출하던 비용이었다 [S-2026-09-09-012]\nWisdombase 를 전부 무료로 제공하며 데이터는 국내에서 처리하고 AI 학습에 쓰지 않는다고 밝혔다 [S-2026-09-09-012]\n모순 · 논쟁\n(없음) — 출시 공지 1건 기준. 무료 정책의 지속 조건은 밝혀지지 않았다.\n관련 페이지\nknowledge-base-compilation — 상위 주제\nproduct-wisdombase\nS-2026-09-09-012-wisdombase-docs-to-wiki-mcp","title":"AI3 (표철민)","topics":["knowledge-base-compilation"],"type":"entity","updated":"2026-09-09"},{"aliases":["앤트로픽","앤스로픽"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-15-001-google-cadence-and-what-to-do","S-2026-09-15-004-astra-verified-and-hardware-shift","ai-agents-enterprise-adoption","distillation-defense-limits","knowledge-distillation","org-deepseek","org-openai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eClaude 모델을 만드는 미국 AI 랩. Claude Code 등장이 \"개발의 민주화\" 계기로 언급된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e제프 왕에 따르면 2026년 8월 시점 상장을 준비 중이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e어느 주에는 Anthropic 모델이 최고라 Claude Code 가 앞서고 다음 주에는 OpenAI 가 앞서는 식으로 최적 모델이 매주 바뀐다 — 라우팅 논리의 근거로 인용됨 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e많은 고객이 최상위 모델(기사 표기 \"페이블\") 부터 쓰다가 예산을 소진한다는 사례에 등장 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026년 2월, DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 reasoning · coding · tool use 능력을 이전하려 했다고 주장하고, 약관 · 지역 제한 우회를 포함한 \"산업적 규모의 distillation 공격\" 으로 규정해 업계 · 정책당국의 공동 대응을 요구했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e근거 있는 사실 (추가)\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e아스트라 며칠 앞서 Fable 5.1 과 Mythos 5.1 을 냈고 코딩 계열 격차는 아직 작다. 격차가 큰 곳은 ARC-AGI-3 와 사이버 분야다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e후속 보도에 따르면 Anthropic 과 Google DeepMind 도 recurrent depth 기술을 검토 중이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-0
