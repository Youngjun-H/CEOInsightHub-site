추가할 수 있다 {stated}\n3. 플랫폼 무관: 기존 코드를 앱 내 편집기에서 컨테이너로 감싸 어떤 언어 · 프레임워크든 실행한다 {stated}\n4. 콘텐츠 기반 실행 캐시로 중간 결과를 저장해 실험 시간과 컴퓨팅 비용을 줄인다 {stated}\n5. 오픈소스 기반으로 만들어졌으며 GitHub 에서 기여 · 이슈 · 코드 열람이 가능하다고 한다. 저장소 주소는 이 페이지 본문에 없다 {stated}\n등장 개념 · 엔티티\nopen-local-models — 상위 주제\nproduct-tangle — 이 페이지의 제품\nsmall-model-self-improvement-loop — Shopify 사례가 말한 파이프라인 기술과의 관계는 미확인\n우리에게 주는 함의\n페이지 내용만으로는 Shopify 의 Tangle 과 동일한지 알 수 없다. 저장소를 직접 찾아 확인한 뒤 판단해야 한다 [S-2026-09-09-001] [S-2026-09-09-003]\n동일하다면 \"실제 업무 결과 평가 → 실패 재학습\" 루프를 파이프라인 컴포넌트로 구성하고 캐시로 반복 실험 비용을 줄이는 용도로 검토할 만하다 [S-2026-09-09-001]\n주요 인용\nCreate complex ML workflows with a powerful visual editor. Connect components, configure arguments, and build pipelines– with or without writing code.\nTangle is platform agnostic. Wrap your existing code in a container using the in-app editor.\nCache intermediate results to accelerate experimentation. Content-based caching saves significant time and compute costs.\nTangle is built on open-source foundations. Contribute, report issues, or explore the codebase on GitHub.","title":"tangleml.com — Tangle: 비주얼 ML 파이프라인 에디터 (제품 소개 페이지)","topics":["open-local-models"],"type":"source","updated":"2026-09-09"},{"aliases":["크루온AI 기사","송호철 인터뷰","크루AI 워크"],"back":["S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-15-003-harness-engineering-guide-provenance","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","harness-engineering-discipline","org-cognition","org-crewon-ai","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e크루온AI 는 AI 에이전트가 직원처럼 일하려면 역할 · 업무지식 · 규정 · 시스템 권한 · 업무 순서 · 보고 체계가 필요하다고 보고, 사람과 AI 가 함께 일하는 업무공간(크루AI 워크) 과 AI 직원을 채용 · 교육 · 관리하는 런타임(크루온AI) 두 플랫폼을 내놓았다. 기업 · 공공 구축형으로 시작하며, \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라고 말한다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 국내 경쟁사 · 협력사 후보. 더존비즈온 출신이 기업 · 공공 구축형으로 들어오는 포지셔닝\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"에이전트 런타임\" 이라는 제품 범주 — 모델이 아니라 역할 · 권한 · 플레이북 · 승인 · 기억 · 감사 기록을 파는 것\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 오늘 이어진 \"실행 환경이 경쟁력\" 논지의 국내 실체 사례\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e크루온AI 는 전 더존비즈온 플랫폼사업부문 대표 송호철이 창업한 회사로, 기업 · 공공 시장을 겨냥한 \"기업용 AI 에이전트 런타임\" 을 출시했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문제 인식: 실제 업무는 한 프로그램 안에서 끝나지 않고 메일 · 메신저 · 문서 · 전자결재 · ERP · CRM 을 오가며 완성되는데, 현재 업무용 AI 는 특정 앱 안에서 답하거나 문서를 쓰는 데 머문다. \"AI 를 잘 사용하는 것과 AI 와 함께 일하는 것은 다르다\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAI 가 직원처럼 일하려면 역할, 업무지식 · 회사 규정, 업무시스템 사용 권한, 일하는 순서, 판단이 어려울 때 상급자 보고가 필요하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e두 플랫폼: '크루AI 워크(crewai.work)' 는 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, 비서 · 영업 · 회계 · 인사 · 홍보 · 법무 'AI 크루' 를 채용하듯 조직도에 추가한다. '크루온AI(Crewon.ai)' 는 AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 승인 단계를 '플레이북' 으로 가르치는 운영 기반이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e예시: 구매 담당 AI 에게 구매규정 · 계약지침을 학습시키고 ERP · 메일 · 문서 권한을 주며 견적 요청 → 비교 → 검토 → 계약 → 발주 순서를 설정하고, 일정 금액 이상은 사람 승인을 강제할 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\"A 프로젝트 예산 증액안 결재 올려줘\" 같은 지시에 AI 크루는 프로젝트 · 예산 관계, 변경 규정, 결재 절차, 요청자 권한을 차례로 확인하고, 범위를 넘으면 담당자에게 보고 · 승인 요청한다. 반복 작업은 AI, 중요한 판단은 사람이 맡는 휴먼 인 더 루프 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e'시맨틱 퍼스트, 벡터 세컨드': 비슷한 문서를 먼저 검색하지 않고 사용자 의도와 해야 할 업무부터 파악한 뒤, 규정 · 절차 · 접근권한을 확인하고 허용 범위 안에서 정보를 찾는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e완료 여부는 실제 결과로 판단한다. 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지 점검한다. \"도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e시스템이 달라져도 역할 · 권한 · 이전 업무 기억이 유지되고, 일할수록 조직 지식이 쌓인다. \"사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다\" — 축적된 지식 · 절차가 기업의 디지털 자산 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e관리 과제: 각 AI 의 데이터 · 시스템 접근 범위, 자율 판단 범위, 판단 근거와 실행 기록, 중요 업무의 사람 승인, 데이터 소유 · 보안 · 오류 책임 범위는 도입 과정에서 검증해야 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사업 모델: 초기에는 기업 · 공공 구축형에 집중하고 법무 · 회계 · R\u0026amp;D 사업관리 등 '전문 AI 크루팩' 을 공급한다. 구독형도 검토 중 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\"고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e — 에이전트를 직원처럼 채용 · 교육 · 권한 · 플레이북으로 운영하는 제품 범주\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 권한 · 승인 단계 · 실행 기록\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 도구 호출 ≠ 업무 완료, 실제 결과로 판정\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 플레이북 = 업무 순서와 완료 조건의 명시\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-crewon-ai\" class=\"wl\"\u003eorg-crewon-ai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e국내에서 \"런타임 · 실행 환경\" 을 파는 회사가 실제로 나왔다. 코그니션(사람 환산 시간 · 생산성 보증), GPT-6 Astra 분석(실행 조건), 크루온AI(플레이북 · 권한 · 실제 결과 판정) 가 같은 결론을 가리킨다: 팔리는 것은 모델이 아니라 모델이 일하는 환경이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e기업 · 공공 구축형 + 전문 크루팩은 국내 규제 · 온프레미스 요구에 맞춘 진입 방식이며, 우리 시장과 겹칠 수 있다. 경쟁인지 협력인지 판단이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"시맨틱 퍼스트, 벡터 세컨드\"(의도 · 규정 · 권한 확인 후 검색) 와 \"실제 결과 기준 완료 판정\" 은 우리 제품 설계에 그대로 참고할 만한 원칙이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“AI를 잘 사용하는 것과 AI와 함께 일하는 것은 다르다”\u003c/p\u003e\n\u003cp\u003e쉽게 말해 크루AI 워크가 AI 직원이 출근해 사람과 함께 일하는 ‘사무실’이라면, 크루온AI는 AI를 채용하고 가르치며 역할과 권한을 관리하는 ‘운영체계’다.\u003c/p\u003e\n\u003cp\u003e송 대표는 “도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제”라고 설명했다.\u003c/p\u003e\n\u003cp\u003e“사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다”\u003c/p\u003e\n\u003cp\u003e“고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경”\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","org-crewon-ai","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/sources/S-2026-09-09-002-crewon-ai-agent-runtime.md","sources":["S-2026-09-09-002"],"src":{"author":"이안나 (디지털데일리)","file":"raw/2026/09/S-2026-09-09-002.html","origin":"url","published_at":"2026-09-03","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-002","url":"https://n.news.naver.com/article/138/0002240068"},"status":"draft","stem":"S-2026-09-09-002-crewon-ai-agent-runtime","summary":"전 더존비즈온 송호철 대표의 크루온AI. AI 크루를 채용 · 교육해 조직도에 배치하고 메일 · ERP · 전자결재를 오가며 일을 끝내는 '에이전트 런타임'. 플레이북 · 권한 · 실제 결과 판정","system":false,"text":"한 줄 요약\n크루온AI 는 AI 에이전트가 직원처럼 일하려면 역할 · 업무지식 · 규정 · 시스템 권한 · 업무 순서 · 보고 체계가 필요하다고 보고, 사람과 AI 가 함께 일하는 업무공간(크루AI 워크) 과 AI 직원을 채용 · 교육 · 관리하는 런타임(크루온AI) 두 플랫폼을 내놓았다. 기업 · 공공 구축형으로 시작하며, \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라고 말한다.\n관심 포인트\n(추정) 국내 경쟁사 · 협력사 후보. 더존비즈온 출신이 기업 · 공공 구축형으로 들어오는 포지셔닝\n(추정) \"에이전트 런타임\" 이라는 제품 범주 — 모델이 아니라 역할 · 권한 · 플레이북 · 승인 · 기억 · 감사 기록을 파는 것\n(추정) 어제 오늘 이어진 \"실행 환경이 경쟁력\" 논지의 국내 실체 사례\n핵심 주장\n1. 크루온AI 는 전 더존비즈온 플랫폼사업부문 대표 송호철이 창업한 회사로, 기업 · 공공 시장을 겨냥한 \"기업용 AI 에이전트 런타임\" 을 출시했다 {stated}\n2. 문제 인식: 실제 업무는 한 프로그램 안에서 끝나지 않고 메일 · 메신저 · 문서 · 전자결재 · ERP · CRM 을 오가며 완성되는데, 현재 업무용 AI 는 특정 앱 안에서 답하거나 문서를 쓰는 데 머문다. \"AI 를 잘 사용하는 것과 AI 와 함께 일하는 것은 다르다\" {stated}\n3. AI 가 직원처럼 일하려면 역할, 업무지식 · 회사 규정, 업무시스템 사용 권한, 일하는 순서, 판단이 어려울 때 상급자 보고가 필요하다 {stated}\n4. 두 플랫폼: '크루AI 워크(crewai.work)' 는 메일 · 메신저 · 일정 · 회의 · 문서 · 전자결재를 갖춘 사람 + AI 업무공간이고, 비서 · 영업 · 회계 · 인사 · 홍보 · 법무 'AI 크루' 를 채용하듯 조직도에 추가한다. '크루온AI(Crewon.ai)' 는 AI 크루마다 역할 · 지식 · 지침 · 기술 · 도구 · 권한 · 기억을 설정하고, 업무 순서와 승인 단계를 '플레이북' 으로 가르치는 운영 기반이다 {stated}\n5. 예시: 구매 담당 AI 에게 구매규정 · 계약지침을 학습시키고 ERP · 메일 · 문서 권한을 주며 견적 요청 → 비교 → 검토 → 계약 → 발주 순서를 설정하고, 일정 금액 이상은 사람 승인을 강제할 수 있다 {stated}\n6. \"A 프로젝트 예산 증액안 결재 올려줘\" 같은 지시에 AI 크루는 프로젝트 · 예산 관계, 변경 규정, 결재 절차, 요청자 권한을 차례로 확인하고, 범위를 넘으면 담당자에게 보고 · 승인 요청한다. 반복 작업은 AI, 중요한 판단은 사람이 맡는 휴먼 인 더 루프 {stated}\n7. '시맨틱 퍼스트, 벡터 세컨드': 비슷한 문서를 먼저 검색하지 않고 사용자 의도와 해야 할 업무부터 파악한 뒤, 규정 · 절차 · 접근권한을 확인하고 허용 범위 안에서 정보를 찾는다 {stated}\n8. 완료 여부는 실제 결과로 판단한다. 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지 점검한다. \"도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제\" {stated}\n9. 시스템이 달라져도 역할 · 권한 · 이전 업무 기억이 유지되고, 일할수록 조직 지식이 쌓인다. \"사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다\" — 축적된 지식 · 절차가 기업의 디지털 자산 {stated}\n10. 관리 과제: 각 AI 의 데이터 · 시스템 접근 범위, 자율 판단 범위, 판단 근거와 실행 기록, 중요 업무의 사람 승인, 데이터 소유 · 보안 · 오류 책임 범위는 도입 과정에서 검증해야 한다 {stated}\n11. 사업 모델: 초기에는 기업 · 공공 구축형에 집중하고 법무 · 회계 · R\u0026D 사업관리 등 '전문 AI 크루팩' 을 공급한다. 구독형도 검토 중 {stated}\n12. \"고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경\" {stated}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption — 상위 주제\nai-workforce-runtime — 에이전트를 직원처럼 채용 · 교육 · 권한 · 플레이북으로 운영하는 제품 범주\nagent-governance-guardrails — 권한 · 승인 단계 · 실행 기록\ntask-level-agent-evaluation — 도구 호출 ≠ 업무 완료, 실제 결과로 판정\ntask-definition-bottleneck — 플레이북 = 업무 순서와 완료 조건의 명시\norg-crewon-ai\n우리에게 주는 함의\n국내에서 \"런타임 · 실행 환경\" 을 파는 회사가 실제로 나왔다. 코그니션(사람 환산 시간 · 생산성 보증), GPT-6 Astra 분석(실행 조건), 크루온AI(플레이북 · 권한 · 실제 결과 판정) 가 같은 결론을 가리킨다: 팔리는 것은 모델이 아니라 모델이 일하는 환경이다 [S-2026-09-09-002] [S-2026-09-08-002] [S-2026-09-09-004]\n기업 · 공공 구축형 + 전문 크루팩은 국내 규제 · 온프레미스 요구에 맞춘 진입 방식이며, 우리 시장과 겹칠 수 있다. 경쟁인지 협력인지 판단이 필요하다 [S-2026-09-09-002]\n\"시맨틱 퍼스트, 벡터 세컨드\"(의도 · 규정 · 권한 확인 후 검색) 와 \"실제 결과 기준 완료 판정\" 은 우리 제품 설계에 그대로 참고할 만한 원칙이다 [S-2026-09-09-002]\n주요 인용\n“AI를 잘 사용하는 것과 AI와 함께 일하는 것은 다르다”\n쉽게 말해 크루AI 워크가 AI 직원이 출근해 사람과 함께 일하는 ‘사무실’이라면, 크루온AI는 AI를 채용하고 가르치며 역할과 권한을 관리하는 ‘운영체계’다.\n송 대표는 “도구를 호출한 것과 실제 업무가 완료된 것은 다른 문제”라고 설명했다.\n“사람은 퇴사할 수 있지만 AI 크루는 퇴사하지 않는다”\n“고객이 구매하는 것은 AI 모델 자체가 아니라 그 모델이 실제로 일하는 환경”","title":"디지털데일리 — \"AI도 채용해서 조직도에 넣는다\" 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임","topics":["ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-09"},{"aliases":["Shopify 0.8B","Shopify Qwen 미세조정"],"back":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-008-neohorse-agent-native-model","agent-native-model","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle","small-model-self-improvement-loop","subscription-subsidy-dependency"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e범용 대형 모델을 그대로 쓰는 대신, 0.8B 소형 모델을 실제 업무 결과로 평가하고 실패 데이터를 다시 학습에 넣는 자기개선 루프로 키우면 특정 업무에서는 대형 모델을 이긴다는 Shopify 사례. 기반 기술 Tangle 은 오픈소스.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"반복 업무마다 작고 저렴한 전용 모델\" 이라는 운영 모델 — 우리 제품 · 고객 업무에 그대로 적용 가능한 구조\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 실패 데이터를 다시 학습에 넣는 루프를 만드는 파이프라인 기술이 오픈소스라는 점 — 직접 써볼 수 있는가\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 공유한 로컬 · 후훈련 흐름(StartLux, K2 Horizon) 과 같은 방향의 서구 대기업 사례\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eShopify 가 Qwen3.5-0.8B 를 특정 업무에 맞게 미세조정한 결과, 그 작업에서 GPT-5.6 Sol 을 이겼다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e방법은 범용 AI 를 그대로 쓰지 않고, 실제 업무에서 나온 결과를 평가하고 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 것이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eShopify CEO Tobi Lütke 는 이런 자기개선 학습 구조가 있으면 작은 모델도 특정 업무에서 대형 모델보다 좋은 성능을 낼 수 있다고 설명했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이 학습 파이프라인을 만드는 기반 기술 Tangle 을 오픈소스로 공개했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이의 전망: 모든 업무에 비싼 대형 모델을 호출하는 대신 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 빠르게 늘 것이다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — 평가 → 실패 재학습 → 전용 소형 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 같은 논지의 중국 사례(StartLux) 와 연결\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — \"업무마다 전용 소형 모델\" 은 라우팅의 극단\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e · \u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e어제의 StartLux(27B 후훈련) 와 오늘의 Shopify(0.8B 미세조정) 는 같은 결론을 가리킨다: 특정 업무의 성능은 모델 크기가 아니라 그 업무의 실제 결과로 만든 학습 루프에서 나온다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우리 고객 업무마다 \"평가 기준 + 실패 수집 + 재학습\" 루프를 제품에 내장하면, 대형 모델 API 비용을 줄이면서 성능을 올리는 구조가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e원문 출처(Shopify 발표, Tangle 저장소) 가 게시글에 없다. 수치와 벤치마크 조건은 확인이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e0.8B짜리 소형 모델이 특정 작업에서 GPT-5.6 Sol을 이겼습니다.\u003c/p\u003e\n\u003cp\u003e범용 AI를 그대로 쓰는 대신 실제 업무에서 나온 결과를 평가하고, 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 방식을 사용했습니다.\u003c/p\u003e\n\u003cp\u003e모든 업무에 비싼 대형 모델을 호출하는 대신, 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 꽤 빠르게 늘어날 것 같습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/sources/S-2026-09-09-003-shopify-small-model-beats-sol.md","sources":["S-2026-09-09-003"],"src":{"author":"미상 (SNS 요약 게시글)","file":"raw/2026/09/S-2026-09-09-003.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-003","url":""},"status":"draft","stem":"S-2026-09-09-003-shopify-small-model-beats-sol","summary":"Shopify 가 Qwen3.5-0.8B 를 업무 결과 평가 → 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 앞섰고, 기반 기술 Tangle 을 오픈소스 공개","system":false,"text":"한 줄 요약\n범용 대형 모델을 그대로 쓰는 대신, 0.8B 소형 모델을 실제 업무 결과로 평가하고 실패 데이터를 다시 학습에 넣는 자기개선 루프로 키우면 특정 업무에서는 대형 모델을 이긴다는 Shopify 사례. 기반 기술 Tangle 은 오픈소스.\n관심 포인트\n(추정) \"반복 업무마다 작고 저렴한 전용 모델\" 이라는 운영 모델 — 우리 제품 · 고객 업무에 그대로 적용 가능한 구조\n(추정) 실패 데이터를 다시 학습에 넣는 루프를 만드는 파이프라인 기술이 오픈소스라는 점 — 직접 써볼 수 있는가\n(추정) 어제 공유한 로컬 · 후훈련 흐름(StartLux, K2 Horizon) 과 같은 방향의 서구 대기업 사례\n핵심 주장\n1. Shopify 가 Qwen3.5-0.8B 를 특정 업무에 맞게 미세조정한 결과, 그 작업에서 GPT-5.6 Sol 을 이겼다 {stated}\n2. 방법은 범용 AI 를 그대로 쓰지 않고, 실제 업무에서 나온 결과를 평가하고 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 것이다 {stated}\n3. Shopify CEO Tobi Lütke 는 이런 자기개선 학습 구조가 있으면 작은 모델도 특정 업무에서 대형 모델보다 좋은 성능을 낼 수 있다고 설명했다 {stated}\n4. 이 학습 파이프라인을 만드는 기반 기술 Tangle 을 오픈소스로 공개했다 {stated}\n5. 글쓴이의 전망: 모든 업무에 비싼 대형 모델을 호출하는 대신 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 빠르게 늘 것이다 {low}\n등장 개념 · 엔티티\nopen-local-models — 상위 주제\nsmall-model-self-improvement-loop — 평가 → 실패 재학습 → 전용 소형 모델\npost-training-agent-capability — 같은 논지의 중국 사례(StartLux) 와 연결\nmodel-routing-token-economics — \"업무마다 전용 소형 모델\" 은 라우팅의 극단\norg-shopify · product-tangle · product-qwen\n우리에게 주는 함의\n어제의 StartLux(27B 후훈련) 와 오늘의 Shopify(0.8B 미세조정) 는 같은 결론을 가리킨다: 특정 업무의 성능은 모델 크기가 아니라 그 업무의 실제 결과로 만든 학습 루프에서 나온다 [S-2026-09-09-003] [S-2026-09-08-006]\n우리 고객 업무마다 \"평가 기준 + 실패 수집 + 재학습\" 루프를 제품에 내장하면, 대형 모델 API 비용을 줄이면서 성능을 올리는 구조가 된다 [S-2026-09-09-003]\n원문 출처(Shopify 발표, Tangle 저장소) 가 게시글에 없다. 수치와 벤치마크 조건은 확인이 필요하다 [S-2026-09-09-003]\n주요 인용\n0.8B짜리 소형 모델이 특정 작업에서 GPT-5.6 Sol을 이겼습니다.\n범용 AI를 그대로 쓰는 대신 실제 업무에서 나온 결과를 평가하고, 실패 데이터를 다시 학습에 넣어 모델을 계속 개선하는 방식을 사용했습니다.\n모든 업무에 비싼 대형 모델을 호출하는 대신, 반복 업무마다 작고 저렴한 전용 모델을 만들어 쓰는 방식이 꽤 빠르게 늘어날 것 같습니다.","title":"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김","topics":["open-local-models"],"type":"source","updated":"2026-09-09"},{"aliases":["GPT-6 Astra 분석","황민호 Astra 글"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","harness-engineering-discipline","human-oversight-erosion","model-routing-token-economics","org-openai","product-gpt-6-astra","subscription-subsidy-dependency","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eOpenAI 가 2026-09-03 공개한 GPT-6 Astra 의 진짜 변화는 성능이 아니라 긴 업무를 수행하는 방식(비동기 도구 호출, 실행 중 지시 변경, 단계별 추론 강도) 에 있으며, 이는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓힌다. 비용은 Sol 의 2.5배라 어디에 쓸지 골라야 하고, 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건 설계가 더 중요해진다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"평가 단위 = 완료된 업무 한 건\" 과 그 측정 지표(완료율, 사람 개입 횟수, 검증 시간, 재시도 + 검수 비용) — 어제 코그니션의 사람 환산 시간과 같은 방향\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 모델 호출 코드보다 \"안전하게 오래 일하게 하는 실행 환경\" 의 품질이 경쟁력이라는 결론 — 우리가 만들 것이 무엇인지\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 공유한 Educators Technology 글의 GPT-6 Astra 를 실무 관점에서 더 자세히 본 것\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eOpenAI 는 2026-09-03 GPT-6 Astra 를 공개했다. Trusted Access Program 참여 기업부터 배포 중이며 API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e비동기 도구 호출: 애플리케이션 함수나 사용자 정의 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행한다(사내 데이터 조회 중 목차 작성, 빌드 · 테스트 중 다른 코드 검토). 실제 업무에서 AI 가 느린 이유는 추론이 아니라 기다려야 하는 외부 시스템이기 때문에 중요하다. 단 작업 ID 관리 · 타임아웃 · 재시도 · 중복 실행 방지는 여전히 개발자 몫이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경(mid-turn steering): 긴 작업 도중 \"일본 시장 제외\", \"이 파일은 수정 금지\", \"변경 전에 계획 먼저\" 같은 지시를 추가할 수 있다. 이미 실행된 행동(파일 삭제, 메일 발송) 을 되돌리거나 시작된 도구 실행을 취소하지는 않으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e단계별 추론 강도 조절: 한 작업 안에서 자료 정리는 낮게, 설계 검토 · 중요 의사결정은 높게, 마무리는 다시 낮게 계산 자원을 배분한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e세 가지를 합치면 Astra 는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓히려는 모델이다. 리서치라면 조회 · 대기 중 읽기 · 범위 수정 · 계산 · 문서 작성 · 검증까지, 코딩이라면 저장소 분석 · 수정 · 빌드 · 테스트 · 오류 수정까지가 한 작업이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e가격: 표준 API 입력 100만 토큰당 10달러, 출력 50달러로 GPT-5.6 Sol(4달러 · 20달러) 의 2.5배. ChatGPT Work · Codex 에서 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise · 구매 크레딧 2.08배 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e따라서 반복 분류 · 요약 · 포맷 변환은 Luna · Terra 가, 범위가 명확한 고난도 작업은 Sol 로 충분하다. Astra 는 여러 단계가 연결되고 외부 시스템을 자주 호출하며 진행 중 요구가 바뀌고 실패 시 사람 재투입 비용이 큰 업무에 맞는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOpenAI 는 Astra 를 Preparedness Framework 에서 처음으로 Critical 수준의 사이버보안 역량에 도달한 모델로 분류했다. 내부 평가 ExploitBench 100%, 알려지지 않은 취약점도 발견. 일부 결과는 기본 환경보다 강한 도구 접근 권한을 쓴 평가였다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e성능이 높아질수록 \"무엇을 시킬 것인가\" 만으로는 부족하다. 어떤 도구를 연결할지, 어느 단계에서 승인을 받을지, 실패하면 어디서 멈출지, 중복 실행을 어떻게 막을지, 작업 내역을 어떻게 남길지를 설계해야 한다. 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건이 더 중요해진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e모델 비교에서 벤치마크 점수만으로는 부족하다. 한 업무를 끝까지 완료한 비율, 사람 개입 횟수, 결과 검증까지 걸린 시간, 재시도와 검수 시간을 합친 비용을 측정해야 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일할 수 있게 만든 실행 환경의 품질이 점점 더 중요해진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e — 평가 단위 = 완료된 업무 한 건, 측정 지표\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 실행 조건: 최소 권한 · 체크포인트 · 승인 지점 · 비용 상한\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 완료 조건 정의\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — Luna · Terra · Sol · Astra 티어 배분\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 실행 중 지시 변경도 되돌리기는 못한다, 승인은 여전히 필요\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리 에이전트 제품의 지표를 \"답변 품질\" 에서 \"완료율 · 개입 횟수 · 검증 시간 · 총비용\" 으로 바꾸면, 코그니션의 사람 환산 시간과 함께 고객에게 제시할 ROI 프레임이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e경쟁력은 모델 호출이 아니라 실행 환경(작업 ID · 타임아웃 · 재시도 · 중복 방지 · 체크포인트 · 감사 기록) 에 있다. 이것은 모델이 바뀌어도 남는 자산이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eAstra 급 모델은 비용이 2.5배이므로 라우팅 없이 전면 도입하면 청구서 충격이 온다. 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eGPT-6 Astra가 바꾼 것은 답변의 질보다 ‘일을 끝내는 방식’입니다\u003c/p\u003e\n\u003cp\u003e평가 단위를 ‘한 번의 답변’에서 ‘완료된 업무 한 건’으로 넓히려는 모델입니다.\u003c/p\u003e\n\u003cp\u003e다만 이미 실행된 행동을 되돌리는 기능은 아닙니다. 파일을 삭제했거나 외부로 메일을 보냈다면 나중에 지시를 바꾼다고 자동 복구되지 않습니다.\u003c/p\u003e\n\u003cp\u003e성능이 높아질수록 “모델에게 어떤 일을 시킬 것인가”만으로는 부족해집니다.\u003c/p\u003e\n\u003cp\u003e한 업무를 끝까지 완료한 비율은 얼마인지, 사람은 몇 번 개입했는지, 결과 검증까지 얼마나 걸렸는지, 재시도와 사람의 검수 시간을 합친 비용은 얼마인지를 측정해야 합니다.\u003c/p\u003e\n\u003cp\u003eAI 에이전트를 만드는 쪽에서도 모델을 호출하는 코드보다 그 모델이 안전하게 오래 일할 수 있도록 만든 실행 환경의 품질이 점점 더 중요해질 것 같습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","agent-governance-guardrails","ai-agents-enterprise-adoption","human-oversight-erosion","model-routing-token-economics","org-openai","product-gpt-6-astra","task-definition-bottleneck","task-level-agent-evaluation"],"relpath":"wiki/sources/S-2026-09-09-004-gpt-6-astra-task-completion.md","sources":["S-2026-09-09-004"],"src":{"author":"황민호 (카카오) — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-004.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-004","url":""},"status":"draft","stem":"S-2026-09-09-004-gpt-6-astra-task-completion","summary":"GPT-6 Astra 의 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도가 평가 단위를 '답변' 에서 '완료된 업무' 로 옮기며, 실행 조건 설계가 핵심이라는 분석","system":false,"text":"한 줄 요약\nOpenAI 가 2026-09-03 공개한 GPT-6 Astra 의 진짜 변화는 성능이 아니라 긴 업무를 수행하는 방식(비동기 도구 호출, 실행 중 지시 변경, 단계별 추론 강도) 에 있으며, 이는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓힌다. 비용은 Sol 의 2.5배라 어디에 쓸지 골라야 하고, 성능이 오를수록 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건 설계가 더 중요해진다.\n관심 포인트\n(추정) \"평가 단위 = 완료된 업무 한 건\" 과 그 측정 지표(완료율, 사람 개입 횟수, 검증 시간, 재시도 + 검수 비용) — 어제 코그니션의 사람 환산 시간과 같은 방향\n(추정) 모델 호출 코드보다 \"안전하게 오래 일하게 하는 실행 환경\" 의 품질이 경쟁력이라는 결론 — 우리가 만들 것이 무엇인지\n(추정) 어제 공유한 Educators Technology 글의 GPT-6 Astra 를 실무 관점에서 더 자세히 본 것\n핵심 주장\n1. OpenAI 는 2026-09-03 GPT-6 Astra 를 공개했다. Trusted Access Program 참여 기업부터 배포 중이며 API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정이다 {stated}\n2. 비동기 도구 호출: 애플리케이션 함수나 사용자 정의 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행한다(사내 데이터 조회 중 목차 작성, 빌드 · 테스트 중 다른 코드 검토). 실제 업무에서 AI 가 느린 이유는 추론이 아니라 기다려야 하는 외부 시스템이기 때문에 중요하다. 단 작업 ID 관리 · 타임아웃 · 재시도 · 중복 실행 방지는 여전히 개발자 몫이다 {stated}\n3. 실행 중 지시 변경(mid-turn steering): 긴 작업 도중 \"일본 시장 제외\", \"이 파일은 수정 금지\", \"변경 전에 계획 먼저\" 같은 지시를 추가할 수 있다. 이미 실행된 행동(파일 삭제, 메일 발송) 을 되돌리거나 시작된 도구 실행을 취소하지는 않으므로 결제 · 배포 · 삭제 · 외부 전송에는 실행 직전 승인이 여전히 필요하다 {stated}\n4. 단계별 추론 강도 조절: 한 작업 안에서 자료 정리는 낮게, 설계 검토 · 중요 의사결정은 높게, 마무리는 다시 낮게 계산 자원을 배분한다 {stated}\n5. 세 가지를 합치면 Astra 는 평가 단위를 \"한 번의 답변\" 에서 \"완료된 업무 한 건\" 으로 넓히려는 모델이다. 리서치라면 조회 · 대기 중 읽기 · 범위 수정 · 계산 · 문서 작성 · 검증까지, 코딩이라면 저장소 분석 · 수정 · 빌드 · 테스트 · 오류 수정까지가 한 작업이다 {stated}\n6. 가격: 표준 API 입력 100만 토큰당 10달러, 출력 50달러로 GPT-5.6 Sol(4달러 · 20달러) 의 2.5배. ChatGPT Work · Codex 에서 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise · 구매 크레딧 2.08배 {stated}\n7. 따라서 반복 분류 · 요약 · 포맷 변환은 Luna · Terra 가, 범위가 명확한 고난도 작업은 Sol 로 충분하다. Astra 는 여러 단계가 연결되고 외부 시스템을 자주 호출하며 진행 중 요구가 바뀌고 실패 시 사람 재투입 비용이 큰 업무에 맞는다 {stated}\n8. OpenAI 는 Astra 를 Preparedness Framework 에서 처음으로 Critical 수준의 사이버보안 역량에 도달한 모델로 분류했다. 내부 평가 ExploitBench 100%, 알려지지 않은 취약점도 발견. 일부 결과는 기본 환경보다 강한 도구 접근 권한을 쓴 평가였다 {stated}\n9. 성능이 높아질수록 \"무엇을 시킬 것인가\" 만으로는 부족하다. 어떤 도구를 연결할지, 어느 단계에서 승인을 받을지, 실패하면 어디서 멈출지, 중복 실행을 어떻게 막을지, 작업 내역을 어떻게 남길지를 설계해야 한다. 완료 조건 · 최소 권한 · 체크포인트 · 재시도 상한 · 비용 상한 같은 실행 조건이 더 중요해진다 {stated}\n10. 모델 비교에서 벤치마크 점수만으로는 부족하다. 한 업무를 끝까지 완료한 비율, 사람 개입 횟수, 결과 검증까지 걸린 시간, 재시도와 검수 시간을 합친 비용을 측정해야 한다 {stated}\n11. 에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일할 수 있게 만든 실행 환경의 품질이 점점 더 중요해진다 {stated}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption — 상위 주제\ntask-level-agent-evaluation — 평가 단위 = 완료된 업무 한 건, 측정 지표\nagent-governance-guardrails — 실행 조건: 최소 권한 · 체크포인트 · 승인 지점 · 비용 상한\ntask-definition-bottleneck — 완료 조건 정의\nmodel-routing-token-economics — Luna · Terra · Sol · Astra 티어 배분\nhuman-oversight-erosion — 실행 중 지시 변경도 되돌리기는 못한다, 승인은 여전히 필요\nproduct-gpt-6-astra · org-openai\n우리에게 주는 함의\n우리 에이전트 제품의 지표를 \"답변 품질\" 에서 \"완료율 · 개입 횟수 · 검증 시간 · 총비용\" 으로 바꾸면, 코그니션의 사람 환산 시간과 함께 고객에게 제시할 ROI 프레임이 된다 [S-2026-09-09-004] [S-2026-09-08-002]\n경쟁력은 모델 호출이 아니라 실행 환경(작업 ID · 타임아웃 · 재시도 · 중복 방지 · 체크포인트 · 감사 기록) 에 있다. 이것은 모델이 바뀌어도 남는 자산이다 [S-2026-09-09-004]\nAstra 급 모델은 비용이 2.5배이므로 라우팅 없이 전면 도입하면 청구서 충격이 온다. 다단계 · 외부 시스템 · 요구 변경이 있는 업무에만 배정한다 [S-2026-09-09-004] [S-2026-09-08-002]\n주요 인용\nGPT-6 Astra가 바꾼 것은 답변의 질보다 ‘일을 끝내는 방식’입니다\n평가 단위를 ‘한 번의 답변’에서 ‘완료된 업무 한 건’으로 넓히려는 모델입니다.\n다만 이미 실행된 행동을 되돌리는 기능은 아닙니다. 파일을 삭제했거나 외부로 메일을 보냈다면 나중에 지시를 바꾼다고 자동 복구되지 않습니다.\n성능이 높아질수록 “모델에게 어떤 일을 시킬 것인가”만으로는 부족해집니다.\n한 업무를 끝까지 완료한 비율은 얼마인지, 사람은 몇 번 개입했는지, 결과 검증까지 얼마나 걸렸는지, 재시도와 사람의 검수 시간을 합친 비용은 얼마인지를 측정해야 합니다.\nAI 에이전트를 만드는 쪽에서도 모델을 호출하는 코드보다 그 모델이 안전하게 오래 일할 수 있도록 만든 실행 환경의 품질이 점점 더 중요해질 것 같습니다.","title":"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 '일을 끝내는 방식'","topics":["ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-09"},{"aliases":["Arena 코딩 리더보드 변화","Hy4 1631 Elo"],"back":["local-model-24gb-boundary","model-routing-token-economics","open-local-models","org-openai","org-tencent","product-qwen"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eArena 코딩(webdev) 리더보드에서 Tencent 의 Hy4 가 Grok 4.6 급 성능을 훨씬 낮은 가격에 내고, OpenAI 의 GPT-5.6 Sol 은 9위로 밀렸으며, 로컬에서 무료로 도는 Qwen3.8-27B 가 상위권에 근접했다는 짧은 관찰. 경쟁 축이 성능에서 성능 · 가격 · 로컬 실행으로 바뀌었다는 결론.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 어제 로컬 모델 글의 Qwen3.8-27B 가 공개 리더보드에서도 상위권이라는 독립 근거\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 최상위 모델의 가격 프리미엄이 정당화되기 어려워지는 흐름 — 우리 모델 선택 · 비용 구조\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eTencent Hy4 는 Arena 코딩 리더보드에서 1631 Elo 를 기록했고 가격은 약 2.50달러 수준이다. Grok 4.6 과 비슷한 성능권이지만 가격은 훨씬 낮다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eGPT-5.6 Sol xhigh 는 1609 Elo 로 9위까지 내려왔고 Top 10 밖으로 밀릴 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.8-27B 는 거의 1600 Elo 에 가까운 점수를 기록하면서 이미 로컬에서 무료로 실행할 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eGLM 모델도 10위까지 하락했고, OpenAI 는 랩 순위에서 6위까지 내려왔다는 분석도 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이제 성능뿐 아니라 가격과 로컬 실행까지 경쟁 축이 완전히 달라졌다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — Qwen3.8-27B 의 로컬 상위권 근거\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 가격 대비 성능\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-tencent\" class=\"wl\"\u003eorg-tencent\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eQwen3.8-27B 가 공개 리더보드 상위권에 근접했다면, 24GB 한 장 로컬 배포 규격이 \"성능 타협\" 이 아니라 현실적 선택이라는 근거가 하나 더 생긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eElo 수치는 리더보드 스냅샷의 전언이며 날짜 · 조건이 없다. 인용할 때는 arena.ai 를 직접 확인한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eTencent의 Hy4는 무려 1631 Elo를 기록했는데 가격은 단 $2.50 수준입니다.\u003c/p\u003e\n\u003cp\u003e더 놀라운 건 Qwen3.8-27B입니다. 거의 1600 Elo에 가까운 점수를 기록하면서 이미 로컬에서 무료로 실행할 수 있습니다.\u003c/p\u003e\n\u003cp\u003e이제는 성능뿐 아니라 가격과 로컬 실행까지 경쟁이 완전히 달라졌습니다.\u003c/p\u003e\n\u003cp\u003eArena 코딩 리더보드: https://arena.ai/leaderboard/code/webdev\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","model-routing-token-economics","open-local-models","org-openai","org-tencent","product-qwen"],"relpath":"wiki/sources/S-2026-09-09-005-arena-coding-leaderboard-shift.md","sources":["S-2026-09-09-005"],"src":{"author":"이상선 — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-005.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-005","url":""},"status":"draft","stem":"S-2026-09-09-005-arena-coding-leaderboard-shift","summary":"Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo(2.5달러), GPT-5.6 Sol 9위, Qwen3.8-27B 약 1600 로컬 무료 — 경쟁 축이 성능 · 가격 · 로컬 실행으로","system":false,"text":"한 줄 요약\nArena 코딩(webdev) 리더보드에서 Tencent 의 Hy4 가 Grok 4.6 급 성능을 훨씬 낮은 가격에 내고, OpenAI 의 GPT-5.6 Sol 은 9위로 밀렸으며, 로컬에서 무료로 도는 Qwen3.8-27B 가 상위권에 근접했다는 짧은 관찰. 경쟁 축이 성능에서 성능 · 가격 · 로컬 실행으로 바뀌었다는 결론.\n관심 포인트\n(추정) 어제 로컬 모델 글의 Qwen3.8-27B 가 공개 리더보드에서도 상위권이라는 독립 근거\n(추정) 최상위 모델의 가격 프리미엄이 정당화되기 어려워지는 흐름 — 우리 모델 선택 · 비용 구조\n핵심 주장\n1. Tencent Hy4 는 Arena 코딩 리더보드에서 1631 Elo 를 기록했고 가격은 약 2.50달러 수준이다. Grok 4.6 과 비슷한 성능권이지만 가격은 훨씬 낮다 {stated}\n2. GPT-5.6 Sol xhigh 는 1609 Elo 로 9위까지 내려왔고 Top 10 밖으로 밀릴 수 있다 {stated}\n3. Qwen3.8-27B 는 거의 1600 Elo 에 가까운 점수를 기록하면서 이미 로컬에서 무료로 실행할 수 있다 {stated}\n4. GLM 모델도 10위까지 하락했고, OpenAI 는 랩 순위에서 6위까지 내려왔다는 분석도 있다 {stated}\n5. 이제 성능뿐 아니라 가격과 로컬 실행까지 경쟁 축이 완전히 달라졌다 {stated}\n등장 개념 · 엔티티\nopen-local-models — 상위 주제\nlocal-model-24gb-boundary — Qwen3.8-27B 의 로컬 상위권 근거\nmodel-routing-token-economics — 가격 대비 성능\norg-tencent · product-qwen · org-openai\n우리에게 주는 함의\nQwen3.8-27B 가 공개 리더보드 상위권에 근접했다면, 24GB 한 장 로컬 배포 규격이 \"성능 타협\" 이 아니라 현실적 선택이라는 근거가 하나 더 생긴다 [S-2026-09-09-005] [S-2026-09-08-006]\nElo 수치는 리더보드 스냅샷의 전언이며 날짜 · 조건이 없다. 인용할 때는 arena.ai 를 직접 확인한다 [S-2026-09-09-005]\n주요 인용\nTencent의 Hy4는 무려 1631 Elo를 기록했는데 가격은 단 $2.50 수준입니다.\n더 놀라운 건 Qwen3.8-27B입니다. 거의 1600 Elo에 가까운 점수를 기록하면서 이미 로컬에서 무료로 실행할 수 있습니다.\n이제는 성능뿐 아니라 가격과 로컬 실행까지 경쟁이 완전히 달라졌습니다.\nArena 코딩 리더보드: https://arena.ai/leaderboard/code/webdev","title":"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접","topics":["open-local-models"],"type":"source","updated":"2026-09-09"},{"aliases":["WikiSkill","위키스킬"],"back":["agent-native-model","beyond-parameter-scaling","knowledge-base-compilation","llm-wiki-pattern","post-training-agent-capability","product-gemini","product-qwen","skill-evolution-persistent-wiki"],"cites":["S-2026-09-08-001-karpathy-llm-wiki"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e구글 리서치 논문 \"WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution\" 소개. 기존 스킬 진화 시스템은 통찰이 최적화 이력에 파편화돼 축적되지 않는데, WikiSkill 은 원시 실행 경험 · 영구 위키 · 실행 가능한 스킬을 분리하고 위키를 토대로 스킬을 갱신해 지속적 성장을 만든다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 우리가 만든 이 저장소와 같은 구조를 구글이 에이전트 스킬 학습에 적용했다는 점 — 설계의 외부 검증\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 이긴다는 결과 — 파라미터 경쟁 밖의 성능 경로\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 한 모델에서 진화시킨 스킬이 다른 계열 모델로 전이된다는 점 — 자산의 이식 가능성\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e기존 스킬 진화 시스템의 구조적 한계는 스킬 발전을 이끄는 통찰이 최적화 과정의 이력 속에 파편화돼 흩어진다는 점이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eWikiSkill 은 기존 시스템이 뭉뚱그리던 세 요소를 분리한다: 가공되지 않은 실행 경험, 축적된 영구 지식 베이스(위키), 실행 가능한 스킬 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e에이전트의 경험은 일회성으로 소비되지 않고 위키에 통합되며, 이후 스킬 업데이트는 파편화된 기록이 아니라 그 위키를 토대로 이루어진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eQwen 3.5 시리즈 · Gemini 3.5 Flash 등 여러 모델과 벤치마크에서 기존 최고 성능인 EvoSkill · SkillOpt 를 일관되게 능가했고, 스킬 미사용 베이스라인 대비 압도적 우위를 보였다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e진화된 스킬을 장착한 작은 모델이 스킬 없는 훨씬 큰 모델을 능가했다 — 스킬 진화가 파라미터 크기의 한계를 넘는 열쇠일 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e한 모델에서 진화시킨 스킬이 다른 아키텍처 · 계열 모델로 효과적으로 전이되며, 이식한 스킬이 자체 진화 스킬보다 더 나은 성능을 낸 경우도 관찰됐다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e스킬 진화는 모델 스케일링을 대체하지 않고 상호 보완한다. 대형 모델은 더 정교한 혜택을, 소형 모델은 체급 이상의 효율을 얻는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e절제 연구(ablation) 는 성공의 핵심이 '위키를 통한 지속적 지식 축적' 임을 확인했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/skill-evolution-persistent-wiki\" class=\"wl\"\u003eskill-evolution-persistent-wiki\u003c/a\u003e — 경험 · 위키 · 스킬의 3층 분리와 축적\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 같은 3계층 구조를 사람의 지식 베이스에 적용한 원전\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 파라미터 밖에서 능력을 올리는 층\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e — 실험 대상 모델\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e이 저장소의 raw / wiki / 스킬 문서 3계층이 에이전트 스킬 학습에서도 같은 형태로 유효하다는 외부 근거다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우리 에이전트 운영에서도 실행 경험을 로그로만 두지 말고 위키로 컴파일해 두면, 다음 개선이 파편화된 이력이 아니라 축적된 지식 위에서 이루어진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e스킬이 모델 계열을 넘어 전이된다면, 우리가 쌓는 것은 특정 모델이 아니라 이식 가능한 자산이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e스킬 발전을 이끄는 핵심적인 통찰력(insights)이 최적화 과정의 역사 속에 파편화되어 흩어져 버린다는 점이다.\u003c/p\u003e\n\u003cp\u003e이 프레임워크는 '가공되지 않은 실행 경험(Raw execution experience)', '축적된 영구적 지식 베이스(Persistent wiki of accumulated knowledge)', 그리고 '실행 가능한 스킬(Executable skills)'을 독립적으로 다룬다.\u003c/p\u003e\n\u003cp\u003e진화된 스킬을 장착한 작은 규모의 모델이, 스킬이 없는 훨씬 더 큰 규모의 모델을 압도하는 성능을 보여주었다.\u003c/p\u003e\n\u003cp\u003e심지어 다른 모델에서 진화된 스킬을 이식했을 때, 스스로 진화시킨 스킬보다 더 우수한 성능을 내는 흥미로운 결과도 관찰되었다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","knowledge-base-compilation","llm-wiki-pattern","post-training-agent-capability","product-qwen","skill-evolution-persistent-wiki"],"relpath":"wiki/sources/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge.md","sources":["S-2026-09-09-006"],"src":{"author":"김석현 (플리토) — 링크드인 발췌","file":"raw/2026/09/S-2026-09-09-006.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-006","url":""},"status":"draft","stem":"S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","summary":"에이전트의 실행 경험 · 영구 위키 · 실행 가능한 스킬을 분리하고, 위키를 토대로 스킬을 갱신해 EvoSkill · SkillOpt 를 능가했다는 구글 논문 소개","system":false,"text":"한 줄 요약\n구글 리서치 논문 \"WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution\" 소개. 기존 스킬 진화 시스템은 통찰이 최적화 이력에 파편화돼 축적되지 않는데, WikiSkill 은 원시 실행 경험 · 영구 위키 · 실행 가능한 스킬을 분리하고 위키를 토대로 스킬을 갱신해 지속적 성장을 만든다.\n관심 포인트\n(추정) 우리가 만든 이 저장소와 같은 구조를 구글이 에이전트 스킬 학습에 적용했다는 점 — 설계의 외부 검증\n(추정) 스킬을 장착한 작은 모델이 스킬 없는 큰 모델을 이긴다는 결과 — 파라미터 경쟁 밖의 성능 경로\n(추정) 한 모델에서 진화시킨 스킬이 다른 계열 모델로 전이된다는 점 — 자산의 이식 가능성\n핵심 주장\n1. 기존 스킬 진화 시스템의 구조적 한계는 스킬 발전을 이끄는 통찰이 최적화 과정의 이력 속에 파편화돼 흩어진다는 점이다 {stated}\n2. WikiSkill 은 기존 시스템이 뭉뚱그리던 세 요소를 분리한다: 가공되지 않은 실행 경험, 축적된 영구 지식 베이스(위키), 실행 가능한 스킬 {stated}\n3. 에이전트의 경험은 일회성으로 소비되지 않고 위키에 통합되며, 이후 스킬 업데이트는 파편화된 기록이 아니라 그 위키를 토대로 이루어진다 {stated}\n4. Qwen 3.5 시리즈 · Gemini 3.5 Flash 등 여러 모델과 벤치마크에서 기존 최고 성능인 EvoSkill · SkillOpt 를 일관되게 능가했고, 스킬 미사용 베이스라인 대비 압도적 우위를 보였다 {stated}\n5. 진화된 스킬을 장착한 작은 모델이 스킬 없는 훨씬 큰 모델을 능가했다 — 스킬 진화가 파라미터 크기의 한계를 넘는 열쇠일 수 있다 {stated}\n6. 한 모델에서 진화시킨 스킬이 다른 아키텍처 · 계열 모델로 효과적으로 전이되며, 이식한 스킬이 자체 진화 스킬보다 더 나은 성능을 낸 경우도 관찰됐다 {stated}\n7. 스킬 진화는 모델 스케일링을 대체하지 않고 상호 보완한다. 대형 모델은 더 정교한 혜택을, 소형 모델은 체급 이상의 효율을 얻는다 {stated}\n8. 절제 연구(ablation) 는 성공의 핵심이 '위키를 통한 지속적 지식 축적' 임을 확인했다 {stated}\n등장 개념 · 엔티티\nknowledge-base-compilation — 상위 주제\nskill-evolution-persistent-wiki — 경험 · 위키 · 스킬의 3층 분리와 축적\nllm-wiki-pattern — 같은 3계층 구조를 사람의 지식 베이스에 적용한 원전\npost-training-agent-capability — 파라미터 밖에서 능력을 올리는 층\nproduct-qwen — 실험 대상 모델\n우리에게 주는 함의\n이 저장소의 raw / wiki / 스킬 문서 3계층이 에이전트 스킬 학습에서도 같은 형태로 유효하다는 외부 근거다 [S-2026-09-09-006] [S-2026-09-08-001]\n우리 에이전트 운영에서도 실행 경험을 로그로만 두지 말고 위키로 컴파일해 두면, 다음 개선이 파편화된 이력이 아니라 축적된 지식 위에서 이루어진다 [S-2026-09-09-006]\n스킬이 모델 계열을 넘어 전이된다면, 우리가 쌓는 것은 특정 모델이 아니라 이식 가능한 자산이 된다 [S-2026-09-09-006]\n주요 인용\n스킬 발전을 이끄는 핵심적인 통찰력(insights)이 최적화 과정의 역사 속에 파편화되어 흩어져 버린다는 점이다.\n이 프레임워크는 '가공되지 않은 실행 경험(Raw execution experience)', '축적된 영구적 지식 베이스(Persistent wiki of accumulated knowledge)', 그리고 '실행 가능한 스킬(Executable skills)'을 독립적으로 다룬다.\n진화된 스킬을 장착한 작은 규모의 모델이, 스킬이 없는 훨씬 더 큰 규모의 모델을 압도하는 성능을 보여주었다.\n심지어 다른 모델에서 진화된 스킬을 이식했을 때, 스스로 진화시킨 스킬보다 더 우수한 성능을 내는 흥미로운 결과도 관찰되었다.","title":"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다","topics":["knowledge-base-compilation"],"type":"source","updated":"2026-09-09"},{"aliases":["AI PPT 만들기","PPT 워크플로"],"back":["_unsorted","ai-document-production-workflow","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e이미지 생성 모델로 만든 장표는 보기 좋지만 텍스트가 깨진다. 밑그림은 사람이 잡고, 거의 같은 프롬프트로 시안을 대량으로 뽑아 고른 뒤, 그 시안에서 텍스트를 제거하고 다시 텍스트를 채워 넣게 하는 순서로 두 마리를 다 잡는 실무 절차.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 대량 시안 생성과 텍스트 재삽입이라는 구체적 절차 — 사내 자료 제작에 바로 적용 가능\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"밑그림은 사람이 해야 한다\" 는 원칙 — AI 를 앵무새로 만들지 않는 선\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e가장 중요한 것은 밑그림이며 이것은 사람이 해야 한다. AI 가 하면 AI 가 시키는 대로 말하는 앵무새 역할이 된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e전달할 메시지와 문맥을 정리해 장표마다 준비한다. 텍스트만 있어도 충분하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAI 에게 장표 디자인을 요청할 때 원하는 스타일 · 말투 · 정보량을 모두 지정하고, 거의 같은 프롬프트로 시안을 최대한 많이 뽑는다. 글쓴이는 최소 10개, 많으면 100개 정도의 조금씩 다른 초안을 받는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e시안을 확정한 뒤 텍스트를 모두 제거하라고 요청해 텍스트 없는 이미지를 만든다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e그 이미지에 시안에서 표현된 정보를 텍스트로 다시 넣어 달라고 지시하면 폰트 · 장평을 맞춰 거의 같은 형태로 끼워 맞춰 준다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e배경 문제의식: 텍스트가 항상 깨지고 한 글자나 한 부분만 고치고 싶은 상황이 생기는데, PPT 내용은 이미지 생성 모델로 만드는 편이 시각적으로 낫고 정보 전달력도 좋다. 이 두 가지를 함께 잡으려는 방법이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-document-production-workflow\" class=\"wl\"\u003eai-document-production-workflow\u003c/a\u003e — 사람이 구조를 잡고 AI 가 대량 시안을 내는 절차\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\"사람이 구조를 잡고 AI 는 변형을 대량 생산한다\" 는 분업은 우리가 다루는 다른 주제(업무 정의가 병목) 와 같은 형태다. 문서 제작이라는 작은 사례로 확인된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e시안을 100개까지 뽑는 방식은 토큰 비용이 성능이 되는 사례이기도 하다. 저렴한 모델로 대량 생성하고 사람이 고르는 구조가 유효하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e가장 중요한건 밑그림. 이건 일단 사람이 해야한다고 생각함. AI가 해도 되는데, 이제 그건 AI가 시키는 대로 말하는 앵무새 역할을 하는 것.\u003c/p\u003e\n\u003cp\u003e최대한 (거의) 같은 프롬프트로, 최대한 많은 시안을 뽑아봄. 나는 최소한 10개, 많으면 100개 정도의 조금씩 다른 초안을 받는 편.\u003c/p\u003e\n\u003cp\u003e이제 AI 에게, 텍스트가 제거된 이미지에, 시안에서 표현된 정보를 텍스트로 집어 넣어달라고 지시함.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-document-production-workflow"],"relpath":"wiki/sources/S-2026-09-09-007-ai-ppt-design-workflow.md","sources":["S-2026-09-09-007"],"src":{"author":"박찬성 (ETRI) — SNS 발췌","file":"raw/2026/09/S-2026-09-09-007.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-007","url":""},"status":"draft","stem":"S-2026-09-09-007-ai-ppt-design-workflow","summary":"밑그림은 사람이 잡고, 같은 프롬프트로 시안을 10~100개 뽑은 뒤, 확정 시안에서 텍스트를 지우고 다시 채워 넣어 이미지 품질과 텍스트 정확도를 함께 잡는 실무 절차","system":false,"text":"한 줄 요약\n이미지 생성 모델로 만든 장표는 보기 좋지만 텍스트가 깨진다. 밑그림은 사람이 잡고, 거의 같은 프롬프트로 시안을 대량으로 뽑아 고른 뒤, 그 시안에서 텍스트를 제거하고 다시 텍스트를 채워 넣게 하는 순서로 두 마리를 다 잡는 실무 절차.\n관심 포인트\n(추정) 대량 시안 생성과 텍스트 재삽입이라는 구체적 절차 — 사내 자료 제작에 바로 적용 가능\n(추정) \"밑그림은 사람이 해야 한다\" 는 원칙 — AI 를 앵무새로 만들지 않는 선\n핵심 주장\n1. 가장 중요한 것은 밑그림이며 이것은 사람이 해야 한다. AI 가 하면 AI 가 시키는 대로 말하는 앵무새 역할이 된다 {stated}\n2. 전달할 메시지와 문맥을 정리해 장표마다 준비한다. 텍스트만 있어도 충분하다 {stated}\n3. AI 에게 장표 디자인을 요청할 때 원하는 스타일 · 말투 · 정보량을 모두 지정하고, 거의 같은 프롬프트로 시안을 최대한 많이 뽑는다. 글쓴이는 최소 10개, 많으면 100개 정도의 조금씩 다른 초안을 받는다 {stated}\n4. 시안을 확정한 뒤 텍스트를 모두 제거하라고 요청해 텍스트 없는 이미지를 만든다 {stated}\n5. 그 이미지에 시안에서 표현된 정보를 텍스트로 다시 넣어 달라고 지시하면 폰트 · 장평을 맞춰 거의 같은 형태로 끼워 맞춰 준다 {stated}\n6. 배경 문제의식: 텍스트가 항상 깨지고 한 글자나 한 부분만 고치고 싶은 상황이 생기는데, PPT 내용은 이미지 생성 모델로 만드는 편이 시각적으로 낫고 정보 전달력도 좋다. 이 두 가지를 함께 잡으려는 방법이다 {stated}\n등장 개념 · 엔티티\nai-document-production-workflow — 사람이 구조를 잡고 AI 가 대량 시안을 내는 절차\n우리에게 주는 함의\n\"사람이 구조를 잡고 AI 는 변형을 대량 생산한다\" 는 분업은 우리가 다루는 다른 주제(업무 정의가 병목) 와 같은 형태다. 문서 제작이라는 작은 사례로 확인된다 [S-2026-09-09-007] [S-2026-09-08-002]\n시안을 100개까지 뽑는 방식은 토큰 비용이 성능이 되는 사례이기도 하다. 저렴한 모델로 대량 생성하고 사람이 고르는 구조가 유효하다 [S-2026-09-09-007]\n주요 인용\n가장 중요한건 밑그림. 이건 일단 사람이 해야한다고 생각함. AI가 해도 되는데, 이제 그건 AI가 시키는 대로 말하는 앵무새 역할을 하는 것.\n최대한 (거의) 같은 프롬프트로, 최대한 많은 시안을 뽑아봄. 나는 최소한 10개, 많으면 100개 정도의 조금씩 다른 초안을 받는 편.\n이제 AI 에게, 텍스트가 제거된 이미지에, 시안에서 표현된 정보를 텍스트로 집어 넣어달라고 지시함.","title":"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법","topics":[],"type":"source","updated":"2026-09-09"},{"aliases":["네오호스","NeoHorse","토큰리듬 분석"],"back":["agent-native-model","beyond-parameter-scaling","loop-transformer-latent-reasoning","model-routing-token-economics","on-policy-distillation","org-deepseek","org-stripe","org-tokenrhythm","person-wang-yunhe","post-training-agent-capability","product-gpt-6-astra","product-neohorse","product-openrouter","product-qwen","routing-harness"],"cites":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e모델 경쟁의 축이 \"어느 단일 모델이 가장 뛰어난가\" 에서 \"수많은 모델을 어떻게 조직하고 활용하는가\" 로 옮겨가는 가운데, 중국 토큰리듬이 자사 라우팅 하네스가 실제로 생성한 에이전트 실행 궤적을 학습 말뭉치로 삼은 '에이전트 네이티브' 모델 NeoHorse-1 을 공개했다. 4B 모델이 두 배 이상 큰 기초 모델을 일부 벤치마크에서 능가했고, 실행 경험이 다시 훈련으로 환류되는 선순환(RSI 단일 루프) 을 검증했다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 우리가 운영하는 에이전트의 실행 기록이 그 자체로 학습 자산이 될 수 있다는 구조 — 로그를 무엇으로 남길 것인가\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 라우팅 하네스라는 인프라 계층이 모델보다 먼저 자리를 잡는다는 관점 — 우리 포지션과 직결\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 미국(단일 거대 모델 내장 에이전트) 대 중국(모델 라우팅 + 경험 환류) 의 갈라짐\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e2026년 8월 스트라이프가 AI 모델 라우팅 플랫폼 오픈라우터를 약 75억 달러에 인수했다. 석 달 전 13억 달러 평가였다. 경쟁 축이 단일 모델 우수성에서 다수 모델의 조직 · 활용으로 옮겨갔음을 보여준다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e토큰리듬은 전 화웨이 노아방주 연구소장이자 판구 대형모델 총책임자였던 왕윈허가 창업했고, 출범 4개월 만에 엔젤 단계에서 1억 달러 기업가치를 인정받았다. 누적 사용자 5만 4천 명, 일일 토큰 호출량 5,000억을 돌파했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e핵심 전략은 '라우팅 하네스': 단순 게이트웨이가 아니라 에이전트 작업 과정에 실시간 개입해 작업 유형 · 실행 단계 · 비용 예산 · 실시간 상태에 따라 모델을 동적으로 선택 · 전환 · 협업시키는 인프라 계층이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eNeoHorse-1 의 훈련 말뭉치는 인터넷 텍스트가 아니라 라우팅 하네스가 생성한 '에이전트 실행 궤적' 이다. 라우터의 판단, 모델 선택, 도구 호출, 환경 피드백, 오류 시 경로 수정까지 행동 · 실패 · 복구의 전 과정이 담긴다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e예시로 기초 모델은 이메일의 최신 제약을 읽지 못해 만료된 정보로 일정을 짜고 파일을 잘못된 위치에 저장한 반면, 네오호스는 이메일까지 읽고 제약을 반영해 재계산한 뒤 검증하고 올바른 위치에 저장했다. '정답' 이 아니라 '문제 해결의 절차' 를 학습했기 때문이라는 설명이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e선순환 구조: 하네스가 궤적 생성 → 구조적 검증과 6개 차원(목표 달성 · 증거 일관성 · 오류 복구 등) 품질 평가로 선별 → '라우팅 유도 커리큘럼 학습' 과 '온폴리시 증류' 로 주입 → 갱신된 모델이 다시 하네스의 선택지가 됨 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e성과: NeoHorse-1-4B 는 Qwen3.5-4B 기반 후훈련으로 10개 종합 벤치마크 매크로 평균이 58.94 → 64.87 로 5.93점 올랐고, 11개 에이전트 벤치마크 중 5개에서 두 배 이상 큰 Qwen3.5-9B 기초 모델을 능가했다. 복잡한 연구 과제 평가 DRACO 에서는 경쟁사 대비 1/3 비용으로 더 나은 성과를 냈다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e실용 가치: 초대형 모델 의존을 줄여 API 비용과 응답 속도를 개선하고, 실행 경험 재투자로 재귀적 자기 개선(RSI) 의 단일 루프를 엔지니어링 검증했으며, 금융 · 제조 · 법률 · R\u0026amp;D 에서 '디지털 인턴' 역할이 가능하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e한계: 현재 RSI 는 단일 루프 검증 단계이며 반복해도 지속적 성능 향상이 보장되는지는 추가 연구가 필요하다. 빅테크가 자체 라우팅 · 에이전트 기술을 고도화하면 중립적 중개자의 생존 공간이 도전받는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e미중 분기: 오픈AI 아스트라는 하나의 거대한 두뇌가 추론하며 하위 에이전트를 동적 생성하는 멀티 에이전트 아키텍처로 에이전트 기능을 모델에 내장하는 수직적 접근이고, 중국은 딥시크 · 큐웬 · 키미 · GLM · Hy 등 오픈소스 모델의 라우팅과 실행 궤적 환류라는 수평적 진화 전략을 택했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e참고 링크로 토큰리듬 홈페이지(tokenrhythm.studio), NeoHorse GitHub, Hugging Face 컬렉션이 제시됐다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-native-model\" class=\"wl\"\u003eagent-native-model\u003c/a\u003e — 에이전트 실행 궤적을 학습 말뭉치로 삼은 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e — 실행 중 모델을 선택 · 전환 · 협업시키는 인프라 계층\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — 후훈련 기법으로 등장\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e · \u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-tokenrhythm\" class=\"wl\"\u003eorg-tokenrhythm\u003c/a\u003e · \u003ca href=\"#/product-neohorse\" class=\"wl\"\u003eproduct-neohorse\u003c/a\u003e · \u003ca href=\"#/person-wang-yunhe\" class=\"wl\"\u003eperson-wang-yunhe\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-stripe\" class=\"wl\"\u003eorg-stripe\u003c/a\u003e · \u003ca href=\"#/product-openrouter\" class=\"wl\"\u003eproduct-openrouter\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e · \u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리가 에이전트를 운영하며 남기는 실행 기록(도구 선택 · 실패 · 복구) 은 그 자체로 학습 자산이 될 수 있다. 지금부터 궤적을 검증 가능한 형태로 남겨 두면 나중에 쓸 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e라우팅 하네스는 우리가 이미 다루고 있는 \"실행 환경이 경쟁력\" 논지의 모델 계층 버전이다. 하네스가 궤적을 만들고 그 궤적이 모델을 키우는 구조라면, 하네스를 가진 쪽이 데이터 우위를 갖는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e4B 모델이 9B 를 일부 능가했다는 결과는 Shopify · StartLux 사례와 같은 방향이며, 우리 도메인에서도 소형 모델 + 경험 학습 경로가 현실적임을 보탠다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e더 이상 ‘어느 단일 모델이 가장 뛰어난가’가 아니라, ‘수많은 모델을 어떻게 효과적으로 조직하고 활용할 것인가’가 핵심 경쟁력으로 부상하고 있는 것입니다.\u003c/p\u003e\n\u003cp\u003e이 궤적에는 단순한 질문과 답변이 아닌 에이전트가 작업을 완수하기까지의 전 과정이 고스란히 담겨 있습니다.\u003c/p\u003e\n\u003cp\u003e네오호스는 에이전트가 실제 세계에서 부딪히는 수많은 시행착오를 ‘언어’ 삼아 학습한 최초의 모델인 셈입니다.\u003c/p\u003e\n\u003cp\u003e즉 미국이 '하나의 AGI'를 향해 수직적으로 나아간다면 중국은 '생태계 전체의 경험을 축적하고 공유하는' 수평적 진화 전략을 취하고 있는 셈입니다.\u003c/p\u003e\n\u003cp\u003e미래의 AI 모델은 단순히 ‘똑똑한’ 존재가 아닌, ‘경험을 통해 진화하는’ 존재가 될 것입니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-003-shopify-small-model-beats-sol","agent-native-model","beyond-parameter-scaling","model-routing-token-economics","on-policy-distillation","org-deepseek","org-stripe","org-tokenrhythm","person-wang-yunhe","post-training-agent-capability","product-gpt-6-astra","product-neohorse","product-openrouter","product-qwen","routing-harness"],"relpath":"wiki/sources/S-2026-09-09-008-neohorse-agent-native-model.md","sources":["S-2026-09-09-008"],"src":{"author":"임선영 — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-008.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-008","url":""},"status":"draft","stem":"S-2026-09-09-008-neohorse-agent-native-model","summary":"토큰리듬의 NeoHorse-1 은 라우팅 하네스가 만든 에이전트 실행 궤적을 학습한 최초의 에이전트 네이티브 모델. 4B 가 9B 기초 모델을 일부 능가하고 RSI 단일 루프를 검증했다는 분석","system":false,"text":"한 줄 요약\n모델 경쟁의 축이 \"어느 단일 모델이 가장 뛰어난가\" 에서 \"수많은 모델을 어떻게 조직하고 활용하는가\" 로 옮겨가는 가운데, 중국 토큰리듬이 자사 라우팅 하네스가 실제로 생성한 에이전트 실행 궤적을 학습 말뭉치로 삼은 '에이전트 네이티브' 모델 NeoHorse-1 을 공개했다. 4B 모델이 두 배 이상 큰 기초 모델을 일부 벤치마크에서 능가했고, 실행 경험이 다시 훈련으로 환류되는 선순환(RSI 단일 루프) 을 검증했다.\n관심 포인트\n(추정) 우리가 운영하는 에이전트의 실행 기록이 그 자체로 학습 자산이 될 수 있다는 구조 — 로그를 무엇으로 남길 것인가\n(추정) 라우팅 하네스라는 인프라 계층이 모델보다 먼저 자리를 잡는다는 관점 — 우리 포지션과 직결\n(추정) 미국(단일 거대 모델 내장 에이전트) 대 중국(모델 라우팅 + 경험 환류) 의 갈라짐\n핵심 주장\n1. 2026년 8월 스트라이프가 AI 모델 라우팅 플랫폼 오픈라우터를 약 75억 달러에 인수했다. 석 달 전 13억 달러 평가였다. 경쟁 축이 단일 모델 우수성에서 다수 모델의 조직 · 활용으로 옮겨갔음을 보여준다 {stated}\n2. 토큰리듬은 전 화웨이 노아방주 연구소장이자 판구 대형모델 총책임자였던 왕윈허가 창업했고, 출범 4개월 만에 엔젤 단계에서 1억 달러 기업가치를 인정받았다. 누적 사용자 5만 4천 명, 일일 토큰 호출량 5,000억을 돌파했다 {stated}\n3. 핵심 전략은 '라우팅 하네스': 단순 게이트웨이가 아니라 에이전트 작업 과정에 실시간 개입해 작업 유형 · 실행 단계 · 비용 예산 · 실시간 상태에 따라 모델을 동적으로 선택 · 전환 · 협업시키는 인프라 계층이다 {stated}\n4. NeoHorse-1 의 훈련 말뭉치는 인터넷 텍스트가 아니라 라우팅 하네스가 생성한 '에이전트 실행 궤적' 이다. 라우터의 판단, 모델 선택, 도구 호출, 환경 피드백, 오류 시 경로 수정까지 행동 · 실패 · 복구의 전 과정이 담긴다 {stated}\n5. 예시로 기초 모델은 이메일의 최신 제약을 읽지 못해 만료된 정보로 일정을 짜고 파일을 잘못된 위치에 저장한 반면, 네오호스는 이메일까지 읽고 제약을 반영해 재계산한 뒤 검증하고 올바른 위치에 저장했다. '정답' 이 아니라 '문제 해결의 절차' 를 학습했기 때문이라는 설명이다 {stated}\n6. 선순환 구조: 하네스가 궤적 생성 → 구조적 검증과 6개 차원(목표 달성 · 증거 일관성 · 오류 복구 등) 품질 평가로 선별 → '라우팅 유도 커리큘럼 학습' 과 '온폴리시 증류' 로 주입 → 갱신된 모델이 다시 하네스의 선택지가 됨 {stated}\n7. 성과: NeoHorse-1-4B 는 Qwen3.5-4B 기반 후훈련으로 10개 종합 벤치마크 매크로 평균이 58.94 → 64.87 로 5.93점 올랐고, 11개 에이전트 벤치마크 중 5개에서 두 배 이상 큰 Qwen3.5-9B 기초 모델을 능가했다. 복잡한 연구 과제 평가 DRACO 에서는 경쟁사 대비 1/3 비용으로 더 나은 성과를 냈다 {stated}\n8. 실용 가치: 초대형 모델 의존을 줄여 API 비용과 응답 속도를 개선하고, 실행 경험 재투자로 재귀적 자기 개선(RSI) 의 단일 루프를 엔지니어링 검증했으며, 금융 · 제조 · 법률 · R\u0026D 에서 '디지털 인턴' 역할이 가능하다 {stated}\n9. 한계: 현재 RSI 는 단일 루프 검증 단계이며 반복해도 지속적 성능 향상이 보장되는지는 추가 연구가 필요하다. 빅테크가 자체 라우팅 · 에이전트 기술을 고도화하면 중립적 중개자의 생존 공간이 도전받는다 {stated}\n10. 미중 분기: 오픈AI 아스트라는 하나의 거대한 두뇌가 추론하며 하위 에이전트를 동적 생성하는 멀티 에이전트 아키텍처로 에이전트 기능을 모델에 내장하는 수직적 접근이고, 중국은 딥시크 · 큐웬 · 키미 · GLM · Hy 등 오픈소스 모델의 라우팅과 실행 궤적 환류라는 수평적 진화 전략을 택했다 {stated}\n11. 참고 링크로 토큰리듬 홈페이지(tokenrhythm.studio), NeoHorse GitHub, Hugging Face 컬렉션이 제시됐다 {stated}\n등장 개념 · 엔티티\nbeyond-parameter-scaling — 상위 주제\nagent-native-model — 에이전트 실행 궤적을 학습 말뭉치로 삼은 모델\nrouting-harness — 실행 중 모델을 선택 · 전환 · 협업시키는 인프라 계층\non-policy-distillation — 후훈련 기법으로 등장\npost-training-agent-capability · model-routing-token-economics\norg-tokenrhythm · product-neohorse · person-wang-yunhe\norg-stripe · product-openrouter · product-qwen · org-deepseek · product-gpt-6-astra\n우리에게 주는 함의\n우리가 에이전트를 운영하며 남기는 실행 기록(도구 선택 · 실패 · 복구) 은 그 자체로 학습 자산이 될 수 있다. 지금부터 궤적을 검증 가능한 형태로 남겨 두면 나중에 쓸 수 있다 [S-2026-09-09-008]\n라우팅 하네스는 우리가 이미 다루고 있는 \"실행 환경이 경쟁력\" 논지의 모델 계층 버전이다. 하네스가 궤적을 만들고 그 궤적이 모델을 키우는 구조라면, 하네스를 가진 쪽이 데이터 우위를 갖는다 [S-2026-09-09-008] [S-2026-09-09-002]\n4B 모델이 9B 를 일부 능가했다는 결과는 Shopify · StartLux 사례와 같은 방향이며, 우리 도메인에서도 소형 모델 + 경험 학습 경로가 현실적임을 보탠다 [S-2026-09-09-008] [S-2026-09-09-003]\n주요 인용\n더 이상 ‘어느 단일 모델이 가장 뛰어난가’가 아니라, ‘수많은 모델을 어떻게 효과적으로 조직하고 활용할 것인가’가 핵심 경쟁력으로 부상하고 있는 것입니다.\n이 궤적에는 단순한 질문과 답변이 아닌 에이전트가 작업을 완수하기까지의 전 과정이 고스란히 담겨 있습니다.\n네오호스는 에이전트가 실제 세계에서 부딪히는 수많은 시행착오를 ‘언어’ 삼아 학습한 최초의 모델인 셈입니다.\n즉 미국이 '하나의 AGI'를 향해 수직적으로 나아간다면 중국은 '생태계 전체의 경험을 축적하고 공유하는' 수평적 진화 전략을 취하고 있는 셈입니다.\n미래의 AI 모델은 단순히 ‘똑똑한’ 존재가 아닌, ‘경험을 통해 진화하는’ 존재가 될 것입니다.","title":"임선영 — '에이전트의 경험'을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련","topics":["beyond-parameter-scaling"],"type":"source","updated":"2026-09-09"},{"aliases":["루프 트랜스포머","아스트라 이후","LooP"],"back":["S-2026-09-15-004-astra-verified-and-hardware-shift","beyond-parameter-scaling","local-model-24gb-boundary","loop-transformer-latent-reasoning","org-deepseek","product-gpt-6-astra"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eGPT-6 Astra 의 벤치마크가 \"같은 레이어를 여러 번 돌리는\" 오래된 아이디어로 만들어졌다는 보도를 출발점으로, 넓게(MoE) · 깊게 · 오래 생각하게(사고사슬) 라는 세 축 옆에 잠재 공간에서 반복 연산하는 네 번째 축이 자리 잡았고, 그것이 1년 반 만에 프론티어 모델에 들어간 것이 이번 발표의 의미라고 정리한 글.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 최상위 모델의 성능이 파라미터가 아니라 추론 시 연산량에서 나온다면 하드웨어 · 비용 구조가 달라진다는 점\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 작은 모델을 여러 번 돌려 큰 모델 성능을 내는 경로 — 우리 로컬 배포 전략과 직결\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 국내 사례(업스테이지 DUS) 를 포함한 계보 정리\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e한국 시간 9월 4일 새벽 OpenAI 가 GPT-6 Astra 를 발표했고, 그렉 브록먼은 기자들에게 \"AGI 시대에 온 것을 환영한다\" 고 말했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e트랜스포머 이후 성능을 올리는 방법은 넓게 만들기(우회로가 MoE) 와 깊게 만들기 두 가지였고, 세 번째가 \"오래 생각하게 만들기\" 다. 뿌리는 2020년 GPT-3 논문의 인컨텍스트 러닝이며, 사고사슬은 2022년 1월 Google Brain 이 프롬프팅 기법으로 보고했고 OpenAI 가 강화학습으로 내재화한 결과가 2024년 9월 o1-preview 다. 2025년 1월 딥시크 R1 이 레시피를 공개한 뒤 \"생각 블록/답변 블록\" 분리가 1년 반의 주류였다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사고사슬과 병렬로, 사람 말에 해당하지 않는 토큰 영역을 따로 만들어 거기서 계산을 돌리는 흐름이 있었다. Pause tokens(2023), Quiet-STaR(2024), Meta 의 Coconut(2024-12) 이 이 계열이며 Coconut 은 마지막 히든 스테이트를 토큰으로 바꾸지 않고 그대로 다음 입력으로 되먹인다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e중간 레이어를 여러 번 도는 연구는 오래됐다. 2018년 Universal Transformer 가 시작이고 ALBERT, RYS, 2025년 Recurrent Depth, Mixture of Recursions, 바이트댄스 LoopLM(1.4B 를 반복해 12B 급 성능 주장) 이 그 계열이다. 다만 성능이 고만고만해 \"잘 안 된다\" 고 여겨졌다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e안 되는 이유: 일반 네트워크는 앞쪽이 피처 추출, 뒤쪽이 판단으로 역할이 분화되는데, 같은 블록을 여러 번 돌리면 한 레이어가 첫 바퀴의 피처 추출과 세 번째 바퀴의 컨텍스트 판단을 겹쳐 맡게 된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e우회로들: 업스테이지 DUS 는 32층 Mistral 7B 를 복제해 24+24=48층으로 이어 붙여 레이어를 재사용했고 KT 믿음 2.0 등이 채택했다. David Ng 의 RYS 는 Qwen2-72B 의 45~51층 7개만 한 번 더 통과시켜 가중치를 바꾸지 않고 HuggingFace Open LLM 리더보드 1위를 기록했으며, 2026년 3월 재현 연구는 Qwen2.5-32B 7~9층, Devstral-24B 12~14층 복제로 추론 벤치가 크게 오른다고 보고했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e2025년 2월 Geiping et al. 의 Huginn 은 역할 중복을 구조로 풀었다. prelude(입력 → 잠재) · recurrent core(잠재 반복 정제) · coda(잠재 → 토큰 확률) 로 나누고 가운데 core 만 r 번 돌린다. 학습 시 r 을 확률적으로 샘플링하고 추론 시 잠재 상태의 KL 수렴으로 조기 종료할 수 있으며, 3.5B 를 32번 돌려 약 50B 급 성능을 보고했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이것은 파라미터를 고정한 채 연산 시간만 늘려 성능을 올리는 test-time scaling 이다. 사고사슬은 밖으로 토큰을 쓰며 생각하고, 이쪽은 안에서 잠재 상태를 돌리며 생각한다. 이 설계가 1년 반 만에 프론티어 모델에 들어갔다는 것이 Astra 발표의 의미라고 본다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eFable 과 Astra 모두 10T 모델에 전문가 1T 파라미터라는 이야기가 나오는 중이라 깊게 만들기도 계속되고 있다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e재현은 별개 문제라는 단서를 여러 번 단다(Huginn 재현, RYS 의 작동 이유에 대한 \"RLHF 로 망가진 부분을 우회하는 효과일 뿐\" 이라는 반론) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 같은 층 반복과 잠재 공간 추론\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e — 이 논의의 출발점\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e · \u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e성능이 파라미터가 아니라 추론 시 연산에서 나온다면, 우리가 고를 수 있는 것은 \"더 큰 모델\" 이 아니라 \"더 오래 돌릴 예산\" 이다. 비용 모델과 지연 시간 설계가 곧 성능 설계가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e작은 모델을 반복해 큰 모델 성능을 내는 경로가 실증되면 24GB 로컬 배포 전략의 상한이 올라간다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e다만 이 글의 핵심 근거(Huginn, RYS) 는 모두 재현 문제를 안고 있다. 도입 판단 전에 우리 과제로 재현 실험이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e같은 레이어를 여러 번 돌리는 것. 오랫동안 \"잘 안 된다\"고 여겨졌던 아이디어가 프론티어 모델에 들어갔다.\u003c/p\u003e\n\u003cp\u003e그런데 같은 블록을 여러 번 돌리면 첫 바퀴에서는 피처를 추출해야 하고 세 번째 바퀴에서는 컨텍스트 판단을 해야 하니, 한 레이어가 여러 역할을 겹쳐서 맡게 된다.\u003c/p\u003e\n\u003cp\u003e3.5B 모델을 32번 돌리면 약 50B 모델에 해당하는 성능이 나온다고 보고했다. (물론 재현은... 또 다른 이야기다.)\u003c/p\u003e\n\u003cp\u003e사고사슬은 밖으로 토큰을 써 가며 생각하고, 이쪽은 안에서 잠재 상태를 돌리며 생각한다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","beyond-parameter-scaling","loop-transformer-latent-reasoning","org-deepseek","org-openai","product-gpt-6-astra","product-qwen"],"relpath":"wiki/sources/S-2026-09-09-009-loop-transformer-after-astra.md","sources":["S-2026-09-09-009"],"src":{"author":"신정규 (래블업) — 페이스북 발췌","file":"raw/2026/09/S-2026-09-09-009.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-009","url":""},"status":"draft","stem":"S-2026-09-09-009-loop-transformer-after-astra","summary":"같은 층을 반복하는 재귀 구조가 프론티어 모델에 들어갔다는 관점에서 Universal Transformer · RYS · Huginn 계보와 잠재 공간 추론의 의미를 정리한 글","system":false,"text":"한 줄 요약\nGPT-6 Astra 의 벤치마크가 \"같은 레이어를 여러 번 돌리는\" 오래된 아이디어로 만들어졌다는 보도를 출발점으로, 넓게(MoE) · 깊게 · 오래 생각하게(사고사슬) 라는 세 축 옆에 잠재 공간에서 반복 연산하는 네 번째 축이 자리 잡았고, 그것이 1년 반 만에 프론티어 모델에 들어간 것이 이번 발표의 의미라고 정리한 글.\n관심 포인트\n(추정) 최상위 모델의 성능이 파라미터가 아니라 추론 시 연산량에서 나온다면 하드웨어 · 비용 구조가 달라진다는 점\n(추정) 작은 모델을 여러 번 돌려 큰 모델 성능을 내는 경로 — 우리 로컬 배포 전략과 직결\n(추정) 국내 사례(업스테이지 DUS) 를 포함한 계보 정리\n핵심 주장\n1. 한국 시간 9월 4일 새벽 OpenAI 가 GPT-6 Astra 를 발표했고, 그렉 브록먼은 기자들에게 \"AGI 시대에 온 것을 환영한다\" 고 말했다 {stated}\n2. 트랜스포머 이후 성능을 올리는 방법은 넓게 만들기(우회로가 MoE) 와 깊게 만들기 두 가지였고, 세 번째가 \"오래 생각하게 만들기\" 다. 뿌리는 2020년 GPT-3 논문의 인컨텍스트 러닝이며, 사고사슬은 2022년 1월 Google Brain 이 프롬프팅 기법으로 보고했고 OpenAI 가 강화학습으로 내재화한 결과가 2024년 9월 o1-preview 다. 2025년 1월 딥시크 R1 이 레시피를 공개한 뒤 \"생각 블록/답변 블록\" 분리가 1년 반의 주류였다 {stated}\n3. 사고사슬과 병렬로, 사람 말에 해당하지 않는 토큰 영역을 따로 만들어 거기서 계산을 돌리는 흐름이 있었다. Pause tokens(2023), Quiet-STaR(2024), Meta 의 Coconut(2024-12) 이 이 계열이며 Coconut 은 마지막 히든 스테이트를 토큰으로 바꾸지 않고 그대로 다음 입력으로 되먹인다 {stated}\n4. 중간 레이어를 여러 번 도는 연구는 오래됐다. 2018년 Universal Transformer 가 시작이고 ALBERT, RYS, 2025년 Recurrent Depth, Mixture of Recursions, 바이트댄스 LoopLM(1.4B 를 반복해 12B 급 성능 주장) 이 그 계열이다. 다만 성능이 고만고만해 \"잘 안 된다\" 고 여겨졌다 {stated}\n5. 안 되는 이유: 일반 네트워크는 앞쪽이 피처 추출, 뒤쪽이 판단으로 역할이 분화되는데, 같은 블록을 여러 번 돌리면 한 레이어가 첫 바퀴의 피처 추출과 세 번째 바퀴의 컨텍스트 판단을 겹쳐 맡게 된다 {stated}\n6. 우회로들: 업스테이지 DUS 는 32층 Mistral 7B 를 복제해 24+24=48층으로 이어 붙여 레이어를 재사용했고 KT 믿음 2.0 등이 채택했다. David Ng 의 RYS 는 Qwen2-72B 의 45~51층 7개만 한 번 더 통과시켜 가중치를 바꾸지 않고 HuggingFace Open LLM 리더보드 1위를 기록했으며, 2026년 3월 재현 연구는 Qwen2.5-32B 7~9층, Devstral-24B 12~14층 복제로 추론 벤치가 크게 오른다고 보고했다 {stated}\n7. 2025년 2월 Geiping et al. 의 Huginn 은 역할 중복을 구조로 풀었다. prelude(입력 → 잠재) · recurrent core(잠재 반복 정제) · coda(잠재 → 토큰 확률) 로 나누고 가운데 core 만 r 번 돌린다. 학습 시 r 을 확률적으로 샘플링하고 추론 시 잠재 상태의 KL 수렴으로 조기 종료할 수 있으며, 3.5B 를 32번 돌려 약 50B 급 성능을 보고했다 {stated}\n8. 이것은 파라미터를 고정한 채 연산 시간만 늘려 성능을 올리는 test-time scaling 이다. 사고사슬은 밖으로 토큰을 쓰며 생각하고, 이쪽은 안에서 잠재 상태를 돌리며 생각한다. 이 설계가 1년 반 만에 프론티어 모델에 들어갔다는 것이 Astra 발표의 의미라고 본다 {stated}\n9. Fable 과 Astra 모두 10T 모델에 전문가 1T 파라미터라는 이야기가 나오는 중이라 깊게 만들기도 계속되고 있다 {low}\n10. 재현은 별개 문제라는 단서를 여러 번 단다(Huginn 재현, RYS 의 작동 이유에 대한 \"RLHF 로 망가진 부분을 우회하는 효과일 뿐\" 이라는 반론) {stated}\n등장 개념 · 엔티티\nbeyond-parameter-scaling — 상위 주제\nloop-transformer-latent-reasoning — 같은 층 반복과 잠재 공간 추론\nproduct-gpt-6-astra — 이 논의의 출발점\nproduct-qwen · org-deepseek · org-openai\n우리에게 주는 함의\n성능이 파라미터가 아니라 추론 시 연산에서 나온다면, 우리가 고를 수 있는 것은 \"더 큰 모델\" 이 아니라 \"더 오래 돌릴 예산\" 이다. 비용 모델과 지연 시간 설계가 곧 성능 설계가 된다 [S-2026-09-09-009]\n작은 모델을 반복해 큰 모델 성능을 내는 경로가 실증되면 24GB 로컬 배포 전략의 상한이 올라간다 [S-2026-09-09-009] [S-2026-09-08-006]\n다만 이 글의 핵심 근거(Huginn, RYS) 는 모두 재현 문제를 안고 있다. 도입 판단 전에 우리 과제로 재현 실험이 필요하다 [S-2026-09-09-009]\n주요 인용\n같은 레이어를 여러 번 돌리는 것. 오랫동안 \"잘 안 된다\"고 여겨졌던 아이디어가 프론티어 모델에 들어갔다.\n그런데 같은 블록을 여러 번 돌리면 첫 바퀴에서는 피처를 추출해야 하고 세 번째 바퀴에서는 컨텍스트 판단을 해야 하니, 한 레이어가 여러 역할을 겹쳐서 맡게 된다.\n3.5B 모델을 32번 돌리면 약 50B 모델에 해당하는 성능이 나온다고 보고했다. (물론 재현은... 또 다른 이야기다.)\n사고사슬은 밖으로 토큰을 써 가며 생각하고, 이쪽은 안에서 잠재 상태를 돌리며 생각한다.","title":"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들","topics":["beyond-parameter-scaling"],"type":"source","updated":"2026-09-09"},{"aliases":["코그니션 인터뷰 후기","손재권 AX"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ax-organizational-redesign","forward-deployed-engineer","org-cognition","person-jeff-wang","proactive-agent","product-devin","task-definition-bottleneck"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e이미 위키에 있는 더밀크 코그니션 인터뷰 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e 를 진행한 기자 본인의 후기. 기사에 없던 창업 시점 · 매출 수치를 더하고, \"AI 도입\" 과 \"AI 가 일하도록 회사를 다시 설계하는 것\" 은 다른 문제이며 한국 AX 가 막힌 이유는 기술이 아니라 조직에 있다고 정리한다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 같은 인터뷰를 기자 시각으로 다시 정리한 글 — 기사에 없던 수치와 한국 시장 진단\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"업의 정의부터 시작하지 않는 AI 도입은 회사를 망하게 한다\" 는 경고\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e FDE 의 정의를 다시 못박은 부분 — 국내에서 오해되고 있다는 지적\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e코그니션은 2023년 창업해 3년밖에 되지 않았고, 지난 5월 260억 달러 기업가치로 10억 달러 이상을 조달했으며 지금은 400억 달러 이상으로 신규 라운드를 논의 중이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e코그니션의 질문은 \"AI 가 코드를 얼마나 잘 쓰는가\" 가 아니라 \"AI 에게 얼마나 많은 일을 통째로 맡길 수 있는가\" 였고, 그 질문을 끝까지 밀어붙여 지금의 기업가치를 만들었다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e코딩 자동화는 코파일럿 → 에이전트 → 클라우드 에이전트로 이동 중이며, 다음은 사람이 시키기 전에 버그 · 보안 문제를 발견해 움직이는 능동형 에이전트다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e에이전트가 능동적으로 움직일수록 기술보다 조직이 만들어 놓은 업무 흐름과 '일의 정의' 가 중요해진다. 그 흐름이 뒤죽박죽이면 아무리 좋은 AI 도 실제 일에 도움이 되지 않는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\"회사를 망하게 하는 법\" 은 하던 일과 조직을 그대로 둔 채 AI FOMO 로 도입하게 하는 것이다. 토큰 비용이 급증하고 누구도 판단하지 못하며 지연과 불신이 생긴다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAX 의 기본은 '업의 정의' 부터 시작하는 것인데 그렇게 하는 회사는 많지 않아 보인다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e코그니션이 높은 평가를 받는 이유는 모델을 만드는 경쟁이 아니라 기업이 실제 일을 AI 에게 넘길 수 있게 만드는 층에 서 있기 때문이다. 미국 대기업은 시스템 전환 · 코드 현대화 · 보안처럼 '하기 싫지만 반드시 해야 하는 일' 부터 넘기고 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e5월 기준 연환산 매출은 4억 9,200만 달러까지 올라왔다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eFDE 는 문제를 해결해주는 사람이지 AI 툴로 대신 일해주는 사람이 아니며, 고객의 문제를 AI 가 해결할 수 있는 형태로 바꾸는 사람이지 사내 프로세스에 AI 를 적용하는 사람이 아니다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e한국은 아직 \"어떤 모델을 쓸 것인가\", \"사내 챗봇을 어떻게 만들 것인가\" 에 논의가 머물러 있는 반면, 미국 선두 기업은 어떤 업무를 없애고 쪼개고 다시 설계해 에이전트에게 넘길지를 고민한다. 한미 차이는 기술보다 조직에 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ax-organizational-redesign\" class=\"wl\"\u003eax-organizational-redesign\u003c/a\u003e — AX 는 도입이 아니라 회사 재설계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e · \u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e · \u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e · \u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e · \u003ca href=\"#/person-jeff-wang\" class=\"wl\"\u003eperson-jeff-wang\u003c/a\u003e · \u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e — 같은 인터뷰의 기사 본문\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e고객 제안의 첫 단계를 모델 선택이 아니라 '업의 정의' 로 잡는 근거가 하나 더 늘었다. 이 후기는 그 순서를 지키지 않은 도입이 어떻게 실패하는지를 구체적으로 적는다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e국내에서 FDE 가 \"AI 로 대신 일해주는 사람\" 으로 오해되고 있다는 지적은 우리가 그 역할을 정의할 때 참고할 만하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e매출 수치가 시점별로 다르다. 5월 연환산 4.92억 달러 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e 와 8월 기준 8억 달러 초과 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e 는 성장 곡선으로 읽어야 하며 어느 하나를 현재값으로 인용하면 안 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e그들은 “AI에게 얼마나 많은 일을 통째로 맡길 수 있는가?”란 질문을 끝까지 밀어붙여 63조원의 기업 가치를 만들어냈다.\u003c/p\u003e\n\u003cp\u003e회사를 망하게 하는 법이 있다. 하던 일과 조직을 그대로 두고 AI 포모(FOMO)를 일으켜 회사에 AI를 도입하게 하는 것이다.\u003c/p\u003e\n\u003cp\u003eFDE는 문제를 해결해주는 사람들이지, AI 툴을 써서 대신 일을 해주는 사람들이 아니다.\u003c/p\u003e\n\u003cp\u003eAI를 도입하는 것과 AI가 일하도록 회사를 다시 설계하는 것은 전혀 다른 문제다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ax-organizational-redesign","forward-deployed-engineer","org-cognition","person-jeff-wang","proactive-agent","product-devin","task-definition-bottleneck"],"relpath":"wiki/sources/S-2026-09-09-010-cognition-interview-ax-view.md","sources":["S-2026-09-09-010"],"src":{"author":"손재권 (더밀크) — SNS 후기","file":"raw/2026/09/S-2026-09-09-010.txt","origin":"text","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-010","url":""},"status":"draft","stem":"S-2026-09-09-010-cognition-interview-ax-view","summary":"같은 인터뷰의 기자 후기. 창업 3년 · 매출 · 기업가치 수치와 함께, AX 의 출발은 업의 정의이고 한미 격차는 기술보다 조직에 있다는 관점","system":false,"text":"한 줄 요약\n이미 위키에 있는 더밀크 코그니션 인터뷰 [S-2026-09-08-002] 를 진행한 기자 본인의 후기. 기사에 없던 창업 시점 · 매출 수치를 더하고, \"AI 도입\" 과 \"AI 가 일하도록 회사를 다시 설계하는 것\" 은 다른 문제이며 한국 AX 가 막힌 이유는 기술이 아니라 조직에 있다고 정리한다.\n관심 포인트\n(추정) 같은 인터뷰를 기자 시각으로 다시 정리한 글 — 기사에 없던 수치와 한국 시장 진단\n(추정) \"업의 정의부터 시작하지 않는 AI 도입은 회사를 망하게 한다\" 는 경고\n(추정) FDE 의 정의를 다시 못박은 부분 — 국내에서 오해되고 있다는 지적\n핵심 주장\n1. 코그니션은 2023년 창업해 3년밖에 되지 않았고, 지난 5월 260억 달러 기업가치로 10억 달러 이상을 조달했으며 지금은 400억 달러 이상으로 신규 라운드를 논의 중이다 {stated}\n2. 코그니션의 질문은 \"AI 가 코드를 얼마나 잘 쓰는가\" 가 아니라 \"AI 에게 얼마나 많은 일을 통째로 맡길 수 있는가\" 였고, 그 질문을 끝까지 밀어붙여 지금의 기업가치를 만들었다 {stated}\n3. 코딩 자동화는 코파일럿 → 에이전트 → 클라우드 에이전트로 이동 중이며, 다음은 사람이 시키기 전에 버그 · 보안 문제를 발견해 움직이는 능동형 에이전트다 {stated}\n4. 에이전트가 능동적으로 움직일수록 기술보다 조직이 만들어 놓은 업무 흐름과 '일의 정의' 가 중요해진다. 그 흐름이 뒤죽박죽이면 아무리 좋은 AI 도 실제 일에 도움이 되지 않는다 {stated}\n5. \"회사를 망하게 하는 법\" 은 하던 일과 조직을 그대로 둔 채 AI FOMO 로 도입하게 하는 것이다. 토큰 비용이 급증하고 누구도 판단하지 못하며 지연과 불신이 생긴다 {stated}\n6. AX 의 기본은 '업의 정의' 부터 시작하는 것인데 그렇게 하는 회사는 많지 않아 보인다 {stated}\n7. 코그니션이 높은 평가를 받는 이유는 모델을 만드는 경쟁이 아니라 기업이 실제 일을 AI 에게 넘길 수 있게 만드는 층에 서 있기 때문이다. 미국 대기업은 시스템 전환 · 코드 현대화 ·
