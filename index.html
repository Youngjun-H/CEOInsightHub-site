-adoption","beyond-parameter-scaling","cot-monitorability-erosion","loop-transformer-latent-reasoning","org-openai","product-arc-agi-3","task-level-agent-evaluation"],"cites":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-002-astra-system-prompt-leak-claim","S-2026-09-15-004-astra-verified-and-hardware-shift"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eOpenAI 의 GPT-6 계열 최상위 모델. 복잡한 추론 · 코딩 · 컴퓨터 사용 · 조사 · 문서 제작을 처음 요청부터 최종 결과까지 이어서 처리하는 모델로 설명된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-03 공개. Trusted Access Program 참여 기업부터 배포, API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e비동기 도구 호출: 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행. 작업 ID · 타임아웃 · 재시도 · 중복 실행 방지는 개발자 구현 사항 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경(mid-turn steering): 진행 중 조건 추가 가능. 이미 실행된 행동은 되돌리지 못하고 시작된 도구 실행도 취소되지 않으므로 되돌리기 어려운 작업에는 실행 직전 승인이 필요 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e단계별 추론 강도 조절: 한 작업 안에서 단계마다 계산 자원 배분 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e가격: API 입력 100만 토큰당 10달러 · 출력 50달러 (GPT-5.6 Sol 은 4달러 · 20달러). ChatGPT Work · Codex 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise 2.08배 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e권장 용도: 다단계 · 외부 시스템 호출 · 진행 중 요구 변경 · 실패 시 사람 재투입 비용이 큰 업무. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ePreparedness Framework 에서 처음으로 Critical 수준 사이버보안 역량으로 분류. ExploitBench 100%, 미공개 취약점 발견. 일부 평가는 기본 환경보다 강한 도구 접근 권한 사용 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026-09-02 The Information 이 recurrent depth(looped transformer) 사용을 보도했다. OpenAI 는 아키텍처를 공식 확인하지 않았지만 연구자들이 \"루프 사용 범위를 제한했다\" 고 반박했다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e시스템 카드: 이전 모델보다 사고사슬 모니터링이 어려워졌고, 말로 쓰지 않고도 더 어려운 문제를 풀며, 회피 지시를 받으면 추론 흔적을 더 잘 통제한다. 모니터링 저하를 아키텍처 탓으로 귀속하지는 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e벤치마크: ARC-AGI-3 98.6%(OpenAI 발표) · 99.9%(어댑터 하네스), ExploitBench 100%, 대부분 97% 이상. 단 Terminal-Bench 4.0 과 FrontierCode 1.1 은 50~60% 로 Fable 5 수준이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성능 향상 요인으로 recurrent depth 와 함께 \"상당히 늘어난 사전학습 컴퓨트\"(GB200 10만 장) 를 언급한다. 루프는 스케일의 대체재가 아니라 보완재다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e평가 중 미공개 제로데이 두 개를 찾아냈다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e시스템 프롬프트라고 주장되는 331KB · 약 5,051줄 문서가 GitHub 에 올라왔다는 전언이 있으나 OpenAI 확인은 없다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-002-astra-system-prompt-leak-claim\" title=\"GPT-6 Astra 시스템 프롬프트가 공개됐다는 주장\"\u003eS-2026-09-15-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e발표 시점은 한국 시간 2026-09-04 새벽이며, 그렉 브록먼은 기자들에게 \"AGI 시대에 온 것을 환영한다\" 고 말했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e아키텍처 관점의 전언: 하나의 거대한 두뇌가 추론하며 필요에 따라 하위 에이전트를 동적으로 생성해 작업을 분배하는 멀티 에이전트 구조로, 에이전트 기능을 모델에 내장하는 접근이라는 해석이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e교육 커뮤니티 소개글은 웹 서핑 · 문서 · 코드 실행 · 소프트웨어 사용 · 프레젠테이션 제작을 묶은 \"가장 강력한 모델\" 로 전했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e내부 구조 설명이 갈렸다. 한쪽은 하나의 거대한 두뇌가 하위 에이전트를 동적 생성하는 멀티 에이전트 아키텍처라고 했고 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e, 다른 쪽은 반복 연산 보도를 근거로 들었다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" title=\"신정규 — 아스트라 이후: 루프 트랜스포머가 바꾸는 것들\"\u003eS-2026-09-09-009\u003c/a\u003e. 이후 보강된 근거는 반복 연산 쪽이다: The Information 보도, OpenAI 연구자의 \"루프 사용 범위 제한\" 반박, 시스템 카드의 모니터링 저하 기술 \u003ca class=\"cite\" href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" title=\"신정규 (2/3) — 아스트라에서 확인된 것: 사고사슬 모니터링 약화와 추론 하드웨어 이동\"\u003eS-2026-09-15-004\u003c/a\u003e. 다만 OpenAI 공식 확인은 여전히 없고, 두 설명이 서로 다른 층위(모델 내부 구조 vs 에이전트 오케스트레이션) 를 가리킬 가능성도 남아 있다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e.\u003c/li\u003e\n\u003cli\u003e모든 소스가 2차 전언이며 OpenAI 원문(https://openai.com/index/gpt-6-astra) 은 미확보.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e · \u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e · \u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/loop-transformer-latent-reasoning\" class=\"wl\"\u003eloop-transformer-latent-reasoning\u003c/a\u003e — 반복 연산 계보\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-009-loop-transformer-after-astra\" class=\"wl\"\u003eS-2026-09-09-009-loop-transformer-after-astra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-004-astra-verified-and-hardware-shift\" class=\"wl\"\u003eS-2026-09-15-004-astra-verified-and-hardware-shift\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-002-astra-system-prompt-leak-claim\" class=\"wl\"\u003eS-2026-09-15-002-astra-system-prompt-leak-claim\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cot-monitorability-erosion\" class=\"wl\"\u003ecot-monitorability-erosion\u003c/a\u003e · \u003ca href=\"#/product-arc-agi-3\" class=\"wl\"\u003eproduct-arc-agi-3\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-003-agents-push-humans-out-of-loop","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","S-2026-09-15-002-astra-system-prompt-leak-claim","S-2026-09-15-004-astra-verified-and-hardware-shift","agent-governance-guardrails","ai-agents-enterprise-adoption","cot-monitorability-erosion","loop-transformer-latent-reasoning","model-routing-token-economics","org-openai","product-arc-agi-3","task-level-agent-evaluation"],"relpath":"wiki/entities/product-gpt-6-astra.md","sources":["S-2026-09-09-004","S-2026-09-08-003","S-2026-09-09-008","S-2026-09-09-009","S-2026-09-15-004","S-2026-09-15-002"],"status":"draft","stem":"product-gpt-6-astra","summary":"OpenAI 의 2026-09-03 최상위 모델. 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도로 긴 업무 수행. 가격은 Sol 의 2.5배, Critical 사이버보안 등급","system":false,"text":"정의\nOpenAI 의 GPT-6 계열 최상위 모델. 복잡한 추론 · 코딩 · 컴퓨터 사용 · 조사 · 문서 제작을 처음 요청부터 최종 결과까지 이어서 처리하는 모델로 설명된다 [S-2026-09-09-004].\n근거 있는 사실\n2026-09-03 공개. Trusted Access Program 참여 기업부터 배포, API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정 [S-2026-09-09-004]\n비동기 도구 호출: 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행. 작업 ID · 타임아웃 · 재시도 · 중복 실행 방지는 개발자 구현 사항 [S-2026-09-09-004]\n실행 중 지시 변경(mid-turn steering): 진행 중 조건 추가 가능. 이미 실행된 행동은 되돌리지 못하고 시작된 도구 실행도 취소되지 않으므로 되돌리기 어려운 작업에는 실행 직전 승인이 필요 [S-2026-09-09-004]\n단계별 추론 강도 조절: 한 작업 안에서 단계마다 계산 자원 배분 [S-2026-09-09-004]\n가격: API 입력 100만 토큰당 10달러 · 출력 50달러 (GPT-5.6 Sol 은 4달러 · 20달러). ChatGPT Work · Codex 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise 2.08배 [S-2026-09-09-004]\n권장 용도: 다단계 · 외부 시스템 호출 · 진행 중 요구 변경 · 실패 시 사람 재투입 비용이 큰 업무. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol [S-2026-09-09-004]\nPreparedness Framework 에서 처음으로 Critical 수준 사이버보안 역량으로 분류. ExploitBench 100%, 미공개 취약점 발견. 일부 평가는 기본 환경보다 강한 도구 접근 권한 사용 [S-2026-09-09-004]\n2026-09-02 The Information 이 recurrent depth(looped transformer) 사용을 보도했다. OpenAI 는 아키텍처를 공식 확인하지 않았지만 연구자들이 \"루프 사용 범위를 제한했다\" 고 반박했다 [S-2026-09-15-004]\n시스템 카드: 이전 모델보다 사고사슬 모니터링이 어려워졌고, 말로 쓰지 않고도 더 어려운 문제를 풀며, 회피 지시를 받으면 추론 흔적을 더 잘 통제한다. 모니터링 저하를 아키텍처 탓으로 귀속하지는 않는다 [S-2026-09-15-004]\n벤치마크: ARC-AGI-3 98.6%(OpenAI 발표) · 99.9%(어댑터 하네스), ExploitBench 100%, 대부분 97% 이상. 단 Terminal-Bench 4.0 과 FrontierCode 1.1 은 50~60% 로 Fable 5 수준이다 [S-2026-09-15-004]\n성능 향상 요인으로 recurrent depth 와 함께 \"상당히 늘어난 사전학습 컴퓨트\"(GB200 10만 장) 를 언급한다. 루프는 스케일의 대체재가 아니라 보완재다 [S-2026-09-15-004]\n평가 중 미공개 제로데이 두 개를 찾아냈다 [S-2026-09-15-004]\n시스템 프롬프트라고 주장되는 331KB · 약 5,051줄 문서가 GitHub 에 올라왔다는 전언이 있으나 OpenAI 확인은 없다 {low} [S-2026-09-15-002]\n발표 시점은 한국 시간 2026-09-04 새벽이며, 그렉 브록먼은 기자들에게 \"AGI 시대에 온 것을 환영한다\" 고 말했다 [S-2026-09-09-009]\n아키텍처 관점의 전언: 하나의 거대한 두뇌가 추론하며 필요에 따라 하위 에이전트를 동적으로 생성해 작업을 분배하는 멀티 에이전트 구조로, 에이전트 기능을 모델에 내장하는 접근이라는 해석이 있다 [S-2026-09-09-008]\n교육 커뮤니티 소개글은 웹 서핑 · 문서 · 코드 실행 · 소프트웨어 사용 · 프레젠테이션 제작을 묶은 \"가장 강력한 모델\" 로 전했다 [S-2026-09-08-003]\n모순 · 논쟁\n내부 구조 설명이 갈렸다. 한쪽은 하나의 거대한 두뇌가 하위 에이전트를 동적 생성하는 멀티 에이전트 아키텍처라고 했고 [S-2026-09-09-008], 다른 쪽은 반복 연산 보도를 근거로 들었다 [S-2026-09-09-009]. 이후 보강된 근거는 반복 연산 쪽이다: The Information 보도, OpenAI 연구자의 \"루프 사용 범위 제한\" 반박, 시스템 카드의 모니터링 저하 기술 [S-2026-09-15-004]. 다만 OpenAI 공식 확인은 여전히 없고, 두 설명이 서로 다른 층위(모델 내부 구조 vs 에이전트 오케스트레이션) 를 가리킬 가능성도 남아 있다 {low}.\n모든 소스가 2차 전언이며 OpenAI 원문(https://openai.com/index/gpt-6-astra) 은 미확보.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\norg-openai\ntask-level-agent-evaluation · model-routing-token-economics · agent-governance-guardrails\nloop-transformer-latent-reasoning — 반복 연산 계보\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-08-003-agents-push-humans-out-of-loop\nS-2026-09-09-008-neohorse-agent-native-model\nS-2026-09-09-009-loop-transformer-after-astra\nS-2026-09-15-004-astra-verified-and-hardware-shift\nS-2026-09-15-002-astra-system-prompt-leak-claim\ncot-monitorability-erosion · product-arc-agi-3","title":"GPT-6 Astra","topics":["ai-agents-enterprise-adoption","beyond-parameter-scaling"],"type":"entity","updated":"2026-09-15"},{"aliases":["K2Horizon","K2 호라이즌"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","fully-open-source-model","open-local-models","org-mbzuai"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eMBZUAI IFM 이 공개한 파운데이션 모델 라인업. 가중치 · 코드 · 학습 데이터 · 레시피 · 중간 체크포인트를 모두 공개한 완전 오픈소스이며 Apache 2.0 으로 허깅페이스에 배포됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e0.9B: 스마트워치 · 스마트안경 등 극제약 온디바이스 대상. 동급 중 수학 · 도구 사용 최상위라고 발표 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e3.7B: 미세조정에 최적화, 4B 이하 중 최고 추론 성능이라고 발표 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e7B: 스마트폰에서 직접 구동하면서 소프트웨어 엔지니어링 역량 제공 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e32B Dense: 로컬 서버 · 온프레미스 · 고성능 노트북 대상 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e36B-A4B: 활성 파라미터 4B 의 저밀도 \"MoVA\" 아키텍처로 비용 대비 성능 극대화 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e375B-A23B: 플래그십. 복합 추론 · 에이전트 작업 특화, 기업용 워크로드 즉시 투입 가능하다고 발표 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e0.9B 를 제외한 5개 모델은 핵심 아키텍처 · 어휘 · 배포 도구를 공유한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성능 주장은 모두 발표 주체의 자체 평가이며 독립 벤치마크는 이 위키에 아직 없다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u0 "entity","updated":"2026-09-08"},{"aliases":["무즈 글리머","Meta Muse Glimmer"],"back":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","open-local-models","product-qwen"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eMeta 슈퍼인텔리전스랩의 로컬 지향 오픈 모델. Qwen3.8-27B 와 함께 27~30B 로컬 표준 형성의 사례로 인용된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-08-10 Qwen3.8-27B 와 같은 라이선스(Apache 2.0) 로 공개됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e300억 파라미터 Dense 구조에 1.8B 지각 인코더, 120K 토큰 이상 컨텍스트 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e4비트 동적 양자화로 17~20GB 까지 내려 24~32GB 메모리 안에 KV 캐시와 추측적 디코딩 여유분까지 확보했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","open-local-models","product-qwen"],"relpath":"wiki/entities/product-muse-glimmer.md","sources":["S-2026-09-08-006"],"status":"draft","stem":"product-muse-glimmer","summary":"Meta 슈퍼인텔리전스랩이 2026-08-10 공개한 30B Dense + 1.8B 지각 인코더 오픈 모델. 4비트 17~20GB 로 24~32GB 로컬 환경 대상","system":false,"text":"정의\nMeta 슈퍼인텔리전스랩의 로컬 지향 오픈 모델. Qwen3.8-27B 와 함께 27~30B 로컬 표준 형성의 사례로 인용된다 [S-2026-09-08-006].\n근거 있는 사실\n2026-08-10 Qwen3.8-27B 와 같은 라이선스(Apache 2.0) 로 공개됐다 [S-2026-09-08-006]\n300억 파라미터 Dense 구조에 1.8B 지각 인코더, 120K 토큰 이상 컨텍스트 [S-2026-09-08-006]\n4비트 동적 양자화로 17~20GB 까지 내려 24~32GB 메모리 안에 KV 캐시와 추측적 디코딩 여유분까지 확보했다 [S-2026-09-08-006]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nlocal-model-24gb-boundary\nproduct-qwen\nS-2026-09-08-006-local-agent-models-startlux","title":"Muse Glimmer (Meta)","topics":["open-local-models"],"type":"entity","updated":"2026-09-08"},{"aliases":["네오호스","NeoHorse-1","NeoHorse-1-4B"],"back":["S-2026-09-09-008-neohorse-agent-native-model","agent-native-model","beyond-parameter-scaling","org-tokenrhythm"],"cites":["S-2026-09-09-008-neohorse-agent-native-model"],"confidence":"medium","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e라우팅 하네스가 생성한 에이전트 실행 궤적을 훈련 말뭉치로 삼은, 업계 최초를 표방하는 에이전트 네이티브 모델 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eNeoHorse-1-4B 는 Qwen3.5-4B 를 기반으로 후훈련했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e10개 종합 벤치마크 매크로 평균이 58.94 에서 64.87 로 5.93점 올랐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e11개 에이전트 관련 벤치마크 중 5개에서 파라미터가 두 배 이상 큰 Qwen3.5-9B 기초 모델을 능가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e복잡한 연구 과제 평가 DRACO 에서 경쟁사 대비 1/3 비용으로 더 나은 성과를 냈다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e훈련 기법으로 '라우팅 유도 커리큘럼 학습' 과 '온폴리시 증류' 를 썼다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eGitHub 와 Hugging Face 에 공개됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e수치는 모두 회사 · 소개글 기준이며 독립 재현은 이 위키에 없다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u00 ki"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e로컬 마크다운 파일을 링크 · 그래프로 탐색하는 노트 앱. LLM Wiki 패턴에서는 \"Obsidian 은 IDE, LLM 은 프로그래머, 위키는 코드베이스\" 로 비유된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e그래프 뷰로 위키의 허브와 고아 페이지를 파악하는 데 가장 좋은 도구로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eWeb Clipper 확장으로 웹 기사를 마크다운으로 변환해 raw 에 넣을 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"Download attachments\" 핫키로 이미지를 로컬에 내려받으면 LLM 이 URL 대신 파일을 직접 볼 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDataview 플러그인은 frontmatter 를 질의해 동적 표를 만들고, Marp 플러그인은 위키 내용으로 슬라이드를 만든다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e\u003c/li\u003e\n el\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e이 인수는 경쟁 축이 단일 모델 우수성에서 다수 모델의 조직 · 활용으로 옮겨간 신호로 해석된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-stripe\" class=\"wl\"\u003eorg-stripe\u003c/a\u003e · \u003ca href=\"#/routing-harness\" class=\"wl\"\u003erouting-harness\u003c/a\u003e · \u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-008-neohorse-agent-native-model","beyond-parameter-scaling","model-routing-token-economics","org-stripe","routing-harness"],"relpath":"wiki/entities/product-openrouter.md","sources":["S-2026-09-09-008"],"status":"draft","stem":"product-openrouter","summary":"AI 모델 라우팅 플랫폼. 2026년 8월 스트라이프가 약 75억 달러에 인수, 석 달 만에 평가액이 13억에서 약 5.8배로","system":false,"text":"정의\n여러 AI 모델을 하나의 접점으로 묶어 호출을 라우팅하는 플랫폼 [S-2026-09-09-008].\n근거 있는 사실\n2026년 8월 스트라이프가 약 75억 달러에 인수했다 [S-2026-09-09-008]\n인수 석 달 전에는 13억 달러로 평가받았다 [S-2026-09-09-008]\n이 인수는 경쟁 축이 단일 모델 우수성에서 다수 모델의 조직 · 활용으로 옮겨간 신호로 해석된다 [S-2026-09-09-008]\n모순 · 논쟁\n(없음)\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\norg-stripe · routing-harness · model-routing-token-economics\nS-2026-09-09-008-neohorse-agent-native-model","title":"OpenRouter (오픈라우터)","topics":["beyond-parameter-scaling"],"type":"entity","updated":"2026-09-09"},{"aliases":["큐웬","Qwen3.8-27B","Qwen3.6-27B","Qwen3.5-0.8B","알리바바 Qwen"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model","S-2026-09-09-009-loop-transformer-after-astra","local-model-24gb-boundary","open-local-models","org-shopify","org-startlux","org-tencent","post-training-agent-capability","product-muse-glimmer","product-neohorse","skill-evolution-persistent-wiki","small-model-self-improvement-loop"],"cites":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","S-2026-09-09-008-neohorse-agent-native-model"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAlibaba 가 공개하는 오픈 LLM 계열. 이 위키에서는 로컬 모델 경계선의 사례이자 후훈련 base 로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eQwen3.8-27B: 2026-08-14 Apache 2.0 공개. 27B Dense, 이미지 입력 네이티브 멀티모달, 262K 토큰 컨텍스트. 4비트 양자화 시 약 17GB 로 24GB 소비자 GPU 에 올라가며 LM Studio · Ollama · Unsloth 원클릭 설치를 출시와 동시에 지원했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시를 생성하는 층을 1/4 로 줄였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.6-27B 는 StartLux-V1.0-27B-Preview 의 base 모델이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.5-0.8B 는 Shopify 가 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 앞섰다는 base 모델이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArena 코딩(webdev) 리더보드에서 Qwen3.8-27B 가 거의 1600 Elo 에 가까운 점수를 내며 로컬 무료 실행이 가능하다는 관찰이 있다 (리더보드 스냅샷 전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.5-4B 는 토큰리듬 NeoHorse-1-4B 의 base 이며, 후훈련 뒤 Qwen3.5-9B 기초 모델을 일부 벤치마크에서 능가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eQwen 3.5 시리즈는 구글 WikiSkill 실험의 대상 모델 중 하나다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이(임선영) 는 Qwen(중국) 과 Meta(미국) 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 투자가 필요하다고 본다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" c 08-006","S-2026-09-09-003","S-2026-09-09-005","S-2026-09-09-006","S-2026-09-09-008"],"status":"draft","stem":"product-qwen","summary":"Alibaba 의 오픈 모델 계열. Qwen3.8-27B(2026-08-14, Apache 2.0) 는 24GB 로컬 표준의 대표 사례이며, Qwen3.6-27B 는 StartLux 의 base","system":false,"text":"정의\nAlibaba 가 공개하는 오픈 LLM 계열. 이 위키에서는 로컬 모델 경계선의 사례이자 후훈련 base 로 등장한다 [S-2026-09-08-006].\n근거 있는 사실\nQwen3.8-27B: 2026-08-14 Apache 2.0 공개. 27B Dense, 이미지 입력 네이티브 멀티모달, 262K 토큰 컨텍스트. 4비트 양자화 시 약 17GB 로 24GB 소비자 GPU 에 올라가며 LM Studio · Ollama · Unsloth 원클릭 설치를 출시와 동시에 지원했다 [S-2026-09-08-006]\n64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시를 생성하는 층을 1/4 로 줄였다 [S-2026-09-08-006]\nQwen3.6-27B 는 StartLux-V1.0-27B-Preview 의 base 모델이다 [S-2026-09-08-006]\nQwen3.5-0.8B 는 Shopify 가 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 앞섰다는 base 모델이다 [S-2026-09-09-003]\nArena 코딩(webdev) 리더보드에서 Qwen3.8-27B 가 거의 1600 Elo 에 가까운 점수를 내며 로컬 무료 실행이 가능하다는 관찰이 있다 (리더보드 스냅샷 전언) [S-2026-09-09-005]\nQwen3.5-4B 는 토큰리듬 NeoHorse-1-4B 의 base 이며, 후훈련 뒤 Qwen3.5-9B 기초 모델을 일부 벤치마크에서 능가했다 [S-2026-09-09-008]\nQwen 3.5 시리즈는 구글 WikiSkill 실험의 대상 모델 중 하나다 [S-2026-09-09-006]\n글쓴이(임선영) 는 Qwen(중국) 과 Meta(미국) 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 투자가 필요하다고 본다 [S-2026-09-08-006]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nlocal-model-24gb-boundary\norg-startlux · product-muse-glimmer · org-shopify\nsmall-model-self-improvement-loop\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-005-arena-coding-leaderboard-shift\nS-2026-09-09-006-wikiskill-agent-experience-to-knowledge\nS-2026-09-09-008-neohorse-agent-native-model","title":"Qwen (알리바바 큐웬)","topics":["open-local-models"],"type":"entity","updated":"2026-09-09"},{"aliases":["Tangle ML","tangleml","tangleml.com"],"back":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","open-local-models","org-shopify","small-model-self-improvement-loop"],"cites":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-be  없다.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-ai3\" class=\"wl\"\u003eorg-ai3\u003c/a\u003e · \u003ca href=\"#/product-gemini\" class=\"wl\"\u003eproduct-gemini\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e · \u003ca href=\"#/rag-vs-persistent-wiki\" class=\"wl\"\u003erag-vs-persistent-wiki\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" class=\"wl\"\u003eS-2026-09-09-012-wisdombase-docs-to-wiki-mcp\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","knowledge-base-compilation","llm-wiki-pattern","org-ai3","product-gemini","rag-vs-persistent-wiki"],"relpath":"wiki/entities/product-wisdombase.md","sources":["S-2026-09-09-012"],"status":"draft","stem":"product-wisdombase","summary":"문서를 올리면 구조화된 위키 사이트 + MCP 서버 + 임베드 챗봇이 자동 생성되는 지식 베이스 서비스. 19종 파싱, 국내 GPU 임베딩, 무료","system":false,"text":"정의\n비정형 사내 문서를 넣으면 Gitbook 유사 위키 사이트와 함께 MCP 서버 · 챗봇이 생성되는 서비스. 사내 RAG 를 별도 구축하지 않아도 되게 하는 것이 목적이다 [S-2026-09-09-012].\n근거 있는 사실\n생성물: 위키 형태 사이트, MCP 서버(ChatGPT · Claude · Gemini 연결), 임베드 코드로 붙이는 챗봇 [S-2026-09-09-012]\n처리: HWP · DOCX · PDF · XLSX · PPTX 등 19종 자동 파싱(표 안의 표 포함), 임베딩, 문서 종류별 자동 청킹, 리랭킹 [S-2026-09-09-012]\n범위: 팀별 지식 베이스(인사팀 · 재무팀) 를 만들어 해당 팀 AI 계정에만 물리거나 전사 지식 베이스로 쓸 수 있다 [S-2026-09-09-012]\n입력 경로: 문서 업로드, 웹사이트 링크, 직접 편집 [S-2026-09-09-012]\n조건: 전부 무료, 데이터 국내 처리, AI 학습 미사용 [S-2026-09-09-012]\n주소 https://wisdombase.ai [S-2026-09-09-012]\n모순 · 논쟁\n(없음) — 출시 공지의 자체 설명이며 실사용 검증은 이 위키에 없다.\n관련 페이지\nknowledge-base-compilation — 상위 주제\norg-ai3 · product-gemini\nllm-wiki-pattern · rag-vs-persistent-wiki\nS-2026-09-09-012-wisdombase-docs-to-wiki-mcp","title":"Wisdombase","topics":["knowledge-base-compilation"],"type":"entity","updated":"2026-09-09"},{"aliases":["RAG 의 한계","RAG vs wiki","지식 축적"],"back":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","knowledge-base-compilation","llm-wiki-pattern","product-wisdombase"],"cites":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-012-wisdombase-docs-to-wiki-mcp"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eLLM 으로 문서를 다루는 두 방식의 대비. RAG(retrieval-augmented generation) 는 질문 시점에 관련 조각을 검색해 답을 만들고, 영속 위키 방식은 소스가 들어올 때 LLM 이 지식을 위키에 통합해 둔다. 차이의 핵심은 지식이 시간에 따라 쌓이는가이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRAG 에서는 다섯 문서를 종합해야 하는 질문을 할 때마다 LLM 이 매번 조각을 다시 찾아 조립한다. 아무것도 쌓이지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eNotebookLM, ChatGPT 파일 업로드, 대부분의 RAG 시스템이 이 방식이라고 원전은 말한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e영속 위키에서는 상호참조가 이미 있고, 모순이 이미 표시돼 있고, 종합이 읽은 모든 것을 반영한다. 소스와 질문이 더해질수록 위키가 풍부해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e상용 쪽에서도 같은 전환이 나타난다. 많은 기업이 사내 RAG 구축에 별도 프로젝트로 비용을 써 왔는데, 문서를 넣으면 구조화된 위키가 생성되는 서비스가 그 자리를 대체하려 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" title=\"표철민 — Wisdombase 출시: 사내 문서를 넣으면 구조화된 위키와 MCP 서버가 나온다\"\u003eS-2026-09-09-012\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e질의 결과(비교표, 분석) 를 위키에 다시 파일링하면 탐색도 소스처럼 복리로 쌓인다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 영속 위키 쪽의 구체 패턴\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e — 원전\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-012-wisdombase-docs-to-wiki-mcp\" class=\"wl\"\u003eS-2026-09-09-012-wisdombase-docs-to-wiki-mcp\u003c/a\u003e · \u003ca href=\"#/product-wisdombase\" class=\"wl\"\u003eproduct-wisdombase\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","S-2026-09-09-012-wisdombase-docs-to-wiki-mcp","knowledge-base-compilation","llm-wiki-pattern","product-wisdombase"],"relpath":"wiki/concepts/rag-vs-persistent-wiki.md","sources":["S-2026-09-08-001","S-2026-09-09-012"],"status":"draft","stem":"rag-vs-persistent-wiki","summary":"RAG 는 질문마다 원문에서 지식을 재발견해 축적이 없고, 영속 위키는 한 번 컴파일한 지식이 복리로 쌓인다는 대비","system":false,"text":"정의\nLLM 으로 문서를 다루는 두 방식의 대비. RAG(retrieval-augmented generation) 는 질문 시점에 관련 조각을 검색해 답을 만들고, 영속 위키 방식은 소스가 들어올 때 LLM 이 지식을 위키에 통합해 둔다. 차이의 핵심은 지식이 시간에 따라 쌓이는가이다 [S-2026-09-08-001].\n근거 있는 사실\nRAG 에서는 다섯 문서를 종합해야 하는 질문을 할 때마다 LLM 이 매번 조각을 다시 찾아 조립한다. 아무것도 쌓이지 않는다 [S-2026-09-08-001]\nNotebookLM, ChatGPT 파일 업로드, 대부분의 RAG 시스템이 이 방식이라고 원전은 말한다 [S-2026-09-08-001]\n영속 위키에서는 상호참조가 이미 있고, 모순이 이미 표시돼 있고, 종합이 읽은 모든 것을 반영한다. 소스와 질문이 더해질수록 위키가 풍부해진다 [S-2026-09-08-001]\n상용 쪽에서도 같은 전환이 나타난다. 많은 기업이 사내 RAG 구축에 별도 프로젝트로 비용을 써 왔는데, 문서를 넣으면 구조화된 위키가 생성되는 서비스가 그 자리를 대체하려 한다 [S-2026-09-09-012]\n질의 결과(비교표, 분석) 를 위키에 다시 파일링하면 탐색도 소스처럼 복리로 쌓인다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nknowledge-base-compilation — 상위 주제\nllm-wiki-pattern — 영속 위키 쪽의 구체 패턴\nS-2026-09-08-001-karpathy-llm-wiki — 원전\nS-2026-09-09-012-wisdombase-docs-to-wiki-mcp · product-wisdombase","title":"RAG 대 영속 위키: 지식 축적의 유무","topics":["knowledge-base-compilation"],"type":"concept","updated":"2026-09-09"},{"aliases":["RLVR 확장","전 분야 RLVR","verifiable rewards"],"back":["S-2026-09-15-001-google-cadence-and-what-to-do","beyond-parameter-scaling"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-15-001-google-cadence-and-what-to-do"],"confidence":"low","created":"2026-09-15","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eRLVR(검증 가능한 보상 강화학습) 이 코딩에서 성과를 낸 것은 코드가 맞는지 틀리는지 자동으로 판정되기 때문이었다. 판별자 역할을 모델이 대신할 수 있게 되면 같은 루프를 코딩 밖 분야로 옮길 수 있다는 전망 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e코딩에서 RLVR 이 돈 방식: 결과의 정오가 명확하므로 맞는 코드 중 가장 짧은 것을 정답으로 취급해 랭킹을 매기고 강화학습을 돌렸다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e전제 조건: 어떤 모델이 대부분의 분야에서 인간 전문가 수준의 판별자가 되는 것 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e예상 결과: 미드 트레이닝 · 포스트 트레이닝에서 코딩이 누린 발전을 나머지 분야가 똑같이 누려, \"코딩은 잘하는데 다른 건 그저 그런\" 모델들이 연말쯤 여러 분야에서 갑자기 개선된다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e그다음 단계로 알파고에서 알파제로로 간 것처럼 구조 개선 자체가 사람 손을 떠날 수 있으며, 글쓴이는 이것이 가장 큰 변화일 것으로 본다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e배경: RLVR 은 원래 특정 teacher 없이 환경의 정답 신호로 학습하는 방식이라 distillation 과 구분된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e전망이며 근거는 논증이다. 판별자 품질이 실제로 전문가 수준인지, 분야마다 정답 판정이 가능한지는 확인되지 않았다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e판별자를 외부 상용 모델로 두면 그 신호는 넓은 의미의 distillation 이 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — 학습 신호의 출처 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e\u003c edium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e단순히 여러 모델을 연결하는 게이트웨이가 아니라, 에이전트가 작업을 수행하는 과정에 실시간으로 개입해 작업 유형 · 실행 단계 · 비용 예산 · 실시간 상태에 따라 모델을 동적으로 선택하고 전환하며 협업시키는 인프라 계층 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e시장 신호: 2026년 8월 스트라이프가 모델 라우팅 플랫폼 오픈라우터를 약 75억 달러에 인수했고, 석 달 전 평가액은 13억 달러였다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e경쟁 축이 \"어느 단일 모델이 가장 뛰어난가\" 에서 \"수많은 모델을 어떻게 조직하고 활용하는가\" 로 이동했다는 것이 이 인수의 해석이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e하네스는 실행 궤적을 생성하며, 그 궤적이 다시 모델 훈련 데이터가 되는 선순환의 출발점이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e토큰리듬은 이 전략으로 출범 4개월 만에 1억 달러 기업가치, 누적 사용자 5만 4천 명, 일일 토큰 호출 5,000억을 기록했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e위험: 빅테크가 자체 라우팅 · 에이전트 기술을 고도화하면 중립적 중개자의 공간이 좁아진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" title=\"임선영 — \u0026#x27;에이전트의 경험\u0026#x27;을 학습한 모델 네오호스: 라우팅 하네스와 선순환 후훈련\"\u003eS-2026-09-09-008\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e코그니션도 작업별 모델 라우팅을 하지만 독립성을 근거로 자사 제품 안에서 수행한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 라우팅이 독립 인프라 계층으로 분리되는가, 각 에이전트 제품에 내장되는가는 열린 문제다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 비용 관점의 같은 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-native-model\" class=\"wl\"\u003eagent-native-model\u003c/a\u003e — 하네스가 만든 궤적으로 학습한 모델\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-tokenrhythm\" class=\"wl\"\u003eorg-tokenrhythm\u003c/a\u003e · \u003ca href=\"#/org-stripe\" class=\"wl\"\u003eorg-stripe\u003c/a\u003e · \u003ca href=\"#/product-openrouter\" class=\"wl\"\u003eproduct-openrouter\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-008-neohorse-agent-native-model\" class=\"wl\"\u003eS-2026-09-09-008-neohorse-agent-native-model\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-008-neohorse-agent-native-model","agent-native-model","beyond-parameter-scaling","model-routing-token-economics","org-stripe","org-tokenrhythm","product-openrouter"],"relpath":"wiki/concepts/routing-harness.md","sources":["S-2026-09-09-008"],"status":"draft","stem":"routing-harness","summary":"여러 모델을 잇는 게이트웨이를 넘어, 에이전트 실행 중에 작업 유형 · 단계 · 비용 예산 · 상태를 보고 모델을 동적으로 선택 · 전환 · 협업시키는 인프라 계층","system":false,"text":"정의\n단순히 여러 모델을 연결하는 게이트웨이가 아니라, 에이전트가 작업을 수행하는 과정에 실시간으로 개입해 작업 유형 · 실행 단계 · 비용 예산 · 실시간 상태에 따라 모델을 동적으로 선택하고 전환하며 협업시키는 인프라 계층 [S-2026-09-09-008].\n근거 있는 사실\n시장 신호: 2026년 8월 스트라이프가 모델 라우팅 플랫폼 오픈라우터를 약 75억 달러에 인수했고, 석 달 전 평가액은 13억 달러였다 [S-2026-09-09-008]\n경쟁 축이 \"어느 단일 모델이 가장 뛰어난가\" 에서 \"수많은 모델을 어떻게 조직하고 활용하는가\" 로 이동했다는 것이 이 인수의 해석이다 [S-2026-09-09-008]\n하네스는 실행 궤적을 생성하며, 그 궤적이 다시 모델 훈련 데이터가 되는 선순환의 출발점이다 [S-2026-09-09-008]\n토큰리듬은 이 전략으로 출범 4개월 만에 1억 달러 기업가치, 누적 사용자 5만 4천 명, 일일 토큰 호출 5,000억을 기록했다 [S-2026-09-09-008]\n위험: 빅테크가 자체 라우팅 · 에이전트 기술을 고도화하면 중립적 중개자의 공간이 좁아진다 [S-2026-09-09-008]\n모순 · 논쟁\n코그니션도 작업별 모델 라우팅을 하지만 독립성을 근거로 자사 제품 안에서 수행한다 [S-2026-09-08-002]. 라우팅이 독립 인프라 계층으로 분리되는가, 각 에이전트 제품에 내장되는가는 열린 문제다.\n관련 페이지\nbeyond-parameter-scaling — 상위 주제\nmodel-routing-token-economics — 비용 관점의 같은 문제\nagent-native-model — 하네스가 만든 궤적으로 학습한 모델\norg-tokenrhythm · org-stripe · product-openrouter\nS-2026-09-09-008-neohorse-agent-native-model","title":"라우팅 하네스","topics":["beyond-parameter-scaling"],"type":"concept","updated":"2026-09-09"},{"aliases":["skill evolution","스킬 진화","WikiSkill 구조","에이전트 경험 축적"],"back":["S-2026-09-09-006-wikiskill-agent-experience-to-knowledge","agent-native-model","beyond-parameter-scaling","knowledge-base-compilation","llm-wiki-pattern","post-training-agent-capability","product-gemini"],"cites":["S-2026-09-09-006-wikiskill-agent-experience-to-knowledge"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트가 작업하며 얻은 경험을 최적화 이력에 흘려보내지 않고 영구 위키에 통합한 뒤, 스킬 업데이트를 그 위키 위에서 수행하는 구조. 세 요소(원시 실행 경험 / 축적된 위키 / 실행 가능한 스킬) 를 독립적으로 다루는 것이 핵심이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e기존 스킬 진화 시스템의 한계는 통찰이 최적화 과정 이력에 파편화돼 반복 학습을 해도 축적되지 않는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eWikiSkill 은 여러 벤치마크와 모델(Qwen 3.5 시리즈, Gemini 3.5 Flash 등) 에서 EvoSkill · SkillOpt 를 일관되게 능가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e진화된 스킬을 장착한 작은 모델이 스킬 없는 훨씬 큰 모델을 능가했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e스킬은 다른 아키텍처 · 계열 모델로 전이되며, 이식한 스킬이 자체 진화 스킬보다 나은 경우도 있었다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e스킬 진화는 모델 스케일링의 대체가 아니라 보완이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e절제 연구가 성공의 핵심을 '위키를 통한 지속적 지식 축적' 으로 지목했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-006-wikiskill-agent-experience-to-knowledge\" title=\"김석현 — 구글 리서치 WikiSkill: 에이전트 경험을 영구 지식으로 컴파일해 스킬을 진화시킨다\"\u003eS-2026-09-09-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-base-compilation\" class=\"wl\"\u003eknowledge-base-compilation\u003c/a\u003e · \u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 사람의 지식 베이스에 적용된 같은 3계층 구조\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 파라미터 "task-specific small model"],"back":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","agent-native-model","beyond-parameter-scaling","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e범용 대형 모델을 호출하는 대신, 특정 업무용 소형 모델을 두고 (1) 실제 업무에서 나온 출력을 평가하고 (2) 실패한 사례를 학습 데이터로 되돌려 (3) 계속 재학습하는 구조. 이 루프가 있으면 작은 모델도 그 업무에서는 대형 모델을 이길 수 있다는 것이 Shopify 의 주장이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eShopify 는 Qwen3.5-0.8B 를 이 방식으로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 앞섰다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eShopify CEO Tobi Lütke 는 자기개선 학습 구조가 소형 모델 우위의 조건이라고 설명했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e파이프라인 기반 기술 Tangle 이 오픈소스로 공개됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 방향의 사례: StartLux 는 27B base 에 도구 사용 · 검증 중심 후훈련만으로 조 단위 모델에 근접했고, \"오토 리서치\" 로 모델이 환경 피드백으로 전략을 조정하게 했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e소스가 SNS 요약글 1건이며 Shopify 원문 · 벤치마크 조건이 없다. \"특정 작업\" 의 범위와 평가 방식은 미확인 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDistillation 논의의 경고와 맞물린다: 재학습 루프의 평가 신호가 외부 frontier 모델의 판단(LLM judge) 에서 오면 넓은 의미의 distillation 이 된다. 실제 업무 결과(사람 · 시스템 검증) 를 신호로 쓰면 그 문제를 피한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e · \u003ca href=\"#/beyond-parameter-scaling\" class=\"wl\"\u003ebeyond-parameter-scaling\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 능력은 후훈련 층에 있다는 같은 결론\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 업무별 모델 배치의 극단형\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 평가 신호의 출처 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e · \u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","beyond-parameter-scaling","distillation-defense-limits","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle"],"relpath":"wiki/concepts/small-model-self-improvement-loop.md","sources":["S-2026-09-09-003"],"status":"draft","stem":"small-model-self-improvement-loop","summary":"실제 업무 결과를 평가하고 실패 데이터를 다시 학습에 넣어 작은 모델을 특정 업무에서 대형 모델보다 낫게 키우는 운영 방식. '반복 업무마다 전용 소형 모델'","system":false,"text":"정의\n범용 대형 모델을 호출하는 대신, 특정 업무용 소형 모델을 두고 (1) 실제 업무에서 나온 출력을 평가하고 (2) 실패한 사례를 학습 데이터로 되돌려 (3) 계속 재학습하는 구조. 이 루프가 있으면 작은 모델도 그 업무에서는 대형 모델을 이길 수 있다는 것이 Shopify 의 주장이다 [S-2026-09-09-003].\n근거 있는 사실\nShopify 는 Qwen3.5-0.8B 를 이 방식으로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 앞섰다 [S-2026-09-09-003]\nShopify CEO Tobi Lütke 는 자기개선 학습 구조가 소형 모델 우위의 조건이라고 설명했다 [S-2026-09-09-003]\n파이프라인 기반 기술 Tangle 이 오픈소스로 공개됐다 [S-2026-09-09-003]\n같은 방향의 사례: StartLux 는 27B base 에 도구 사용 · 검증 중심 후훈련만으로 조 단위 모델에 근접했고, \"오토 리서치\" 로 모델이 환경 피드백으로 전략을 조정하게 했다 [S-2026-09-08-006]\n모순 · 논쟁\n소스가 SNS 요약글 1건이며 Shopify 원문 · 벤치마크 조건이 없다. \"특정 작업\" 의 범위와 평가 방식은 미확인 {low} [S-2026-09-09-003]\nDistillation 논의의 경고와 맞물린다: 재학습 루프의 평가 신호가 외부 frontier 모델의 판단(LLM judge) 에서 오면 넓은 의미의 distillation 이 된다. 실제 업무 결과(사람 · 시스템 검증) 를 신호로 쓰면 그 문제를 피한다 [S-2026-09-08-004]\n관련 페이지\nopen-local-models · beyond-parameter-scaling — 상위 주제\npost-training-agent-capability — 능력은 후훈련 층에 있다는 같은 결론\nmodel-routing-token-economics — 업무별 모델 배치의 극단형\ndistillation-defense-limits — 평가 신호의 출처 문제\norg-shopify · product-tangle · product-qwen\nS-2026-09-09-003-shopify-small-model-beats-sol","title":"소형 전용 모델의 자기개선 루프","topics":["open-local-models","beyond-parameter-scaling"],"type":"concept","updated":"2026-09-09"},{"aliases":["소버린 AI","sovereign AI","AI 주권","에이전트 주권"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","agent-governance-guardrails"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e서로 다른 두 관점이 같은 결론에 이른다. 미국 에이전트 회사의 시각에서 소버린 AI 는 자체 LLM 만의 문제가 아니라 기업 데이터가 어디에 머무는지, AI 가 어느 시스템까지 접근하는지, 실행 기록을 누가 통제하는지의 문제이며, 한국 기업에는 이쪽이 더 현실적이라고 코그니션은 말한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 코그니션은 미국 연방정부 · EU 와 일했고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이며, 한국 금융 확산의 전제로 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 든다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e한국 쪽 분석은 로컬 모델의 부상을 \"AI 통제권이 소수 기업의 데이터센터에서 개인과 기업의 책상 위로 이동하는 에이전트 주권의 이전\" 으로 읽고, 소버린 AI 를 세 축으로 재정의하자고 한다: 민감 데이터를 국내 로컬 인프라에서 처리하는 데이터 주권, Qwen · Meta 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 · 에이전트에 투자하는 기술 자립, 국방 · 정무 · 금융 · 법률용 레퍼런스 모델과 데이터 표준을 만드는 산업 통제력 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 한국은 온디바이스 하드웨어에 강하지만 증명이 필요한 층은 후훈련이라는 지적도 따른다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e종합하면 소버린 AI 의 실체는 \"국산 모델\" 이 아니라 데이터 위치 · 접근 범위 · 실행 기록 통제 · 산업 표준이며, 로컬 실행 가능한 모델과 에이전트 거버넌스가 그 기술적 기반이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 접근권한 · 감사로그 · 책임소재\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — 데이터가 사옥을 떠나지 않게 하는 기술 기반\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 기술 자립의 실제 층\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e — 소버린 형태 배포를 논의하는 미국 회사\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e — 규제 통과 프레임까지 설계한 중국 로컬 모델 회사\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-08 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e 임선영, 소버린 AI 를 데이터 주권 · 기술 자립 · 산업 통제력으로 재정의 제안\u003c/li\u003e\n\u003cli\u003e2026-08-31 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e 코그니션, 소버린 AI 는 데이터 위치 · 접근 범위 · 실행 기록 통제의 문제라고 언급\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e열린 질문\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e한국 정부 · 산업이 \"레퍼런스 모델과 데이터 표준\" 을 만든다면 우리가 참여할 접점은 어디인가\u003c/li\u003e\n\u003cli\u003e코그니션 같은 해외 회사의 \"소버린 배포\" 와 국내 로컬 모델은 경쟁인가 보완인가\u003c/li\u003e\n\u003cli\u003e감사로그 · 실행 기록 통제를 제품 기능으로 어떻게 구현하고 증명할 것인가\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관심 흐름\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-08: 미국 회사 인터뷰와 한국 분석가의 글이 모두 소버린 AI 재정의를 말한다 — 국내 공공 · 금융 시장 대응 프레임에 대한 관심으로 추정 \u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","agent-governance-guardrails","local-model-24gb-boundary","org-cognition","org-startlux","post-training-agent-capability"],"relpath":"wiki/topics/sovereign-ai.md","sources":["S-2026-09-08-002","S-2026-09-08-006"],"status":"draft","stem":"sovereign-ai","summary":"소버린 AI 를 자체 LLM 개발로만 보지 않고, 데이터가 어디 머물고 AI 가 어디까지 접근하며 실행 기록을 누가 통제하는지(코그니션) 와 데이터 주권 · 기술 자립 · 산업 통제력(임선영) 으로 재정의하는 흐름","system":false,"text":"현재 종합\n서로 다른 두 관점이 같은 결론에 이른다. 미국 에이전트 회사의 시각에서 소버린 AI 는 자체 LLM 만의 문제가 아니라 기업 데이터가 어디에 머무는지, AI 가 어느 시스템까지 접근하는지, 실행 기록을 누가 통제하는지의 문제이며, 한국 기업에는 이쪽이 더 현실적이라고 코그니션은 말한다 [S-2026-09-08-002]. 코그니션은 미국 연방정부 · EU 와 일했고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이며, 한국 금융 확산의 전제로 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 든다 [S-2026-09-08-002].\n한국 쪽 분석은 로컬 모델의 부상을 \"AI 통제권이 소수 기업의 데이터센터에서 개인과 기업의 책상 위로 이동하는 에이전트 주권의 이전\" 으로 읽고, 소버린 AI 를 세 축으로 재정의하자고 한다: 민감 데이터를 국내 로컬 인프라에서 처리하는 데이터 주권, Qwen · Meta 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 · 에이전트에 투자하는 기술 자립, 국방 · 정무 · 금융 · 법률용 레퍼런스 모델과 데이터 표준을 만드는 산업 통제력 [S-2026-09-08-006]. 한국은 온디바이스 하드웨어에 강하지만 증명이 필요한 층은 후훈련이라는 지적도 따른다 [S-2026-09-08-006].\n종합하면 소버린 AI 의 실체는 \"국산 모델\" 이 아니라 데이터 위치 · 접근 범위 · 실행 기록 통제 · 산업 표준이며, 로컬 실행 가능한 모델과 에이 망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e임계 시점: 정액제 요금제의 토큰량이 줄어드는 순간이 \"물 빠진 수영장\" 의 순간이 될 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e함께 제기된 문제: 무제한 자본에 기반한 무제한 개발력에 대항하는 법을 IT 산업계가 아는지, 글쓴이도 답을 내지 못했다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e관련 관찰: 최상위 모델은 가격이 몇 배 높아 모든 작업에 쓰면 비용이 급증하므로 작업별 라우팅이 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e전망이자 우려이며 랩들의 재무 자료로 뒷받침되지 않았다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e반대 방향의 힘도 있다. 오픈 모델과 로컬 실행, 소형 전용 모델 경로는 정액제 의존을 낮춘다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 종량 기준으로 비용을 다시 계산하는 수단\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 의존을 낮추는 반대 방향\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" class=\"wl\"\u003eS-2026-09-15-001-google-cadence-and-what-to-do\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-15-001-google-cadence-and-what-to-do","ai-roi-human-equivalent-hours","model-routing-token-economics","open-local-models"],"relpath":"wiki/concepts/subscription-subsidy-dependency.md","sources":["S-2026-09-15-001"],"status":"draft","stem":"subscription-subsidy-dependency","summary":"지금의 AI 활용 확산이 프론티어 랩들의 적자 기반 정액제 요금제에 기대고 있으며, 토큰 한도가 줄어드는 순간 비용 전제가 무너진다는 우려","system":false,"text":"정의\nMax · Pro · Ultra 같은 정액제 요금제가 제공하는 넉넉한 토큰량이 사실상 손실을 감수한 보조금이며, 많은 조직의 AI 활용이 그 위에 서 있다는 진단 [S-2026-09-15-001].\n근거 있는 사실\n글쓴이의 문제 제기: 2026년 IT 분야의 대규모 혁신이 Anthropic · OpenAI · Google 의 끝을 모르는 적자에 기반한 호혜에 그냥 얹혀 있는 것이 아닌가 [S-2026-09-15-001]\n임계 시점: 정액제 요금제의 토큰량이 줄어드는 순간이 \"물 빠진 수영장\" 의 순간이 될 것이다 [S-2026-09-15-001]\n함께 제기된 문제: 무제한 자본에 기반한 무제한 개발력에 대항하는 법을 IT 산업계가 아는지, 글쓴이도 답을 내지 못했다 [S-2026-09-15-001]\n관련 관찰: 최상위 모델은 가격이 몇 배 높아 모든 작업에 쓰면 비용이 급증하므로 작업별 라우팅이 필요하다 [S-2026-09-08-002] [S-2026-09-09-004]\n모순 · 논쟁\n전망이자 우려이며 랩들의 재무 자료로 뒷받침되지 않았다 {low} [S-2026-09-15-001]\n반대 방향의 힘도 있다. 오픈 모델과 로컬 실행, 소형 전용 모델 경로는 정액제 의존을 낮춘다 [S-2026-09-08-006] [S-2026-09-09-003]\n관련 페이지\nmodel-routing-token-economics — 종량 기준으로 비용을 다시 계산하는 수단\nopen-local-models — 의존을 낮추는 반대 방향\nai-roi-human-equivalent-hours\nS-2026-09-15-001-google-cadence-and-what-to-do","title":"적자 정액제에 얹힌 산업 구조","topics":[],"type":"concept","updated":"2026-09-15"},{"aliases":["업무 정의 병목","완료 조건","definition of done for agents"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","ai-document-production-workflow","ai-roi-human-equivalent-hours","ai-workforce-runtime","ax-organizational-redesign","cloud-agent","forward-deployed-engineer","post-training-agent-capability","task-level-agent-evaluation","two-months-later-principle"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-007-ai-ppt-design-workflow","S-2026-09-09-010-cognition-interview-ax-view"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e에이전트에게 \"이 기능을 만들어라\" 로 끝내지 않고 성공 조건(\"모든 유닛 테스트 통과\", \"앱을 직접 실행해 테스트\") 을 주고, 프로젝트를 에이전트가 받을 수 있는 단위로 쪼개는 일. 이것이 부족하면 강한 모델을 써도 기간이 줄지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e한국 기업의 에이전트 도입 확신 부족에 대해 제프 왕은 \"무엇이 완료된 상태인지 명확히 정의하는 것이 부족했기 때문\" 이라고 답했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e통제 문제에서도 사람이 할 일은 어떤 작업을 맡기는지와 무엇을 성공으로 볼지를 명확히 정의하는 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e개발자의 역할이 요구사항 정의 · 아키텍처 · 우선순위 · 품질 기준 · 리스크 판단으로 올라가며, 코딩 비용이 낮아질수록 \"무엇을 만들지 잘못 정한 비용\" 이 커진다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e긴 업무를 끝까지 수행하는 모델(GPT-6 Astra) 에서도 완료 조건은 실행 조건 목록의 첫 항목이며, 완료 조건이 있어야 \"업무 완료율\" 을 잴 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e크루온AI 의 '플레이북' 은 업무 순서와 승인 단계를 미리 가르치는 장치로, 업무 정의를 제품 기능으로 만든 사례다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e가장 작은 사례: AI 로 장표를 만들 때도 밑그림(메시지와 구조) 은 사람이 잡아야 하며, 그러지 않으면 AI 가 시키는 대로 말하는 앵무새가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" title=\"박찬성 — 생각보다 잘 작동하는 AI PPT 제작 방법\"\u003eS-2026-09-09-007\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e조직 수준으로 올리면 'AX 의 기본은 업의 정의부터' 가 된다. 하던 일과 조직을 그대로 둔 채 도입하면 토큰 비용만 급증하고 판단 주체가 사라진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" title=\"손재권 — 코그니션 제프 왕 인터뷰 후기: 한국 AX 는 기술이 아니라 조직 문제\"\u003eS-2026-09-09-010\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e창업자에게는 기술이 아니라 고객의 고통(pain point) 에서 시작하라고 권한다. AI 로 만드는 장벽은 낮아졌기 때문이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e — 이 정의 작업을 고객과 함께 하는 직무\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-010-cognition-interview-ax-view\" class=\"wl\"\u003eS-2026-09-09-010-cognition-interview-ax-view\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-007-ai-ppt-design-workflow\" class=\"wl\"\u003eS-2026-09-09-007-ai-ppt-design-workflow\u003c/a\u003e · \u003ca href=\"#/ai-document-production-workflow\" class=\"wl\"\u003eai-document-production-workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ax-organizational-redesign\" class=\"wl\"\u003eax-organizational-redesign\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","S-2026-09-09-007-ai-ppt-design-workflow","S-2026-09-09-010-cognition-interview-ax-view","ai-agents-enterprise-adoption","ai-document-production-workflow","ai-roi-human-equivalent-hours","ax-organizational-redesign","cloud-agent","forward-deployed-engineer"],"relpath":"wiki/concepts/task-definition-bottleneck.md","sources":["S-2026-09-08-002","S-2026-09-09-004","S-2026-09-09-002","S-2026-09-09-010","S-2026-09-09-007"],"status":"draft","stem":"task-definition-bottleneck","summary":"AI 도입 성패는 모델 성능보다 무엇을 맡길지, 무엇이 완료인지(테스트 통과 · 실행 검증) 를 정의하고 프로젝트를 위임 단위로 나누는 데 달렸다는 주장","system":false,"text":"정의\n에이전트에게 \"이 기능을 만들어라\" 로 끝내지 않고 성공 조건(\"모든 유닛 테스트 통과\", \"앱을 직접 실행해 테스트\") 을 주고, 프로젝트를 에이전트가 받을 수 있는 단위로 쪼개는 일. 이것이 부족하면 강한 모델을 써도 기간이 줄지 않는다 [S-2026-09-08-002].\n근거 있는 사실\n한국 기업의 에이전트 도입 확신 부족에 대해 제프 왕은 \"무엇이 완료된 상태인지 명확히 정의하는 것이 부족했기 때문\" 이라고 답했다 [S-2026-09-08-002]\n통제 문제에서도 사람이 할 일은 어떤 작업을 맡기는지와 무엇을 성공으로 볼지를 명확히 정의하는 것이다 [S-2026-09-08-002]\n개발자의 역할이 요구사항 정의 · 아키텍처 · 우선순위 · 품질 기준 · 리스크 판단으로 올라가며, 코딩 비용이 낮아질수록 \"무엇을 만들지 잘못 정한 비용\" 이 커진다 [S-2026-09-08-002]\n긴 업무를 끝까지 수행하는 모델(GPT-6 Astra) 에서도 완료 조건은 실행 조건 목록의 첫 항목이며, 완료 조건이 있어야 \"업무 완료율\" 을 잴 수 있다 [S-2026-09-09-004]\n크루온AI 의 '플레이북' 은 업무 순서와 승인 단계를 미리 가르치는 장치로, 업무 정의를 제품 기능으로 만든 사례다 [S-2026-09-09-002]\n가장 작은 사례: AI 로 장표를 만들 때도 밑그림(메시지와 구조) 은 사람이 잡아야 하며, 그러지 않으면 AI 가 시키는 대로 말하는 앵무새가 된다 [S-2026-09-09-007]\n조직 수준으로 올리면 'AX 의 기본은 업의 정의부터' 가 된다. 하던 일과 조직을 그대로 둔 채 도입하면 토큰 비용만 급증하고 판단 주체가 사라진다 [S-2026-09-09-010]\n창업자에게는 기술이 아니라 고객의 고통(pain point) 에서 시작하라고 권한다. AI 로 만드는 장벽은 낮아졌기 때문이다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\nai-roi-human-equivalent-hours\nforward-deployed-engineer — 이 정의 작업을 고객과 함께 하는 직무\ncloud-agent\nS-2026-09-08-002-cognition-jeff-wang-interview\nS-2026-09-09-004-gpt-6-astra-task-completion\nS-2026-09-09-002-crewon-ai-agent-runtime\nS-2026-09-09-010-cognition-interview-ax-view\nS-2026-09-09-007-ai-ppt-design-workflow · ai-document-production-workflow\nax-organizational-redesign","title":"에이전트 도입의 병목은 업무 정의와 완료 조건","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-09"},{"aliases":["완료된 업무 단위 평가","task completion rate","에이전트 KPI","업무 완료율"],"back":["S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","ai-agents-enterprise-adoption","ai-workforce-runtime","harness-engineering-discipline","product-arc-agi-3","product-gpt-6-astra"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델이 긴 업무를 끝까지 수행하게 되면 \"답변이 얼마나 좋은가\" 는 평가 단위로 부족하다. 평가 단위를 완료된 업무 한 건으로 잡고, 그 업무를 끝까지 완료한 비율, 사람이 개입한 횟수, 결과 검증까지 걸린 시간, 재시도와 사람 검수 시간을 합친 총비용을 측정하자는 관점 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGPT-6 Astra 의 비동기 도구 호출 · 실행 중 지시 변경 · 단계별 추론 강도는 하나의 긴 업무를 처음부터 최종 결과까지 이어서 처리하려는 설계이며, 그래서 평가 단위가 \"완료된 업무 한 건\" 으로 넓어진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e벤치마크 점수만으로는 실제 업무 능력을 설명하기 어려워진다는 것이 글쓴이의 결론이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e에이전트를 만드는 쪽에서는 모델 호출 코드보다 모델이 안전하게 오래 일하게 하는 실행 환경의 품질이 중요해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 방향의 사업 지표: 코그니션은 세션을 작업 유형별로 분류해 사람이 했다면 걸렸을 시간(사람 환산 작업시간) 과 프로덕션 반영 여부로 ROI 를 재고, 판매 기준을 좌석 수에서 \"완료한 일의 양\" 으로 옮긴다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e크루온AI 는 \"도구를 호출한 것과 실제 업무가 완료된 것은 다르다\" 며 전자결재 시스템이 정상 응답해도 실제 결재 문서가 생성됐는지까지 확인해 완료를 판정한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" title=\"디지털데일리 — \u0026quot;AI도 채용해서 조직도에 넣는다\u0026quot; 송호철 크루온AI 대표의 승부수: 기업용 AI 에이전트 런타임\"\u003eS-2026-09-09-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — 같은 단위의 사업 쪽 지표\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 완료 조건이 정의돼야 완료율을 잴 수 있다\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 실행 조건(체크포인트 · 재시도 상한 · 비용 상한)\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-gpt-6-astra\" class=\"wl\"\u003eproduct-gpt-6-astra\u003c/a\u003e · \u003ca href=\"#/ai-workforce-runtime\" class=\"wl\"\u003eai-workforce-runtime\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-002-crewon-ai-agent-runtime\" class=\"wl\"\u003eS-2026-09-09-002-crewon-ai-agent-runtime\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","product-gpt-6-astra","task-definition-bottleneck"],"relpath":"wiki/concept  (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e글쓴이는 재작년부터 팀에 이 말을 해 왔고, CTO 가 이를 믿게 되기까지 네 번의 모델 업데이트가 걸렸다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e구체 예시: 온톨로지라서 안 풀린다는 문제도 AR 모델 안에 리커런트 루프가 들어가면 구조상 효율은 떨어져도 자동으로 해결될 것으로 본다. GNN 을 안 쓴 이유는 GNN 이 그것만 잘하기 때문이었다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e결론: 개발 분야의 문제 해결은 시간의 문제지 난도의 문제가 아니다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e근거가 되는 관찰: 구글은 Gemini Flash 를 3주 간격으로 내고 있고 그때마다 성능이 오른다 \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e개인 경험에 기반한 원칙이며 실패 사례는 제시되지 않았다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-15-001-google-cadence-and-what-to-do\" title=\"신정규 (3/3) — 구글의 3주 주기, 전 분야 RLVR 전망, 그래서 우리는 뭘 해야 하나\"\u003eS-2026-09-15-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 국면을 다르게 읽는 축도 있다. 모델이 좋아져도 무엇을 맡길지와 완료 조건을 정의하지 않으면 기간이 줄지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 미루기가 통하는 것은 난도 문제일 때이고, 정의 문제는 미뤄도 그대로 남는다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/
