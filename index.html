권한다 [S-2026-09-08-001]\n본인은 LLM 에이전트와 Obsidian 을 나란히 띄워 놓고, 소스를 한 번에 하나씩 관여하며 인제스트하는 방식을 쓴다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nllm-wiki-pattern\nS-2026-09-08-001-karpathy-llm-wiki","title":"Andrej Karpathy","topics":[],"type":"entity","updated":"2026-09-08"},{"aliases":["Danny Chen","陈大年","천대년"],"back":["S-2026-09-08-006-local-agent-models-startlux","open-local-models","org-startlux"],"cites":["S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e중국 인터넷 역사에서 \"1세대 프로그래머 대부\" 로 불리는 인물. StartLux 창업자 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e1999년 형 천톈차오와 샨다네트워크를 공동 창업했고 중국에 공유 소프트웨어 개념을 처음 도입했다. 2004년 샨다 나스닥 상장 때 26세. 이후 롄상네트워크를 세워 9억 사용자의 WiFi만능열쇠를 키웠다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e샨다에서는 이사 겸 부총재(후에 COO) 로 기술 · 제품을 맡았고, 미르의전설2 대리권 확보와 액토즈 인수는 형 천톈차오가 주도했다. 2017년 이후 셩취의 국부 유출 논란은 천씨 형제가 2014~2015년 샨다게임즈를 매각하고 떠난 뒤의 일이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성다혁신원 18주년 행사에서 로컬 모델이 클라우드 시장을 무너뜨리고 3년 안에 Claude 와 대등해지며 시장 80% 를 점유할 것이라 예측했다. \"스케일링 법칙은 지나가는 신선(過路神仙) 이다\" \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이는 샨다가 보여준 것이 \"기술보다 시장 흐름을 남보다 빨리 읽는 능력\" 이었고, 같은 인물이 로컬 모델이라는 다음 시장을 먼저 읽고 있다고 경고한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","open-local-models","org-startlux"],"relpath":"wiki/entities/person-chen-danian.md","sources":["S-2026-09-08-006"],"status":"draft","stem":"person-chen-danian","summary":"중국 1세대 프로그래머. 샨다 공동창업(1999), WiFi만능열쇠(롄상네트워크) 창업. 은퇴 10년 만에 StartLux 창립, '스케일링 법칙은 지나가는 신선' 이라며 로컬 모델 주창","system":false,"text":"정의\n중국 인터넷 역사에서 \"1세대 프로그래머 대부\" 로 불리는 인물. StartLux 창업자 [S-2026-09-08-006].\n근거 있는 사실\n1999년 형 천톈차오와 샨다네트워크를 공동 창업했고 중국에 공유 소프트웨어 개념을 처음 도입했다. 2004년 샨다 나스닥 상장 때 26세. 이후 롄상네트워크를 세워 9억 사용자의 WiFi만능열쇠를 키웠다 [S-2026-09-08-006]\n샨다에서는 이사 겸 부총재(후에 COO) 로 기술 · 제품을 맡았고, 미르의전설2 대리권 확보와 액토즈 인수는 형 천톈차오가 주도했다. 2017년 이후 셩취의 국부 유출 논란은 천씨 형제가 2014~2015년 샨다게임즈를 매각하고 떠난 뒤의 일이다 [S-2026-09-08-006]\n성다혁신원 18주년 행사에서 로컬 모델이 클라우드 시장을 무너뜨리고 3년 안에 Claude 와 대등해지며 시장 80% 를 점유할 것이라 예측했다. \"스케일링 법칙은 지나가는 신선(過路神仙) 이다\" [S-2026-09-08-006]\n글쓴이는 샨다가 보여준 것이 \"기술보다 시장 흐름을 남보다 빨리 읽는 능력\" 이었고, 같은 인물이 로컬 모델이라는 다음 시장을 먼저 읽고 있다고 경고한다 [S-2026-09-08-006]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\norg-startlux\nS-2026-09-08-006-local-agent-models-startlux","title":"천다녠 (陈大年, Danny Chen)","topics":["open-local-models"],"type":"entity","updated":"2026-09-08"},{"aliases":["제프 왕","Jeff Wang"],"back":["S-2026 s/person-jeff-wang.md","sources":["S-2026-09-08-002"],"status":"draft","stem":"person-jeff-wang","summary":"코그니션 신사업 · 엔터프라이즈 대표. 전 Windsurf CEO, Codeium 사업 총괄. AI 코딩 인터페이스 변화(자동완성 → 에이전틱 IDE → 클라우드 에이전트) 를 관통","system":false,"text":"정의\nCognition 의 President of New Enterprise. 전 Windsurf CEO 이며 Codeium 시절부터 사업을 이끌었다 [S-2026-09-08-002].\n근거 있는 사실\n2025년 7월 Windsurf 의 OpenAI 인수 논의가 무산되고 창업자 · 연구진이 Google DeepMind 로 이동한 뒤 CEO 를 맡았고, 며칠 뒤 코그니션이 남은 사업을 인수했다. \"지난 72시간은 내 커리어에서 가장 극적인 롤러코스터\" 라고 직원들에게 말했다 [S-2026-09-08-002]\n더밀크 손재권 대표와의 단독 인터뷰(2026-08-31 게재) 에서 클라우드 에이전트 → 능동형 에이전트, ROI · 업무 정의, 모델 라우팅, 한국 금융 · 제조 · 소버린 AI 를 말했다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음)\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\norg-cognition\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"Jeff Wang (제프 왕)","topics":["ai-agents-enterprise-adoption"],"type":"entity","updated":"2026-09-08"},{"aliases":["post-training","사후훈련","후훈련","에이전트 특화 후훈련"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","ai-agents-enterprise-adoption","local-model-24gb-boundary","open-local-models","org-startlux","small-model-self-improvement-loop","sovereign-ai"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e모델이 배워야 할 것이 최종 텍스트가 아니라 \"언제 어떤 도구를 부를지, 오류가 오면 어떻게 조정할지, 어떤 조건에서 완료를 선언할지\" 라면, 그 능력은 사전학습이 아니라 사후훈련 층에서 만들어진다는 관찰 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eStartLux-V1.0-27B-Preview 는 Qwen3.6-27B 에 후훈련만 얹었고 같은 27B 원본보다 CAICT MCP 테스트에서 5.34%p 높았다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e훈련 데이터는 과제 이해 · 도구 선택 · 파라미터 구성 · 다단계 실행 · 상태 점검 · 결과 검증을 집중 강화했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"오토 리서치\": 모델이 실제 도구 환경에서 스스로 과제를 수행하고 환경 피드백으로 전략을 조정하는, AI 가 AI 를 훈련시키는 방법론. 회사는 이 방식으로 후훈련한 중국 최초의 로컬 에이전트 모델이라고 주장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e결론: 파라미터를 늘리지 않고 점수가 5%p 넘게 움직였으므로 에이전트 능력의 상당 부분이 후훈련 층에 있고, 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e한국은 온디바이스 하드웨어(메모리 · NPU) 에 강하지만 증명된 층은 하드웨어가 아니라 후훈련이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e서구 대기업 사례: Shopify 는 0.8B Qwen 을 실제 업무 결과 평가 → 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼다. 크기가 아니라 업무별 학습 루프가 성능을 만든다는 같은 결론이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실물 경제가 원하는 것은 만능 제너럴리스트가 아니라 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e후훈련만으로 효과를 내려면 강한 base model 이 전제라는 점은 distillation 논의와 일치한다: 약한 baseline 에서는 외부 신호를 아무리 모아도 frontier 가 되지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e. 보완 관계.\u003c/li\u003e\n\u003cli\u003eStartLux 의 Claude Sonnet 4.6 대비 시연 결과는 회사 측 자료다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — Shopify 의 운영 루프\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e · \u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — 후훈련 신호의 출처 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 완료 조건 정의는 훈련 데이터에서도 핵심\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","knowledge-distillation","local-model-24gb-boundary","on-policy-distillation","open-local-models","org-startlux","product-qwen","small-model-self-improvement-loop","task-definition-bottleneck"],"relpath":"wiki/concepts/post-training-agent-capability.md","sources":["S-2026-09-08-006","S-2026-09-09-003"],"status":"draft","stem":"post-training-agent-capability","summary":"같은 27B base 에 도구 선택 · 다단계 실행 · 검증 중심 후훈련만 얹어 5%p 이상 오른 사례로, 에이전트 능력의 상당 부분이 사전학습이 아닌 후훈련에 있고 파운데이션 모델 없는 회사도 만들 수 있다는 주장","system":false,"text":"정의\n모델이 배워야 할 것이 최종 텍스트가 아니라 \"언제 어떤 도구를 부를지, 오류가 오면 어떻게 조정할지, 어떤 조건에서 완료를 선언할지\" 라면, 그 능력은 사전학습이 아니라 사후훈련 층에서 만들어진다는 관찰 [S-2026-09-08-006].\n근거 있는 사실\nStartLux-V1.0-27B-Preview 는 Qwen3.6-27B 에 후훈련만 얹었고 같은 27B 원본보다 CAICT MCP 테스트에서 5.34%p 높았다 [S-2026-09-08-006]\n훈련 데이터는 과제 이해 · 도구 선택 · 파라미터 구성 · 다단계 실행 · 상태 점검 · 결과 검증을 집중 강화했다 [S-2026-09-08-006]\n\"오토 리서치\": 모델이 실제 도구 환경에서 스스로 과제를 수행하고 환경 피드백으로 전략을 조정하는, AI 가 AI 를 훈련시키는 방법론. 회사는 이 방식으로 후훈련한 중국 최초의 로컬 에이전트 모델이라고 주장한다 [S-2026-09-08-006]\n결론: 파라미터를 늘리지 않고 점수가 5%p 넘게 움직였으므로 에이전트 능력의 상당 부분이 후훈련 층에 있고, 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다 [S-2026-09-08-006]\n한국은 온디바이스 하드웨어(메모리 · NPU) 에 강하지만 증명된 층은 하드웨어가 아니라 후훈련이다 [S-2026-09-08-006]\n서구 대기업 사례: Shopify 는 0.8B Qwen 을 실제 업무 결과 평가 → 실패 재학습 루프로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 이겼다. 크기가 아니라 업무별 학습 루프가 성능을 만든다는 같은 결론이다 [S-2026-09-09-003]\n실물 경제가 원하는 것은 만능 제너럴리스트가 아니라 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트다 [S-2026-09-08-006]\n모순 · 논쟁\n후훈련만으로 효과를 내려면 강한 base model 이 전제라는 점은 distillation 논의와 일치한다: 약한 baseline 에서는 외부 신호를 아무리 모아도 frontier 가 되지 않는다 [S-2026-09-08-004]. 보완 관계.\nStartLux 의 Claude Sonnet 4.6 대비 시연 결과는 회사 측 자료다 {low} [S-2026-09-08-006]\n관련 페이지\nopen-local-models — 상위 주제\nlocal-model-24gb-boundary\nsmall-model-self-improvement-loop — Shopify 의 운영 루프\norg-startlux · product-qwen\nknowledge-distillation · on-policy-distillation — 후훈련 신호의 출처 문제\ntask-definition-bottleneck — 완료 조건 정의는 훈련 데이터에서도 핵심\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-003-shopify-small-model-beats-sol","title":"에이전트 능력은 사후훈련 층에 있다","topics":["open-local-models"],"type":"concept","updated":"2026-09-09"},{"aliases":["proactive agent","선제적 에이전트"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","agent-governance-guardrails","ai-agents-enterprise-adoption","cloud-agent","human-oversight-erosion"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"low","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e사람이 시키지 않아도 스스로 문제를 발견해 조사하고 수정안을 내는 에이전트. 제프 왕은 클라우드 에이전트 다음에 올 시대로 예측했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e예시: 슬랙에서 여러 사람이 같은 버그를 반복해 말하면 감지하고, 보안 취약점이 생기면 자동으로 조사 · 패치한다. 코그니션이 개발 중인 자동화도 이 방향이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eCIO 대화에서 두 번째로 자주 나오는 주제가 코드베이스 보안이며, 이미 탐지된 수천 · 수백만 건의 취약점 처리가 수요다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e요청하지 않은 AI 가 시스템을 수정하면 무엇까지 허용할지, 어떤 작업은 승인을 받을지, 오류 시 책임은 누구인지가 경영 이슈가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 단일 소스의 예측이라 confidence 는 low.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 이전 단계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 능동형이 되면 커지는 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","agent-governance-guardrails","ai-agents-enterprise-adoption","cloud-agent"],"relpath":"wiki/concepts/proactive-agent.md","sources":["S-2026-09-08-002"],"status":"draft","stem":"proactive-agent","summary":"사람이 요청하기 전에 문제를 감지하고 먼저 움직이는 에이전트. 클라우드 에이전트 다음 단계로 제시되며 권한 · 책임 문제를 동반","system":false,"text":"정의\n사람이 시키지 않아도 스스로 문제를 발견해 조사하고 수정안을 내는 에이전트. 제프 왕은 클라우드 에이전트 다음에 올 시대로 예측했다 [S-2026-09-08-002].\n근거 있는 사실\n예시: 슬랙에서 여러 사람이 같은 버그를 반복해 말하면 감지하고, 보안 취약점이 생기면 자동으로 조사 · 패치한다. 코그니션이 개발 중인 자동화도 이 방향이다 [S-2026-09-08-002]\nCIO 대화에서 두 번째로 자주 나오는 주제가 코드베이스 보안이며, 이미 탐지된 수천 · 수백만 건의 취약점 처리가 수요다 [S-2026-09-08-002]\n요청하지 않은 AI 가 시스템을 수정하면 무엇까지 허용할지, 어떤 작업은 승인을 받을지, 오류 시 책임은 누구인지가 경영 이슈가 된다 [S-2026-09-08-002]\n모순 · 논쟁\n(없음) — 단일 소스의 예측이라 confidence 는 low.\n관련 페이지\nai-agents-enterprise-adoption — 상위 주제\ncloud-agent — 이전 단계\nagent-governance-guardrails — 능동형이 되면 커지는 문제\nS-2026-09-08-002-cognition-jeff-wang-interview","title":"능동형 에이전트 (Proactive Agent)","topics":["ai-agents-enterprise-adoption"],"type":"concept","updated":"2026-09-08"},{"aliases":["데빈"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","cloud-agent","org-cognition"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e코드 추천이나 대화형 코딩 도구를 넘어, 독립 VM 에서 하나의 작업을 끝까지 수행하도록 설계된 에이전트. 핵심은 코드 생성이 아니라 업무 위임이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e개발자가 할 일과 완료 조건을 주면 독립 수행 후 결과를 검증해 돌려주며, 여러 Devin 을 동시에 띄워 병렬 처리할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e세션마다 하네스가 감독해 과제 이탈을 감지한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e코그니션 내부 코드 작성의 90% 를 담당한다고 회사가 밝혔다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e금융권 COBOL · 메인프레임 탈피 프로젝트에서 코드베이스 분석과 이전을 지원하는 용도로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e2026년 Windsurf 브랜드가 Devin 으로 통합됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-e ss=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-03 공개. Trusted Access Program 참여 기업부터 배포, API 와 Plus · Pro · Business · Enterprise 에는 며칠에 걸쳐 제공 예정 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e비동기 도구 호출: 도구를 호출해 두고 결과를 기다리는 동안 다른 작업을 진행. 작업 ID · 타임아웃 · 재시도 · 중복 실행 방지는 개발자 구현 사항 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e실행 중 지시 변경(mid-turn steering): 진행 중 조건 추가 가능. 이미 실행된 행동은 되돌리지 못하고 시작된 도구 실행도 취소되지 않으므로 되돌리기 어려운 작업에는 실행 직전 승인이 필요 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e단계별 추론 강도 조절: 한 작업 안에서 단계마다 계산 자원 배분 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e가격: API 입력 100만 토큰당 10달러 · 출력 50달러 (GPT-5.6 Sol 은 4달러 · 20달러). ChatGPT Work · Codex 작업당 사용량은 소비자 구독 약 3.27배, Business 2.95배, Enterprise 2.08배 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e권장 용도: 다단계 · 외부 시스템 호출 · 진행 중 요구 변경 · 실패 시 사람 재투입 비용이 큰 업무. 반복 분류 · 요약은 Luna · Terra, 범위가 명확한 고난도는 Sol \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ePreparedness Framework 에서 처음으로 Critical 수준 사이버보안 역량으로 분류. ExploitBench 100%, 미공개 취약점 발견. 일부 평가는 기본 환경보다 강한 도구 접근 권한 사용 \u003ca class=\"cite\" href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" title=\"황민호 — GPT-6 Astra 가 바꾼 것은 답변의 질보다 \u0026#x27;일을 끝내는 방식\u0026#x27;\"\u003eS-2026-09-09-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e교육 커뮤니티 소개글은 웹 서핑 · 문서 · 코드 실행 · 소프트웨어 사용 · 프레젠테이션 제작을 묶은 \"가장 강력한 모델\" 로 전했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음) — 두 소스 모두 2차 전언이며 OpenAI 원문(https://openai.com/index/gpt-6-astra) 은 미확보.\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-level-agent-evaluation\" class=\"wl\"\u003etask-level-agent-evaluation\u003c/a\u003e · \u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e · \u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-004-gpt-6-astra-task-completion\" class=\"wl\"\u003eS-2026-09-09-004-gpt-6-astra-task-completion\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" class=\"wl\"\u003eS-2026-09-08-003-agents-push-humans-out-of-loop\u003c/a\u003e\u003c/li\u nts-enterprise-adoption"],"type":"entity","updated":"2026-09-09"},{"aliases":["K2Horizon","K2 호라이즌"],"back":["S-2026-09-08-005-uae-k2-horizon-open-source","fully-open-source-model","open-local-models","org-mbzuai"],"cites":["S-2026-09-08-005-uae-k2-horizon-open-source"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eMBZUAI IFM 이 공개한 파운데이션 모델 라인업. 가중치 · 코드 · 학습 데이터 · 레시피 · 중간 체크포인트를 모두 공개한 완전 오픈소스이며 Apache 2.0 으로 허깅페이스에 배포됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e0.9B: 스마트워치 · 스마트안경 등 극제약 온디바이스 대상. 동급 중 수학 · 도구 사용 최상위라고 발표 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e3.7B: 미세조정에 최적화, 4B 이하 중 최고 추론 성능이라고 발표 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e7B: 스마트폰에서 직접 구동하면서 소프트웨어 엔지니어링 역량 제공 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e32B Dense: 로컬 서버 · 온프레미스 · 고성능 노트북 대상 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e36B-A4B: 활성 파라미터 4B 의 저밀도 \"MoVA\" 아키텍처로 비용 대비 성능 극대화 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e375B-A23B: 플래그십. 복합 추론 · 에이전트 작업 특화, 기업용 워크로드 즉시 투입 가능하다고 발표 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e0.9B 를 제외한 5개 모델은 핵심 아키텍처 · 어휘 · 배포 도구를 공유한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성능 주장은 모두 발표 주체의 자체 평가이며 독립 벤치마크는 이 위키에 아직 없다 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-mbzuai\" class=\"wl\"\u003eorg-mbzuai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/fully-open-source-model\" class=\"wl\"\u003efully-open-source-model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" class=\"wl\"\u003eS-2026-09-08-005-uae-k2-horizon-open-source\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-005-uae-k2-horizon-open-source","fully-open-source-model","open-local-models","org-mbzuai"],"relpath":"wiki/entities/product-k2-horizon.md","sources":["S-2026-09-08-005"],"status":"draft","stem":"product-k2-horizon","summary":"MBZUAI IFM 의 완전 오픈소스 파운데이션 모델 6종(0.9B · 3.7B · 7B · 32B · 36B-A4B · 375B-A23B). Apache 2.0, 온디바이스부터 엔터프라이즈까지","system":false,"text":"정의\nMBZUAI 컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e4비트 동적 양자화로 17~20GB 까지 내려 24~32GB 메모리 안에 KV 캐시와 추측적 디코딩 여유분까지 확보했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","local-model-24gb-boundary","open-local-models","product-qwen"],"relpath":"wiki/entities/product-muse-glimmer.md","sources":["S-2026-09-08-006"],"status":"draft","stem":"product-muse-glimmer","summary":"Meta 슈퍼인텔리전스랩이 2026-08-10 공개한 30B Dense + 1.8B 지각 인코더 오픈 모델. 4비트 17~20GB 로 24~32GB 로컬 환경 대상","system":false,"text":"정의\nMeta 슈퍼인텔리전스랩의 로컬 지향 오픈 모델. Qwen3.8-27B 와 함께 27~30B 로컬 표준 형성의 사례로 인용된다 [S-2026-09-08-006].\n근거 있는 사실\n2026-08-10 Qwen3.8-27B 와 같은 라이선스(Apache 2.0) 로 공개됐다 [S-2026-09-08-006]\n300억 파라미터 Dense 구조에 1.8B 지각 인코더, 120K 토큰 이상 컨텍스트 [S-2026-09-08-006]\n4비트 동적 양자화로 17~20GB 까지 내려 24~32GB 메모리 안에 KV 캐시와 추측적 디코딩 여유분까지 확보했다 [S-2026-09-08-006]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nlocal-model-24gb-boundary\nproduct-qwen\nS-2026-09-08-006-local-agent-models-startlux","title":"Muse Glimmer (Meta)","topics":["open-local-models"],"type":"entity","updated":"2026-09-08"},{"aliases":["옵시디언"],"back":["S-2026-09-08-001-karpathy-llm-wiki","_unsorted","llm-wiki-pattern"],"cites":["S-2026-09-08-001-karpathy-llm-wiki"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e로컬 마크다운 파일을 링크 · 그래프로 탐색하는 노트 앱. LLM Wiki 패턴에서는 \"Obsidian 은 IDE, LLM 은 프로그래머, 위키는 코드베이스\" 로 비유된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e그래프 뷰로 위키의 허브와 고아 페이지를 파악하는 데 가장 좋은 도구로 제시된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eWeb Clipper 확장으로 웹 기사를 마크다운으로 변환해 raw 에 넣을 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\"Download attachments\" 핫키로 이미지를 로컬에 내려받으면 LLM 이 URL 대신 파일을 직접 볼 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDataview 플러그인은 frontmatter 를 질의해 동적 표를 만들고, Marp 플러그인은 위키 내용으로 슬라이드를 만든다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","llm-wiki-pattern"],"relpath":"wiki/entities/product-obsidian.md","sources":["S-2026-09-08-001"],"status":"draft","stem":"product-obsidian","summary":"로컬 마크다운 노트 앱. LLM Wiki 패턴에서 사람이 위키를 열람 · 탐색하는 도구(IDE 역할) 로 권장됨","system":false,"text":"정의\n로컬 마크다운 파일을 링크 · 그래프로 탐색하는 노트 앱. LLM Wiki 패턴에서는 \"Obsidian 은 IDE, LLM 은 프로그래머, 위키는 코드베이스\" 로 비유된다 [S-2026-09-08-001].\n근거 있는 사실\n그래프 뷰로 위키의 허브와 고아 페이지를 파악하는 데 가장 좋은 도구로 제시된다 [S-2026-09-08-001]\nWeb Clipper 확장으로 웹 기사를 마크다운으로 변환해 raw 에 넣을 수 있다 [S-2026-09-08-001]\n\"Download attachments\" 핫키로 이미지를 로컬에 내려받으면 LLM 이 URL 대신 파일을 직접 볼 수 있다 [S-2026-09-08-001]\nDataview 플러그인은 frontmatter 를 질의해 동적 표를 만들고, Marp 플러그인은 위키 내용으로 슬라이드를 만든다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nllm-wiki-pattern\nS-2026-09-08-001-karpathy-llm-wiki","title":"Obsidian","topics":[],"type":"entity","updated":"2026-09-08"},{"aliases":["큐웬","Qwen3.8-27B","Qwen3.6-27B","Qwen3.5-0.8B","알리바바 Qwen"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","local-model-24gb-boundary","open-local-models","org-shopify","org-startlux","org-tencent","post-training-agent-capability","product-muse-glimmer","small-model-self-improvement-loop"],"cites":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift"],"confidence":"medium","created":"2026-09-08","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eAlibaba 가 공개하는 오픈 LLM 계열. 이 위키에서는 로컬 모델 경계선의 사례이자 후훈련 base 로 등장한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eQwen3.8-27B: 2026-08-14 Apache 2.0 공개. 27B Dense, 이미지 입력 네이티브 멀티모달, 262K 토큰 컨텍스트. 4비트 양자화 시 약 17GB 로 24GB 소비자 GPU 에 올라가며 LM Studio · Ollama · Unsloth 원클릭 설치를 출시와 동시에 지원했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시를 생성하는 층을 1/4 로 줄였다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.6-27B 는 StartLux-V1.0-27B-Preview 의 base 모델이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eQwen3.5-0.8B 는 Shopify 가 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 앞섰다는 base 모델이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArena 코딩(webdev) 리더보드에서 Qwen3.8-27B 가 거의 1600 Elo 에 가까운 점수를 내며 로컬 무료 실행이 가능하다는 관찰이 있다 (리더보드 스냅샷 전언) \u003ca class=\"cite\" href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" title=\"이상선 — 코딩 AI 판도 변화: Arena 코딩 리더보드에서 Tencent Hy4 1631 Elo, Qwen3.8-27B 로컬 무료 근접\"\u003eS-2026-09-09-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e글쓴이(임선영) 는 Qwen(중국) 과 Meta(미국) 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 투자가 필요하다고 본다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e · \u003ca href=\"#/product-muse-glimmer\" class=\"wl\"\u003eproduct-muse-glimmer\u003c/a\u003e · \u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-005-arena-coding-leaderboard-shift\" class=\"wl\"\u003eS-2026-09-09-005-arena-coding-leaderboard-shift\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","local-model-24gb-boundary","open-local-models","org-shopify","org-startlux","product-muse-glimmer","small-model-self-improvement-loop"],"relpath":"wiki/entities/product-qwen.md","sources":["S-2026-09-08-006","S-2026-09-09-003","S-2026-09-09-005"],"status":"draft","stem":"product-qwen","summary":"Alibaba 의 오픈 모델 계열. Qwen3.8-27B(2026-08-14, Apache 2.0) 는 24GB 로컬 표준의 대표 사례이며, Qwen3.6-27B 는 StartLux 의 base","system":false,"text":"정의\nAlibaba 가 공개하는 오픈 LLM 계열. 이 위키에서는 로컬 모델 경계선의 사례이자 후훈련 base 로 등장한다 [S-2026-09-08-006].\n근거 있는 사실\nQwen3.8-27B: 2026-08-14 Apache 2.0 공개. 27B Dense, 이미지 입력 네이티브 멀티모달, 262K 토큰 컨텍스트. 4비트 양자화 시 약 17GB 로 24GB 소비자 GPU 에 올라가며 LM Studio · Ollama · Unsloth 원클릭 설치를 출시와 동시에 지원했다 [S-2026-09-08-006]\n64층 중 48층을 선형 어텐션으로 바꿔 KV 캐시를 생성하는 층을 1/4 로 줄였다 [S-2026-09-08-006]\nQwen3.6-27B 는 StartLux-V1.0-27B-Preview 의 base 모델이다 [S-2026-09-08-006]\nQwen3.5-0.8B 는 Shopify 가 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 앞섰다는 base 모델이다 [S-2026-09-09-003]\nArena 코딩(webdev) 리더보드에서 Qwen3.8-27B 가 거의 1600 Elo 에 가까운 점수를 내며 로컬 무료 실행이 가능하다는 관찰이 있다 (리더보드 스냅샷 전언) [S-2026-09-09-005]\n글쓴이(임선영) 는 Qwen(중국) 과 Meta(미국) 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 투자가 필요하다고 본다 [S-2026-09-08-006]\n모순 · 논쟁\n(없음)\n관련 페이지\nopen-local-models — 상위 주제\nlocal-model-24gb-boundary\norg-startlux · product-muse-glimmer · org-shopify\nsmall-model-self-improvement-loop\nS-2026-09-08-006-local-agent-models-startlux\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-005-arena-coding-leaderboard-shift","title":"Qwen (알리바바 큐웬)","topics":["open-local-models"],"type":"entity","updated":"2026-09-09"},{"aliases":["Tangle ML","tangleml","tangleml.com"],"back":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","open-local-models","org-shopify","small-model-self-improvement-loop"],"cites":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"low","created":"2026-09-09","folder":"entities","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eSNS 요약글에 따르면 Shopify 가 소형 모델 학습 파이프라인을 만드는 기반 기술로 오픈소스 공개한 도구 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eShopify 의 자기개선 학습 파이프라인 기반 기술이며 오픈소스로 공개됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003etangleml.com 의 Tangle: 비주얼 파이프라인 편집, 재사용 컴포넌트 라이브러리, 언어 · 프레임워크 무관 컨테이너 래핑, 콘텐츠 기반 실행 캐시. 오픈소스 기반이며 GitHub 에서 코드를 볼 수 있다고 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" title=\"tangleml.com — Tangle: 비주얼 ML 파이프라인 에디터 (제품 소개 페이지)\"\u003eS-2026-09-09-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eShopify 게시글 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e 에는 저장소 주소가 없고, tangleml.com 페이지 \u003ca class=\"cite\" href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" title=\"tangleml.com — Tangle: 비주얼 ML 파이프라인 에디터 (제품 소개 페이지)\"\u003eS-2026-09-09-001\u003c/a\u003e 에는 Shopify 나 모델 학습 언급이 없다. 두 소스가 같은 제품을 가리키는지 미확인 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e. 같은 날 함께 공유됐다는 정황만 있다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" class=\"wl\"\u003eS-2026-09-09-001-tangle-visual-ml-pipeline\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","open-local-models","org-shopify","small-model-self-improvement-loop"],"relpath":"wiki/entities/product-tangle.md","sources":["S-2026-09-09-003","S-2026-09-09-001"],"status":"draft","stem":"product-tangle","summary":"Shopify 가 소형 모델 자기개선 파이프라인의 기반 기술로 오픈소스 공개했다고 전해지는 도구. tangleml.com 의 '비주얼 ML 파이프라인 에디터' 와 동일한지는 미확인","system":false,"text":"정의\nSNS 요약글에 따르면 Shopify 가 소형 모델 학습 파이프라인을 만드는 기반 기술로 오픈소스 공개한 도구 [S-2026-09-09-003].\n근거 있는 사실\nShopify 의 자기개선 학습 파이프라인 기반 기술이며 오픈소스로 공개됐다 [S-2026-09-09-003]\ntangleml.com 의 Tangle: 비주얼 파이프라인 편집, 재사용 컴포넌트 라이브러리, 언어 · 프레임워크 무관 컨테이너 래핑, 콘텐츠 기반 실행 캐시. 오픈소스 기반이며 GitHub 에서 코드를 볼 수 있다고 한다 [S-2026-09-09-001]\n모순 · 논쟁\nShopify 게시글 [S-2026-09-09-003] 에는 저장소 주소가 없고, tangleml.com 페이지 [S-2026-09-09-001] 에는 Shopify 나 모델 학습 언급이 없다. 두 소스가 같은 제품을 가리키는지 미확인 {low}. 같은 날 함께 공유됐다는 정황만 있다.\n관련 페이지\nopen-local-models — 상위 주제\norg-shopify\nsmall-model-self-improvement-loop\nS-2026-09-09-003-shopify-small-model-beats-sol\nS-2026-09-09-001-tangle-visual-ml-pipeline","title":"Tangle","topics":["open-local-models"],"type":"entity","updated":"2026-09-09"},{"aliases":["RAG 의 한계","RAG vs wiki","지식 축적"],"back":["S-2026-09-08-001-karpathy-llm-wiki","_unsorted","llm-wiki-pattern"],"cites":["S-2026-09-08-001-karpathy-llm-wiki"],"confidence":"medium","created":"2026-09-08","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003eLLM 으로 문서를 다루는 두 방식의 대비. RAG(retrieval-augmented generation) 는 질문 시점에 관련 조각을 검색해 답을 만들고, 영속 위키 방식은 소스가 들어올 때 LLM 이 지식을 위키에 통합해 둔다. 차이의 핵심은 지식이 시간에 따라 쌓이는가이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRAG 에서는 다섯 문서를 종합해야 하는 질문을 할 때마다 LLM 이 매번 조각을 다시 찾아 조립한다. 아무것도 쌓이지 않는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eNotebookLM, ChatGPT 파일 업로드, 대부분의 RAG 시스템이 이 방식이라고 원전은 말한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e영속 위키에서는 상호참조가 이미 있고, 모순이 이미 표시돼 있고, 종합이 읽은 모든 것을 반영한다. 소스와 질문이 더해질수록 위키가 풍부해진다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e질의 결과(비교표, 분석) 를 위키에 다시 파일링하면 탐색도 소스처럼 복리로 쌓인다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cp\u003e(없음)\u003c/p\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 영속 위키 쪽의 구체 패턴\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" class=\"wl\"\u003eS-2026-09-08-001-karpathy-llm-wiki\u003c/a\u003e — 원전\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-001-karpathy-llm-wiki","llm-wiki-pattern"],"relpath":"wiki/concepts/rag-vs-persistent-wiki.md","sources":["S-2026-09-08-001"],"status":"draft","stem":"rag-vs-persistent-wiki","summary":"RAG 는 질문마다 원문에서 지식을 재발견해 축적이 없고, 영속 위키는 한 번 컴파일한 지식이 복리로 쌓인다는 대비","system":false,"text":"정의\nLLM 으로 문서를 다루는 두 방식의 대비. RAG(retrieval-augmented generation) 는 질문 시점에 관련 조각을 검색해 답을 만들고, 영속 위키 방식은 소스가 들어올 때 LLM 이 지식을 위키에 통합해 둔다. 차이의 핵심은 지식이 시간에 따라 쌓이는가이다 [S-2026-09-08-001].\n근거 있는 사실\nRAG 에서는 다섯 문서를 종합해야 하는 질문을 할 때마다 LLM 이 매번 조각을 다시 찾아 조립한다. 아무것도 쌓이지 않는다 [S-2026-09-08-001]\nNotebookLM, ChatGPT 파일 업로드, 대부분의 RAG 시스템이 이 방식이라고 원전은 말한다 [S-2026-09-08-001]\n영속 위키에서는 상호참조가 이미 있고, 모순이 이미 표시돼 있고, 종합이 읽은 모든 것을 반영한다. 소스와 질문이 더해질수록 위키가 풍부해진다 [S-2026-09-08-001]\n질의 결과(비교표, 분석) 를 위키에 다시 파일링하면 탐색도 소스처럼 복리로 쌓인다 [S-2026-09-08-001]\n모순 · 논쟁\n(없음)\n관련 페이지\nllm-wiki-pattern — 영속 위키 쪽의 구체 패턴\nS-2026-09-08-001-karpathy-llm-wiki — 원전","title":"RAG 대 영속 위키: 지식 축적의 유무","topics":[],"type":"concept","updated":"2026-09-08"},{"aliases":["자기개선 루프","self-improving small model","전용 소형 모델","task-specific small model"],"back":["S-2026-09-09-001-tangle-visual-ml-pipeline","S-2026-09-09-003-shopify-small-model-beats-sol","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle"],"cites":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"medium","created":"2026-09-09","folder":"concepts","html":"\u003ch2\u003e정의\u003c/h2\u003e\n\u003cp\u003e범용 대형 모델을 호출하는 대신, 특정 업무용 소형 모델을 두고 (1) 실제 업무에서 나온 출력을 평가하고 (2) 실패한 사례를 학습 데이터로 되돌려 (3) 계속 재학습하는 구조. 이 루프가 있으면 작은 모델도 그 업무에서는 대형 모델을 이길 수 있다는 것이 Shopify 의 주장이다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e근거 있는 사실\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eShopify 는 Qwen3.5-0.8B 를 이 방식으로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 앞섰다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eShopify CEO Tobi Lütke 는 자기개선 학습 구조가 소형 모델 우위의 조건이라고 설명했다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e파이프라인 기반 기술 Tangle 이 오픈소스로 공개됐다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e같은 방향의 사례: StartLux 는 27B base 에 도구 사용 · 검증 중심 후훈련만으로 조 단위 모델에 근접했고, \"오토 리서치\" 로 모델이 환경 피드백으로 전략을 조정하게 했다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e모순 · 논쟁\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e소스가 SNS 요약글 1건이며 Shopify 원문 · 벤치마크 조건이 없다. \"특정 작업\" 의 범위와 평가 방식은 미확인 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eDistillation 논의의 경고와 맞물린다: 재학습 루프의 평가 신호가 외부 frontier 모델의 판단(LLM judge) 에서 오면 넓은 의미의 distillation 이 된다. 실제 업무 결과(사람 · 시스템 검증) 를 신호로 쓰면 그 문제를 피한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e관련 페이지\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 능력은 후훈련 층에 있다는 같은 결론\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 업무별 모델 배치의 극단형\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 평가 신호의 출처 문제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-shopify\" class=\"wl\"\u003eorg-shopify\u003c/a\u003e · \u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e · \u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" class=\"wl\"\u003eS-2026-09-09-003-shopify-small-model-beats-sol\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","out":["S-2026-09-08-004-distillation-spectrum-lee-dongsoo","S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-003-shopify-small-model-beats-sol","distillation-defense-limits","model-routing-token-economics","open-local-models","org-shopify","post-training-agent-capability","product-qwen","product-tangle"],"relpath":"wiki/concepts/small-model-self-improvement-loop.md","sources":["S-2026-09-09-003"],"status":"draft","stem":"small-model-self-improvement-loop","summary":"실제 업무 결과를 평가하고 실패 데이터를 다시 학습에 넣어 작은 모델을 특정 업무에서 대형 모델보다 낫게 키우는 운영 방식. '반복 업무마다 전용 소형 모델'","system":false,"text":"정의\n범용 대형 모델을 호출하는 대신, 특정 업무용 소형 모델을 두고 (1) 실제 업무에서 나온 출력을 평가하고 (2) 실패한 사례를 학습 데이터로 되돌려 (3) 계속 재학습하는 구조. 이 루프가 있으면 작은 모델도 그 업무에서는 대형 모델을 이길 수 있다는 것이 Shopify 의 주장이다 [S-2026-09-09-003].\n근거 있는 사실\nShopify 는 Qwen3.5-0.8B 를 이 방식으로 미세조정해 특정 작업에서 GPT-5.6 Sol 을 앞섰다 [S-2026-09-09-003]\nShopify CEO Tobi Lütke 는 자기개선 학습 구조가 소형 모델 우위의 조건이라고 설명했다 [S-2026-09-09-003]\n파이프라인 기반 기술 Tangle 이 오픈소스로 공개됐다 [S-2026-09-09-003]\n같은 방향의 사례: StartLux 는 27B base 에 도구 사용 · 검증 중심 후훈련만으로 조 단위 모델에 근접했고, \"오토 리서치\" 로 모델이 환경 피드백으로 전략을 조정하게 했다 [S-2026-09-08-006]\n모순 · 논쟁\n소스가 SNS 요약글 1건이며 Shopify 원문 · 벤치마크 조건이 없다. \"특정 작업\" 의 범위와 평가 방식은 미확인 {low} [S-2026-09-09-003]\nDistillation 논의의 경고와 맞물린다: 재학습 루프의 평가 신호가 외부 frontier 모델의 판단(LLM judge) 에서 오면 넓은 의미의 distillation 이 된다. 실제 업무 결과(사람 · 시스템 검증) 를 신호로 쓰면 그 문제를 피한다 [S-2026-09-08-004]\n관련 페이지\nopen-local-models — 상위 주제\npost-training-agent-capability — 능력은 후훈련 층에 있다는 같은 결론\nmodel-routing-token-economics — 업무별 모델 배치의 극단형\ndistillation-defense-limits — 평가 신호의 출처 문제\norg-shopify · product-tangle · product-qwen\nS-2026-09-09-003-shopify-small-model-beats-sol","title":"소형 전용 모델의 자기개선 루프","topics":["open-local-models"],"type":"concept","updated":"2026-09-09"},{"aliases":["소버린 AI","sovereign AI","AI 주권","에이전트 주권"],"back":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux","agent-governance-guardrails"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-08-006-local-agent-models-startlux"],"confidence":"medium","created":"2026-09-08","folder":"topics","html":"\u003ch2\u003e현재 종합\u003c/h2\u003e\n\u003cp\u003e서로 다른 두 관점이 같은 결론에 이른다. 미국 에이전트 회사의 시각에서 소버린 AI 는 자체 LLM 만의 문제가 아니라 기업 데이터가 어디에 머무는지, AI 가 어느 시스템까지 접근하는지, 실행 기록을 누가 통제하는지의 문제이며, 한국 기업에는 이쪽이 더 현실적이라고 코그니션은 말한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e. 코그니션은 미국 연방정부 · EU 와 일했고 여러 정부와 소버린 형태의 Devin 배포를 논의 중이며, 한국 금융 확산의 전제로 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 든다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e한국 쪽 분석은 로컬 모델의 부상을 \"AI 통제권이 소수 기업의 데이터센터에서 개인과 기업의 책상 위로 이동하는 에이전트 주권의 이전\" 으로 읽고, 소버린 AI 를 세 축으로 재정의하자고 한다: 민감 데이터를 국내 로컬 인프라에서 처리하는 데이터 주권, Qwen · Meta 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 · 에이전트에 투자하는 기술 자립, 국방 · 정무 · 금융 · 법률용 레퍼런스 모델과 데이터 표준을 만드는 산업 통제력 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e. 한국은 온디바이스 하드웨어에 강하지만 증명이 필요한 층은 후훈련이라는 지적도 따른다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e종합하면 소버린 AI 의 실체는 \"국산 모델\" 이 아니라 데이터 위치 · 접근 범위 · 실행 기록 통제 · 산업 표준이며, 로컬 실행 가능한 모델과 에이전트 거버넌스가 그 기술적 기반이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e하위 페이지\u003c/h2\u003e\n\u003ch3\u003e개념\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 접근권한 · 감사로그 · 책임소재\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — 데이터가 사옥을 떠나지 않게 하는 기술 기반\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 기술 자립의 실제 층\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e엔티티\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e — 소버린 형태 배포를 논의하는 미국 회사\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e — 규제 통과 프레임까지 설계한 중국 로컬 모델 회사\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e소스\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" class=\"wl\"\u003eS-2026-09-08-002-cognition-jeff-wang-interview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/S-2026-09-08-006-local-agent-models-startlux\" class=\"wl\"\u003eS-2026-09-08-006-local-agent-models-startlux\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e타임라인\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e2026-09-08 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e 임선영, 소버린 AI 를 데이터 주권 · 기술 자립 · 산업 통제력으로 재정의 제안\u003c/li\u003e\n\u003cli\u003e2026-08-31 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e 코그니션, 소버린 AI 는 데이터 위치 · 접근 범위 · 실행 기록 통제의
