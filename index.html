<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO Insight Hub</title>
<style>
:root{
  --bg:#fbfbf9; --panel:#ffffff; --fg:#1c1c1a; --muted:#6b6b66; --faint:#8e8e88;
  --border:#e2e1dc; --border-strong:#cfcec8; --accent:#2f6f5e; --accent-fg:#ffffff;
  --chip:#f1f0ea; --code-bg:#f3f2ec; --quote:#f6f5ef; --shadow:rgba(0,0,0,.07);
  --t-topic:#2f6f5e; --t-concept:#4a5fa8; --t-entity:#8a5a2b; --t-source:#7a4a86;
  --t-insight:#a03a56; --t-digest:#3d6a86;
  --mk-stated:#6b6b66; --mk-high:#2e7d4f; --mk-low:#a2701a; --mk-disputed:#b13b34;
  --est:#a2701a; --missing:#b13b34;
}

  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1d1d22; --fg:#e6e5e0; --muted:#a3a29c; --faint:#8a8983;
    --border:#2e2e35; --border-strong:#41414a; --accent:#6fbfa4; --accent-fg:#12241e;
    --chip:#26262c; --code-bg:#23232a; --quote:#212128; --shadow:rgba(0,0,0,.5);
    --t-topic:#6fbfa4; --t-concept:#8fa4e6; --t-entity:#d3a06a; --t-source:#c294d4;
    --t-insight:#e08099; --t-digest:#7fb4d6;
    --mk-stated:#a3a29c; --mk-high:#5fbd85; --mk-low:#d8ab4e; --mk-disputed:#e2756c;
    --est:#d8ab4e; --missing:#e2756c;
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1d1d22; --fg:#e6e5e0; --muted:#a3a29c; --faint:#8a8983;
  --border:#2e2e35; --border-strong:#41414a; --accent:#6fbfa4; --accent-fg:#12241e;
  --chip:#26262c; --code-bg:#23232a; --quote:#212128; --shadow:rgba(0,0,0,.5);
  --t-topic:#6fbfa4; --t-concept:#8fa4e6; --t-entity:#d3a06a; --t-source:#c294d4;
  --t-insight:#e08099; --t-digest:#7fb4d6;
  --mk-stated:#a3a29c; --mk-high:#5fbd85; --mk-low:#d8ab4e; --mk-disputed:#e2756c;
  --est:#d8ab4e; --missing:#e2756c;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

/* --- top bar --- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);
}
.topbar .brand{font-weight:700; font-size:15px; white-space:nowrap; cursor:pointer}
.topbar .grow{flex:1}
.tb-btn{
  border:1px solid var(--border); border-radius:7px; padding:5px 10px;
  background:var(--panel); font-size:13px; color:var(--muted); white-space:nowrap;
}
.tb-btn:hover{border-color:var(--border-strong); color:var(--fg)}
#menu{display:none; font-size:17px; padding:2px 8px}
#q{
  flex:1; max-width:420px; min-width:90px; padding:6px 10px; font:inherit; font-size:14px;
  border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--fg);
}
#q:focus{outline:none; border-color:var(--accent)}

/* --- layout --- */
.layout{display:flex; align-items:flex-start}
#sidebar{
  width:260px; flex:0 0 260px; position:sticky; top:45px; align-self:flex-start;
  height:calc(100vh - 45px); overflow-y:auto; padding:14px 10px 40px;
  border-right:1px solid var(--border); background:var(--panel);
}
body.sb-collapsed #sidebar{display:none}
#main{flex:1; min-width:0; padding:22px 26px 80px}
.wrap{max-width:860px; margin:0 auto}
#scrim{display:none}

@media (max-width:800px){
  #menu{display:block}
  #sidebar{
    position:fixed; top:0; left:0; height:100vh; z-index:60; transform:translateX(-100%);
    transition:transform .18s ease; box-shadow:0 0 24px var(--shadow); padding-top:16px;
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-collapsed #sidebar{display:block}
  body.sb-open #scrim{display:block; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.35)}
  #main{padding:16px 14px 60px}
}

/* --- sidebar tree --- */
.sec{margin-bottom:6px}
.sec-head{
  display:flex; align-items:center; gap:6px; width:100%; padding:5px 8px;
  font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.02em;
  border-radius:6px; text-align:left;
}
.sec-head:hover{background:var(--chip)}
.sec-head .cnt{margin-left:auto; font-weight:500; color:var(--faint)}
.sec-head .caret{display:inline-block; width:9px; transition:transform .15s}
.sec.closed .caret{transform:rotate(-90deg)}
.sec.closed .sec-body{display:none}
.sec-body{padding:2px 0 6px}
.tree-a{
  display:block; padding:3px 10px 3px 22px; font-size:13.5px; color:var(--fg);
  border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tree-a:hover{background:var(--chip); text-decoration:none}
.tree-a.active{background:var(--chip); color:var(--accent); font-weight:600}
.divider{
  padding:6px 10px 2px 22px; font-size:11.5px; color:var(--faint);
  border-top:1px solid var(--border); margin-top:6px;
}
.hit{display:block; padding:7px 9px; border-radius:7px; color:var(--fg)}
.hit:hover{background:var(--chip); text-decoration:none}
.hit .ht{font-size:13.5px; font-weight:600}
.hit .hs{font-size:12px; color:var(--muted); display:block; margin-top:2px}
.hit mark{background:transparent; color:var(--accent); font-weight:700}
.sb-note{padding:8px 10px; font-size:12.5px; color:var(--faint)}

/* --- badges / chips --- */
.badge{
  display:inline-block; font-size:10.5px; font-weight:700; line-height:1.5;
  padding:1px 6px; border-radius:5px; color:#fff; vertical-align:middle;
}
.badge.b-topic{background:var(--t-topic)} .badge.b-concept{background:var(--t-concept)}
.badge.b-entity{background:var(--t-entity)} .badge.b-source{background:var(--t-source)}
.badge.b-insight{background:var(--t-insight)} .badge.b-digest{background:var(--t-digest)}
.badge.b-op{background:var(--chip); color:var(--muted)}
.chip{
  display:inline-block; padding:1px 9px; margin:0 5px 5px 0; font-size:12.5px;
  border:1px solid var(--border); border-radius:20px; background:var(--chip); color:var(--fg);
}
a.chip:hover{border-color:var(--accent); color:var(--accent); text-decoration:none}

/* --- home --- */
h1.page-title{font-size:23px; line-height:1.4; margin:2px 0 8px}
.lede{color:var(--muted); margin:0 0 22px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.card{
  display:block; padding:14px 15px; border:1px solid var(--border); border-radius:10px;
  background:var(--panel); color:var(--fg);
}
.card:hover{border-color:var(--accent); text-decoration:none}
.card .ct{font-weight:700; font-size:15px; margin-bottom:4px}
.card .cs{font-size:13px; color:var(--muted); line-height:1.55}
.card .cm{margin-top:9px; font-size:11.5px; color:var(--faint)}
h2.sec-title{font-size:15px; margin:32px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border)}
.log-list{list-style:none; margin:0; padding:0}
.log-list li{display:flex; gap:9px; align-items:baseline; padding:5px 0; font-size:13.5px; border-bottom:1px dotted var(--border)}
.log-list .d{color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.stats{display:flex; flex-wrap:wrap; gap:8px}
.stat{border:1px solid var(--border); border-radius:8px; padding:7px 13px; background:var(--panel); font-size:13px}
.stat b{font-size:17px; margin-right:5px}

/* --- page view --- */
.meta{
  display:grid; grid-template-columns:max-content 1fr; gap:5px 14px; margin:14px 0 22px;
  padding:13px 15px; border:1px solid var(--border); border-radius:10px; background:var(--panel);
  font-size:13.5px;
}
.meta dt{color:var(--muted); font-size:12.5px; padding-top:1px}
.meta dd{margin:0; min-width:0}
.callout{
  margin:16px 0; padding:12px 15px; border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0; background:var(--quote);
}
.callout .cl-l{font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.04em}
.callout .cl-b{margin-top:5px; white-space:pre-wrap}
.callout .cl-b.none{color:var(--faint)}
.body{margin-top:6px}
.body h2{font-size:17px; margin:30px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--border)}
.body h3{font-size:14.5px; margin:20px 0 6px; color:var(--muted)}
.body p{margin:0 0 12px}
.body ul,.body ol{margin:0 0 12px; padding-left:22px}
.body li{margin-bottom:5px}
.body blockquote{
  margin:14px 0; padding:8px 16px; border-left:3px solid var(--border-strong);
  background:var(--quote); color:var(--fg); border-radius:0 6px 6px 0;
}
.body blockquote p:last-child{margin-bottom:0}
.body code{background:var(--code-bg); padding:1px 5px; border-radius:4px; font-size:.9em}
.body pre{background:var(--code-bg); padding:11px 13px; border-radius:8px; overflow-x:auto}
.body pre code{background:none; padding:0}
.tbl-wrap{overflow-x:auto; margin:0 0 14px}
.body table{border-collapse:collapse; font-size:13.5px}
.body th,.body td{border:1px solid var(--border); padding:6px 10px; text-align:left}
.body th{background:var(--chip)}
.body hr{border:0; border-top:1px solid var(--border); margin:22px 0}
.backlinks{list-style:none; margin:0; padding:0}
.backlinks li{padding:4px 0; font-size:13.5px}
.srcfoot{margin-top:36px; padding-top:10px; border-top:1px solid var(--border); font-size:12px; color:var(--faint)}
.notfound{padding:40px 0; color:var(--muted)}

/* --- markers --- */
.mk{
  display:inline-block; font-size:10.5px; font-weight:700; line-height:1.6;
  padding:0 6px; border-radius:5px; border:1px solid currentColor; vertical-align:middle;
}
.mk-stated{color:var(--mk-stated)} .mk-high{color:var(--mk-high)}
.mk-low{color:var(--mk-low)} .mk-disputed{color:var(--mk-disputed)}
.est{color:var(--est); text-decoration:underline; text-decoration-style:dotted}
.wl-missing{color:var(--missing); text-decoration:underline; text-decoration-style:dashed; cursor:help}
.cite{font-size:.86em; font-variant-numeric:tabular-nums; padding:0 2px; white-space:nowrap}
.cite-missing{font-size:.86em; color:var(--missing); text-decoration:underline; text-decoration-style:dashed}

/* --- graph --- */
#graph-wrap{border:1px solid var(--border); border-radius:10px; background:var(--panel); overflow:hidden}
#graph{display:block; width:100%; height:70vh; min-height:420px; touch-action:none; cursor:grab}
#graph.dragging{cursor:grabbing}
#graph line{stroke:var(--border-strong); stroke-width:1}
#graph .node circle{stroke:var(--panel); stroke-width:1.5}
#graph .node text{
  font-size:9px; fill:var(--fg); pointer-events:none; opacity:0;
  paint-order:stroke; stroke:var(--panel); stroke-width:2.5px; stroke-linejoin:round;
}
#graph .node.lbl text,#graph .node:hover text{opacity:1}
#graph .node{cursor:pointer}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 0; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px}
.ghelp{font-size:12.5px; color:var(--faint); margin-top:6px}
</style>
</head>

stra 와 일을 끝내는 방식 (S-2026-09-09-004)"},{"date":"2026-09-09","detail":"agent: claude changed: wiki/sources/S-2026-09-09-005-arena-coding-leaderboard-shift.md (new), wiki/entities/org-tencent.md (new), wiki/entities/{product-qwen,org-openai}.md (patched), wiki/concepts/{local-model-24gb-boundary,model-routing-token-economics}.md (patched), wiki/topics/open-local-models.md (patched), wiki/index.md notes: 코멘트 없음 → (추정) 2건. Elo 수치는 리더보드 스냅샷 전언(날짜 · 가격 단위 불명) → org-tencent confidence low. GLM · Grok 4.6 은 단발 언급이라 페이지 미생성.","op":"ingest","title":"이상선 — Arena 코딩 리더보드 판도 변화 (S-2026-09-09-005)"},{"date":"2026-09-09","detail":"agent: claude changed: wiki/sources/S-2026-09-09-002-crewon-ai-agent-runtime.md (new), wiki/concepts/ai-workforce-runtime.md (new), wiki/entities/org-crewon-ai.md (new), wiki/concepts/{task-level-agent-evaluation,agent-governance-guardrails,task-definition-bottleneck}.md (patched), wiki/entities/org-cognition.md (patched), wiki/topics/ai-agents-enterprise-adoption.md (patched), wiki/index.md notes: 코멘트 없음 → (추정) 3건. 모순 없음. 이번 배치 5건 중 4건이 \"실행 환경이 경쟁력\" 논지로 수렴 — topic 현재 종합에 반영. 사람 판단 필요: 크루온AI 가 경쟁사인지 협력사인지.","op":"ingest","title":"디지털데일리 — 크루온AI 기업용 AI 에이전트 런타임 (S-2026-09-09-002)"}],"pages":[{"aliases":["LLM Wiki gist","카파시 LLM 위키"],"back":["_unsorted","llm-wiki-pattern","person-andrej-karpathy","product-obsidian","rag-vs-persistent-wiki"],"cites":[],"confidence":"","created":"2026-09-08","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e질문할 때마다 원문을 다시 검색하는 RAG 와 달리, LLM 이 원본을 한 번 읽어 영속적인 마크다운 위키에 통합하고 계속 최신으로 유지하게 하는 패턴. 이 저장소의 설계 원전이다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eshared_note\u003c/code\u003e 는 \"시범 인제스트\". 공유 자료가 아니라 운영자가 파이프라인 검증용으로 넣은 자료다. 관심 추정은 하지 않는다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eRAG 는 질문마다 원문 조각을 다시 찾아 조립하므로 지식이 축적되지 않는다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e대안은 LLM 이 새 소스를 읽고 기존 위키에 통합하는 것이다 — 엔티티 페이지 갱신, 주제 요약 수정, 모순 표시. 지식은 한 번 컴파일되고 이후 최신으로 유지된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e구조는 3계층이다: 불변 원본(raw), LLM 이 전적으로 소유하는 위키, 그리고 구조 · 관례 · 워크플로를 정의하는 스키마 문서(CLAUDE.md 또는 AGENTS.md) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e운영은 세 작업으로 돌아간다: ingest(소스 1건이 10~15 페이지를 건드림), query(인용 달린 답, 좋은 답은 위키에 다시 파일링), lint(모순 · 정체 · 고아 · 누락 페이지 · 데이터 공백 점검) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e저자는 소스를 한 번에 하나씩, 사람이 관여하며 인제스트하는 방식을 선호한다. 배치 인제스트도 가능하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eindex.md(카탈로그) 와 log.md(시간순 기록) 두 파일이 탐색을 담당하며, 소스 ~100건 · 페이지 수백 개 규모까지는 임베딩 기반 RAG 없이 index 만으로 충분하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e위키가 커지면 로컬 검색 도구(qmd 등)를 붙인다. 초기에는 필요 없다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사람이 위키를 포기하는 이유는 유지보수(장부 정리) 부담이 가치보다 빨리 커지기 때문이며, LLM 은 이 비용을 거의 0 으로 만든다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사람의 역할은 소스 큐레이션, 분석 방향 설정, 좋은 질문. 나머지는 LLM 의 일이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e이 아이디어는 Vannevar Bush 의 Memex(1945) 와 정신적으로 연결된다 — 유지보수 주체 문제를 LLM 이 푼다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e문서는 의도적으로 추상적이며, 디렉토리 · 스키마 · 도구는 도메인에 맞게 각자 구체화하라고 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/llm-wiki-pattern\" class=\"wl\"\u003ellm-wiki-pattern\u003c/a\u003e — 이 문서가 정의하는 패턴 자체\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/rag-vs-persistent-wiki\" class=\"wl\"\u003erag-vs-persistent-wiki\u003c/a\u003e — RAG 의 \"축적 없음\" 한계와 그 대안\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/person-andrej-karpathy\" class=\"wl\"\u003eperson-andrej-karpathy\u003c/a\u003e — 저자\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-obsidian\" class=\"wl\"\u003eproduct-obsidian\u003c/a\u003e — 위키 열람 · 그래프 뷰 · 클리퍼 도구로 권장\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e이 저장소(CEO Insight Hub) 는 이 패턴의 구현이다. AGENTS.md 가 \"스키마 계층\", raw/ 와 wiki/ 가 나머지 두 계층에 대응한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e저자가 권하는 \"1건씩 사람이 관여하며 인제스트\" 가 우리 규칙 0-8(소스 1건 = 커밋 1개) 의 근거다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e임베딩 검색을 미루고 index.md + 텍스트 검색으로 시작하는 결정(규칙 8장) 도 이 문서의 규모 판단을 따른 것이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-001-karpathy-llm-wiki\" title=\"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴\"\u003eS-2026-09-08-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eInstead of just retrieving from raw documents at query time, the LLM \u003cstrong\u003eincrementally builds and maintains a persistent wiki\u003c/strong\u003e — a structured, interlinked collection of markdown files that sits between you and the raw sources.\u003c/p\u003e\n\u003cp\u003eObsidian is the IDE; the LLM is the programmer; the wiki is the codebase.\u003c/p\u003e\n\u003cp\u003eThis works surprisingly well at moderate scale (~100 sources, ~hundreds of pages) and avoids the need for embedding-based RAG infrastructure.\u003c/p\u003e\n\u003cp\u003eThe tedious part of maintaining a knowledge base is not the reading or the thinking — it's the bookkeeping.\u003c/p\u003e\n\u003cp\u003eThe human's job is to curate sources, direct the analysis, ask good questions, and think about what it all means. The LLM's job is everything else.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["llm-wiki-pattern","person-andrej-karpathy","product-obsidian","rag-vs-persistent-wiki"],"relpath":"wiki/sources/S-2026-09-08-001-karpathy-llm-wiki.md","sources":["S-2026-09-08-001"],"src":{"author":"Andrej Karpathy","file":"raw/2026/09/S-2026-09-08-001.html","origin":"url","published_at":"2026-08-19","shared_at":"2026-09-08","shared_by":"CEO","shared_note":"시범 인제스트","source_id":"S-2026-09-08-001","url":"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f"},"status":"draft","stem":"S-2026-09-08-001-karpathy-llm-wiki","summary":"RAG 대신 LLM 이 원본을 영속 위키로 컴파일 · 유지하는 3계층(raw/wiki/schema) 패턴과 ingest · query · lint 운영 방식","system":false,"text":"한 줄 요약\n질문할 때마다 원문을 다시 검색하는 RAG 와 달리, LLM 이 원본을 한 번 읽어 영속적인 마크다운 위키에 통합하고 계속 최신으로 유지하게 하는 패턴. 이 저장소의 설계 원전이다.\n관심 포인트\nsharednote 는 \"시범 인제스트\". 공유 자료가 아니라 운영자가 파이프라인 검증용으로 넣은 자료다. 관심 추정은 하지 않는다.\n핵심 주장\n1. RAG 는 질문마다 원문 조각을 다시 찾아 조립하므로 지식이 축적되지 않는다 {stated}\n2. 대안은 LLM 이 새 소스를 읽고 기존 위키에 통합하는 것이다 — 엔티티 페이지 갱신, 주제 요약 수정, 모순 표시. 지식은 한 번 컴파일되고 이후 최신으로 유지된다 {stated}\n3. 구조는 3계층이다: 불변 원본(raw), LLM 이 전적으로 소유하는 위키, 그리고 구조 · 관례 · 워크플로를 정의하는 스키마 문서(CLAUDE.md 또는 AGENTS.md) {stated}\n4. 운영은 세 작업으로 돌아간다: ingest(소스 1건이 10~15 페이지를 건드림), query(인용 달린 답, 좋은 답은 위키에 다시 파일링), lint(모순 · 정체 · 고아 · 누락 페이지 · 데이터 공백 점검) {stated}\n5. 저자는 소스를 한 번에 하나씩, 사람이 관여하며 인제스트하는 방식을 선호한다. 배치 인제스트도 가능하다 {stated}\n6. index.md(카탈로그) 와 log.md(시간순 기록) 두 파일이 탐색을 담당하며, 소스 ~100건 · 페이지 수백 개 규모까지는 임베딩 기반 RAG 없이 index 만으로 충분하다 {stated}\n7. 위키가 커지면 로컬 검색 도구(qmd 등)를 붙인다. 초기에는 필요 없다 {stated}\n8. 사람이 위키를 포기하는 이유는 유지보수(장부 정리) 부담이 가치보다 빨리 커지기 때문이며, LLM 은 이 비용을 거의 0 으로 만든다 {stated}\n9. 사람의 역할은 소스 큐레이션, 분석 방향 설정, 좋은 질문. 나머지는 LLM 의 일이다 {stated}\n10. 이 아이디어는 Vannevar Bush 의 Memex(1945) 와 정신적으로 연결된다 — 유지보수 주체 문제를 LLM 이 푼다 {stated}\n11. 문서는 의도적으로 추상적이며, 디렉토리 · 스키마 · 도구는 도메인에 맞게 각자 구체화하라고 한다 {stated}\n등장 개념 · 엔티티\nllm-wiki-pattern — 이 문서가 정의하는 패턴 자체\nrag-vs-persistent-wiki — RAG 의 \"축적 없음\" 한계와 그 대안\nperson-andrej-karpathy — 저자\nproduct-obsidian — 위키 열람 · 그래프 뷰 · 클리퍼 도구로 권장\n우리에게 주는 함의\n이 저장소(CEO Insight Hub) 는 이 패턴의 구현이다. AGENTS.md 가 \"스키마 계층\", raw/ 와 wiki/ 가 나머지 두 계층에 대응한다 [S-2026-09-08-001]\n저자가 권하는 \"1건씩 사람이 관여하며 인제스트\" 가 우리 규칙 0-8(소스 1건 = 커밋 1개) 의 근거다 [S-2026-09-08-001]\n임베딩 검색을 미루고 index.md + 텍스트 검색으로 시작하는 결정(규칙 8장) 도 이 문서의 규모 판단을 따른 것이다 [S-2026-09-08-001]\n주요 인용\nInstead of just retrieving from raw documents at query time, the LLM incrementally builds and maintains a persistent wiki — a structured, interlinked collection of markdown files that sits between you and the raw sources.\nObsidian is the IDE; the LLM is the programmer; the wiki is the codebase.\nThis works surprisingly well at moderate scale (~100 sources, ~hundreds of pages) and avoids the need for embedding-based RAG infrastructure.\nThe tedious part of maintaining a knowledge base is not the reading or the thinking — it's the bookkeeping.\nThe human's job is to curate sources, direct the analysis, ask good questions, and think about what it all means. The LLM's job is everything else.","title":"Karpathy — LLM Wiki: LLM 이 유지하는 개인 지식 베이스 패턴","topics":[],"type":"source","updated":"2026-09-08"},{"aliases":["코그니션 인터뷰","제프 왕 인터뷰","Cognition interview"],"back":["S-2026-09-08-006-local-agent-models-startlux","S-2026-09-09-002-crewon-ai-agent-runtime","S-2026-09-09-004-gpt-6-astra-task-completion","agent-governance-guardrails","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","ai-workforce-runtime","cloud-agent","forward-deployed-engineer","local-model-24gb-boundary","model-routing-token-economics","org-anthropic","org-cognition","org-openai","person-jeff-wang","proactive-agent","product-devin","sovereign-ai","task-definition-bottleneck","task-level-agent-evaluation"],"cites":[],"confidence":"","created":"2026-09-08","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e코그니션(Devin 개발사) 신사업 대표 제프 왕이 AI 코딩의 다음 단계를 클라우드 에이전트와 능동형 에이전트로 보고, 기업 AI 의 성패는 모델 성능이 아니라 업무 정의 · ROI 측정 · 모델 라우팅(토큰 경제) 에 달렸다고 말한 인터뷰.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 에이전트를 \"사람 대신 끝까지 일을 수행하는 단위\" 로 파는 방식 — 좌석 수가 아니라 완료한 일의 양으로 가격을 매기고 생산성 보증까지 거는 계약 구조\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e ROI 를 \"사람 환산 작업시간\" 으로 수치화하는 방법론. 우리 고객사에 AI 도입 효과를 설명할 때 쓸 수 있는 프레임\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 한국 금융 · 제조 시장과 소버린 AI 파트너십 언급 — 국내 진출 시 협력 또는 경쟁 상대가 될 회사\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eAI 코딩의 경쟁 축이 \"코드를 얼마나 잘 쓰나\" 에서 \"얼마나 많은 일을 끝까지 수행하나\" 로 이동하고 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사용 방식이 약 6개월마다 바뀌어 왔다: 자동완성 → 대화 → 코드베이스 컨텍스트 → 에이전트 → 클라우드 에이전트. 다음은 사람이 시키기 전에 문제를 발견해 움직이는 능동형(Proactive) 에이전트다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e클라우드 에이전트는 별도의 실행 환경(OS · 브라우저 · 저장소 · DB) 을 가져 코드를 쓰는 데 그치지 않고 실행 · 재현 · 테스트까지 한다. \"그럴듯한 코드\" 와 \"작동하는 코드\" 의 차이를 실행으로 메운다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e생산성 논리가 \"개발자 한 명이 얼마나 빨라지나\" 에서 \"한 사람이 동시에 몇 개 작업을 위임 · 관리하나\" 로 바뀐다. 코그니션 내부 코드의 90% 를 Devin 이 작성한다고 밝혔다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAI 도입의 병목은 모델이 아니라 업무 정의다. 무엇을 맡길지, 완료 조건(테스트 통과, 직접 실행 검증) 이 무엇인지 명확히 해야 하고, 프로젝트를 에이전트에게 줄 수 있는 단위로 나눠야 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e코그니션은 작업별로 모델을 라우팅한다(Claude · ChatGPT · Gemini · 자체 · 오픈소스). 모든 작업에 최상위 모델을 쓰면 비용이 10배가 되고, 최적 모델은 거의 매주 바뀐다. 특정 랩에 속하지 않은 독립성이 이를 가능하게 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eROI 측정: Devin 세션을 작업 유형별로 분류하고 사람이 했다면 걸렸을 시간을 \"사람 환산 작업시간(Human-equivalent hours)\" 으로 계산하며, 프로덕션 반영 여부까지 본다. 일부 계약에는 최대 1000만 달러 한도의 생산성 보증을 넣었다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e판매 기준이 좌석 · 라이선스 수에서 \"완료한 일의 양\" 으로 이동한다는 것이 코그니션의 주장이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eFDE(Forward Deployed Engineer) 는 고객 조직 안에서 레거시 현대화 같은 어려운 프로젝트를 맡되, 목표는 대신 끝내주는 것이 아니라 고객이 스스로 같은 방식으로 일하게 만드는 것이다. 계약 후 전환 관리자와 Applied AI 인력을 함께 투입한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e개발자의 역할은 작성에서 요구사항 · 아키텍처 · 우선순위 · 품질 기준 · 리스크 판단으로 올라간다. 코딩 비용이 낮아질수록 \"무엇을 만들지 잘못 정한 비용\" 이 커진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e생산성 10배는 \"같은 일을 적은 사람으로\" 또는 \"같은 사람으로 더 많은 일을\" 두 갈래이며, 어느 쪽인지는 기술이 아니라 경영진 선택이다. 최근에는 감원보다 채용 확대 현상이 보인다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e한국은 초기 시장이며 금융(COBOL · 메인프레임 탈피) 과 제조(자동차 등 소프트웨어화된 코드베이스) 를 본다. 금융 확산의 전제는 접근권한 · 감사로그 · 데이터 경계 · 책임소재다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e소버린 AI 는 자체 LLM 만의 문제가 아니다. 데이터가 어디 머무는지, AI 가 어느 시스템까지 접근하는지, 실행 기록을 누가 통제하는지가 에이전트 시대 소버린의 요소다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e에이전트의 경쟁력과 위험은 같은 곳(연결과 접근권한) 에서 나온다. 거버넌스와 가드레일이 먼저, 지능의 개방은 그다음이다. AGI 정의보다 기업 데이터 · 시스템과의 연결이 부족한 것이 실제 병목이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e기업가치: 기사 도입부는 약 460억 달러로 신규 투자 유치 중이라 하고, 해설은 400억~450억 달러 수준으로 논의 중이며 연환산 매출 8억 달러 초과라고 보도한다. 왕은 코멘트하지 않았다 \u003cspan class=\"mk mk-disputed\"\u003edisputed\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e · \u003ca href=\"#/sovereign-ai\" class=\"wl\"\u003esovereign-ai\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/cloud-agent\" class=\"wl\"\u003ecloud-agent\u003c/a\u003e — 독립 실행 환경을 가진 에이전트\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/proactive-agent\" class=\"wl\"\u003eproactive-agent\u003c/a\u003e — 시키기 전에 움직이는 다음 단계\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — 작업별 모델 선택과 토큰 비용\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ai-roi-human-equivalent-hours\" class=\"wl\"\u003eai-roi-human-equivalent-hours\u003c/a\u003e — ROI 측정과 생산성 보증\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/task-definition-bottleneck\" class=\"wl\"\u003etask-definition-bottleneck\u003c/a\u003e — 도입 병목은 업무 정의와 완료 조건\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/forward-deployed-engineer\" class=\"wl\"\u003eforward-deployed-engineer\u003c/a\u003e — FDE 의 역할 재정의\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 권한 · 책임 · 감사로그\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-cognition\" class=\"wl\"\u003eorg-cognition\u003c/a\u003e · \u003ca href=\"#/product-devin\" class=\"wl\"\u003eproduct-devin\u003c/a\u003e · \u003ca href=\"#/person-jeff-wang\" class=\"wl\"\u003eperson-jeff-wang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e · \u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e — 상장 준비 중, 특정 랩 종속 도구의 한계 사례로 언급\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e고객에게 AI 도입을 제안할 때 \"모델이 좋다\" 가 아니라 맡길 업무 · 완료 조건 · 사람 환산 시간을 먼저 정의하는 순서가 설득력이 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e우리 서비스도 최상위 모델 고정이 아니라 작업별 라우팅으로 비용 구조를 짜야 한다. 오픈웨이트 모델이 성능 동등 · 비용 1/10 이면 후보다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e한국 금융 · 제조 고객에게는 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 설계한 제품이 통한다. 소버린 논의도 \"어디서 실행되고 누가 기록을 통제하나\" 로 재구성할 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e지금은 AI가 코드를 얼마나 잘 쓰는가 여부가 관심이라면 이제는 얼마나 많은 일을 사람 대신 끝까지 수행할 수 있는가로 옮겨가고 있다\u003c/p\u003e\n\u003cp\u003e코딩에 가장 좋은 모델은 매주 바뀌는데, 특정 랩에 속한 도구는 그 랩의 모델에 묶인다는 것이다.\u003c/p\u003e\n\u003cp\u003e모든 기업이 AI가 좋다는 것은 안다. 하지만 실제로 얼마만큼의 ROI를 얻고 있는지는 모른다\u003c/p\u003e\n\u003cp\u003e에이전트 시대에는 ‘얼마나 많은 사람이 사용했는가’보다 \u003cstrong\u003e얼마나 많은 일을 완료했는가\u003c/strong\u003e가 가격과 계약의 기준으로 이동한다는 것이 코그니션의 주장이다.\u003c/p\u003e\n\u003cp\u003e소버린 AI를 자체 LLM을 만드는 문제로만 볼 필요는 없다. 에이전트 시대에는 어떤 모델을 사용할지뿐 아니라 \u003cstrong\u003e기업 데이터가 어디에 머무는지, AI가 어느 시스템까지 접근할 수 있는지, 실행 기록을 누가 통제하는지\u003c/strong\u003e도 소버린의 중요한 요소가 된다.\u003c/p\u003e\n\u003cp\u003eAI 에이전트의 경쟁력과 위험이 같은 곳에서 생기는 셈이다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["agent-governance-guardrails","ai-agents-enterprise-adoption","ai-roi-human-equivalent-hours","cloud-agent","forward-deployed-engineer","model-routing-token-economics","org-anthropic","org-cognition","org-openai","person-jeff-wang","proactive-agent","product-devin","sovereign-ai","task-definition-bottleneck"],"relpath":"wiki/sources/S-2026-09-08-002-cognition-jeff-wang-interview.md","sources":["S-2026-09-08-002"],"src":{"author":"손재권 (더밀크)","file":"raw/2026/09/S-2026-09-08-002.html","origin":"url","published_at":"2026-08-31","shared_at":"2026-09-08","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-08-002","url":"https://themiilk.com/articles/ab8c1204f"},"status":"draft","stem":"S-2026-09-08-002-cognition-jeff-wang-interview","summary":"코그니션 제프 왕 인터뷰. 클라우드 에이전트 → 능동형 에이전트, 업무별 모델 라우팅, ROI(사람 환산 시간) · 생산성 보증, FDE, 한국 금융 · 제조 · 소버린 AI","system":false,"text":"한 줄 요약\n코그니션(Devin 개발사) 신사업 대표 제프 왕이 AI 코딩의 다음 단계를 클라우드 에이전트와 능동형 에이전트로 보고, 기업 AI 의 성패는 모델 성능이 아니라 업무 정의 · ROI 측정 · 모델 라우팅(토큰 경제) 에 달렸다고 말한 인터뷰.\n관심 포인트\n(추정) 에이전트를 \"사람 대신 끝까지 일을 수행하는 단위\" 로 파는 방식 — 좌석 수가 아니라 완료한 일의 양으로 가격을 매기고 생산성 보증까지 거는 계약 구조\n(추정) ROI 를 \"사람 환산 작업시간\" 으로 수치화하는 방법론. 우리 고객사에 AI 도입 효과를 설명할 때 쓸 수 있는 프레임\n(추정) 한국 금융 · 제조 시장과 소버린 AI 파트너십 언급 — 국내 진출 시 협력 또는 경쟁 상대가 될 회사\n핵심 주장\n1. AI 코딩의 경쟁 축이 \"코드를 얼마나 잘 쓰나\" 에서 \"얼마나 많은 일을 끝까지 수행하나\" 로 이동하고 있다 {stated}\n2. 사용 방식이 약 6개월마다 바뀌어 왔다: 자동완성 → 대화 → 코드베이스 컨텍스트 → 에이전트 → 클라우드 에이전트. 다음은 사람이 시키기 전에 문제를 발견해 움직이는 능동형(Proactive) 에이전트다 {stated}\n3. 클라우드 에이전트는 별도의 실행 환경(OS · 브라우저 · 저장소 · DB) 을 가져 코드를 쓰는 데 그치지 않고 실행 · 재현 · 테스트까지 한다. \"그럴듯한 코드\" 와 \"작동하는 코드\" 의 차이를 실행으로 메운다 {stated}\n4. 생산성 논리가 \"개발자 한 명이 얼마나 빨라지나\" 에서 \"한 사람이 동시에 몇 개 작업을 위임 · 관리하나\" 로 바뀐다. 코그니션 내부 코드의 90% 를 Devin 이 작성한다고 밝혔다 {stated}\n5. AI 도입의 병목은 모델이 아니라 업무 정의다. 무엇을 맡길지, 완료 조건(테스트 통과, 직접 실행 검증) 이 무엇인지 명확히 해야 하고, 프로젝트를 에이전트에게 줄 수 있는 단위로 나눠야 한다 {stated}\n6. 코그니션은 작업별로 모델을 라우팅한다(Claude · ChatGPT · Gemini · 자체 · 오픈소스). 모든 작업에 최상위 모델을 쓰면 비용이 10배가 되고, 최적 모델은 거의 매주 바뀐다. 특정 랩에 속하지 않은 독립성이 이를 가능하게 한다 {stated}\n7. ROI 측정: Devin 세션을 작업 유형별로 분류하고 사람이 했다면 걸렸을 시간을 \"사람 환산 작업시간(Human-equivalent hours)\" 으로 계산하며, 프로덕션 반영 여부까지 본다. 일부 계약에는 최대 1000만 달러 한도의 생산성 보증을 넣었다 {stated}\n8. 판매 기준이 좌석 · 라이선스 수에서 \"완료한 일의 양\" 으로 이동한다는 것이 코그니션의 주장이다 {stated}\n9. FDE(Forward Deployed Engineer) 는 고객 조직 안에서 레거시 현대화 같은 어려운 프로젝트를 맡되, 목표는 대신 끝내주는 것이 아니라 고객이 스스로 같은 방식으로 일하게 만드는 것이다. 계약 후 전환 관리자와 Applied AI 인력을 함께 투입한다 {stated}\n10. 개발자의 역할은 작성에서 요구사항 · 아키텍처 · 우선순위 · 품질 기준 · 리스크 판단으로 올라간다. 코딩 비용이 낮아질수록 \"무엇을 만들지 잘못 정한 비용\" 이 커진다 {stated}\n11. 생산성 10배는 \"같은 일을 적은 사람으로\" 또는 \"같은 사람으로 더 많은 일을\" 두 갈래이며, 어느 쪽인지는 기술이 아니라 경영진 선택이다. 최근에는 감원보다 채용 확대 현상이 보인다 {stated}\n12. 한국은 초기 시장이며 금융(COBOL · 메인프레임 탈피) 과 제조(자동차 등 소프트웨어화된 코드베이스) 를 본다. 금융 확산의 전제는 접근권한 · 감사로그 · 데이터 경계 · 책임소재다 {stated}\n13. 소버린 AI 는 자체 LLM 만의 문제가 아니다. 데이터가 어디 머무는지, AI 가 어느 시스템까지 접근하는지, 실행 기록을 누가 통제하는지가 에이전트 시대 소버린의 요소다 {stated}\n14. 에이전트의 경쟁력과 위험은 같은 곳(연결과 접근권한) 에서 나온다. 거버넌스와 가드레일이 먼저, 지능의 개방은 그다음이다. AGI 정의보다 기업 데이터 · 시스템과의 연결이 부족한 것이 실제 병목이다 {stated}\n15. 기업가치: 기사 도입부는 약 460억 달러로 신규 투자 유치 중이라 하고, 해설은 400억~450억 달러 수준으로 논의 중이며 연환산 매출 8억 달러 초과라고 보도한다. 왕은 코멘트하지 않았다 {disputed}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption · sovereign-ai — 상위 주제\ncloud-agent — 독립 실행 환경을 가진 에이전트\nproactive-agent — 시키기 전에 움직이는 다음 단계\nmodel-routing-token-economics — 작업별 모델 선택과 토큰 비용\nai-roi-human-equivalent-hours — ROI 측정과 생산성 보증\ntask-definition-bottleneck — 도입 병목은 업무 정의와 완료 조건\nforward-deployed-engineer — FDE 의 역할 재정의\nagent-governance-guardrails — 권한 · 책임 · 감사로그\norg-cognition · product-devin · person-jeff-wang\norg-openai · org-anthropic — 상장 준비 중, 특정 랩 종속 도구의 한계 사례로 언급\n우리에게 주는 함의\n고객에게 AI 도입을 제안할 때 \"모델이 좋다\" 가 아니라 맡길 업무 · 완료 조건 · 사람 환산 시간을 먼저 정의하는 순서가 설득력이 있다 [S-2026-09-08-002]\n우리 서비스도 최상위 모델 고정이 아니라 작업별 라우팅으로 비용 구조를 짜야 한다. 오픈웨이트 모델이 성능 동등 · 비용 1/10 이면 후보다 [S-2026-09-08-002]\n한국 금융 · 제조 고객에게는 접근권한 · 감사로그 · 데이터 경계 · 책임소재를 먼저 설계한 제품이 통한다. 소버린 논의도 \"어디서 실행되고 누가 기록을 통제하나\" 로 재구성할 수 있다 [S-2026-09-08-002]\n주요 인용\n지금은 AI가 코드를 얼마나 잘 쓰는가 여부가 관심이라면 이제는 얼마나 많은 일을 사람 대신 끝까지 수행할 수 있는가로 옮겨가고 있다\n코딩에 가장 좋은 모델은 매주 바뀌는데, 특정 랩에 속한 도구는 그 랩의 모델에 묶인다는 것이다.\n모든 기업이 AI가 좋다는 것은 안다. 하지만 실제로 얼마만큼의 ROI를 얻고 있는지는 모른다\n에이전트 시대에는 ‘얼마나 많은 사람이 사용했는가’보다 얼마나 많은 일을 완료했는가가 가격과 계약의 기준으로 이동한다는 것이 코그니션의 주장이다.\n소버린 AI를 자체 LLM을 만드는 문제로만 볼 필요는 없다. 에이전트 시대에는 어떤 모델을 사용할지뿐 아니라 기업 데이터가 어디에 머무는지, AI가 어느 시스템까지 접근할 수 있는지, 실행 기록을 누가 통제하는지도 소버린의 중요한 요소가 된다.\nAI 에이전트의 경쟁력과 위험이 같은 곳에서 생기는 셈이다.","title":"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제","topics":["ai-agents-enterprise-adoption","sovereign-ai"],"type":"source","updated":"2026-09-08"},{"aliases":["AI Agents Push Humans Out of the Loop","인간 감독 보고서 소개"],"back":["agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","human-oversight-erosion","org-openai","product-gpt-6-astra"],"cites":[],"confidence":"","created":"2026-09-08","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eOpenAI 의 GPT-6 Astra 출시로 \"에이전트 시대\" 가 왔다고 선언하면서, 사람이 루프 안에 있다고 실질적 감독이 보장되지는 않는다는 정책 보고서(Mitchell · Ghosh · Passi, arXiv 2608.23642) 의 논지를 교육 관점에서 소개한 글.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 에이전트 도입 시 \"사람이 승인 버튼을 누른다\" 는 것만으로 안전을 주장할 수 없다는 점 — 고객 · 규제 대응에서 감독 설계를 어떻게 증명할 것인가\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 승인 피로와 역량 약화가 우리 조직 내부(에이전트로 개발하는 직원) 에도 그대로 적용된다는 점\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e GPT-6 Astra 의 범용 에이전트 능력(웹 · 문서 · 코드 실행 · 소프트웨어 사용) 이 현재 어디까지 왔는지\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eOpenAI 가 GPT-6 Astra 를 공개했고, 웹 서핑 · 문서 작업 · 코드 작성 및 실행 · 소프트웨어 사용 · 프레젠테이션 제작 등 도구를 활용한 복잡한 작업을 수행한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAI 는 질문에 답하는 것에서 계획 · 결정 · 도구 사용 · 행동 수행으로 나아가는 \"에이전트 시대\" 에 들어섰다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e사람이 루프 안에 있다고(검토 · 승인 · 개입 가능) 실질적 감독이 보장되지는 않는다. 수십 단계의 에이전트 작업을 이해 · 기억 · 예측 · 감시하는 것은 엄청난 인지 부담이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e승인 피로: \"허용 · 계속 · 승인\" 을 반복 클릭하다 보면 검토를 멈추고, 사람의 역할은 상징적인 것이 된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e자동화의 아이러니: 자동화가 더 많은 일을 할수록 사람은 평가 기술을 연습할 기회를 잃어 전문성이 약해지고, 정작 문제가 생겼을 때 개입할 준비가 덜 된다. \"감독은 감독자의 역량을 약화시킨다\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e처방으로 전략적 마찰을 제안한다: AI 추천을 보기 전에 스스로 판단하기, 승인 근거 설명하기, 일부를 AI 없이 수행하기, 판단이 중요한 순간에 멈추기. 그 외 정기적 자율 연습, 설계된 승인 시점, 휴식 · 작업 순환, 주의력 저하 인지 훈련 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e해당 보고서는 새 실험이 아니라 인지과학 · 자동화 · HCI · AI 연구를 종합한 정책 제안서다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e교육에서는 배경 지식이 없는 학생이 AI 산출물을 \"검토\" 할 수 없다는 문제로 나타난다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/human-oversight-erosion\" class=\"wl\"\u003ehuman-oversight-erosion\u003c/a\u003e — 승인 피로 · 자동화의 아이러니 · 전략적 마찰\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/agent-governance-guardrails\" class=\"wl\"\u003eagent-governance-guardrails\u003c/a\u003e — 승인 지점 설계와 맞닿음\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-openai\" class=\"wl\"\u003eorg-openai\u003c/a\u003e — GPT-6 Astra 출시 주체\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e에이전트 제품에 승인 버튼을 넣는 것만으로 \"human-in-the-loop\" 를 주장하면 규제 · 고객 감사에서 약하다. 승인 지점을 언제 · 왜 두는지, 사람이 무엇을 이해한 상태에서 승인하는지를 설계로 보여줘야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e내부 개발 조직도 마찬가지다. 에이전트가 코드를 대부분 쓰면 리뷰어의 역량이 약해진다. 전략적 마찰(일부는 직접 작성 · 승인 근거 기록) 을 프로세스에 넣을 근거가 된다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-003-agents-push-humans-out-of-loop\" title=\"Educators Technology — GPT-6 Astra 와 \u0026#x27;AI 에이전트가 인간을 루프 밖으로 밀어낸다\u0026#x27; 보고서 소개\"\u003eS-2026-09-08-003\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e점점 더 빨라지고, 자율성이 높아지며, 관리가 어려워지는 시스템을 인간이 의미 있게 감독할 수 있을까요?\u003c/p\u003e\n\u003cp\u003e기술적으로는 사람이 개입되어 있지만, 그 역할은 상징적인 것에 그치게 됩니다.\u003c/p\u003e\n\u003cp\u003e자동화 시스템의 능력이 향상될수록, 인간은 문제가 발생했을 때 개입할 준비가 덜 되어버릴 수 있다는 것입니다.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e감독은 감독자의 역량을 약화시킨다.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ehttps://arxiv.org/abs/2608.23642\u003c/p\u003e\n\u003c/blockquote\u003e","out":["agent-governance-guardrails","ai-agents-enterprise-adoption","human-oversight-erosion","org-openai"],"relpath":"wiki/sources/S-2026-09-08-003-agents-push-humans-out-of-loop.md","sources":["S-2026-09-08-003"],"src":{"author":"Educators Technology (페이스북 계정, 캐나다 교육 커뮤니티) — 한국어 번역 발췌","file":"raw/2026/09/S-2026-09-08-003.txt","origin":"text","published_at":"","shared_at":"2026-09-08","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-08-003","url":""},"status":"draft","stem":"S-2026-09-08-003-agents-push-humans-out-of-loop","summary":"GPT-6 Astra 출시를 계기로 에이전트 시대의 인간 감독 문제를 다룬 페이스북 글. 승인 피로 · 자동화의 아이러니 · 전략적 마찰 (Mitchell 외 정책 보고서 소개)","system":false,"text":"한 줄 요약\nOpenAI 의 GPT-6 Astra 출시로 \"에이전트 시대\" 가 왔다고 선언하면서, 사람이 루프 안에 있다고 실질적 감독이 보장되지는 않는다는 정책 보고서(Mitchell · Ghosh · Passi, arXiv 2608.23642) 의 논지를 교육 관점에서 소개한 글.\n관심 포인트\n(추정) 에이전트 도입 시 \"사람이 승인 버튼을 누른다\" 는 것만으로 안전을 주장할 수 없다는 점 — 고객 · 규제 대응에서 감독 설계를 어떻게 증명할 것인가\n(추정) 승인 피로와 역량 약화가 우리 조직 내부(에이전트로 개발하는 직원) 에도 그대로 적용된다는 점\n(추정) GPT-6 Astra 의 범용 에이전트 능력(웹 · 문서 · 코드 실행 · 소프트웨어 사용) 이 현재 어디까지 왔는지\n핵심 주장\n1. OpenAI 가 GPT-6 Astra 를 공개했고, 웹 서핑 · 문서 작업 · 코드 작성 및 실행 · 소프트웨어 사용 · 프레젠테이션 제작 등 도구를 활용한 복잡한 작업을 수행한다 {stated}\n2. AI 는 질문에 답하는 것에서 계획 · 결정 · 도구 사용 · 행동 수행으로 나아가는 \"에이전트 시대\" 에 들어섰다 {stated}\n3. 사람이 루프 안에 있다고(검토 · 승인 · 개입 가능) 실질적 감독이 보장되지는 않는다. 수십 단계의 에이전트 작업을 이해 · 기억 · 예측 · 감시하는 것은 엄청난 인지 부담이다 {stated}\n4. 승인 피로: \"허용 · 계속 · 승인\" 을 반복 클릭하다 보면 검토를 멈추고, 사람의 역할은 상징적인 것이 된다 {stated}\n5. 자동화의 아이러니: 자동화가 더 많은 일을 할수록 사람은 평가 기술을 연습할 기회를 잃어 전문성이 약해지고, 정작 문제가 생겼을 때 개입할 준비가 덜 된다. \"감독은 감독자의 역량을 약화시킨다\" {stated}\n6. 처방으로 전략적 마찰을 제안한다: AI 추천을 보기 전에 스스로 판단하기, 승인 근거 설명하기, 일부를 AI 없이 수행하기, 판단이 중요한 순간에 멈추기. 그 외 정기적 자율 연습, 설계된 승인 시점, 휴식 · 작업 순환, 주의력 저하 인지 훈련 {stated}\n7. 해당 보고서는 새 실험이 아니라 인지과학 · 자동화 · HCI · AI 연구를 종합한 정책 제안서다 {stated}\n8. 교육에서는 배경 지식이 없는 학생이 AI 산출물을 \"검토\" 할 수 없다는 문제로 나타난다 {stated}\n등장 개념 · 엔티티\nai-agents-enterprise-adoption — 상위 주제\nhuman-oversight-erosion — 승인 피로 · 자동화의 아이러니 · 전략적 마찰\nagent-governance-guardrails — 승인 지점 설계와 맞닿음\norg-openai — GPT-6 Astra 출시 주체\n우리에게 주는 함의\n에이전트 제품에 승인 버튼을 넣는 것만으로 \"human-in-the-loop\" 를 주장하면 규제 · 고객 감사에서 약하다. 승인 지점을 언제 · 왜 두는지, 사람이 무엇을 이해한 상태에서 승인하는지를 설계로 보여줘야 한다 [S-2026-09-08-003]\n내부 개발 조직도 마찬가지다. 에이전트가 코드를 대부분 쓰면 리뷰어의 역량이 약해진다. 전략적 마찰(일부는 직접 작성 · 승인 근거 기록) 을 프로세스에 넣을 근거가 된다 [S-2026-09-08-003]\n주요 인용\n점점 더 빨라지고, 자율성이 높아지며, 관리가 어려워지는 시스템을 인간이 의미 있게 감독할 수 있을까요?\n기술적으로는 사람이 개입되어 있지만, 그 역할은 상징적인 것에 그치게 됩니다.\n자동화 시스템의 능력이 향상될수록, 인간은 문제가 발생했을 때 개입할 준비가 덜 되어버릴 수 있다는 것입니다.\n감독은 감독자의 역량을 약화시킨다.\nhttps://arxiv.org/abs/2608.23642","title":"Educators Technology — GPT-6 Astra 와 'AI 에이전트가 인간을 루프 밖으로 밀어낸다' 보고서 소개","topics":["ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-08"},{"aliases":["Distillation 스펙트럼 글","레시피를 숨겨도 셰프는 복제된다"],"back":["_unsorted","distillation-defense-limits","knowledge-distillation","on-policy-distillation","org-anthropic","org-deepseek","post-training-agent-capability","small-model-self-improvement-loop"],"cites":[],"confidence":"","created":"2026-09-08","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eKnowledge distillation 의 역사(Hinton · Vinyals · Dean 2015) 에서 출발해, LLM 시대에는 답변 · 추론 과정 · 비평 · 순위 · 도구 궤적까지 모두 능력 이전 통로가 되어 distillation 과 일반 학습의 경계가 흐려졌으며, 서비스 가치를 지키면서 이를 완벽히 막는 것은 불가능하다고 논증하는 글. Anthropic 의 2026년 2월 \"산업적 규모 distillation 공격\" 주장을 계기로 썼다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 우리 모델 · API 출력이 경쟁사 학습 데이터가 될 위험과, 반대로 우리가 외부 모델 출력 · 판단을 학습에 쓸 때의 기술적 · 계약적 경계\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"능력의 상당 부분이 사후훈련에 있고, 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다\" 는 논지 — 우리 같은 회사의 전략적 위치\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 중국 모델 발전을 distillation 만으로 설명하면 안 된다는 경고 — 경쟁사 평가의 균형\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eDistillation 은 Hinton · Vinyals · Dean 의 2015년 논문이 teacher/student 와 soft target(dark knowledge) 개념으로 체계화했다. 원래 같은 조직 안에서 큰 모델을 작고 싸게 만드는 정상적인 경량화 기술이었다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eLLM 시대에는 teacher 가 전달하는 것이 확률 벡터를 넘어 완성 답변, 풀이 과정, 실패 수정법, 답안 순위, 코드 수정안, 도구 선택 순서, student 답안에 대한 비평까지 확장됐다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eAnthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 reasoning · coding · tool use 능력을 이전하려 했다고 주장하고, 이를 \"산업적 규모의 distillation 공격\" 으로 규정해 업계 · 정책당국의 공동 대응을 요구했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e방식의 스펙트럼: 가중치 · 상세 reasoning path 대량 확보(명백한 탈취) → output/sequence-level distillation(완성품 대량 관찰) → reasoning distillation(중간 추론까지) → on-policy distillation(student 가 헤맨 지점에서 teacher 교정) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eOn-policy distillation 은 student 가 스스로 생성한 궤적 위에서 teacher 의 token 확률 또는 교정 신호를 받아 exposure bias 를 줄인다. Google DeepMind 의 Generalized Knowledge Distillation 이 이를 정식화했다. 상용 API 는 logit 을 주지 않지만 다음 단계 작성 · 오류 지적 · 답안 순위 · 비교 평가로 유사한 신호를 얻을 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eLLM-as-a-Judge 의 점수 · 판단을 student 학습에 다시 쓰면(RLAIF, reward model, preference optimization, rejection sampling) 형식은 RL 이지만 실질은 teacher 능력 이전이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eRLVR(검증 가능한 보상) 은 teacher 없이 환경 신호로 학습하므로 본래 distillation 이 아니다(DeepSeek-R1-Zero 사례). 그러나 실제 시스템은 RLVR · on-policy distillation · rejection sampling · teacher critique 를 한 학습 과정에 결합한다(2026년 OPDVR 등) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eSelf-distillation(이전 checkpoint, 더 많은 context/tool 을 준 같은 모델, 작은 모델들의 상호 평가) 까지 고려하면 \"외부 모델 복제\" 와 무관해도 기술적으로는 distillation 이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e판단 기준은 알고리즘 이름(SFT/RL) 이 아니라 \"student 를 바꾼 답안과 평가 신호가 어디서 왔는가\" 다. 특정 teacher 의 답변 · 판단 · 교정 · 순위 · 행동 경로가 지속적 · 인과적 학습 신호였다면 넓은 의미의 distillation 이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e완벽한 방어는 어렵다. 정상 사용(코딩 에이전트의 대량 코드 작성, 교육 서비스의 대량 첨삭) 과 distillation 목적 사용이 본질적으로 구별되지 않고, 학습 가능성을 없애려면 답변 품질을 떨어뜨려야 해 서비스 가치가 함께 사라진다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e현실적 방어는 비용을 높이는 것이다: 계정 · 결제 분산 패턴 탐지, 체계적 능력 훑기 프롬프트 탐지, rate limit, 신원 확인, 출력 식별 신호, benchmark 유사 대량 질의 탐지, 계약 · 약관. 수학적으로 불가능하게 만들지는 못한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e중국 모델 발전 전체를 distillation 탓으로 돌리는 것은 위험하다. Distillation 은 강한 base model · 자체 pre-training · 데이터 · 컴퓨팅 · post-training 인프라가 있어야 마지막 격차를 줄이는 데 효과적이지, 약한 baseline 에서 frontier 를 만들지는 못한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e기술적 distillation, 약관 위반, IP 침해, 보안 공격은 서로 다른 문제다. 알고리즘 이름만으로 정당성 · 불법성을 판단해서는 안 된다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e(박상길 후기) 논문을 읽고 distillation 을 코드로 구현 · 공개했으며, 코딩 어시스턴트 도움을 받되 최종 구조 · 수식 대조 · 리뷰는 사람이 직접 했다. \"인간 책임자가 완전히 이해하고 통제한 코드로 내놓는 결과물은 여전히 가치가 있다\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/knowledge-distillation\" class=\"wl\"\u003eknowledge-distillation\u003c/a\u003e — 정의 · 역사 · soft target\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/on-policy-distillation\" class=\"wl\"\u003eon-policy-distillation\u003c/a\u003e — student 궤적 위의 teacher 교정\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/distillation-defense-limits\" class=\"wl\"\u003edistillation-defense-limits\u003c/a\u003e — 왜 완벽히 막을 수 없는가, 판단 기준\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-anthropic\" class=\"wl\"\u003eorg-anthropic\u003c/a\u003e — distillation 공격 주장 주체\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e — 피고발 기업, R1-Zero(RLVR) 사례\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e우리 API · 제품의 출력도 잠재적 학습 데이터다. 방어는 \"막기\" 가 아니라 \"비싸게 만들기 + 계약\" 이며, 정상 고객 가치와의 트레이드오프를 정해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e반대로 우리가 외부 frontier 모델을 judge · critique 로 써서 자체 모델을 개선하면 넓은 의미의 distillation 이 된다. 약관과 계약을 먼저 확인해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e에이전트 능력이 사후훈련 층에 있다면, 파운데이션 모델 없이도 우리 도메인 특화 능력을 얹을 수 있다. 단 강한 base model 위에서만 효과적이다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-004-distillation-spectrum-lee-dongsoo\" title=\"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계\"\u003eS-2026-09-08-004\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eTeacher의 답변을 학습하면 distillation이고, teacher의 점수를 이용하면 reinforcement learning이며, teacher의 비평을 사용하면 self-improvement라고 이름 붙일 수 있지만, 세 경우 모두 teacher의 판단이 없었다면 얻기 어려웠을 능력이 student로 이동할 수 있습니다.\u003c/p\u003e\n\u003cp\u003e완벽한 방어가 어려운 가장 큰 이유는 정상적인 서비스 사용과 distillation을 목적으로 한 서비스 요구 형태가 본질적으로 구별이 매우매우 어렵기 떄문입니다. [sic]\u003c/p\u003e\n\u003cp\u003edistillation은 마지막 성능 격차를 빠르게 줄이는 데 특히 효과적인 것이지, 절대 절대적인 수단이 될수는 없습니다. [sic]\u003c/p\u003e\n\u003cp\u003e기술적 distillation, 약관 위반, 지식재산권 침해와 보안 공격은 서로 다른 이야기라는 점 특히 명심해야 합니다.\u003c/p\u003e\n\u003cp\u003e“충분히 고도로 발전한 distillation은 일반적인 학습과 구별할 수 없다.”\u003c/p\u003e\n\u003cp\u003e인간 책임자가 완전히 이해하고 통제한 코드로 내놓는 결과물은 여전히 가치가 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["distillation-defense-limits","knowledge-distillation","on-policy-distillation","org-anthropic","org-deepseek"],"relpath":"wiki/sources/S-2026-09-08-004-distillation-spectrum-lee-dongsoo.md","sources":["S-2026-09-08-004"],"src":{"author":"이동수 (전 네이버클라우드) — 페이스북 발췌 2편 + 박상길 (Dnotitia) 후기","file":"raw/2026/09/S-2026-09-08-004.txt","origin":"text","published_at":"","shared_at":"2026-09-08","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-08-004","url":""},"status":"draft","stem":"S-2026-09-08-004-distillation-spectrum-lee-dongsoo","summary":"Distillation 이 logit 복사 → on-policy → LLM judge → RLVR 의 스펙트럼이 되어 정상 사용과 구별이 어렵고, 완벽 방어는 불가능하다는 해설","system":false,"text":"한 줄 요약\nKnowledge distillation 의 역사(Hinton · Vinyals · Dean 2015) 에서 출발해, LLM 시대에는 답변 · 추론 과정 · 비평 · 순위 · 도구 궤적까지 모두 능력 이전 통로가 되어 distillation 과 일반 학습의 경계가 흐려졌으며, 서비스 가치를 지키면서 이를 완벽히 막는 것은 불가능하다고 논증하는 글. Anthropic 의 2026년 2월 \"산업적 규모 distillation 공격\" 주장을 계기로 썼다.\n관심 포인트\n(추정) 우리 모델 · API 출력이 경쟁사 학습 데이터가 될 위험과, 반대로 우리가 외부 모델 출력 · 판단을 학습에 쓸 때의 기술적 · 계약적 경계\n(추정) \"능력의 상당 부분이 사후훈련에 있고, 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다\" 는 논지 — 우리 같은 회사의 전략적 위치\n(추정) 중국 모델 발전을 distillation 만으로 설명하면 안 된다는 경고 — 경쟁사 평가의 균형\n핵심 주장\n1. Distillation 은 Hinton · Vinyals · Dean 의 2015년 논문이 teacher/student 와 soft target(dark knowledge) 개념으로 체계화했다. 원래 같은 조직 안에서 큰 모델을 작고 싸게 만드는 정상적인 경량화 기술이었다 {stated}\n2. LLM 시대에는 teacher 가 전달하는 것이 확률 벡터를 넘어 완성 답변, 풀이 과정, 실패 수정법, 답안 순위, 코드 수정안, 도구 선택 순서, student 답안에 대한 비평까지 확장됐다 {stated}\n3. Anthropic 은 2026년 2월 DeepSeek · Moonshot AI · MiniMax 가 약 2만4천 개 계정으로 Claude 와 1,600만 건 넘는 대화를 생성해 reasoning · coding · tool use 능력을 이전하려 했다고 주장하고, 이를 \"산업적 규모의 distillation 공격\" 으로 규정해 업계 · 정책당국의 공동 대응을 요구했다 {stated}\n4. 방식의 스펙트럼: 가중치 · 상세 reasoning path 대량 확보(명백한 탈취) → output/sequence-level distillation(완성품 대량 관찰) → reasoning distillation(중간 추론까지) → on-policy distillation(student 가 헤맨 지점에서 teacher 교정) {stated}\n5. On-policy distillation 은 student 가 스스로 생성한 궤적 위에서 teacher 의 token 확률 또는 교정 신호를 받아 exposure bias 를 줄인다. Google DeepMind 의 Generalized Knowledge Distillation 이 이를 정식화했다. 상용 API 는 logit 을 주지 않지만 다음 단계 작성 · 오류 지적 · 답안 순위 · 비교 평가로 유사한 신호를 얻을 수 있다 {stated}\n6. LLM-as-a-Judge 의 점수 · 판단을 student 학습에 다시 쓰면(RLAIF, reward model, preference optimization, rejection sampling) 형식은 RL 이지만 실질은 teacher 능력 이전이다 {stated}\n7. RLVR(검증 가능한 보상) 은 teacher 없이 환경 신호로 학습하므로 본래 distillation 이 아니다(DeepSeek-R1-Zero 사례). 그러나 실제 시스템은 RLVR · on-policy distillation · rejection sampling · teacher critique 를 한 학습 과정에 결합한다(2026년 OPDVR 등) {stated}\n8. Self-distillation(이전 checkpoint, 더 많은 context/tool 을 준 같은 모델, 작은 모델들의 상호 평가) 까지 고려하면 \"외부 모델 복제\" 와 무관해도 기술적으로는 distillation 이다 {stated}\n9. 판단 기준은 알고리즘 이름(SFT/RL) 이 아니라 \"student 를 바꾼 답안과 평가 신호가 어디서 왔는가\" 다. 특정 teacher 의 답변 · 판단 · 교정 · 순위 · 행동 경로가 지속적 · 인과적 학습 신호였다면 넓은 의미의 distillation 이다 {stated}\n10. 완벽한 방어는 어렵다. 정상 사용(코딩 에이전트의 대량 코드 작성, 교육 서비스의 대량 첨삭) 과 distillation 목적 사용이 본질적으로 구별되지 않고, 학습 가능성을 없애려면 답변 품질을 떨어뜨려야 해 서비스 가치가 함께 사라진다 {stated}\n11. 현실적 방어는 비용을 높이는 것이다: 계정 · 결제 분산 패턴 탐지, 체계적 능력 훑기 프롬프트 탐지, rate limit, 신원 확인, 출력 식별 신호, benchmark 유사 대량 질의 탐지, 계약 · 약관. 수학적으로 불가능하게 만들지는 못한다 {stated}\n12. 중국 모델 발전 전체를 distillation 탓으로 돌리는 것은 위험하다. Distillation 은 강한 base model · 자체 pre-training · 데이터 · 컴퓨팅 · post-training 인프라가 있어야 마지막 격차를 줄이는 데 효과적이지, 약한 baseline 에서 frontier 를 만들지는 못한다 {stated}\n13. 기술적 distillation, 약관 위반, IP 침해, 보안 공격은 서로 다른 문제다. 알고리즘 이름만으로 정당성 · 불법성을 판단해서는 안 된다 {stated}\n14. (박상길 후기) 논문을 읽고 distillation 을 코드로 구현 · 공개했으며, 코딩 어시스턴트 도움을 받되 최종 구조 · 수식 대조 · 리뷰는 사람이 직접 했다. \"인간 책임자가 완전히 이해하고 통제한 코드로 내놓는 결과물은 여전히 가치가 있다\" {stated}\n등장 개념 · 엔티티\nknowledge-distillation — 정의 · 역사 · soft target\non-policy-distillation — student 궤적 위의 teacher 교정\ndistillation-defense-limits — 왜 완벽히 막을 수 없는가, 판단 기준\norg-anthropic — distillation 공격 주장 주체\norg-deepseek — 피고발 기업, R1-Zero(RLVR) 사례\n우리에게 주는 함의\n우리 API · 제품의 출력도 잠재적 학습 데이터다. 방어는 \"막기\" 가 아니라 \"비싸게 만들기 + 계약\" 이며, 정상 고객 가치와의 트레이드오프를 정해야 한다 [S-2026-09-08-004]\n반대로 우리가 외부 frontier 모델을 judge · critique 로 써서 자체 모델을 개선하면 넓은 의미의 distillation 이 된다. 약관과 계약을 먼저 확인해야 한다 [S-2026-09-08-004]\n에이전트 능력이 사후훈련 층에 있다면, 파운데이션 모델 없이도 우리 도메인 특화 능력을 얹을 수 있다. 단 강한 base model 위에서만 효과적이다 [S-2026-09-08-004]\n주요 인용\nTeacher의 답변을 학습하면 distillation이고, teacher의 점수를 이용하면 reinforcement learning이며, teacher의 비평을 사용하면 self-improvement라고 이름 붙일 수 있지만, 세 경우 모두 teacher의 판단이 없었다면 얻기 어려웠을 능력이 student로 이동할 수 있습니다.\n완벽한 방어가 어려운 가장 큰 이유는 정상적인 서비스 사용과 distillation을 목적으로 한 서비스 요구 형태가 본질적으로 구별이 매우매우 어렵기 떄문입니다. [sic]\ndistillation은 마지막 성능 격차를 빠르게 줄이는 데 특히 효과적인 것이지, 절대 절대적인 수단이 될수는 없습니다. [sic]\n기술적 distillation, 약관 위반, 지식재산권 침해와 보안 공격은 서로 다른 이야기라는 점 특히 명심해야 합니다.\n“충분히 고도로 발전한 distillation은 일반적인 학습과 구별할 수 없다.”\n인간 책임자가 완전히 이해하고 통제한 코드로 내놓는 결과물은 여전히 가치가 있습니다.","title":"이동수 — 레시피를 숨겨도 셰프는 복제된다: Distillation 의 경계와 방어 한계","topics":[],"type":"source","updated":"2026-09-08"},{"aliases":["K2 Horizon 공개","UAE 오픈소스 AI"],"back":["fully-open-source-model","open-local-models","org-mbzuai","product-k2-horizon"],"cites":[],"confidence":"","created":"2026-09-08","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e아부다비 MBZUAI 의 기초 모델 연구소(IFM) 가 가중치만이 아니라 소스 코드 · 전체 학습 데이터셋 · 평가 및 학습 레시피 · 중간 체크포인트까지 공개한 \"완전 오픈소스\" 파운데이션 모델 6종(0.9B~375B) 을 Apache 2.0 으로 내놓았다는 소식.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 완전 오픈소스 모델(데이터 · 레시피 포함) 이 우리 모델 개발의 출발점이 될 수 있는가 — Apache 2.0 이면 상업 이용 제약이 없다\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 0.9B · 3.7B · 7B 온디바이스급과 32B 온프레미스급 라인업 — 우리 제품이 겨냥하는 배포 환경과의 매칭\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 미국 · 중국 외 제3국(UAE) 이 국가 주도로 프론티어급 오픈소스를 내놓는 흐름\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eMBZUAI 산하 IFM 이 3일 'K2 Horizon' 6종 파운데이션 모델 라인업을 공개했다. 게시글에는 연도가 없고 \"3일\" 로만 적혀 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e가중치(오픈웨이트) 를 넘어 소스 코드, 전체 학습 데이터셋, 평가 · 학습 레시피, 학습 과정을 추적할 수 있는 중간 체크포인트까지 배포해 재현성과 투명성을 극대화했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e라이선스는 Apache 2.0, 허깅페이스에 공개 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eIFM 은 \"AI 역사상 최대 규모의 완전 오픈소스 모델 발표\" 라고 주장한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e6종 구성: 0.9B(스마트워치 · 스마트안경 등 극제약 온디바이스), 3.7B(미세조정 최적화, 4B 이하 최고 추론), 7B(스마트폰 구동, 소프트웨어 엔지니어링), 32B Dense(로컬 서버 · 온프레미스 · 고성능 노트북), 36B-A4B(활성 4B 의 저밀도 \"MoVA\" 아키텍처), 375B-A23B(플래그십, 복합 추론 · 에이전트 · 기업 워크로드) \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eIFM 은 추론 · 코딩 · 수학 · 에이전트 작업 전반에서 모든 규모 등급 최고 수준이며 0.9B · 3.7B · 7B 는 각 규모에서 새 최첨단 기록이라고 밝혔다 — 발표 주체의 자체 평가 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e0.9B 를 제외한 5개 모델은 핵심 아키텍처 · 어휘 · 배포 도구를 공유한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/fully-open-source-model\" class=\"wl\"\u003efully-open-source-model\u003c/a\u003e — 가중치 + 코드 + 데이터 + 레시피 공개\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-mbzuai\" class=\"wl\"\u003eorg-mbzuai\u003c/a\u003e — 발표 주체\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-k2-horizon\" class=\"wl\"\u003eproduct-k2-horizon\u003c/a\u003e — 모델 라인업\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eApache 2.0 완전 오픈소스에 학습 레시피와 데이터까지 있으면, 우리 도메인 데이터로 재학습 · 미세조정할 때 라이선스와 재현성 리스크가 낮다. 3.7B(미세조정 최적화) 와 32B(온프레미스) 가 우리 배포 환경 후보로 검토할 만하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e성능 주장은 발표 주체의 자체 평가이므로 도입 전 우리 과제로 재평가가 필요하다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-005-uae-k2-horizon-open-source\" title=\"UAE MBZUAI, 완전 오픈소스 AI \u0026#x27;K2 Horizon\u0026#x27; 6종 공개\"\u003eS-2026-09-08-005\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"K2 Horizon은 AI 역사상 최대 규모의 완전 오픈소스 모델 발표입니다. 코드, 훈련 데이터 및 레시피를 완전히 공개함으로써 투명성 측면에서 중요한 진전을 이루었습니다.\"\u003c/p\u003e\n\u003cp\u003e단순 가중치 배포를 넘어 소스 코드, 전체 학습 데이터셋, 평가 및 학습 레시피(방법론)까지 포함해 연구 재현성과 투명성을 극대화.\u003c/p\u003e\n\u003cp\u003e\"코딩 및 에이전트 기반 과제 전반에 걸쳐 모든 규모 등급에서 최고 수준의 성능을 보여주며, 특히 9억, 37억, 70억 매개변수 모델은 각 규모에서 새로운 최첨단 기록을 세웠습니다.\"\u003c/p\u003e\n\u003c/blockquote\u003e","out":["fully-open-source-model","open-local-models","org-mbzuai","product-k2-horizon"],"relpath":"wiki/sources/S-2026-09-08-005-uae-k2-horizon-open-source.md","sources":["S-2026-09-08-005"],"src":{"author":"미상 (뉴스 요약 게시글, 해시태그 #wonwizard)","file":"raw/2026/09/S-2026-09-08-005.txt","origin":"text","published_at":"","shared_at":"2026-09-08","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-08-005","url":""},"status":"draft","stem":"S-2026-09-08-005-uae-k2-horizon-open-source","summary":"MBZUAI 산하 IFM 이 0.9B~375B 파운데이션 모델 6종을 코드 · 학습 데이터 · 레시피 · 중간 체크포인트까지 Apache 2.0 으로 공개했다는 뉴스 요약","system":false,"text":"한 줄 요약\n아부다비 MBZUAI 의 기초 모델 연구소(IFM) 가 가중치만이 아니라 소스 코드 · 전체 학습 데이터셋 · 평가 및 학습 레시피 · 중간 체크포인트까지 공개한 \"완전 오픈소스\" 파운데이션 모델 6종(0.9B~375B) 을 Apache 2.0 으로 내놓았다는 소식.\n관심 포인트\n(추정) 완전 오픈소스 모델(데이터 · 레시피 포함) 이 우리 모델 개발의 출발점이 될 수 있는가 — Apache 2.0 이면 상업 이용 제약이 없다\n(추정) 0.9B · 3.7B · 7B 온디바이스급과 32B 온프레미스급 라인업 — 우리 제품이 겨냥하는 배포 환경과의 매칭\n(추정) 미국 · 중국 외 제3국(UAE) 이 국가 주도로 프론티어급 오픈소스를 내놓는 흐름\n핵심 주장\n1. MBZUAI 산하 IFM 이 3일 'K2 Horizon' 6종 파운데이션 모델 라인업을 공개했다. 게시글에는 연도가 없고 \"3일\" 로만 적혀 있다 {stated}\n2. 가중치(오픈웨이트) 를 넘어 소스 코드, 전체 학습 데이터셋, 평가 · 학습 레시피, 학습 과정을 추적할 수 있는 중간 체크포인트까지 배포해 재현성과 투명성을 극대화했다 {stated}\n3. 라이선스는 Apache 2.0, 허깅페이스에 공개 {stated}\n4. IFM 은 \"AI 역사상 최대 규모의 완전 오픈소스 모델 발표\" 라고 주장한다 {stated}\n5. 6종 구성: 0.9B(스마트워치 · 스마트안경 등 극제약 온디바이스), 3.7B(미세조정 최적화, 4B 이하 최고 추론), 7B(스마트폰 구동, 소프트웨어 엔지니어링), 32B Dense(로컬 서버 · 온프레미스 · 고성능 노트북), 36B-A4B(활성 4B 의 저밀도 \"MoVA\" 아키텍처), 375B-A23B(플래그십, 복합 추론 · 에이전트 · 기업 워크로드) {stated}\n6. IFM 은 추론 · 코딩 · 수학 · 에이전트 작업 전반에서 모든 규모 등급 최고 수준이며 0.9B · 3.7B · 7B 는 각 규모에서 새 최첨단 기록이라고 밝혔다 — 발표 주체의 자체 평가 {low}\n7. 0.9B 를 제외한 5개 모델은 핵심 아키텍처 · 어휘 · 배포 도구를 공유한다 {stated}\n등장 개념 · 엔티티\nopen-local-models — 상위 주제\nfully-open-source-model — 가중치 + 코드 + 데이터 + 레시피 공개\norg-mbzuai — 발표 주체\nproduct-k2-horizon — 모델 라인업\n우리에게 주는 함의\nApache 2.0 완전 오픈소스에 학습 레시피와 데이터까지 있으면, 우리 도메인 데이터로 재학습 · 미세조정할 때 라이선스와 재현성 리스크가 낮다. 3.7B(미세조정 최적화) 와 32B(온프레미스) 가 우리 배포 환경 후보로 검토할 만하다 [S-2026-09-08-005]\n성능 주장은 발표 주체의 자체 평가이므로 도입 전 우리 과제로 재평가가 필요하다 [S-2026-09-08-005]\n주요 인용\n\"K2 Horizon은 AI 역사상 최대 규모의 완전 오픈소스 모델 발표입니다. 코드, 훈련 데이터 및 레시피를 완전히 공개함으로써 투명성 측면에서 중요한 진전을 이루었습니다.\"\n단순 가중치 배포를 넘어 소스 코드, 전체 학습 데이터셋, 평가 및 학습 레시피(방법론)까지 포함해 연구 재현성과 투명성을 극대화.\n\"코딩 및 에이전트 기반 과제 전반에 걸쳐 모든 규모 등급에서 최고 수준의 성능을 보여주며, 특히 9억, 37억, 70억 매개변수 모델은 각 규모에서 새로운 최첨단 기록을 세웠습니다.\"","title":"UAE MBZUAI, 완전 오픈소스 AI 'K2 Horizon' 6종 공개","topics":["open-local-models"],"type":"source","updated":"2026-09-08"},{"aliases":["로컬 모델에 대한 철학과 이해","중국AI미래지도 로컬 모델","스타트럭스 글"],"back":["S-2026-09-09-003-shopify-small-model-beats-sol","S-2026-09-09-005-arena-coding-leaderboard-shift","ai-agents-enterprise-adoption","local-model-24gb-boundary","open-local-models","org-deepseek","org-startlux","person-chen-danian","post-training-agent-capability","product-muse-glimmer","product-qwen","small-model-self-improvement-loop","sovereign-ai"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview"],"confidence":"","created":"2026-09-08","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e2026년 하반기 들어 스케일링 법칙이 유일한 해법이 아니라는 흐름이 뚜렷해졌고, PC 한 대(24GB GPU) 에서 도는 27~30B 급 에이전트 특화 로컬 모델(StartLux · Qwen3.8 · Muse Glimmer) 이 조 단위 모델에 근접한 실무 성능을 내면서, 에이전트 주권이 데이터센터에서 책상 위로 옮겨가고 있으니 한국의 소버린 AI 를 데이터 주권 · 기술 자립 · 산업 통제력으로 재정의해야 한다는 글.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e \"에이전트 능력의 상당 부분이 사후훈련 층에 있고, 파운데이션 모델 없는 회사도 만들 수 있다\" — 우리가 취할 수 있는 포지션\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 국방 · 정무 · 금융 · 법률 · 회계 · 의료 등 데이터가 사옥을 못 벗어나는 고부가가치 산업에서 로컬 에이전트가 전제가 되어간다는 시장 판단\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 중국 기업이 시장 흐름을 먼저 읽는 속도에 대한 경계 — 샨다 · 미르의전설 사례를 든 이유\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e2026년 하반기, 수조 파라미터를 쌓는 스케일링 법칙이 유일한 해법이 아니라는 목소리가 힘을 얻고 있다. 배경은 에이전트가 실물 경제(금융 데이터 분석, 브라우저 조작) 와 맞닿으면서 크기보다 신뢰성 · 실행 능력이 척도가 된 것이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e중국 1세대 프로그래머 천다녠(Danny Chen, 샨다 공동창업) 이 은퇴 10년 만에 StartLux 를 창립했고, 첫 모델 StartLux-V1.0-27B-Preview 가 CAICT 신뢰 AI 대모형 MCP 특별 테스트에서 종합 2위(39.25%) 를 기록했다. 284B DeepSeek-V4-Flash(38.24%) 와 198B Step-3.7-Flash 를 앞섰고 1.6T DeepSeek-V4-Pro(40.55%) 에 1.3%p 차다. 위치 네비게이션 단독 1위, 금융 분석 · 브라우저 자동화 공동 1위. 3회 완주 평균 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eStartLux 모델은 사전학습부터 만든 것이 아니라 Alibaba Qwen3.6-27B 에 후훈련(post-training) 만 얹은 것이며, 같은 27B 원본보다 5.34%p 높다. 훈련 데이터는 과제 이해 · 도구 선택 · 파라미터 구성 · 다단계 실행 · 상태 점검 · 결과 검증을 집중 강화했고, 모델이 도구 환경에서 스스로 과제를 수행하며 환경 피드백으로 전략을 조정하는 \"오토 리서치\" 를 적용했다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e파라미터를 늘리지 않고 5%p 넘게 움직였다는 것은 에이전트 능력의 상당 부분이 사전학습이 아니라 사후훈련 층에 있다는 뜻이며, 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e천다녠은 로컬 모델이 3년 안에 Claude 와 대등해지고 시장의 80% 를 점유할 것이라 예측했다. \"스케일링 법칙은 지나가는 신선(過路神仙) 이다\" \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e24GB 가 새 경계선이다. Alibaba 는 2026-08-14 Qwen3.8-27B(Dense, 네이티브 멀티모달, 262K 컨텍스트, 64층 중 48층 선형 어텐션으로 KV 캐시 층 1/4) 를 Apache 2.0 으로 공개했고 4비트 양자화로 약 17GB 가 되어 24GB 소비자 GPU 에 올라간다. Meta 슈퍼인텔리전스랩은 2026-08-10 Muse Glimmer(30B Dense + 1.8B 지각 인코더, 120K+ 컨텍스트, 4비트 17~20GB) 를 같은 라이선스로 공개했다. 세 모델이 27~30B 에 모인 것은 우연이 아니라 소비자 GPU 한 장의 메모리가 설계 제약이 됐기 때문이다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e클라우드 시장은 사라지지 않고 역할이 재편된다. 2026년 글로벌 AI 투자는 2조 5,200억 달러(전년 대비 +44%) 로 전망되며 인프라가 절반을 넘는다. Microsoft 는 Azure Local, Google 은 경량 Flash 계열로 로컬을 흡수한다. 미래는 \"어떤 작업을 어디서 처리할지\" 가 정해지는 계층 구조다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e실물 경제가 원하는 것은 만능 제너럴리스트가 아니라 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트다. StartLux 시연: 금융 분석에서 Claude Sonnet 4.6 은 비거래일 오판으로 47,254달러(89.02%), StartLux 는 47,499.09달러(90.00%); 브라우저 자동화(싱가포르–베이징 최저가 직항) 에서 Claude 는 200초+ · 21단계 · 556달러, StartLux 는 95초 · 12단계 · 299달러 — 회사 측 시연 \u003cspan class=\"mk mk-low\"\u003elow\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e로컬 모델이 선택되는 이유는 정확도만이 아니라 검증 가능성, 사용자 통제권, 데이터가 손안을 떠나지 않는 것이다. 의료 · 금융 · 법률 · 국방에서 로컬 에이전트는 선택이 아니라 전제가 되어간다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e샨다는 2001년 미르의전설2 중국 대리권을 확보해 국민게임으로 키운 뒤 로열티 거부 · 계약 파기 · 유사 게임 출시 · 액토즈 지분 인수로 한국 게임 산업에 상처를 남겼다. 당시 주도자는 형 천톈차오였고 2017년 이후 논란은 천씨 형제가 떠난 뒤의 일이지만, \"기술보다 시장 흐름을 먼저 읽는 능력\" 의 교훈은 유효하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e소버린 AI 를 국내 모델 개발을 넘어 데이터 주권(민감 데이터의 국내 처리, 로컬 인프라), 기술 자립(Qwen · Meta 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 · 에이전트 투자), 산업 통제력(국방 · 정무 · 금융 · 법률용 레퍼런스 모델과 데이터 표준) 으로 재정의해야 한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e한국은 온디바이스 하드웨어(메모리 · NPU) 에 강하지만 StartLux 가 증명한 층은 하드웨어가 아니라 사후훈련이다. StartLux 는 가중치가 아니라 오피스 설치하듯 한 번에 끝나는 로컬 지능 솔루션을 팔며, 정부 규제 통과 프레임까지 설계해 두었다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e · \u003ca href=\"#/sovereign-ai\" class=\"wl\"\u003esovereign-ai\u003c/a\u003e · \u003ca href=\"#/ai-agents-enterprise-adoption\" class=\"wl\"\u003eai-agents-enterprise-adoption\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/local-model-24gb-boundary\" class=\"wl\"\u003elocal-model-24gb-boundary\u003c/a\u003e — 소비자 GPU 한 장이 만든 27~30B 표준\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/post-training-agent-capability\" class=\"wl\"\u003epost-training-agent-capability\u003c/a\u003e — 에이전트 능력은 사후훈련 층에\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/fully-open-source-model\" class=\"wl\"\u003efully-open-source-model\u003c/a\u003e — Qwen3.8 · Muse Glimmer 의 Apache 2.0 공개와 연결\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/org-startlux\" class=\"wl\"\u003eorg-startlux\u003c/a\u003e · \u003ca href=\"#/person-chen-danian\" class=\"wl\"\u003eperson-chen-danian\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-qwen\" class=\"wl\"\u003eproduct-qwen\u003c/a\u003e · \u003ca href=\"#/product-muse-glimmer\" class=\"wl\"\u003eproduct-muse-glimmer\u003c/a\u003e · \u003ca href=\"#/org-deepseek\" class=\"wl\"\u003eorg-deepseek\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/model-routing-token-economics\" class=\"wl\"\u003emodel-routing-token-economics\u003c/a\u003e — \"어떤 작업을 어디서\" 의 클라우드 · 로컬 계층화\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e파운데이션 모델 없이 강한 오픈 base(Qwen · K2 Horizon 급) 위에 도메인 특화 사후훈련을 얹는 것이 현실적인 포지션이다. 이때 훈련 데이터는 텍스트가 아니라 도구 선택 · 다단계 실행 · 검증 같은 에이전트 행동이어야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e24GB 한 장에서 도는 제품 규격(27B 4비트 ≈ 17GB) 을 배포 목표로 삼으면 금융 · 의료 · 국방 고객의 온프레미스 요구와 맞는다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e소버린 AI 를 \"국산 LLM\" 이 아니라 데이터 위치 · 통제권 · 산업 표준으로 재정의하는 담론은 코그니션 인터뷰의 관점과 일치한다. 우리 제안서의 프레임으로 쓸 수 있다 \u003ca class=\"cite\" href=\"#/S-2026-09-08-006-local-agent-models-startlux\" title=\"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의\"\u003eS-2026-09-08-006\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-08-002-cognition-jeff-wang-interview\" title=\"더밀크 단독 인터뷰 — 코그니션 제프 왕: 12개월 일을 1개월에, AI 생산성과 토큰 경제\"\u003eS-2026-09-08-002\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e수조 개의 파라미터를 쌓아 올리는 '스케일링 법칙(Scaling Law)'이 더 이상 유일한 해법이 아니라는 목소리가 설득력을 얻기 시작한 것입니다.\u003c/p\u003e\n\u003cp\u003e약 60배 작은 모델이 조 단위 모델의 능력 구간에 진입한 것입니다.\u003c/p\u003e\n\u003cp\u003e파라미터를 늘리지 않고도 점수가 5%포인트 넘게 움직였다는 것은, 에이전트 능력의 상당 부분이 사전 학습이 아니라 사후 훈련 층에 얹혀 있다는 뜻입니다. 그리고 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있습니다.\u003c/p\u003e\n\u003cp\u003e클라우드에서는 모델이 인프라에 맞춰 커졌지만 로컬에서는 인프라가 모델의 상한을 정합니다. 제약이 표준을 만들고 표준이 생태계를 만듭니다.\u003c/p\u003e\n\u003cp\u003e이는 단순한 기술적 전환이 아니며  AI의 통제권이 소수 기업의 데이터센터에서 개인과 기업의 책상 위로 이동하는 에이전트 주권(Sovereignty)의 이전입니다. [sic]\u003c/p\u003e\n\u003cp\u003e스타트럭스가 증명한 층은 하드웨어가 아니라 사후훈련입니다.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-08-002-cognition-jeff-wang-interview","ai-agents-enterprise-adoption","fully-open-source-model","local-model-24gb-boundary","model-routing-token-economics","open-local-models","org-deepseek","org-startlux","person-chen-danian","post-training-agent-capability","product-muse-glimmer","product-qwen","sovereign-ai"],"relpath":"wiki/sources/S-2026-09-08-006-local-agent-models-startlux.md","sources":["S-2026-09-08-006"],"src":{"author":"임선영 — 페이스북 발췌 (#중국AI미래지도)","file":"raw/2026/09/S-2026-09-08-006.txt","origin":"text","published_at":"","shared_at":"2026-09-08","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-08-006","url":""},"status":"draft","stem":"S-2026-09-08-006-local-agent-models-startlux","summary":"StartLux 27B 가 1.6T 모델에 근접, Qwen3.8 · Muse Glimmer 와 24GB 로컬 표준 형성. 에이전트 능력은 후훈련 층에 있고 소버린 AI 를 재정의하자는 글","system":false,"text":"한 줄 요약\n2026년 하반기 들어 스케일링 법칙이 유일한 해법이 아니라는 흐름이 뚜렷해졌고, PC 한 대(24GB GPU) 에서 도는 27~30B 급 에이전트 특화 로컬 모델(StartLux · Qwen3.8 · Muse Glimmer) 이 조 단위 모델에 근접한 실무 성능을 내면서, 에이전트 주권이 데이터센터에서 책상 위로 옮겨가고 있으니 한국의 소버린 AI 를 데이터 주권 · 기술 자립 · 산업 통제력으로 재정의해야 한다는 글.\n관심 포인트\n(추정) \"에이전트 능력의 상당 부분이 사후훈련 층에 있고, 파운데이션 모델 없는 회사도 만들 수 있다\" — 우리가 취할 수 있는 포지션\n(추정) 국방 · 정무 · 금융 · 법률 · 회계 · 의료 등 데이터가 사옥을 못 벗어나는 고부가가치 산업에서 로컬 에이전트가 전제가 되어간다는 시장 판단\n(추정) 중국 기업이 시장 흐름을 먼저 읽는 속도에 대한 경계 — 샨다 · 미르의전설 사례를 든 이유\n핵심 주장\n1. 2026년 하반기, 수조 파라미터를 쌓는 스케일링 법칙이 유일한 해법이 아니라는 목소리가 힘을 얻고 있다. 배경은 에이전트가 실물 경제(금융 데이터 분석, 브라우저 조작) 와 맞닿으면서 크기보다 신뢰성 · 실행 능력이 척도가 된 것이다 {stated}\n2. 중국 1세대 프로그래머 천다녠(Danny Chen, 샨다 공동창업) 이 은퇴 10년 만에 StartLux 를 창립했고, 첫 모델 StartLux-V1.0-27B-Preview 가 CAICT 신뢰 AI 대모형 MCP 특별 테스트에서 종합 2위(39.25%) 를 기록했다. 284B DeepSeek-V4-Flash(38.24%) 와 198B Step-3.7-Flash 를 앞섰고 1.6T DeepSeek-V4-Pro(40.55%) 에 1.3%p 차다. 위치 네비게이션 단독 1위, 금융 분석 · 브라우저 자동화 공동 1위. 3회 완주 평균 {stated}\n3. StartLux 모델은 사전학습부터 만든 것이 아니라 Alibaba Qwen3.6-27B 에 후훈련(post-training) 만 얹은 것이며, 같은 27B 원본보다 5.34%p 높다. 훈련 데이터는 과제 이해 · 도구 선택 · 파라미터 구성 · 다단계 실행 · 상태 점검 · 결과 검증을 집중 강화했고, 모델이 도구 환경에서 스스로 과제를 수행하며 환경 피드백으로 전략을 조정하는 \"오토 리서치\" 를 적용했다 {stated}\n4. 파라미터를 늘리지 않고 5%p 넘게 움직였다는 것은 에이전트 능력의 상당 부분이 사전학습이 아니라 사후훈련 층에 있다는 뜻이며, 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있다 {stated}\n5. 천다녠은 로컬 모델이 3년 안에 Claude 와 대등해지고 시장의 80% 를 점유할 것이라 예측했다. \"스케일링 법칙은 지나가는 신선(過路神仙) 이다\" {stated}\n6. 24GB 가 새 경계선이다. Alibaba 는 2026-08-14 Qwen3.8-27B(Dense, 네이티브 멀티모달, 262K 컨텍스트, 64층 중 48층 선형 어텐션으로 KV 캐시 층 1/4) 를 Apache 2.0 으로 공개했고 4비트 양자화로 약 17GB 가 되어 24GB 소비자 GPU 에 올라간다. Meta 슈퍼인텔리전스랩은 2026-08-10 Muse Glimmer(30B Dense + 1.8B 지각 인코더, 120K+ 컨텍스트, 4비트 17~20GB) 를 같은 라이선스로 공개했다. 세 모델이 27~30B 에 모인 것은 우연이 아니라 소비자 GPU 한 장의 메모리가 설계 제약이 됐기 때문이다 {stated}\n7. 클라우드 시장은 사라지지 않고 역할이 재편된다. 2026년 글로벌 AI 투자는 2조 5,200억 달러(전년 대비 +44%) 로 전망되며 인프라가 절반을 넘는다. Microsoft 는 Azure Local, Google 은 경량 Flash 계열로 로컬을 흡수한다. 미래는 \"어떤 작업을 어디서 처리할지\" 가 정해지는 계층 구조다 {stated}\n8. 실물 경제가 원하는 것은 만능 제너럴리스트가 아니라 자기 업무를 실수 없이 완수하는 스페셜리스트 에이전트다. StartLux 시연: 금융 분석에서 Claude Sonnet 4.6 은 비거래일 오판으로 47,254달러(89.02%), StartLux 는 47,499.09달러(90.00%); 브라우저 자동화(싱가포르–베이징 최저가 직항) 에서 Claude 는 200초+ · 21단계 · 556달러, StartLux 는 95초 · 12단계 · 299달러 — 회사 측 시연 {low}\n9. 로컬 모델이 선택되는 이유는 정확도만이 아니라 검증 가능성, 사용자 통제권, 데이터가 손안을 떠나지 않는 것이다. 의료 · 금융 · 법률 · 국방에서 로컬 에이전트는 선택이 아니라 전제가 되어간다 {stated}\n10. 샨다는 2001년 미르의전설2 중국 대리권을 확보해 국민게임으로 키운 뒤 로열티 거부 · 계약 파기 · 유사 게임 출시 · 액토즈 지분 인수로 한국 게임 산업에 상처를 남겼다. 당시 주도자는 형 천톈차오였고 2017년 이후 논란은 천씨 형제가 떠난 뒤의 일이지만, \"기술보다 시장 흐름을 먼저 읽는 능력\" 의 교훈은 유효하다 {stated}\n11. 소버린 AI 를 국내 모델 개발을 넘어 데이터 주권(민감 데이터의 국내 처리, 로컬 인프라), 기술 자립(Qwen · Meta 가 오픈소스 생태계를 장악하기 전에 한국형 로컬 모델 · 에이전트 투자), 산업 통제력(국방 · 정무 · 금융 · 법률용 레퍼런스 모델과 데이터 표준) 으로 재정의해야 한다 {stated}\n12. 한국은 온디바이스 하드웨어(메모리 · NPU) 에 강하지만 StartLux 가 증명한 층은 하드웨어가 아니라 사후훈련이다. StartLux 는 가중치가 아니라 오피스 설치하듯 한 번에 끝나는 로컬 지능 솔루션을 팔며, 정부 규제 통과 프레임까지 설계해 두었다 {stated}\n등장 개념 · 엔티티\nopen-local-models · sovereign-ai · ai-agents-enterprise-adoption — 상위 주제\nlocal-model-24gb-boundary — 소비자 GPU 한 장이 만든 27~30B 표준\npost-training-agent-capability — 에이전트 능력은 사후훈련 층에\nfully-open-source-model — Qwen3.8 · Muse Glimmer 의 Apache 2.0 공개와 연결\norg-startlux · person-chen-danian\nproduct-qwen · product-muse-glimmer · org-deepseek\nmodel-routing-token-economics — \"어떤 작업을 어디서\" 의 클라우드 · 로컬 계층화\n우리에게 주는 함의\n파운데이션 모델 없이 강한 오픈 base(Qwen · K2 Horizon 급) 위에 도메인 특화 사후훈련을 얹는 것이 현실적인 포지션이다. 이때 훈련 데이터는 텍스트가 아니라 도구 선택 · 다단계 실행 · 검증 같은 에이전트 행동이어야 한다 [S-2026-09-08-006]\n24GB 한 장에서 도는 제품 규격(27B 4비트 ≈ 17GB) 을 배포 목표로 삼으면 금융 · 의료 · 국방 고객의 온프레미스 요구와 맞는다 [S-2026-09-08-006]\n소버린 AI 를 \"국산 LLM\" 이 아니라 데이터 위치 · 통제권 · 산업 표준으로 재정의하는 담론은 코그니션 인터뷰의 관점과 일치한다. 우리 제안서의 프레임으로 쓸 수 있다 [S-2026-09-08-006] [S-2026-09-08-002]\n주요 인용\n수조 개의 파라미터를 쌓아 올리는 '스케일링 법칙(Scaling Law)'이 더 이상 유일한 해법이 아니라는 목소리가 설득력을 얻기 시작한 것입니다.\n약 60배 작은 모델이 조 단위 모델의 능력 구간에 진입한 것입니다.\n파라미터를 늘리지 않고도 점수가 5%포인트 넘게 움직였다는 것은, 에이전트 능력의 상당 부분이 사전 학습이 아니라 사후 훈련 층에 얹혀 있다는 뜻입니다. 그리고 이 층은 파운데이션 모델을 소유하지 않은 회사도 만들 수 있습니다.\n클라우드에서는 모델이 인프라에 맞춰 커졌지만 로컬에서는 인프라가 모델의 상한을 정합니다. 제약이 표준을 만들고 표준이 생태계를 만듭니다.\n이는 단순한 기술적 전환이 아니며 AI의 통제권이 소수 기업의 데이터센터에서 개인과 기업의 책상 위로 이동하는 에이전트 주권(Sovereignty)의 이전입니다. [sic]\n스타트럭스가 증명한 층은 하드웨어가 아니라 사후훈련입니다.","title":"임선영 — 로컬 모델에 대한 철학과 이해: 스케일링 법칙 이후, 에이전트 특화 로컬 모델과 소버린 AI 재정의","topics":["open-local-models","sovereign-ai","ai-agents-enterprise-adoption"],"type":"source","updated":"2026-09-08"},{"aliases":["tangleml.com","Tangle 소개 페이지"],"back":["open-local-models","product-tangle"],"cites":["S-2026-09-09-003-shopify-small-model-beats-sol"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003eTangle 이라는 ML 파이프라인 도구의 제품 랜딩 페이지. 비주얼 편집기로 파이프라인을 만들고, 컴포넌트를 재사용하고, 어떤 언어든 컨테이너로 감싸 실행하며, 중간 결과를 콘텐츠 기반으로 캐시한다. 오픈소스 기반이라고 밝힌다. 본문에 Shopify 나 소형 모델 학습에 대한 언급은 없다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 같은 날 공유한 Shopify 소형 모델 사례의 \"오픈소스 기반 기술 Tangle\" 을 직접 보라는 뜻으로 추정\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"est\"\u003e(추정)\u003c/span\u003e 우리 학습 파이프라인(평가 → 실패 수집 → 재학습) 을 이 도구 위에 올릴 수 있는지\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e핵심 주장\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e비주얼 편집기로 복잡한 ML 워크플로를 만들 수 있고, 코드를 쓰지 않아도 컴포넌트 연결과 인자 설정이 가능하다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e어떤 파이프라인이든 복제 · 편집 · 실행할 수 있고, 컴포넌트 라이브러리의 재사용 모듈을 쓰거나 자기 것을 추가할 수 있다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e플랫폼 무관: 기존 코드를 앱 내 편집기에서 컨테이너로 감싸 어떤 언어 · 프레임워크든 실행한다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e콘텐츠 기반 실행 캐시로 중간 결과를 저장해 실험 시간과 컴퓨팅 비용을 줄인다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e오픈소스 기반으로 만들어졌으며 GitHub 에서 기여 · 이슈 · 코드 열람이 가능하다고 한다. 저장소 주소는 이 페이지 본문에 없다 \u003cspan class=\"mk mk-stated\"\u003estated\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e등장 개념 · 엔티티\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/open-local-models\" class=\"wl\"\u003eopen-local-models\u003c/a\u003e — 상위 주제\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/product-tangle\" class=\"wl\"\u003eproduct-tangle\u003c/a\u003e — 이 페이지의 제품\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/small-model-self-improvement-loop\" class=\"wl\"\u003esmall-model-self-improvement-loop\u003c/a\u003e — Shopify 사례가 말한 파이프라인 기술과의 관계는 미확인\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e우리에게 주는 함의\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e페이지 내용만으로는 Shopify 의 Tangle 과 동일한지 알 수 없다. 저장소를 직접 찾아 확인한 뒤 판단해야 한다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" title=\"tangleml.com — Tangle: 비주얼 ML 파이프라인 에디터 (제품 소개 페이지)\"\u003eS-2026-09-09-001\u003c/a\u003e \u003ca class=\"cite\" href=\"#/S-2026-09-09-003-shopify-small-model-beats-sol\" title=\"Shopify, 0.8B 소형 모델을 자기개선 루프로 미세조정해 특정 업무에서 GPT-5.6 Sol 을 이김\"\u003eS-2026-09-09-003\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e동일하다면 \"실제 업무 결과 평가 → 실패 재학습\" 루프를 파이프라인 컴포넌트로 구성하고 캐시로 반복 실험 비용을 줄이는 용도로 검토할 만하다 \u003ca class=\"cite\" href=\"#/S-2026-09-09-001-tangle-visual-ml-pipeline\" title=\"tangleml.com — Tangle: 비주얼 ML 파이프라인 에디터 (제품 소개 페이지)\"\u003eS-2026-09-09-001\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e주요 인용\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCreate complex ML workflows with a powerful visual editor. Connect components, configure arguments, and build pipelines– with or without writing code.\u003c/p\u003e\n\u003cp\u003eTangle is platform agnostic. Wrap your existing code in a container using the in-app editor.\u003c/p\u003e\n\u003cp\u003eCache intermediate results to accelerate experimentation. Content-based caching saves significant time and compute costs.\u003c/p\u003e\n\u003cp\u003eTangle is built on open-source foundations. Contribute, report issues, or explore the codebase on GitHub.\u003c/p\u003e\n\u003c/blockquote\u003e","out":["S-2026-09-09-003-shopify-small-model-beats-sol","open-local-models","product-tangle","small-model-self-improvement-loop"],"relpath":"wiki/sources/S-2026-09-09-001-tangle-visual-ml-pipeline.md","sources":["S-2026-09-09-001"],"src":{"author":"","file":"raw/2026/09/S-2026-09-09-001.html","origin":"url","published_at":"","shared_at":"2026-09-09","shared_by":"CEO","shared_note":"","source_id":"S-2026-09-09-001","url":"https://tangleml.com/"},"status":"draft","stem":"S-2026-09-09-001-tangle-visual-ml-pipeline","summary":"드래그 앤 드롭 파이프라인 편집, 재사용 컴포넌트, 언어 · 프레임워크 무관 컨테이너 래핑, 콘텐츠 기반 실행 캐시를 내세운 오픈소스 기반 ML 파이프라인 도구의 랜딩 페이지","system":false,"text":"한 줄 요약\nTangle 이라는 ML 파이프라인 도구의 제품 랜딩 페이지. 비주얼 편집기로 파이프라인을 만들고, 컴포넌트를 재사용하고, 어떤 언어든 컨테이너로 감싸 실행하며, 중간 결과를 콘텐츠 기반으로 캐시한다. 오픈소스 기반이라고 밝힌다. 본문에 Shopify 나 소형 모델 학습에 대한 언급은 없다.\n관심 포인트\n(추정) 같은 날 공유한 Shopify 소형 모델 사례의 \"오픈소스 기반 기술 Tangle\" 을 직접 보라는 뜻으로 추정\n(추정) 우리 학습 파이프라인(평가 → 실패 수집 → 재학습) 을 이 도구 위에 올릴 수 있는지\n핵심 주장\n1. 비주얼 편집기로 복잡한 ML 워크플로를 만들 수 있고, 코드를 쓰지 않아도 컴포넌트 연결과 인자 설정이 가능하다 {stated}\n2. 어떤 파이프라인이든 복제 · 편집 · 실행할 수 있고, 컴포넌트 라이브러리의 재사용 모듈을 쓰거나 자기 것을 추가할 수 있다 {stated}\n3. 플랫폼 무관: 기존 코드를 앱 내 편집기에서 컨테이너로 감싸 어떤 언어 · 프레임워크든 실행한다 {stated}\n4. 콘텐츠 기반 실행 캐시로 중간 결과를 저장해 실험 시간과 컴퓨팅 비용을 줄인다 {stated}\n5. 오픈소스 기반으로 만들어졌으며 GitHub 에서 기여 · 이슈 · 코드 열람이 가능하다고 한다. 저장소 주소는 이 페이지 본문에 없다 {stated}\n등장 개념 · 엔티티\nopen-local-models — 상위 주제\nproduct-tangle — 이 페이지의 제품\nsmall-model-self-improvement-loop — Shopify 사례가 말한 파이프라인 기술과의 관계는 미확인\n우리에게 주는 함의\n페이지 내용만으로는 Shopify 의 Tangle 과 동일한지 알 수 없다. 저장소를 직접 찾아 확인한 뒤 판단해야 한다 [S-2026-09-09-001] [S-2026-09-09-003]\n동일하다면 \"실제 업무 결과 평가 → 실패 재학습\" 루프를 파이프라인 컴포넌트로 구성하고 캐시로 반복 실험 비용을 줄이는 용도로 검토할 만하다 [S-2026-09-09-001]\n주요 인용\nCreate complex ML workflows with a powerful visual editor. Connect components, configure arguments, and build pipelines– with or without writing code.\nTangle is platform agnostic. Wrap your existing code in a container using the in-app editor.\nCache intermediate results to accelerate experimentation. Content-based caching saves significant time and compute costs.\nTangle is built on open-source foundations. Contribute, report issues, or explore the codebase on GitHub.","title":"tangleml.com — Tangle: 비주얼 ML 파이프라인 에디터 (제품 소개 페이지)","topics":["open-local-models"],"type":"source","updated":"2026-09-09"},{"aliases":["크루온AI 기사","송호철 인터뷰","크루AI 워크"],"back":["agent-governance-guardrails","ai-agents-enterprise-adoption","ai-workforce-runtime","org-cognition","org-crewon-ai","task-definition-bottleneck","task-level-agent-evaluation"],"cites":["S-2026-09-08-002-cognition-jeff-wang-interview","S-2026-09-09-004-gpt-6-astra-task-completion"],"confidence":"","created":"2026-09-09","folder":"sources","html":"\u003ch2\u003e한 줄 요약\u003c/h2\u003e\n\u003cp\u003e크루온AI 는 AI 에이전트가 직원처럼 일하려면 역할 · 업무지식 · 규정 · 시스템 권한 · 업무 순서 · 보고 체계가 필요하다고 보고, 사람과 AI 가 함께 일하는 업무공간(크루AI 워크) 과 AI 직원을 채용 · 교육 · 관리하는 런타임(크루온AI) 두 플랫폼을 내놓았다. 기업 · 공공 구축형으로 시작하며, \"고객이 사는 것은 모델이 아니라 모델이 일하는 환경\" 이라고 말한다.\u003c/p\u003e\n\u003ch2\u003e관심 포인트\u003c/h2\u003e\n\u003cul\u003e\n\u0
